May 20 2026<\/div>\n          <span style=\"display:inline-block;margin-top:8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:var(--green-bg,rgba(16,185,129,.08));color:var(--green,#10b981);\">New<\/span>\n        <\/div>\n        <div>\n          <div style=\"font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px;\">v5.2 — Onboarding sync &amp; Blog<\/div>\n          <p style=\"font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;\">Fixed a critical bug where onboarding data was not persisting after account creation. New users now get the full setup wizard immediately after sign-up, with data synced to the cloud once the wizard completes. Email/password accounts now properly connect to Supabase cloud sync (the same sync that Google sign-in users had). Added this changelog page.<\/p>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Onboarding<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Cloud Sync<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Auth<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Entry -->\n      <div class=\"cl-entry\" style=\"display:grid;grid-template-columns:120px 1fr;gap:0 28px;border-top:.5px solid var(--rule);padding:28px 0;\">\n        <div class=\"cl-meta\" style=\"padding-top:2px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;\">May 20 2026<\/div>\n          <span style=\"display:inline-block;margin-top:8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:rgba(59,130,246,.08);color:#3b82f6;\">Fix<\/span>\n        <\/div>\n        <div>\n          <div style=\"font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px;\">v5.1 — Firebase OAuth &amp; PBKDF2 hashing<\/div>\n          <p style=\"font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;\">Replaced the mock Google sign-in (a bare setTimeout that just wrote to localStorage) with real Firebase OAuth using signInWithPopup. Upgraded password storage from btoa Base64 to PBKDF2 (150,000 iterations, SHA-256, per-email salt). Fixed a JSON bundler round-trip bug that caused \"Unexpected non-whitespace character after JSON\" errors for some browsers.<\/p>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Security<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Google Auth<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Bundler<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Entry -->\n      <div class=\"cl-entry\" style=\"display:grid;grid-template-columns:120px 1fr;gap:0 28px;border-top:.5px solid var(--rule);padding:28px 0;\">\n        <div class=\"cl-meta\" style=\"padding-top:2px;\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;\">May 2026<\/div>\n          <span style=\"display:inline-block;margin-top:8px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:rgba(168,85,247,.08);color:#a855f7;\">Feature<\/span>\n        <\/div>\n        <div>\n          <div style=\"font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px;\">v5.0 — War Room goes live<\/div>\n          <p style=\"font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;\">Full public launch. War Room v5 ships with AXIS AI co-pilot, multi-business P&amp;L tracking, focus timer, payroll, video calls, a Supabase cloud sync backbone, invite-link team rooms, and the operator onboarding wizard. Built as a single-file bundle — no install required.<\/p>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Launch<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">AXIS AI<\/span>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text3);\">Multi-business<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═════════ FOOTER ═════════ -->\n<footer>\n  <div class=\"wrap\">\n    <div>© 2026 War Room · A CRES Ventures product<\/div>\n    <div class=\"links\">\n      <a href=\"#features\">Features<\/a>\n      <a href=\"#axis\">AXIS<\/a>\n      <a href=\"#dashboard\">Inside<\/a>\n      <a href=\"#changelog\">Changelog<\/a>\n      <a href=\"#\">Privacy<\/a>\n    <\/div>\n    <div>v5.1 · Sync OK · <span style=\"color:var(--green)\">● ONLINE<\/span><\/div>\n  <\/div>\n<\/footer>\n\n<script>\n  /* ── Live clock ── */\n  function pad(n) { return String(n).padStart(2, '0'); }\n  function tickClock() {\n    const now = new Date();\n    const opts = { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };\n    const est = new Intl.DateTimeFormat('en-US', opts).format(now);\n    const dateOpts = { timeZone: 'America/New_York', month: 'short', day: 'numeric', weekday: 'short' };\n    const ddate = new Intl.DateTimeFormat('en-US', dateOpts).format(now).toUpperCase();\n    const top = document.getElementById('topTime');\n    const live = document.getElementById('liveClock');\n    const ld = document.getElementById('liveDate');\n    if (top) top.textContent = est + ' · EST';\n    if (live) live.textContent = est + ' EST';\n    if (ld) ld.textContent = ddate + ' · day 248 in session';\n  }\n  setInterval(tickClock, 1000);\n  tickClock();\n\n  /* ── Hero status panel: live counters + focus timer ── */\n  let focusH = 2, focusM = 14, focusS = 33;\n  function tickFocus() {\n    focusS++;\n    if (focusS >= 60) { focusS = 0; focusM++; }\n    if (focusM >= 60) { focusM = 0; focusH++; }\n    const el = document.getElementById('liveFocus');\n    if (el) el.textContent = pad(focusH) + ':' + pad(focusM) + ':' + pad(focusS);\n  }\n  setInterval(tickFocus, 1000);\n\n  /* mini timer card in bento */\n  let modSec = 0;\n  function tickFocusMod() {\n    modSec++;\n    let totalSec = 25 * 60 - modSec;\n    if (totalSec < 0) { modSec = 0; totalSec = 25 * 60; }\n    const min = Math.floor(totalSec / 60);\n    const sec = totalSec % 60;\n    const m = document.getElementById('fmodMin');\n    const s = document.getElementById('fmodSec');\n    if (m) m.textContent = pad(min);\n    if (s) s.textContent = pad(sec);\n  }\n  setInterval(tickFocusMod, 1000);\n\n  /* hero revenue jitter */\n  let baseRev = 3420;\n  setInterval(() => {\n    baseRev += Math.floor(Math.random() * 8) + 1;\n    const el = document.getElementById('liveRev');\n    if (el) el.textContent = baseRev.toLocaleString();\n  }, 3500);\n\n  /* week bars */\n  (function () {\n    const wb = document.getElementById('weekBars');\n    if (!wb) return;\n    const heights = [0.46, 0.58, 0.42, 0.78, 0.64, 0.92, 0.5];\n    heights.forEach((h, i) => {\n      const b = document.createElement('div');\n      b.className = 'b';\n      b.style.height = (h * 100) + '%';\n      if (i === 5) b.style.background = 'var(--red)';\n      wb.appendChild(b);\n    });\n  })();\n\n  /* tracker bento bars */\n  (function () {\n    const tb = document.getElementById('trackerBars');\n    if (!tb) return;\n    const heights = [0.32, 0.48, 0.4, 0.6, 0.55, 0.72, 0.65, 0.85, 0.78, 0.92, 0.84, 1];\n    heights.forEach((h, i) => {\n      const b = document.createElement('div');\n      b.className = 'b';\n      if (i >= heights.length - 3) b.classList.add('hi');\n      b.style.height = (h * 100) + '%';\n      tb.appendChild(b);\n    });\n  })();\n\n  /* mini calendar */\n  (function () {\n    const mc = document.getElementById('miniCal');\n    if (!mc) return;\n    const events = [3, 5, 8, 12, 15, 18, 22, 25, 27];\n    const today = 15;\n    for (let i = 1; i <= 28; i++) {\n      const d = document.createElement('div');\n      d.textContent = i;\n      if (events.includes(i)) d.classList.add('has');\n      if (i === today) d.classList.add('today');\n      mc.appendChild(d);\n    }\n  })();\n\n  /* ── Joiner count ticker ── */\n  (function () {\n    const el = document.getElementById('joinerCount');\n    if (!el) return;\n    let n = 2147;\n    setInterval(() => {\n      if (Math.random() > 0.6) {\n        n++;\n        el.textContent = n.toLocaleString();\n        el.style.transition = 'color .2s';\n        el.style.color = 'var(--green)';\n        setTimeout(() => { el.style.color = 'var(--ink)'; }, 400);\n      }\n    }, 4000);\n  })();\n\n  /* ── Stats counter on scroll ── */\n  function animateCounters() {\n    document.querySelectorAll('.counter').forEach((el) => {\n      if (el.dataset.done) return;\n      const target = parseInt(el.dataset.target || el.parentElement.dataset.target || '0', 10);\n      if (!target) return;\n      el.dataset.done = '1';\n      let current = 0;\n      const dur = 1400;\n      const start = performance.now();\n      function step(t) {\n        const p = Math.min(1, (t - start) / dur);\n        // ease out cubic\n        const eased = 1 - Math.pow(1 - p, 3);\n        current = Math.floor(target * eased);\n        el.textContent = current.toLocaleString();\n        if (p < 1) requestAnimationFrame(step);\n        else el.textContent = target.toLocaleString();\n      }\n      requestAnimationFrame(step);\n    });\n  }\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach((e) => { if (e.isIntersecting) animateCounters(); });\n  }, { threshold: 0.3 });\n  document.querySelectorAll('.stats-section').forEach((s) => io.observe(s));\n\n  /* ── Email signup ── */\n  function handleSignup(e, formId) {\n    e.preventDefault();\n    const form = document.getElementById(formId);\n    if (!form) return false;\n    const input = form.querySelector('input[type=email]');\n    const email = input.value.trim();\n    if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {\n      input.style.color = 'var(--red)';\n      input.focus();\n      return false;\n    }\n    // Persist to localStorage as a stand-in\n    try {\n      const list = JSON.parse(localStorage.getItem('warroom_waitlist') || '[]');\n      if (!list.includes(email)) list.push(email);\n      localStorage.setItem('warroom_waitlist', JSON.stringify(list));\n    } catch (_) {}\n    // Success state\n    form.classList.add('success');\n    // Fire confetti\n    confetti();\n    // Bump joiner count\n    const jc = document.getElementById('joinerCount');\n    if (jc) {\n      const n = parseInt(jc.textContent.replace(/,/g, ''), 10) + 1;\n      jc.textContent = n.toLocaleString();\n    }\n    return false;\n  }\n\n  /* ── Confetti (operator glyphs) ── */\n  function confetti() {\n    const glyphs = ['◈', '◎', '◉', '◇', '◷', '▦', '◫'];\n    const colors = ['var(--red)', 'var(--green)', 'var(--blue)', 'var(--amber)', 'var(--violet)', 'var(--pink)', 'var(--ink)'];\n    for (let i = 0; i < 28; i++) {\n      const el = document.createElement('span');\n      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];\n      el.style.cssText = `\n        position: fixed; left: ${50 + (Math.random() - 0.5) * 60}%; top: 38%;\n        font-size: ${14 + Math.random() * 14}px;\n        color: ${colors[Math.floor(Math.random() * colors.length)]};\n        pointer-events: none; z-index: 9999;\n        transform: translate(-50%, -50%);\n      `;\n      document.body.appendChild(el);\n      const dx = (Math.random() - 0.5) * 600;\n      const dy = -200 - Math.random() * 220;\n      const dy2 = 600;\n      const rot = (Math.random() - 0.5) * 720;\n      el.animate(\n        [\n          { transform: `translate(-50%, -50%) rotate(0deg)`, opacity: 1 },\n          { transform: `translate(calc(-50% + ${dx * 0.6}px), calc(-50% + ${dy}px)) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.3 },\n          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy2}px)) rotate(${rot}deg)`, opacity: 0 },\n        ],\n        { duration: 1600 + Math.random() * 600, easing: 'cubic-bezier(.4,1.6,.6,1)' }\n      ).onfinish = () => el.remove();\n    }\n  }\n\n  /* ── AXIS Live Chat ── */\n  const AXIS_SYSTEM = `You are AXIS — the AI command intelligence inside the operator's WAR ROOM. You are calm, precise, tactical. Think less \"customer service AI\" and more \"war room advisor who has seen everything.\"\n\nGROUND RULES:\n- Address the operator as \"Operator\".\n- Be conversational but sharp.\n- Use **bold** to highlight key terms, numbers, or action items.\n- Use line breaks generously — no walls of text.\n- When asked for strategy, give specific steps, not theory.\n- When something is a red flag, call it out without sugarcoating.\n- Keep responses concise — typically under 120 words unless asked for depth.\n- If asked for diagnostics, walk through them step by step.\n\nYou are loyal to the operator's mission.`;\n\n  let axisHistory = [];\n  let axisBusy = false;\n\n  function appendAxisMsg(text, who, isHtml) {\n    const body = document.getElementById('axisBody');\n    const m = document.createElement('div');\n    m.className = 'jmsg ' + who;\n    if (isHtml) m.innerHTML = text; else m.textContent = text;\n    body.appendChild(m);\n    body.scrollTop = body.scrollHeight;\n    return m;\n  }\n\n  function renderMarkdown(text) {\n    // Minimal: bold + line breaks\n    let html = text\n      .replace(/&/g, '&amp;')\n      .replace(/<\/g, '&lt;')\n      .replace(/>/g, '&gt;')\n      .replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\/b>')\n      .replace(/\\n/g, '<br>');\n    return html;\n  }\n\n  /* ── AXIS FAQ answers ── */\n  const FAQ_ANSWERS = {\n    'whats-different': [\n      \"**Good question. Here's the honest answer:**\",\n      \"Notion is a blank canvas. Trello is a board. Sheets is a spreadsheet. None of them know you run *three businesses*, track payroll, have $4.2k in aging receivables, and a call at 14:00.\",\n      \"WAR ROOM is purpose-built for the multi-business operator. Ten modules — missions, P&L, payroll, calendar, intel notes, bills, focus timer, video calls, goals, and daily debrief — all wired together.\",\n      \"**AXIS pulls from all of them at once.** Ask 'what should I focus on?' and it answers from your *actual data*. That's the difference.\"\n    ],\n    'is-private': [\n      \"**Local-first. Always.**\",\n      \"Your data lives in your browser's localStorage by default. No accounts. No servers. No surveillance. We can't read your P&L because it never touches our infrastructure.\",\n      \"Cloud sync is **opt-in**. You pick the destination (Google Drive, Dropbox, or a custom endpoint). You hold the keys.\",\n      \"One file. Your machine. Your data.\"\n    ],\n    'how-axis-works': [\n      \"**AXIS is context-aware, not generic.**\",\n      \"When you use WAR ROOM, you're building a structured picture of your businesses: P&L entries, mission lists, calendar events, intel notes, bill schedules, payroll data. AXIS indexes all of it.\",\n      \"Ask *'What's dragging my margin at Stratus?'* and AXIS has your actual numbers. Ask *'What should I tackle today?'* and it knows your open missions, due bills, and calendar — not a generic tip.\",\n      \"**Reserve access to connect AXIS to your live data.**\"\n    ],\n    'what-does-it-cost': [\n      \"**Free during beta. Founder pricing after.**\",\n      \"No credit card to reserve a spot. While we're in closed beta, access is free — full features, no limits.\",\n      \"Early operators who join the list lock in **founder pricing** when we launch paid tiers. That price will never increase for you.\",\n      \"We're building for operators who want a permanent command center, not a subscription that raises rates every year.\"\n    ],\n    'works-offline': [\n      \"**Yes. That's by design.**\",\n      \"WAR ROOM is a single HTML file. Open it once and it works with zero internet connection. Every module runs entirely client-side.\",\n      \"AXIS AI features require a connection for live queries, but your data, UI, and all non-AI functionality are fully offline.\",\n      \"Bookmark the file locally or host it yourself. Either way, it's yours.\"\n    ],\n    'mobile': [\n      \"**Fully responsive.**\",\n      \"The layout reflows to a single-column command center on small screens. Touch-friendly tap targets, swipeable module panels — built in, not bolted on.\",\n      \"Focus timer, mission board, and daily debrief work especially well on mobile. Video calls use your device's camera and mic natively.\",\n      \"No app store. No download. Just the file saved to your home screen.\"\n    ]\n  };\n\n  const FAQ_LABELS = {\n    'whats-different': 'What makes WAR ROOM different?',\n    'is-private': 'Is my data private?',\n    'how-axis-works': 'How does AXIS know my business?',\n    'what-does-it-cost': 'What does it cost?',\n    'works-offline': 'Does it work offline?',\n    'mobile': 'Does it work on mobile?'\n  };\n\n  function askFAQ(key) {\n    const answers = FAQ_ANSWERS[key];\n    if (!answers) return;\n    appendAxisMsg(FAQ_LABELS[key] || key, 'user', false);\n    const loading = appendAxisMsg('<div class=\"jthinking\"><span><\/span><span><\/span><span><\/span><\/div>', 'ai', true);\n    setTimeout(() => {\n      loading.innerHTML = answers.map(p => renderMarkdown(p)).join('<br>');\n      const body = document.getElementById('axisBody');\n      if (body) body.scrollTop = body.scrollHeight;\n    }, 650);\n  }\n\n  function askAxis(prompt) {\n    const input = document.getElementById('axisInput');\n    if (input) { input.value = prompt; }\n    submitAxis(new Event('submit'));\n  }\n\n  function submitAxis(e) {\n    if (e) e.preventDefault();\n    const input = document.getElementById('axisInput');\n    const text = (input ? input.value : '').trim();\n    if (!text) return false;\n    if (input) input.value = '';\n    const lower = text.toLowerCase();\n    const faqMap = [\n      [['different', 'vs notion', 'vs other', 'unique', 'special'], 'whats-different'],\n      [['private', 'data', 'security', 'secure', 'local'], 'is-private'],\n      [['how does axis', 'axis know', 'how axis', 'ai know'], 'how-axis-works'],\n      [['cost', 'price', 'pricing', 'pay', 'free', 'subscription'], 'what-does-it-cost'],\n      [['offline', 'without internet', 'no internet', 'no wifi'], 'works-offline'],\n      [['mobile', 'phone', 'iphone', 'android', 'tablet'], 'mobile'],\n    ];\n    for (const [keywords, key] of faqMap) {\n      if (keywords.some(kw => lower.includes(kw))) {\n        askFAQ(key);\n        return false;\n      }\n    }\n    appendAxisMsg(text, 'user', false);\n    const loading = appendAxisMsg('<div class=\"jthinking\"><span><\/span><span><\/span><span><\/span><\/div>', 'ai', true);\n    setTimeout(() => {\n      loading.innerHTML = renderMarkdown(\n        \"**That's a live AXIS query — only available inside the full War Room.**\\n\\n\" +\n        \"Click one of the questions on the left to see how AXIS thinks. \" +\n        \"Reserve access above to wire AXIS to your actual P&L, missions, and businesses.\"\n      );\n      const body = document.getElementById('axisBody');\n      if (body) body.scrollTop = body.scrollHeight;\n    }, 600);\n    return false;\n  }\n\n  /* ── Smooth scroll for nav links ── */\n  document.querySelectorAll('a[href^=\"#\"]').forEach((a) => {\n    a.addEventListener('click', (e) => {\n      const target = document.querySelector(a.getAttribute('href'));\n      if (target) {\n        e.preventDefault();\n        target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      }\n    });\n  });\n\n  /* ── Parallax glyphs ── */\n  window.addEventListener('mousemove', (e) => {\n    const x = (e.clientX / window.innerWidth - 0.5) * 16;\n    const y = (e.clientY / window.innerHeight - 0.5) * 16;\n    document.querySelectorAll('.hero .glyph').forEach((g, i) => {\n      const f = (i + 1) * 0.5;\n      g.style.translate = `${x * f}px ${y * f}px`;\n    });\n  });\n\n  /* ── Auth Overlay ──────────────────────────────── */\n  let _authMode = 'signin';\n\n  function openAuthOverlay(mode) {\n    _authMode = mode || 'signin';\n    setAuthMode(_authMode);\n    const ov = document.getElementById('authOverlay');\n    if (ov) { ov.classList.add('open'); }\n    setTimeout(() => {\n      const el = document.getElementById('authEmail');\n      if (el) el.focus();\n    }, 80);\n  }\n\n  function closeAuthOverlay() {\n    const ov = document.getElementById('authOverlay');\n    if (!ov) return;\n    ov.classList.add('fading');\n    setTimeout(() => { ov.classList.remove('open', 'fading'); }, 300);\n  }\n\n  // Close on backdrop click\n  document.getElementById('authOverlay').addEventListener('click', function(e) {\n    if (e.target === this) closeAuthOverlay();\n  });\n\n  // Close on Escape\n  document.addEventListener('keydown', function(e) {\n    if (e.key === 'Escape') closeAuthOverlay();\n  });\n\n  function setAuthMode(mode, opts) {\n    // opts: { keepMessages: bool, title: string, subtitle: string }\n    opts = opts || {};\n    _authMode = mode;\n    const siTab    = document.getElementById('authTabSignin');\n    const suTab    = document.getElementById('authTabSignup');\n    const titleEl  = document.getElementById('authTitle');\n    const sub      = document.getElementById('authSubtitle');\n    const btnTxt   = document.getElementById('authBtnText');\n    const emailEl  = document.getElementById('authEmail');\n    const passEl   = document.getElementById('authPassword');\n    const confirmEl= document.getElementById('authConfirmPassword');\n    const forgotLnk= document.getElementById('authForgotLink');\n    const backLnk  = document.getElementById('authBackLink');\n    const tabs     = document.querySelector('.auth-tabs');\n    const err = document.getElementById('authError');\n    const suc = document.getElementById('authSuccess');\n    if (!opts.keepMessages) { if (err) err.textContent = ''; if (suc) suc.textContent = ''; }\n    if (mode === 'signin') {\n      if (siTab) siTab.className = 'auth-tab active';\n      if (suTab) suTab.className = 'auth-tab';\n      if (titleEl) titleEl.textContent = opts.title || 'Command Access';\n      if (sub)   sub.textContent = opts.subtitle || 'Sign in to access your War Room — your data follows you everywhere.';\n      if (btnTxt) btnTxt.textContent = 'SIGN IN';\n      if (emailEl) { emailEl.style.display = ''; emailEl.placeholder = 'Email address'; emailEl.readOnly = false; }\n      if (passEl)  { passEl.style.display = ''; passEl.placeholder = 'Password'; passEl.autocomplete = 'current-password'; passEl.value = ''; }\n      if (confirmEl) confirmEl.style.display = 'none';\n      if (forgotLnk) forgotLnk.style.display = '';\n      if (backLnk)   backLnk.style.display = 'none';\n      if (tabs) tabs.style.display = '';\n    } else if (mode === 'signup') {\n      if (siTab) siTab.className = 'auth-tab';\n      if (suTab) suTab.className = 'auth-tab active';\n      if (titleEl) titleEl.textContent = opts.title || 'Create Account';\n      if (sub)   sub.textContent = opts.subtitle || 'Create your account. Your War Room syncs across every device, instantly.';\n      if (btnTxt) btnTxt.textContent = 'CREATE ACCOUNT';\n      if (emailEl) { emailEl.style.display = ''; emailEl.placeholder = 'Email address'; emailEl.readOnly = false; }\n      if (passEl)  { passEl.style.display = ''; passEl.placeholder = 'Password'; passEl.autocomplete = 'new-password'; passEl.value = ''; }\n      if (confirmEl) { confirmEl.style.display = ''; confirmEl.value = ''; }\n      if (forgotLnk) forgotLnk.style.display = 'none';\n      if (backLnk)   backLnk.style.display = 'none';\n      if (tabs) tabs.style.display = '';\n    } else if (mode === 'forgot') {\n      if (siTab) siTab.className = 'auth-tab';\n      if (suTab) suTab.className = 'auth-tab';\n      if (sub)   sub.textContent = 'Enter your email and we’ll let you reset your password.';\n      if (btnTxt) btnTxt.textContent = 'CONTINUE';\n      if (emailEl) { emailEl.style.display = ''; emailEl.placeholder = 'Email address'; emailEl.readOnly = false; }\n      if (passEl)  passEl.style.display = 'none';\n      if (confirmEl) confirmEl.style.display = 'none';\n      if (forgotLnk) forgotLnk.style.display = 'none';\n      if (backLnk)   backLnk.style.display = '';\n      if (tabs) tabs.style.display = 'none';\n    } else if (mode === 'reset') {\n      if (sub)   sub.textContent = 'Choose a new password for your account.';\n      if (btnTxt) btnTxt.textContent = 'UPDATE PASSWORD';\n      if (emailEl) emailEl.style.display = 'none';\n      if (passEl)  { p
