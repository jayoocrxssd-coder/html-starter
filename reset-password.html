document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g:24px 0;\">\n        <svg width=\"36\" height=\"36\" viewBox=\"0 0 36 36\" fill=\"none\" style=\"animation:spin 0.9s linear infinite;margin:0 auto 20px;display:block;\">\n          <circle cx=\"18\" cy=\"18\" r=\"15\" stroke=\"rgba(14,14,13,0.1)\" stroke-width=\"3\"><\/circle>\n          <path d=\"M18 3a15 15 0 0 1 15 15\" stroke=\"#0e0e0d\" stroke-width=\"3\" stroke-linecap=\"round\"><\/path>\n        <\/svg>\n        <p style=\"font-size:14px;color:#9a9a98;\">Verifying your reset link\u2026<\/p>\n      <\/div>\n    <\/sc-if>\n\n    <!-- INVALID / EXPIRED STATE -->\n    <sc-if value=\"{{ isInvalid }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:#ececea;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\">\n            <circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#c45c4a\" stroke-width=\"1.8\"><\/circle>\n            <path d=\"M12 7v5.5M12 16v.5\" stroke=\"#c45c4a\" stroke-width=\"2\" stroke-linecap=\"round\"><\/path>\n          <\/svg>\n        <\/div>\n        <h2 style=\"font-size:22px;font-weight:700;color:#0e0e0d;letter-spacing:-0.02em;margin-bottom:10px;\">Link expired.<\/h2>\n        <p style=\"font-size:14px;color:#9a9a98;line-height:1.65;margin-bottom:28px;\">This reset link is no longer valid. Links expire after 1 hour \u2014 request a new one below.<\/p>\n        <a href=\"forgot-password.html\" style=\"display:block;background:#0e0e0d;color:#f4f4f2;text-decoration:none;font-size:14px;font-weight:700;padding:14px;border-radius:9px;text-align:center;margin-bottom:14px;transition:background 0.15s,transform 0.18s;\" style-hover=\"background:#2c2c2a;transform:translateY(-1px);\">Request a new link \u2192<\/a>\n        <a href=\"access.html\" style=\"display:block;font-size:13px;color:#9a9a98;text-decoration:none;transition:color 0.15s;\" style-hover=\"color:#0e0e0d;\">\u2190 Back to sign in<\/a>\n      <\/div>\n    <\/sc-if>\n\n    <!-- FORM STATE -->\n    <sc-if value=\"{{ isValid }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:#0e0e0d;display:flex;align-items:center;justify-content:center;margin-bottom:24px;\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\">\n          <path d=\"M10 2L4 5v6c0 3.3 2.6 6.4 6 7 3.4-.6 6-3.7 6-7V5L10 2z\" stroke=\"rgba(244,244,242,0.6)\" stroke-width=\"1.5\" stroke-linejoin=\"round\" fill=\"none\"><\/path>\n          <path d=\"M7.5 10.5l2 2 3-3\" stroke=\"#4a8e65\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path>\n        <\/svg>\n      <\/div>\n      <h2 style=\"font-size:22px;font-weight:700;color:#0e0e0d;letter-spacing:-0.02em;margin-bottom:8px;\">Set a new password.<\/h2>\n      <p style=\"font-size:14px;color:#9a9a98;line-height:1.6;margin-bottom:28px;\">Choose something strong \u2014 at least 8 characters.<\/p>\n\n      <form onsubmit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:14px;\">\n\n        <!-- New password field -->\n        <div>\n          <label style=\"display:block;font-size:11px;font-weight:700;color:#0e0e0d;margin-bottom:7px;letter-spacing:0.05em;text-transform:uppercase;\">New password<\/label>\n          <div style=\"position:relative;\">\n            <input type=\"{{ pwType }}\" required=\"\" value=\"{{ password }}\" onchange=\"{{ onPasswordChange }}\" placeholder=\"Min. 8 characters\" style=\"width:100%;background:#ececea;border:1.5px solid transparent;border-radius:8px;padding:12px 44px 12px 14px;font-size:14px;color:#0e0e0d;transition:border-color 0.15s;\" style-focus=\"border-color:#0e0e0d;\">\n            <sc-if value=\"{{ showPw }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" onclick=\"{{ togglePw }}\" style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#9a9a98;display:flex;align-items:center;\" style-hover=\"color:#0e0e0d;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"><\/path>\n                  <line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"><\/line>\n                <\/svg>\n              <\/button>\n            <\/sc-if>\n            <sc-if value=\"{{ hidePw }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" onclick=\"{{ togglePw }}\" style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#9a9a98;display:flex;align-items:center;\" style-hover=\"color:#0e0e0d;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\/path>\n                  <circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle>\n                <\/svg>\n              <\/button>\n            <\/sc-if>\n          <\/div>\n          <!-- Strength bars -->\n          <div style=\"display:flex;gap:4px;margin-top:8px;\">\n            <div style=\"{{ s1 }}\"><\/div>\n            <div style=\"{{ s2 }}\"><\/div>\n            <div style=\"{{ s3 }}\"><\/div>\n            <div style=\"{{ s4 }}\"><\/div>\n          <\/div>\n          <p style=\"font-size:11px;color:#9a9a98;margin-top:5px;min-height:16px;\">{{ strengthLabel }}<\/p>\n        <\/div>\n\n        <!-- Confirm password field -->\n        <div>\n          <label style=\"display:block;font-size:11px;font-weight:700;color:#0e0e0d;margin-bottom:7px;letter-spacing:0.05em;text-transform:uppercase;\">Confirm password<\/label>\n          <input type=\"{{ pwType }}\" required=\"\" value=\"{{ confirm }}\" onchange=\"{{ onConfirmChange }}\" placeholder=\"Repeat password\" style=\"{{ confirmStyle }}\" style-focus=\"border-color:#0e0e0d;\">\n          <sc-if value=\"{{ showMismatch }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:12px;color:#c45c4a;margin-top:5px;\">Passwords don't match.<\/p>\n          <\/sc-if>\n        <\/div>\n\n        <!-- Error -->\n        <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:flex-start;gap:10px;background:rgba(196,92,74,0.08);border:1px solid rgba(196,92,74,0.15);border-radius:8px;padding:11px 14px;\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" style=\"flex-shrink:0;margin-top:1px;\"><circle cx=\"7\" cy=\"7\" r=\"6\" stroke=\"#c45c4a\" stroke-width=\"1.3\"><\/circle><path d=\"M7 4.5v3M7 9.5v.5\" stroke=\"#c45c4a\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\/path><\/svg>\n            <p style=\"font-size:13px;color:#c45c4a;line-height:1.5;\">{{ error }}<\/p>\n          <\/div>\n        <\/sc-if>\n\n        <button type=\"submit\" style=\"{{ submitBtnStyle }}\">\n          <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"animation:spin 0.8s linear infinite;flex-shrink:0;\">\n              <circle cx=\"8\" cy=\"8\" r=\"6\" stroke=\"rgba(244,244,242,0.25)\" stroke-width=\"2\"><\/circle>\n              <path d=\"M8 2a6 6 0 0 1 6 6\" stroke=\"#f4f4f2\" stroke-width=\"2\" stroke-linecap=\"round\"><\/path>\n            <\/svg>\n          <\/sc-if>\n          <sc-if value=\"{{ notLoading }}\" hint-placeholder-val=\"{{ true }}\">Update password \u2192<\/sc-if>\n        <\/button>\n      <\/form>\n    <\/sc-if>\n\n    <!-- SUCCESS STATE -->\n    <sc-if value=\"{{ isSuccess }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:#0e0e0d;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\">\n            <path d=\"M5 13l4 4L19 7\" stroke=\"#4a8e65\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path>\n          <\/svg>\n        <\/div>\n        <h2 style=\"font-size:22px;font-weight:700;color:#0e0e0d;letter-spacing:-0.02em;margin-bottom:10px;\">Password updated.<\/h2>\n        <p style=\"font-size:14px;color:#9a9a98;line-height:1.65;margin-bottom:28px;\">You're all set. Sign in with your new credentials to access your command center.<\/p>\n        <a href=\"access.html\" style=\"display:block;background:#0e0e0d;color:#f4f4f2;text-decoration:none;font-size:14px;font-weight:700;padding:14px;border-radius:9px;text-align:center;transition:background 0.15s,transform 0.18s,box-shadow 0.18s;\" style-hover=\"background:#2c2c2a;transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,14,13,0.3);\">Sign in to Warroom \u2192<\/a>\n      <\/div>\n    <\/sc-if>\n\n  <\/div>\n\n  <p style=\"margin-top:28px;font-size:12px;color:rgba(244,244,242,0.18);\">\u00a9 2026 aionvsn \u00b7 All rights reserved.<\/p>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1200, &quot;height&quot;: 800 },\n  &quot;supabaseUrl&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://xtvvbylcejvkgvyrcist.supabase.co&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Supabase Config&quot; },\n  &quot;supabaseAnonKey&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0dnZieWxjZWp2a2d2eXJjaXN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4Mjg2MDUsImV4cCI6MjA5NzQwNDYwNX0.WwT1ZxdW5XuRTr9OKcCTjSPO9DKAJd0E86DcL2_iyV4&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Supabase Config&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    pageState: 'loading',\n    password: '',\n    confirm: '',\n    showPw: false,\n    loading: false,\n    error: null,\n  };\n\n  _supabase = null;\n\n  getStrength(pw) {\n    if (!pw) return 0;\n    let score = 0;\n    if (pw.length >= 8) score++;\n    if (pw.length >= 12) score++;\n    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;\n    if (/[0-9]/.test(pw) || /[^a-zA-Z0-9]/.test(pw)) score++;\n    return Math.min(4, score);\n  }\n\n  componentDidMount() {\n    const url = this.props.supabaseUrl;\n    const key = this.props.supabaseAnonKey;\n\n    // Preview mode \u2014 show form without a real token\n    if (!url || !key || url === 'YOUR_SUPABASE_URL') {\n      setTimeout(() => this.setState({ pageState: 'valid' }), 600);\n      return;\n    }\n\n    try {\n      this._supabase = window.supabase.createClient(url, key, {\n        auth: { detectSessionInUrl: true, flowType: 'implicit' },\n      });\n\n      // Parse the hash Supabase appends to the redirect URL\n      const hash = window.location.hash.substring(1);\n      const params = new URLSearchParams(hash);\n      const access_token = params.get('access_token');\n      const refresh_token = params.get('refresh_token') || '';\n      const type = params.get('type');\n\n      if (type === 'recovery' && access_token) {\n        this._supabase.auth\n          .setSession({ access_token, refresh_token })\n          .then(({ error }) => {\n            this.setState({ pageState: error ? 'invalid' : 'valid' });\n          });\n      } else {\n        this._supabase.auth.getSession().then(({ data: { session } }) => {\n          this.setState({ pageState: session ? 'valid' : 'invalid' });\n        });\n      }\n    } catch (e) {\n      console.error('[reset-password] Init error:', e);\n      this.setState({ pageState: 'invalid' });\n    }\n  }\n\n  async doSubmit() {\n    const { password, confirm, loading } = this.state;\n    if (loading) return;\n    if (password.length < 8) {\n      this.setState({ error: 'Password must be at least 8 characters.' });\n      return;\n    }\n    if (password !== confirm) {\n      this.setState({ error: 'Passwords do not match.' });\n      return;\n    }\n    this.setState({ loading: true, error: null });\n    try {\n      if (!this._supabase) {\n        // Preview mode simulation\n        await new Promise(r => setTimeout(r, 1200));\n        this.setState({ pageState: 'success', loading: false });\n        return;\n      }\n      const { error } = await this._supabase.auth.updateUser({ password });\n      if (error) throw error;\n      this.setState({ pageState: 'success', loading: false });\n    } catch (e) {\n      this.setState({\n        loading: false,\n        error: e.message || 'Failed to update password. Please try again.',\n      });\n    }\n  }\n\n  renderVals() {\n    const { pageState, password, confirm, showPw, loading, error } = this.state;\n    const strength = this.getStrength(password);\n    const strengthLabels = ['', 'Weak', 'Fair', 'Good', 'Strong'];\n    const strengthColors = { 1: '#c45c4a', 2: '#c0784a', 3: '#4a8e65', 4: '#2d6b43' };\n    const barColor = (i) => strength >= i ? (strengthColors[strength] || '#ececea') : '#ececea';\n    const barBase = { height: '4px', borderRadius: '100px', flex: 1, transition: 'background 0.35s' };\n    const mismatch = confirm.length > 0 && password !== confirm;\n\n    return {\n      isLoading: pageState === 'loading',\n      isValid: pageState === 'valid',\n      isInvalid: pageState === 'invalid',\n      isSuccess: pageState === 'success',\n\n      password,\n      confirm,\n      showPw,\n      hidePw: !showPw,\n      pwType: showPw ? 'text' : 'password',\n      loading,\n      notLoading: !loading,\n      error,\n      hasError: !!error,\n      showMismatch: mismatch,\n\n      strengthLabel: password.length > 0 ? (strengthLabels[strength] || '') : '',\n      s1: { ...barBase, background: barColor(1) },\n      s2: { ...barBase, background: barColor(2) },\n      s3: { ...barBase, background: barColor(3) },\n      s4: { ...barBase, background: barColor(4) },\n\n      confirmStyle: {\n        width: '100%',\n        background: '#ececea',\n        border: mismatch ? '1.5px solid #c45c4a' : '1.5px solid transparent',\n        borderRadius: '8px',\n        padding: '12px 14px',\n        fontSize: '14px',\n        color: '#0e0e0d',\n        transition: 'border-color 0.15s',\n      },\n\n      submitBtnStyle: {\n        background: '#0e0e0d',\n        color: '#f4f4f2',\n        border: 'none',\n        cursor: loading ? 'not-allowed' : 'pointer',\n        fontSize: '15px',\n        fontWeight: 700,\n        padding: '14px',\n        borderRadius: '9px',\n        width: '100%',\n        display: 'flex',\n        alignItems: 'center',\n        justifyContent: 'center',\n        gap: '8px',\n        opacity: loading ? 0.65 : 1,\n        transition: 'background 0.15s, transform 0.18s, box-shadow 0.18s',\n      },\n\n      togglePw: () => this.setState({ showPw: !showPw }),\n      onPasswordChange: (e) => this.setState({ password: e.target.value, error: null }),\n      onConfirmChange: (e) => this.setState({ confirm: e.target.value }),\n      onSubmit: (e) => { e.preventDefault(); this.doSubmit(); },\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
