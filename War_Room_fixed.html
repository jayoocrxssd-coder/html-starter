?biz.name:''}<\u002Fdiv>\n      <button onclick=\"deleteGoal(${g.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n  const done=S.goals.filter(g=>g.done).length;\n  const pct=S.goals.length?Math.round((done\u002FS.goals.length)*100):0;\n  document.getElementById('goalsCount').textContent=`${done}\u002F${S.goals.length}`;\n  document.getElementById('goalsBar').style.width=pct+'%';\n}\nfunction toggleGoal(id){\n  id=parseInt(id);\n  const g=S.goals.find(x=>x.id===id);\n  if(!g)return;\n  const wasDone=g.done;\n  g.done=!g.done;\n  logGoalActivity(id,g.done?'✅ Goal marked complete':'↩ Goal reopened');\n  if(g.done&&!wasDone){\n    const xp=XP_PER_GOAL[g.priority]||XP_PER_GOAL.Medium;\n    let bonus=0;\n    if(g.deadline&&new Date(g.deadline+'T23:59:59')>=new Date()){bonus+=XP_EARLY_BONUS;}\n    awardXP(xp+bonus);\n    const newA=checkAchievements(g);\n    save();\n    showGoalCelebration(g.text,xp+bonus,newA);\n  } else {\n    save();\n  }\n  renderGoals();renderGoalsPage();updateBadges();\n}\nfunction deleteGoal(id){id=parseInt(id);_dangerConfirm('Delete this goal? This cannot be undone.',function(){S.goals=S.goals.filter(g=>g.id!==id);save();renderGoals();renderGoalsPage();updateBadges();});}\n\u002F\u002F saveGoal now handled in Goals Command Center JS above\n\n\u002F\u002F RECENT\nfunction renderRecent(){\n  const el=document.getElementById('recentList'); if(!el)return;\n  if(!S.recent.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3);padding:8px 0\">Nothing logged yet. Log what you\\'ve been working on.<\u002Fdiv>';return;}\n  el.innerHTML=S.recent.slice(0,6).map(r=>{\n    const biz=bizById(r.bizId);\n    return `<div class=\"rec-row\">\n      <div class=\"rec-pip\"><\u002Fdiv>\n      <div class=\"rec-main\">\n        <div class=\"rec-text\">${r.text} <span style=\"opacity:.45\">— ${biz?biz.name:''}<\u002Fspan><\u002Fdiv>\n        <div class=\"rec-ts\">${r.type ? '['+r.type+'] · ' : ''}${r.ts}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"deleteRecent(${r.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;margin-left:6px;flex-shrink:0\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n}\nfunction deleteRecent(id){S.recent=S.recent.filter(r=>r.id!==id);save();renderRecent();}\nfunction saveRecent(){\n  const text=document.getElementById('recentText').value.trim(); if(!text)return;\n  const now=new Date();\n  S.recent.unshift({id:S.nextId++,text,bizId:parseInt(document.getElementById('recentBiz').value)||null,type:document.getElementById('recentType').value,ts:'Today, '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});\n  if(S.recent.length>10)S.recent=S.recent.slice(0,10);\n  save();closeModal('recentModal');renderRecent();\n}\n\n\u002F\u002F ── WEEKLY WINS ──\nconst WIN_ICONS = {Revenue:'💰',Client:'🤝',Launch:'🚀',Milestone:'🏆',Personal:'⭐',Operations:'⚙️'};\n\nfunction openWinModal(){\n  refreshSelects();\n  const sel = document.getElementById('winBiz');\n  if(sel) sel.innerHTML = '<option value=\"\">No Business \u002F Personal<\u002Foption>' + S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  document.getElementById('winText').value = '';\n  openModal('winModal');\n  setTimeout(()=>document.getElementById('winText').focus(), 80);\n}\n\nfunction saveWin(){\n  const text = document.getElementById('winText').value.trim(); if(!text)return;\n  if(!S.wins) S.wins = [];\n  const now = new Date();\n  S.wins.unshift({\n    id: S.nextId++,\n    text,\n    bizId: parseInt(document.getElementById('winBiz').value)||null,\n    category: document.getElementById('winCategory').value || 'Milestone',\n    date: now.toISOString().slice(0,10),\n    ts: now.toLocaleDateString('en-US',{month:'short',day:'numeric'})\n  });\n  if(S.wins.length > 100) S.wins = S.wins.slice(0,100);\n  save();\n  closeModal('winModal');\n  renderWins();\n}\n\nfunction deleteWin(id){\n  if(!S.wins) return;\n  S.wins = S.wins.filter(w=>w.id!==id);\n  save(); renderWins();\n}\n\nfunction renderWins(){\n  const el = document.getElementById('winsList'); if(!el) return;\n  if(!S.wins) S.wins = [];\n  \u002F\u002F Filter to this week\n  const now = new Date();\n  const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay()); weekStart.setHours(0,0,0,0);\n  const thisWeek = S.wins.filter(w => new Date(w.date+'T00:00:00') >= weekStart);\n  if(!thisWeek.length){\n    el.innerHTML = '<div style=\"font-size:10px;color:var(--text3);padding:8px 0;font-family:\\'DM Mono\\',monospace\">No wins logged this week yet.<br>Every step counts — log one.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML = thisWeek.slice(0,5).map(w=>{\n    const biz = bizById(w.bizId);\n    const color = w.bizId ? bizColor(w.bizId) : 'var(--green)';\n    const icon = WIN_ICONS[w.category]||'⭐';\n    return `<div class=\"win-item\">\n      <div class=\"win-star\">${icon}<\u002Fdiv>\n      <div style=\"flex:1\">\n        <div class=\"win-text\">${w.text}<\u002Fdiv>\n        <div class=\"win-meta\">${w.ts}${biz?' · '+biz.name:''} · ${w.category}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"deleteWin(${w.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;opacity:.5\" onmouseover=\"this.style.opacity='1';this.style.color='var(--red)'\" onmouseout=\"this.style.opacity='.5';this.style.color='var(--text3)'\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n\u002F\u002F NAVIGATION\nfunction showPage(page, bizId) {\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));\n  document.querySelectorAll('.biz-item').forEach(n=>n.classList.remove('active-biz'));\n  const pageEl = document.getElementById('page-'+page); if(pageEl) pageEl.classList.add('active'); else return;\n  const navEl = document.getElementById('nav-'+page); if(navEl) navEl.classList.add('active');\n  \u002F\u002F Mobile bottom nav sync\n  document.querySelectorAll('.mob-nav-item').forEach(el=>el.classList.remove('active'));\n  const _morePages=['goals','intel','timer','bills','profile','update','invoices'];\n  const _mbnId=_morePages.includes(page)?'mobnav-more':'mobnav-'+page;\n  const mbn=document.getElementById(_mbnId); if(mbn) mbn.classList.add('active');\n  currentPage=page;\n  if(page==='dashboard'){renderDashboard();}\n  if(page==='strategy'){renderKanban();}\n  if(page==='tracker')renderTracker();\n  if(page==='intel')renderNotes();\n  if(page==='timer'){renderSessionLog();renderAlarms();}\n  if(page==='calendar'){renderCalendar();renderUpcoming();}\n  if(page==='bills'){renderBills();}\n  if(page==='goals'){renderGoalsPage();}\n  if(page==='update'){renderUpdatePage();}\n  if(page==='profile'){renderProfilePage();}\n  if(page==='invoices'){renderInvoices();}\n  if(page==='bizprofile'&&bizId){\n    currentBizId=bizId;\n    document.querySelectorAll('.biz-item').forEach(el=>{if(parseInt(el.dataset.bizid)===bizId)el.classList.add('active-biz');});\n    renderBizProfile(bizId);\n  }\n  if(S.lastBriefingTs&&page==='dashboard'){}\n}\n\n\u002F\u002F BUSINESSES\nfunction saveBusiness(){\n  const name=document.getElementById('bizName').value.trim(); if(!name)return;\n  recalculateNextId(); const biz={id:S.nextId++,name,type:document.getElementById('bizType').value.trim(),focus:document.getElementById('bizFocus').value.trim(),status:document.getElementById('bizStatus').value,website:'',targetMarket:'',revenueGoal:0,founded:'',tagline:''};\n  if(!biz.color)biz.color=getUniqueBizColor();\n  S.businesses.push(biz);\n  if(!S.streams[biz.id])S.streams[biz.id]=[];\n  save();closeModal('bizModal');refreshBizNav();renderProfileBizGrid();renderDashboard();\n  ['bizName','bizType','bizFocus'].forEach(id=>document.getElementById(id).value='');\n}\n\nfunction refreshBizNav(){\n  \u002F\u002F Ensure Stratus is always pinned as the first business\n  const STRATUS_MARKER = '__stratus_project__';\n  let stratusBiz = S.businesses.find(function(b){ return b._pinned === STRATUS_MARKER; });\n  if(!stratusBiz){\n    stratusBiz = {\n      id: -1,\n      name: 'Stratus',\n      type: 'Product · OS',\n      focus: 'War Room — personal operating system',\n      status: 'Building',\n      _pinned: STRATUS_MARKER,\n      color: '#6c8fff',\n      revenueGoal: 0,\n      website: '',\n      tagline: 'Command Center',\n      founded: ''\n    };\n    S.businesses.unshift(stratusBiz);\n    if(!S.streams[-1]) S.streams[-1] = [];\n  } else if(S.businesses.indexOf(stratusBiz) !== 0){\n    \u002F\u002F Keep it first\n    S.businesses = [stratusBiz].concat(S.businesses.filter(function(b){ return b._pinned !== STRATUS_MARKER; }));\n  }\n\n  function bizItemHTML(b, i){\n    const color = b.color || BIZ_COLORS[i % BIZ_COLORS.length];\n    const isPinned = b._pinned === STRATUS_MARKER;\n    const statusStyle = b.status==='Active'\n      ? 'background:var(--green-bg);color:var(--green)'\n      : b.status==='Building'\n        ? 'background:var(--amber-bg);color:var(--amber)'\n        : b.status==='On Hold'\n          ? 'background:var(--bg3);color:var(--text3)'\n          : 'background:var(--blue-bg);color:var(--blue)';\n    const logoHtml = b.logo\n      ? '<div style=\"width:18px;height:18px;border-radius:4px;overflow:hidden;flex-shrink:0\"><img src=\"' + b.logo + '\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fdiv>'\n      : '<div class=\"biz-pip\" style=\"background:' + color + (isPinned ? ';box-shadow:0 0 0 2px ' + color + '33' : '') + '\"><\u002Fdiv>';\n    const pinnedBadge = isPinned\n      ? '<span style=\"font-size:7px;font-family:DM Mono,monospace;margin-left:auto;padding:1px 5px;border-radius:100px;background:' + color + '22;color:' + color + ';letter-spacing:.04em\">PROJECT<\u002Fspan>'\n      : '<span style=\"font-size:8px;font-family:DM Mono,monospace;margin-left:auto;padding:1px 6px;border-radius:100px;' + statusStyle + '\">' + (b.status||'') + '<\u002Fspan>';\n    const cls = 'biz-item' + (isPinned ? ' biz-item-pinned' : '');\n    \u002F\u002F Use data-bizid only — clicks handled by delegated listener on bizNav\n    return '<div class=\"' + cls + '\" data-bizid=\"' + b.id + '\" title=\"Double-click or right-click for options\">'\n      + logoHtml\n      + '<span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">' + b.name + '<\u002Fspan>'\n      + pinnedBadge\n      + '<\u002Fdiv>';\n  }\n\n  const bizNavEl = document.getElementById('bizNav');\n  bizNavEl.innerHTML = S.businesses.map(bizItemHTML).join('');\n\n  \u002F\u002F Event delegation — no inline onclick conflicts\n  bizNavEl.onclick = function(e){\n    const item = e.target.closest('[data-bizid]');\n    if(!item) return;\n    showPage('bizprofile', parseInt(item.dataset.bizid));\n  };\n  bizNavEl.ondblclick = function(e){\n    const item = e.target.closest('[data-bizid]');\n    if(!item) return;\n    e.preventDefault();\n    showBizCtxMenu(e, parseInt(item.dataset.bizid));\n  };\n  bizNavEl.oncontextmenu = function(e){\n    const item = e.target.closest('[data-bizid]');\n    if(!item) return;\n    showBizCtxMenu(e, parseInt(item.dataset.bizid));\n  };\n\n  refreshSelects();\n  updateBadges();\n}\n\nfunction refreshSelects(){\n  const withAll=['chartBizSel','trackerBizSel','strategyBizFilter','billsBizFilter'];\n  const plain=['taskBiz','entryBiz','noteBiz','goalBiz','recentBiz','billBiz','editBillBiz','sessionBiz','editTaskBiz','editGoalBiz','editNoteBiz','lgcEditGoalBiz'];\n  const bizOptions=S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  const withNone='<option value=\"\">No Business<\u002Foption>'+bizOptions;\n  plain.forEach(id=>{const el=document.getElementById(id);if(!el)return;const prev=el.value;el.innerHTML=withNone||'<option value=\"\">No businesses added<\u002Foption>';if(prev)el.value=prev;});\n  withAll.forEach(id=>{const el=document.getElementById(id);if(!el)return;const prev=el.value;el.innerHTML='<option value=\"all\">All Businesses<\u002Foption>'+bizOptions;if(prev)el.value=prev;});\n  const nf=document.getElementById('noteFilter');if(nf)nf.innerHTML='<option value=\"all\">All<\u002Foption>'+bizOptions;\n  const gbf=document.getElementById('goalBizFilter');if(gbf){const prev=gbf.value;gbf.innerHTML='<option value=\"all\">All Businesses<\u002Foption>'+bizOptions;if(prev)gbf.value=prev;}\n}\n\nfunction updateBadges(){\n  const gb = document.getElementById('badge-goals');\n  if(gb){ const ag = S.goals.filter(g=>!g.done).length; gb.textContent = ag > 0 ? ag : ''; }\n  const bd=document.getElementById('badge-dashboard');if(bd){const a=S.tasks.filter(t=>t.status==='In Progress').length;bd.textContent=a||'';}\n  const bs=document.getElementById('badge-strategy');if(bs){const p=S.tasks.filter(t=>t.status==='Planned').length;bs.textContent=p||'';}\n  const bi=document.getElementById('badge-intel');if(bi){bi.textContent=S.notes.length||'';}\n  const bb=document.getElementById('badge-bills');if(bb){const od=S.bills.filter(b=>b.status==='overdue').length;bb.textContent=od||'';if(od)bb.style.color='var(--red)';else bb.style.color='';}\n  const binv=document.getElementById('badge-invoices');if(binv){const today=new Date().toISOString().slice(0,10);const oi=(S.invoices||[]).filter(inv=>inv.status!=='paid'&&inv.dueDate&&inv.dueDate<today).length;binv.textContent=oi||'';binv.style.display=oi?'':'none';if(oi)binv.style.color='var(--red)';else binv.style.color='';}\n}\n\n\u002F\u002F DASHBOARD\nfunction renderDashboard(){renderKpiStrip();renderChart();renderDashTasks();renderNetSummary();renderGoals();renderRecent();renderWins();updateBadges();renderTodaySchedule();renderDashUpcoming();}\n\nfunction renderKpiStrip(){\n  const r=S.entries.reduce((a,e)=>a+e.rev,0);\n  const x=S.entries.reduce((a,e)=>a+e.exp,0);\n  const net=r-x;\n  const active=S.tasks.filter(t=>t.status==='In Progress').length;\n  const totalSecs=S.sessions.reduce((a,s)=>a+s.duration,0);\n  const totalHrs=(totalSecs\u002F3600).toFixed(1);\n  document.getElementById('kpiStrip').innerHTML=[\n    {lbl:'Revenue YTD',val:'$'+r.toLocaleString(),sub:'Total incoming'},\n    {lbl:'Expenses YTD',val:'$'+x.toLocaleString(),sub:'Total outgoing'},\n    {lbl:'Net Profit',val:'$'+Math.abs(net).toLocaleString(),sub:'YTD position',cls:net>=0?'pos':'neg'},\n    {lbl:'Active Missions',val:active,sub:S.tasks.length+' total logged'},\n    {lbl:'Hours Logged',val:totalHrs+'h',sub:S.sessions.length+' sessions'},\n  ].map(k=>`<div class=\"card card-sm\"><div class=\"cl\">${k.lbl}<\u002Fdiv><div class=\"cv ${k.cls||''}\">${k.val}<\u002Fdiv><div class=\"cs\">${k.sub}<\u002Fdiv><\u002Fdiv>`).join('');\n}\n\nfunction renderTodaySchedule(){\n  const today=new Date().toISOString().slice(0,10);\n  const todayEvs=S.events.filter(e=>e.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));\n  const wrap=document.getElementById('todayScheduleWrap');\n  const el=document.getElementById('todaySchedule');\n  if(!wrap||!el)return;\n  if(!todayEvs.length){wrap.style.display='none';return;}\n  wrap.style.display='block';\n  el.innerHTML=todayEvs.map(e=>{\n    const color=bizColorForEvent(e);\n    const biz=bizById(e.bizId);\n    return`<div style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:100px;border:.5px solid ${color}40;background:${color}14\">\n      <div style=\"width:6px;height:6px;border-radius:50%;background:${color};flex-shrink:0\"><\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:700;color:var(--text)\">${e.time||'All day'}<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--text2)\">${e.title}<\u002Fdiv>\n      ${biz?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">· ${biz.name}<\u002Fdiv>`:''}\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderDashUpcoming(){\n  const el=document.getElementById('dashUpcoming');if(!el)return;\n  const today=new Date().toISOString().slice(0,10);\n  const upcoming=S.events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||((a.time||'').localeCompare(b.time||''))).slice(0,8);\n  if(!upcoming.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3);padding:12px 0\">No upcoming events. Add events from the Calendar.<\u002Fdiv>';return;}\n  el.innerHTML=upcoming.map(e=>{\n    const color=bizColorForEvent(e);\n    const biz=bizById(e.bizId);\n    const isToday=e.date===today;\n    return`<div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)\">\n      <div style=\"width:3px;height:36px;border-radius:2px;background:${color};flex-shrink:0\"><\u002Fdiv>\n      <div style=\"min-width:44px;text-align:center\">\n        <div style=\"font-size:9px;font-weight:700;font-family:'DM Mono',monospace;color:${isToday?'var(--accent)':'var(--text)'}\">${isToday?'TODAY':e.date.slice(5)}<\u002Fdiv>\n        ${e.time?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${e.time}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      <div style=\"flex:1\">\n        <div style=\"font-size:11px;font-weight:600;color:var(--text)\">${e.title}<\u002Fdiv>\n        ${biz?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${biz.name}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderChart(){\n  const biz=document.getElementById('chartBizSel')?.value||'all';\n  const ents=biz==='all'?S.entries:S.entries.filter(e=>String(e.bizId)===biz);\n  const byM={};\n  ents.forEach(e=>{if(!byM[e.date])byM[e.date]={rev:0,exp:0};byM[e.date].rev+=e.rev;byM[e.date].exp+=e.exp;});\n  const sorted=Object.entries(byM).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7);\n  const bc=document.getElementById('barChart');\n  if(!sorted.length){bc.innerHTML='<div class=\"empty-state-text\" style=\"font-size:9px;color:var(--text3)\">No entries yet. Log P&L data to see chart.<\u002Fdiv>';return;}\n  const maxV=Math.max(...sorted.flatMap(([,v])=>[v.rev,v.exp]),1);\n  bc.innerHTML=sorted.map(([m,v])=>{const rh=Math.round((v.rev\u002FmaxV)*64);const eh=Math.round((v.exp\u002FmaxV)*64);return`<div class=\"bar-col\"><div style=\"display:flex;gap:2px;align-items:flex-end;height:64px\"><div class=\"bar bar-rev\" style=\"height:${rh}px;flex:1\" title=\"Rev: $${v.rev.toLocaleString()}\"><\u002Fdiv><div class=\"bar bar-exp\" style=\"height:${eh}px;flex:1\" title=\"Exp: $${v.exp.toLocaleString()}\"><\u002Fdiv><\u002Fdiv><div class=\"bar-lbl\">${m.slice(5)}<\u002Fdiv><\u002Fdiv>`;}).join('');\n}\n\nfunction renderDashTasks(){\n  const active=S.tasks.filter(t=>t.status!=='Done').slice(0,5);\n  const el=document.getElementById('dashTasks');\n  if(!active.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3)\">No active missions yet. Add missions from the Mission Board.<\u002Fdiv>';return;}\n  el.innerHTML=active.map(t=>{const biz=bizById(t.bizId);return`<div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg2);border-radius:var(--rs);margin-bottom:6px\"><div><div style=\"font-size:11px;font-weight:600;color:var(--text)\">${t.title}<\u002Fdiv><div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${biz?biz.name:''} · ${t.type||''}<\u002Fdiv><\u002Fdiv><span class=\"badge ${t.priority==='High'?'b-red':t.priority==='Medium'?'b-amber':'b-green'}\">${t.priority}<\u002Fspan><\u002Fdiv>`;}).join('');\n}\n\nfunction renderNetSummary(){\n  const el=document.getElementById('netSummary');\n  const period=document.getElementById('netPeriodSel')?.value||'ytd';\n  const now=new Date();\n  let filtered=S.entries;\n  if(period==='mtd'){\n    const ym=now.toISOString().slice(0,7);\n    filtered=S.entries.filter(e=>e.date===ym);\n  } else if(period==='7d'){\n    \u002F\u002F entries only have YYYY-MM so we match current + previous month then approximate\n    const cutoff=new Date(now); cutoff.setDate(cutoff.getDate()-7);\n    const cutYM=cutoff.toISOString().slice(0,7);\n    const nowYM=now.toISOString().slice(0,7);\n    filtered=S.entries.filter(e=>e.date===nowYM||e.date===cutYM);\n  }\n  const byB={};\n  filtered.forEach(e=>{if(!byB[e.bizId])byB[e.bizId]={rev:0,exp:0};byB[e.bizId].rev+=e.rev;byB[e.bizId].exp+=e.exp;});\n  const periodLabel={ytd:'YTD',mtd:'This Month',['7d']:'Past 7 Days'}[period]||'YTD';\n  if(!Object.keys(byB).length){\n    el.innerHTML=`<div style=\"font-size:10px;color:var(--text3)\">No data for ${periodLabel}.<\u002Fdiv>`;return;\n  }\n  const ym2=now.toISOString().slice(0,7);\n  const billsDueThisMonth=(S.bills||[]).filter(b=>b.dueDate&&b.dueDate.startsWith(ym2)&&b.status!=='paid').reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  el.innerHTML=Object.entries(byB).map(([id,v])=>{\n    const biz=bizById(parseInt(id));const net=v.rev-v.exp;\n    return`<div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)\">\n      <div><div style=\"font-size:11px;font-weight:700;color:var(--text)\">${biz?biz.name:'Unknown'}<\u002Fdiv>\n      <div style=\"font-size:8px;color:var(--text3);font-family:'DM Mono',monospace\">Rev $${v.rev.toLocaleString()} · Exp $${v.exp.toLocaleString()}<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:12px;font-family:'DM Mono',monospace;font-weight:700\" class=\"${net>=0?'pos':'neg'}\">${net>=0?'+':'−'} $${Math.abs(net).toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')+`<div style=\"font-size:8px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:8px;text-align:right\">${periodLabel}<\u002Fdiv>`;\n  \u002F\u002F Append bills due this month after main content\n  if(billsDueThisMonth>0){\n    el.innerHTML+=`<div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)\"><div><div style=\"font-size:11px;font-weight:700;color:var(--text)\">Bills Due<\u002Fdiv><div style=\"font-size:8px;color:var(--text3);font-family:'DM Mono',monospace\">This month<\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;font-family:'DM Mono',monospace;font-weight:700;color:var(--red)\">−$${billsDueThisMonth.toLocaleString()}<\u002Fdiv><\u002Fdiv>`;\n  }\n}\n\n\u002F\u002F KANBAN\nconst KCOLS=['Planned','In Progress','Done'];\nfunction renderKanban(){\n  const filter=document.getElementById('strategyBizFilter')?.value||'all';\n  let tasks=S.tasks;\n  if(filter!=='all')tasks=tasks.filter(t=>String(t.bizId)===filter);\n  document.getElementById('kanbanBoard').innerHTML=KCOLS.map(col=>`\n    <div class=\"k-col\" ondragover=\"event.preventDefault();this.classList.add('drag-over')\" ondragleave=\"event.relatedTarget&&this.contains(event.relatedTarget)?null:this.classList.remove('drag-over')\" ondrop=\"dropTask(event,'${col}',this)\">\n      <div class=\"k-col-title\">${col}<span style=\"background:var(--bg3);color:var(--text3);font-size:8px;padding:1px 6px;border-radius:100px;font-family:'DM Mono',monospace\">${tasks.filter(t=>t.status===col).length}<\u002Fspan><\u002Fdiv>\n      ${tasks.filter(t=>t.status===col).map(t=>{const biz=bizById(t.bizId);const isDone=t.status==='Done';return`<div class=\"task-card${isDone?' done-flash':''}\" id=\"task-card-${t.id}\" draggable=\"true\" ondragstart=\"dragTaskStart(event,${t.id})\" ondragend=\"dragTaskEnd(event)\" onclick=\"openTaskDetail(${t.id})\">\n        <div class=\"task-title-text\">${t.title}<\u002Fdiv>\n        <div style=\"display:flex;gap:4px;flex-wrap:wrap\">${typeBadge(t.type||'Task')}<span class=\"badge ${t.priority==='High'?'b-red':t.priority==='Medium'?'b-amber':'b-green'}\">${t.priority}<\u002Fspan>${biz?`<span class=\"badge b-muted\">${biz.name}<\u002Fspan>`:''}<\u002Fdiv>\n        ${t.notes?`<div style=\"font-size:10px;color:var(--text3);margin-top:5px;line-height:1.5\">${t.notes}<\u002Fdiv>`:''}\n        <div style=\"margin-top:7px;padding-top:6px;border-top:.5px solid var(--border);display:flex;justify-content:space-between\"><button onclick=\"event.stopPropagation();openEditTask(${t.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:9px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 0\">Edit<\u002Fbutton><button onclick=\"event.stopPropagation();deleteTask(${t.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:9px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 0\" onmouseenter=\"this.style.color='var(--red)'\" onmouseleave=\"this.style.color='var(--text3)'\">Delete<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>`;}).join('')}\n      <button class=\"add-col-btn\" onclick=\"openAddTask('${col}')\">+ Add Mission<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nlet _dragTaskId=null;\nfunction dragTaskStart(e,id){_dragTaskId=id;setTimeout(()=>{const el=document.getElementById('task-card-'+id);if(el)el.classList.add('dragging');},0);e.dataTransfer.effectAllowed='move';}\nfunction dragTaskEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.k-col').forEach(c=>c.classList.remove('drag-over'));}\nfunction dropTask(e,col,colEl){e.preventDefault();colEl.classList.remove('drag-over');if(!_dragTaskId)return;const t=S.tasks.find(x=>x.id===_dragTaskId);if(t&&t.status!==col){t.status=col;save();renderKanban();updateBadges();}_dragTaskId=null;}\nfunction dropTaskInBiz(e,col,bizId,colEl){e.preventDefault();colEl.classList.remove('drag-over');if(!_dragTaskId)return;const t=S.tasks.find(x=>x.id===_dragTaskId);if(t&&t.status!==col){t.status=col;save();renderBizProfile(bizId);}_dragTaskId=null;}\nfunction cycleTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.status=KCOLS[(KCOLS.indexOf(t.status)+1)%KCOLS.length];save();renderKanban();updateBadges();}\nfunction deleteTask(id){_dangerConfirm('Delete this mission? This cannot be undone.',function(){S.tasks=S.tasks.filter(t=>t.id!==id);save();renderKanban();updateBadges();renderDashboard();});}\n\nfunction openTaskDetail(id){\n  const t=S.tasks.find(x=>x.id===id);if(!t)return;\n  const biz=bizById(t.bizId);\n  const priorityColor={High:'var(--red)',Medium:'var(--amber)',Low:'var(--green)'}[t.priority]||'var(--text3)';\n  const typeColorMap={Strategy:'var(--blue)',Planning:'var(--amber)',Revenue:'var(--green)',Operations:'var(--text3)',Creative:'var(--blue)',Research:'var(--amber)'};\n  const typeColor=typeColorMap[t.type]||'var(--text3)';\n  const bizColor=biz?BIZ_COLORS[S.businesses.findIndex(b=>b.id===biz.id)%BIZ_COLORS.length]:null;\n  const isDone=t.status==='Done';\n\n  const overlay=document.getElementById('taskDetailOverlay');\n  overlay.querySelector('.task-popup-card').style.setProperty('--tp-color',bizColor||typeColor);\n  document.getElementById('taskPopupHeaderBg').style.background=bizColor||typeColor;\n  document.getElementById('taskPopupEyebrow').style.color=bizColor||typeColor;\n  document.getElementById('taskPopupEyebrow').innerHTML=`<div style=\"width:6px;height:6px;border-radius:50%;background:${bizColor||typeColor};flex-shrink:0\"><\u002Fdiv>${(t.type||'Task').toUpperCase()}${biz?' · '+biz.name:''}`;\n  document.getElementById('taskPopupTitle').textContent=t.title;\n\n  \u002F\u002F Meta grid\n  const metaItems=[\n    `<div class=\"task-popup-meta-item\"><div class=\"task-popup-meta-label\">Priority<\u002Fdiv><div class=\"task-popup-meta-value\" style=\"color:${priorityColor}\">${t.priority}<\u002Fdiv><\u002Fdiv>`,\n    `<div class=\"task-popup-meta-item\"><div class=\"task-popup-meta-label\">Status<\u002Fdiv><div class=\"task-popup-meta-value\">${t.status}<\u002Fdiv><\u002Fdiv>`,\n    `<div class=\"task-popup-meta-item\"><div class=\"task-popup-meta-label\">Type<\u002Fdiv><div class=\"task-popup-meta-value\" style=\"color:${typeColor}\">${t.type||'Task'}<\u002Fdiv><\u002Fdiv>`,\n  ];\n  document.getElementById('taskPopupMeta').innerHTML=metaItems.join('');\n\n  \u002F\u002F Notes\n  const nb=document.getElementById('taskPopupNotesBlock');\n  if(t.notes&&nb){nb.style.display='';document.getElementById('taskPopupNotesText').textContent=t.notes;}\n  else if(nb){nb.style.display='none';}\n\n  \u002F\u002F Done button\n  const doneBtn=document.getElementById('taskPopupDoneBtn');\n  if(isDone){\n    doneBtn.textContent='✓ Mission Complete';\n    doneBtn.className='task-popup-done-btn already-done';\n    doneBtn.onclick=null;\n  } else {\n    doneBtn.textContent='✓ Mark Done';\n    doneBtn.className='task-popup-done-btn';\n    doneBtn.onclick=()=>{\n      t.status='Done';save();\n      \u002F\u002F Flash the card green\n      const card=document.getElementById('task-card-'+id);\n      if(card){card.classList.add('done-flash');}\n      closeTaskDetail();\n      setTimeout(()=>{renderKanban();updateBadges();renderDashboard();},350);\n    };\n  }\n\n  document.getElementById('taskPopupEditBtn').onclick=()=>{closeTaskDetail();openEditTask(id);};\n  document.getElementById('taskPopupDeleteBtn').onclick=()=>{if(confirm('Delete this mission?')){deleteTask(id);closeTaskDetail();}};\n  overlay.style.display='flex';\n}\n\nfunction closeTaskDetail(){\n  const el=document.getElementById('taskDetailOverlay');\n  if(el){el.style.opacity='0';el.style.transition='opacity .18s';setTimeout(()=>{el.style.display='none';el.style.opacity='';el.style.transition='';},180);}\n}\nfunction openAddTask(status){\n  document.getElementById('taskTitle').value='';document.getElementById('taskNotes').value='';\n  document.getElementById('taskStatus').value=status||'Planned';\n  refreshSelects();openModal('taskModal');\n}\nfunction saveTask(){\n  const title=document.getElementById('taskTitle').value.trim();if(!title)return;\n  S.tasks.push({id:S.nextId++,title,bizId:parseInt(document.getElementById('taskBiz').value)||null,type:document.getElementById('taskType').value,priority:document.getElementById('taskPriority').value,status:document.getElementById('taskStatus').value,notes:document.getElementById('taskNotes').value.trim()});\n  save();closeModal('taskModal');renderKanban();updateBadges();renderDashboard();\n}\n\n\u002F\u002F TRACKER\nfunction setTrackerPeriod(p){\n  S.trackerPeriod=p;\n  ['week','month','year','all'].forEach(t=>{\n    const el=document.getElementById('tab-'+t);\n    if(el)el.className='tracker-tab'+(t===p?' active':'');\n  });\n  renderTracker();\n}\n\nfunction filterEntriesByPeriod(period){\n  const now=new Date();\n  if(period==='week'){\n    \u002F\u002F get start of current week (Mon)\n    const startOfWeek=new Date(now);\n    const day=startOfWeek.getDay()||7;\n    startOfWeek.setDate(startOfWeek.getDate()-day+1);\n    startOfWeek.setHours(0,0,0,0);\n    \u002F\u002F match entries whose day field falls in week, or YYYY-MM matches and no day set\n    const wYM=now.toISOString().slice(0,7);\n    return S.entries.filter(e=>{\n      if(e.day){const d=new Date(e.day+'T00:00:00');return d>=startOfWeek&&d<=now;}\n      return e.date===wYM; \u002F\u002F fallback: all month entries if no specific day\n    });\n  } else if(period==='month'){\n    const ym=now.toISOString().slice(0,7);\n    return S.entries.filter(e=>e.date===ym);\n  } else if(period==='year'){\n    const yr=now.getFullYear().toString();\n    return S.entries.filter(e=>e.date.startsWith(yr));\n  }\n  return S.entries; \u002F\u002F all\n}\n\nfunction renderTracker(){\n  const period=S.trackerPeriod||'month';\n  const bizFilter=document.getElementById('trackerBizSel')?.value||'all';\n  let ents=filterEntriesByPeriod(period);\n  if(bizFilter!=='all')ents=ents.filter(e=>String(e.bizId)===bizFilter);\n  renderTrackerKpis(ents, period);\n  renderBreakdowns(ents, period, bizFilter);\n  populateMonthSel();\n  renderTrackerTable();\n}\n\nfunction renderTrackerKpis(ents, period){\n  const r=ents.reduce((a,e)=>a+e.rev,0);\n  const x=ents.reduce((a,e)=>a+e.exp,0);\n  const n=r-x;const mg=r?Math.round((n\u002Fr)*100):0;\n  const periodLabels={week:'This Week',month:'This Month',year:'This Year',all:'All Time'};\n  const lbl=periodLabels[period]||'Period';\n  document.getElementById('trackerKpis').innerHTML=[\n    {lbl:'Revenue',val:'$'+r.toLocaleString(),sub:lbl},\n    {lbl:'Expenses',val:'$'+x.toLocaleString(),sub:lbl},\n    {lbl:'Net Profit',val:'$'+Math.abs(n).toLocaleString(),sub:lbl,cls:n>=0?'pos':'neg'},\n    {lbl:'Profit Margin',val:mg+'%',sub:lbl,cls:mg>=0?'pos':'neg'},\n  ].map(k=>`<div class=\"card card-sm\"><div class=\"cl\">${k.lbl}<\u002Fdiv><div class=\"cv ${k.cls||''}\">${k.val}<\u002Fdiv><div class=\"cs\">${k.sub}<\u002Fdiv><\u002Fdiv>`).join('');\n}\n\nfunction renderBreakdowns(ents, period, bizFilter){\n  const mWrap=document.getElementById('monthlyBreakdownWrap');\n  const wWrap=document.getElementById('weeklyBreakdownWrap');\n  if(period==='week'){\n    mWrap.style.display='none'; wWrap.style.display='block';\n    \u002F\u002F daily breakdown for this week\n    const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n    const now=new Date();\n    const startOfWeek=new Date(now);\n    const wd=startOfWeek.getDay()||7;\n    startOfWeek.setDate(startOfWeek.getDate()-wd+1);\n    startOfWeek.setHours(0,0,0,0);\n    const rows=days.map((d,i)=>{\n      const dayDate=new Date(startOfWeek);dayDate.setDate(dayDate.getDate()+i);\n      const ds=dayDate.toISOString().slice(0,10);\n      const dayEnts=ents.filter(e=>e.day===ds);\n      const r=dayEnts.reduce((a,e)=>a+e.rev,0);\n      const x=dayEnts.reduce((a,e)=>a+e.exp,0);\n      const net=r-x;\n      const isToday=ds===now.toISOString().slice(0,10);\n      return`<tr ${isToday?'style=\"background:var(--bg2)\"':''}><td>${d} <span class=\"mono\" style=\"font-size:9px;color:var(--text3)\">${ds.slice(5)}<\u002Fspan>${isToday?' <span class=\"badge b-blue\">Today<\u002Fspan>':''}<\u002Ftd><td class=\"mono pos\">${r?'$'+r.toLocaleString():'-'}<\u002Ftd><td class=\"mono neg\">${x?'$'+x.toLocaleString():'-'}<\u002Ftd><td class=\"mono ${net>0?'pos':net<0?'neg':''}\" style=\"font-weight:700\">${net?((net>0?'+':'−')+' $'+Math.abs(net).toLocaleString()):'-'}<\u002Ftd><\u002Ftr>`;\n    });\n    document.getElementById('weekBreakdownBody').innerHTML=rows.join('');\n    document.getElementById('weekBreakdownTitle').textContent='Week of '+startOfWeek.toLocaleDateString('en-US',{month:'short',day:'numeric'});\n  } else {\n    wWrap.style.display='none'; mWrap.style.display='block';\n    \u002F\u002F monthly breakdown\n    const allForPeriod=(bizFilter!=='all'?S.entries.filter(e=>String(e.bizId)===bizFilter):S.entries)\n      .filter(e=>period==='year'?e.date.startsWith(new Date().getFullYear().toString()):true);\n    const byM={};\n    allForPeriod.forEach(e=>{if(!byM[e.date])byM[e.date]={rev:0,exp:0};byM[e.date].rev+=e.rev;byM[e.date].exp+=e.exp;});\n    const sorted=Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0]));\n    if(!sorted.length){document.getElementById('monthlyBreakdownBody').innerHTML='<tr><td colspan=\"5\" style=\"text-align:center;color:var(--text3);padding:16px;font-size:10px\">No data for this period.<\u002Ftd><\u002Ftr>';return;}\n    document.getElementById('monthlyBreakdownBody').innerHTML=sorted.map(([m,v])=>{\n      const net=v.rev-v.exp;const mg=v.rev?Math.round((net\u002Fv.rev)*100):0;\n      const isCurrent=m===new Date().toISOString().slice(0,7);\n      return`<tr ${isCurrent?'style=\"background:var(--bg2)\"':''}><td>${m}${isCurrent?' <span class=\"badge b-blue\">Current<\u002Fspan>':''}<\u002Ftd><td class=\"mono pos\">$${v.rev.toLocaleString()}<\u002Ftd><td class=\"mono neg\">$${v.exp.toLocaleString()}<\u002Ftd><td class=\"mono ${net>=0?'pos':'neg'}\" style=\"font-weight:700\">${net>=0?'+':'−'} $${Math.abs(net).toLocaleString()}<\u002Ftd><td class=\"mono ${mg>=0?'pos':'neg'}\">${mg}%<\u002Ftd><\u002Ftr>`;\n    }).join('');\n    document.getElementById('breakdownTitle').textContent=period==='year'?'Monthly Breakdown ('+new Date().getFullYear()+')':'Monthly Breakdown';\n  }\n}\n\nfunction populateMonthSel(){\n  const months=[...new Set(S.entries.map(e=>e.date))].sort().reverse();\n  const sel=document.getElementById('monthSel');\n  if(!sel)return;\n  sel.innerHTML='<option value=\"all\">All Months<\u002Foption>'+months.map(m=>`<option value=\"${m}\">${m}<\u002Foption>`).join('');\n}\n\nfunction renderTrackerTable(){\n  const biz=document.getElementById('trackerBizSel')?.value||'all';\n  const month=document.getElementById('monthSel')?.value||'all';\n  let ents=S.entries;\n  if(biz!=='all')ents=ents.filter(e=>String(e.bizId)===biz);\n  if(month!=='all')ents=ents.filter(e=>e.date===month);\n  const body=document.getElementById('trackerBody');\n  if(!ents.length){body.innerHTML=`<tr><td colspan=\"9\" style=\"text-align:center;color:var(--text3);padding:28px;font-family:'DM Mono',monospace;font-size:10px\">No entries match. Add entries or change the filter.<\u002Ftd><\u002Ftr>`;return;}\n  body.innerHTML=ents.slice().reverse().map(e=>{\n    const biz=bizById(e.bizId);const net=e.rev-e.exp;\n    return`<tr><td>${biz?biz.name:'?'}<\u002Ftd><td class=\"mono\" style=\"font-size:10px\">${e.date}<\u002Ftd><td class=\"mono\" style=\"font-size:10px;color:var(--text3)\">${e.day||'—'}<\u002Ftd><td>${e.desc}<\u002Ftd><td><span class=\"badge b-muted\">${e.cat}<\u002Fspan><\u002Ftd><td class=\"mono pos\">$${e.rev.toLocaleString()}<\u002Ftd><td class=\"mono neg\">$${e.exp.toLocaleString()}<\u002Ftd><td class=\"mono ${net>=0?'pos':'neg'}\" style=\"font-weight:700\">${net>=0?'+':'−'} $${Math.abs(net).toLocaleString()}<\u002Ftd><td style=\"white-space:nowrap\"><button class=\"btn btn-g btn-sm\" onclick=\"openEditEntry(${e.id})\" style=\"font-size:9px;margin-right:4px\">Edit<\u002Fbutton><button class=\"btn btn-g btn-sm\" onclick=\"deleteEntry(${e.id})\" style=\"font-size:9px\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`;\n  }).join('');\n}\n\nfunction exportCSV(){\n  const rows=[['Business','Month','Date','Description','Category','Revenue','Expense','Net']];\n  S.entries.forEach(e=>{\n    const biz=bizById(e.bizId);const net=e.rev-e.exp;\n    rows.push([biz?biz.name:'',e.date,e.day||'',e.desc,e.cat,e.rev,e.exp,net]);\n  });\n  const csv=rows.map(r=>r.map(c=>`\"${String(c).replace(\u002F\"\u002Fg,'\"\"')}\"`).join(',')).join('\\n');\n  const a=document.createElement('a');a.href='data:text\u002Fcsv;charset=utf-8,'+encodeURIComponent(csv);\n  a.download='stratus-pl-export.csv';a.click();\n}\nfunction openAddEntry(){\n  ['entryDate','entryDay','entryDesc','entryCat','entryRev','entryExp'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('entryDate').value=new Date().toISOString().slice(0,7);\n  refreshSelects();openModal('entryModal');\n}\nfunction saveEntry(){\n  const revRaw=document.getElementById('entryRev').value;\n  const expRaw=document.getElementById('entryExp').value;\n  const rev=revRaw===''?0:parseFloat(revRaw);\n  const exp=expRaw===''?0:parseFloat(expRaw);\n  if(isNaN(rev)||isNaN(exp)){alert('Revenue and expense must be valid numbers.');return;}\n  const date=document.getElementById('entryDate').value||new Date().toISOString().slice(0,7);\n  if(!date){alert('Please select a date.');return;}\n  const day=document.getElementById('entryDay').value||'';\n  const desc=escapeHTML(document.getElementById('entryDesc').value.trim()||'Entry');\n  S.entries.push({id:S.nextId++,bizId:parseInt(document.getElementById('entryBiz').value)||null,date,day,desc,cat:document.getElementById('entryCat').value||'General',rev,exp});\n  save();closeModal('entryModal');renderTracker();renderDashboard();\n}\nfunction deleteEntry(id){_dangerConfirm('Delete this P&L entry? This cannot be undone.',function(){S.entries=S.entries.filter(e=>e.id!==id);save();renderTracker();renderDashboard();});}\n\n\u002F\u002F NOTES\nfunction renderNotes(){\n  const filter=document.getElementById('noteFilter')?.value||'all';\n  const search=(document.getElementById('noteSearch')?.value||'').toLowerCase();\n  let notes=S.notes;\n  if(filter!=='all')notes=notes.filter(n=>String(n.bizId)===filter);\n  if(search)notes=notes.filter(n=>n.title.toLowerCase().includes(search)||n.body.toLowerCase().includes(search));\n  const grid=document.getElementById('notesGrid');\n  if(!notes.length){grid.innerHTML='<div class=\"empty-state\"><div class=\"empty-state-icon\">◉<\u002Fdiv><div class=\"empty-state-text\">No intel entries yet.<br>Add research, observations, or ideas.<\u002Fdiv><\u002Fdiv>';return;}\n  grid.innerHTML=`<div class=\"g2\">${notes.slice().reverse().map(n=>{const biz=bizById(n.bizId);return`<div class=\"note-card\"><div class=\"fb mb8\"><span class=\"badge b-muted\">${biz?escapeHTML(biz.name):'General'}<\u002Fspan><div class=\"flex gap8\"><span style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${n.date}<\u002Fspan><button class=\"btn btn-g btn-sm\" onclick=\"openEditNote(${n.id})\" style=\"font-size:9px\">Edit<\u002Fbutton><button class=\"btn btn-g btn-sm\" onclick=\"deleteNote(${n.id})\" style=\"font-size:9px\">✕<\u002Fbutton><\u002Fdiv><\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px\">${escapeHTML(n.title)}<\u002Fdiv><div class=\"note-body-text\">${escapeHTML(n.body).replace(\u002F\\n\u002Fg,'<br>')}<\u002Fdiv><\u002Fdiv>`;}).join('')}<\u002Fdiv>`;\n  updateBadges();\n}\nfunction saveNote(){\n  const title=document.getElementById('noteTitle').value.trim();const body=document.getElementById('noteBody').value.trim();if(!title)return;\n  S.notes.push({id:S.nextId++,bizId:parseInt(document.getElementById('noteBiz').value)||null,title,body,date:new Date().toISOString().slice(0,10)});\n  save();closeModal('noteModal');renderNotes();\n}\nfunction deleteNote(id){_dangerConfirm('Delete this intel note? This cannot be undone.',function(){S.notes=S.notes.filter(n=>n.id!==id);save();renderNotes();});}\n\n\u002F\u002F BUSINESS PROFILE\nfunction renderBizProfile(bizId){\n  const biz=bizById(bizId); if(!biz){showPage('dashboard');return;}\n  const color=bizColor(bizId);\n  const streams=S.streams[bizId]||[];\n  const bizTasks=S.tasks.filter(t=>t.bizId===bizId);\n  const bizEntries=S.entries.filter(e=>e.bizId===bizId);\n  const bizRev=bizEntries.reduce((a,e)=>a+e.rev,0);\n  const bizExp=bizEntries.reduce((a,e)=>a+e.exp,0);\n  const bizNet=bizRev-bizExp;\n\n  \u002F\u002F Normalise tab name (handle old whiteboard\u002Fstrategy tab names from stored state)\n  const TAB_MAP={whiteboard:'intel',strategy:'missions'};\n  const activeTab=TAB_MAP[currentBizTab]||currentBizTab||'overview';\n  if(activeTab!==currentBizTab) currentBizTab=activeTab;\n\n  \u002F\u002F Shared computed data\n  const now=new Date();\n  const ym=now.toISOString().slice(0,7);\n  const monthEntries=bizEntries.filter(e=>e.date===ym);\n  const monthRev=monthEntries.reduce((a,e)=>a+e.rev,0);\n  const monthExp=monthEntries.reduce((a,e)=>a+e.exp,0);\n  const revGoalAmt=biz.revenueGoal||0;\n  const revGoalPct=revGoalAmt>0?Math.min(100,Math.round((bizRev\u002FrevGoalAmt)*100)):0;\n  const bizGoals=(S.goals||[]).filter(g=>g.bizId===bizId);\n  const bizGoalsDone=bizGoals.filter(g=>g.done).length;\n  const bizGoalPct=bizGoals.length?Math.round((bizGoalsDone\u002FbizGoals.length)*100):0;\n  const activeTasks=bizTasks.filter(t=>t.status!=='Done');\n  const daysLeft=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();\n  const bizNotes=(S.notes||[]).filter(n=>n.bizId===bizId).slice().reverse();\n\n  \u002F\u002F ── OVERVIEW \u002F COMMAND CENTER ──────────────────────────────────\n  const overviewTab=(()=>{\n    const revGoalBar=revGoalAmt>0?`\n      <div class=\"card mb12\">\n        <div class=\"rev-goal-wrap\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\">\n            <div style=\"font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Revenue Goal Progress<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:800;font-family:'DM Mono',monospace;color:${revGoalPct>=100?'var(--green)':color}\">${revGoalPct}%<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rev-goal-bar-bg\"><div class=\"rev-goal-bar-fill\" style=\"width:${revGoalPct}%;background:${revGoalPct>=100?'var(--green)':color}\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"rev-goal-label\"><span>$${bizRev.toLocaleString()} earned<\u002Fspan><span>Goal: $${revGoalAmt.toLocaleString()}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`:'';\n\n    const goalsCard=bizGoals.length?`\n      <div class=\"card\">\n        <div class=\"sec-hdr\"><div class=\"sec-title\">Goals<\u002Fdiv><button class=\"btn btn-g btn-sm\" onclick=\"showPage('goals')\">View All<\u002Fbutton><\u002Fdiv>\n        ${bizGoals.slice(0,4).map(g=>{\n          const pct=g.done?100:(g.target>0?Math.min(100,Math.round(((g.progress||0)\u002Fg.target)*100)):0);\n          return`<div style=\"margin-bottom:10px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n              <div style=\"font-size:11px;font-weight:600;color:var(--text)\">${g.text}<\u002Fdiv>\n              <span style=\"font-size:9px;font-weight:800;font-family:'DM Mono',monospace;color:${g.done?'var(--green)':color}\">${pct}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:4px;background:var(--bg3);border-radius:100px;overflow:hidden\">\n              <div style=\"height:100%;width:${pct}%;background:${g.done?'var(--green)':color};border-radius:100px;transition:width .4s ease\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('')}\n        ${bizGoals.length>4?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;padding:4px 0;cursor:pointer\" onclick=\"showPage('goals')\">+${bizGoals.length-4} more goals →<\u002Fdiv>`:''}\n      <\u002Fdiv>`:'';\n\n    const missionsCard=`\n      <div class=\"card\">\n        <div class=\"sec-hdr\"><div class=\"sec-title\">Active Missions<\u002Fdiv><button class=\"btn btn-g btn-sm\" onclick=\"openAddTaskForBiz(${bizId})\">+ Mission<\u002Fbutton><\u002Fdiv>\n        ${activeTasks.length?activeTasks.slice(0,5).map(t=>`\n          <div class=\"mini-task-card\" onclick=\"openTaskDetail(${t.id})\">\n            <div style=\"font-size:11px;font-weight:600;color:var(--text);margin-bottom:5px\">${t.title}<\u002Fdiv>\n            <div style=\"display:flex;gap:4px;align-items:center\">\n              <span class=\"badge ${t.priority==='High'?'b-red':t.priority==='Medium'?'b-amber':'b-green'}\" style=\"font-size:7px\">${t.priority}<\u002Fspan>\n              <span class=\"badge b-muted\" style=\"font-size:7px\">${t.type}<\u002Fspan>\n              <span style=\"font-size:8px;color:var(--text3);font-family:'DM Mono',monospace;margin-left:auto\">${t.status}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>`).join('')+(activeTasks.length>5?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center;padding:4px 0;cursor:pointer\" onclick=\"switchBizTab(${bizId},'missions')\">+${activeTasks.length-5} more → Missions board<\u002Fdiv>`:'')+\n          `<div style=\"margin-top:8px;padding-top:8px;border-top:.5px solid var(--border);display:flex;justify-content:space-between\">\n            <span style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${bizTasks.filter(t=>t.status==='Done').length} completed<\u002Fspan>\n            <span class=\"link-style\" onclick=\"switchBizTab(${bizId},'missions')\" style=\"font-size:9px;cursor:pointer;color:var(--accent)\">Full Board →<\u002Fspan>\n          <\u002Fdiv>`:\n          `<div style=\"font-size:10px;color:var(--text3)\">No active missions yet. <span style=\"text-decoration:underline;cursor:pointer;color:var(--accent)\" onclick=\"openAddTaskForBiz(${bizId})\">Add one →<\u002Fspan><\u002Fdiv>`}\n      <\u002Fdiv>`;\n\n    const profileCard=`\n      <div class=\"card\" style=\"min-width:210px;max-width:270px\">\n        <div class=\"sec-hdr mb10\"><div class=\"sec-title\">Profile<\u002Fdiv><button class=\"btn btn-g btn-sm\" onclick=\"switchBizTab(${bizId},'settings')\">Edit<\u002Fbutton><\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text2);line-height:1.7\">${biz.focus||'<span style=\"color:var(--text3);font-size:10px\">No description added yet.<\u002Fspan>'}<\u002Fdiv>\n        ${biz.tagline?`<div style=\"font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:8px;font-style:italic\">\"${biz.tagline}\"<\u002Fdiv>`:''}\n        <div style=\"margin-top:12px;padding-top:10px;border-top:.5px solid var(--border);display:flex;flex-wrap:wrap;gap:5px\">\n          <span class=\"badge b-muted\">${biz.type||'Business'}<\u002Fspan>\n          <span class=\"badge ${biz.status==='Active'?'b-green':biz.status==='Building'?'b-amber':'b-muted'}\">${biz.status}<\u002Fspan>\n          ${biz.founded?`<span class=\"badge b-muted\">Est. ${biz.founded}<\u002Fspan>`:''}\n        <\u002Fdiv>\n        ${biz.website?`<a href=\"${biz.website}\" target=\"_blank\" style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:8px;display:block;text-decoration:underline\">${biz.website}<\u002Fa>`:''}\n        ${biz.targetMarket?`<div style=\"margin-top:8px;font-size:9px;color:var(--text3);line-height:1.6\"><span style=\"font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Target:<\u002Fspan> ${biz.targetMarket}<\u002Fdiv>`:''}\n        <div style=\"margin-top:14px;padding:10px 12px;background:var(--bg2);border-radius:var(--rs);text-align:center\">\n          <div style=\"font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Days Left This Month<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;color:var(--text);font-family:'DM Mono',monospace;margin-top:2px\">${daysLeft}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n\n    return`\n      <div class=\"g4 mb12\">\n        <div class=\"card card-sm\"><div class=\"cl\">Month Revenue<\u002Fdiv><div class=\"cv pos\">$${monthRev.toLocaleString()}<\u002Fdiv><div class=\"cs\">${monthExp>0?'Exp $'+monthExp.toLocaleString():'No expenses this month'}<\u002Fdiv><\u002Fdiv>\n        <div class=\"card card-sm\"><div class=\"cl\">YTD Revenue<\u002Fdiv><div class=\"cv ${bizRev>0?'pos':''}\">$${bizRev.toLocaleString()}<\u002Fdiv><div class=\"cs\">${revGoalAmt>0?revGoalPct+'% of $'+revGoalAmt.toLocaleString()+' goal':'No revenue goal set'}<\u002Fdiv><\u002Fdiv>\n        <div class=\"card card-sm\"><div class=\"cl\">Net Profit YTD<\u002Fdiv><div class=\"cv ${bizNet>=0?'pos':'neg'}\">${bizNet>=0?'+':'−'}$${Math.abs(bizNet).toLocaleString()}<\u002Fdiv><div class=\"cs\">Revenue − Expenses<\u002Fdiv><\u002Fdiv>\n        <div class=\"card card-sm\"><div class=\"cl\">Goals<\u002Fdiv><div class=\"cv\">${bizGoals.length?bizGoalsDone+'\u002F'+bizGoals.length:'—'}<\u002Fdiv><div class=\"cs\">${bizGoals.length?bizGoalPct+'% complete':'No goals yet'}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      ${revGoalBar}\n      <div class=\"row\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n          ${missionsCard}\n          ${goalsCard}\n        <\u002Fdiv>\n        ${profileCard}\n      <\u002Fdiv>`;\n  })();\n\n  \u002F\u002F ── MISSIONS (mini-kanban + work streams) ─────────────────────\n  const missionsTab=(()=>{\n    const cols=['Planned','In Progress','Done'];\n    const kanban=`<div class=\"mini-kanban\">\n      ${cols.map(col=>{\n        const colTasks=bizTasks.filter(t=>t.status===col);\n        return`<div class=\"mini-kanban-col\" ondragover=\"event.preventDefault();this.classList.add('drag-over')\" ondragleave=\"event.relatedTarget&&this.contains(event.relatedTarget)?null:this.classList.remove('drag-over')\" ondrop=\"dropTaskInBiz(event,'${col}',${bizId},this)\">\n          <div class=\"mini-kanban-col-hdr\">\n            <span class=\"mini-kanban-count\">${colTasks.length}<\u002Fspan>${col}\n          <\u002Fdiv>\n          ${colTasks.length?colTasks.map(t=>`\n            <div class=\"mini-task-card\" draggable=\"true\" ondragstart=\"dragTaskStart(event,${t.id})\" ondragend=\"dragTaskEnd(event)\" onclick=\"openTaskDetail(${t.id})\">\n              <div style=\"font-size:11px;font-weight:600;color:var(--text);margin-bottom:5px\">${t.title}<\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap\">\n                <span class=\"badge ${t.priority==='High'?'b-red':t.priority==='Medium'?'b-amber':'b-green'}\" style=\"font-size:7px\">${t.priority}<\u002Fspan>\n                <span class=\"badge b-muted\" style=\"font-size:7px\">${t.type}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>`).join(''):`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;padding:6px 0;text-align:center\">Empty<\u002Fdiv>`}\n          <button class=\"add-col-btn\" onclick=\"openAddTaskForBiz(${bizId})\" style=\"margin-top:4px\">+ Add Mission<\u002Fbutton>\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>`;\n\n    const streamsSection=`\n      <div class=\"sec-hdr\"><div class=\"sec-title\">Work Streams<\u002Fdiv><button class=\"btn btn-p btn-sm\" onclick=\"openAddStream(${bizId})\">+ New Stream<\u002Fbutton><\u002Fdiv>\n      ${streams.length?streams.map(s=>`\n        <div class=\"stream-card\">\n          <div class=\"fb mb8\">\n            <div style=\"display:flex;align-items:center;gap:7px\"><span class=\"task-type-badge ${typeClass(s.type)}\">${s.type}<\u002Fspan><div class=\"stream-title\">${s.title}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;align-items:center\">\n              <span class=\"badge ${s.status==='Active'?'b-green':s.status==='Complete'?'b-blue':'b-muted'}\">${s.status}<\u002Fspan>\n              <button onclick=\"openEditStream(${bizId},${s.id})\" style=\"background:none;border:.5px solid var(--border2);color:var(--text3);cursor:pointer;font-size:9px;padding:2px 7px;border-radius:100px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .15s\" onmouseover=\"this.style.color='var(--text)';this.style.borderColor='var(--accent)'\" onmouseout=\"this.style.color='var(--text3)';this.style.borderColor='var(--border2)'\">Edit<\u002Fbutton>\n              <button onclick=\"deleteStream(${bizId},${s.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stream-body\">${s.body}<\u002Fdiv>\n          <div class=\"stream-meta\">${s.date}<\u002Fdiv>\n        <\u002Fdiv>`).join(''):`<div class=\"empty-state\"><div class=\"empty-state-icon\">◎<\u002Fdiv><div class=\"empty-state-text\">No work streams yet.<br>Add strategy docs, plans, and ongoing work<br>for ${biz.name} here.<\u002Fdiv><\u002Fdiv>`}`;\n\n    return`\n      <div class=\"sec-hdr mb10\"><div class=\"sec-title\">Missions Board<\u002Fdiv><button class=\"btn btn-p btn-sm\" onclick=\"openAddTaskForBiz(${bizId})\">+ Mission<\u002Fbutton><\u002Fdiv>\n      ${bizTasks.length?kanban:`<div class=\"empty-state\" style=\"margin-bottom:16px\"><div class=\"empty-state-icon\">◎<\u002Fdiv><div class=\"empty-state-text\">No missions for ${biz.name} yet.<br>Add your first task below or hit + Mission above.<\u002Fdiv><\u002Fdiv>`}\n      ${streamsSection}`;\n  })();\n\n  \u002F\u002F ── FINANCIALS ────────────────────────────────────────────────\n  const financialsTab=(()=>{\n    const months=[];\n    for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleString('en-US',{month:'short'})});}\n    const monthData=months.map(m=>{const mes=bizEntries.filter(e=>e.date===m.key);return{...m,rev:mes.reduce((a,e)=>a+e.rev,0),exp:mes.reduce((a,e)=>a+e.exp,0)};});\n    const maxVal=Math.max(...monthData.map(m=>Math.max(m.rev,m.exp)),1);\n    const chartBars=monthData.map(m=>{const rh=Math.round((m.rev\u002FmaxVal)*72);const eh=Math.round((m.exp\u002FmaxVal)*72);return`<div class=\"fin-chart-month-group\">\n      <div class=\"fin-chart-bars-pair\">\n        <div class=\"fin-bar\" style=\"height:${Math.max(rh,2)}px;background:var(--green);opacity:.8\" title=\"Rev $${m.rev.toLocaleString()}\"><\u002Fdiv>\n        <div class=\"fin-bar\" style=\"height:${Math.max(eh,2)}px;background:var(--red);opacity:.7\" title=\"Exp $${m.exp.toLocaleString()}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fin-chart-month-label\">${m.label}<\u002Fdiv>\n    <\u002Fdiv>`;}).join('');\n    return`\n      <div class=\"sec-hdr\"><div class=\"sec-title\">Financial Log<\u002Fdiv><button class=\"btn btn-p btn-sm\" onclick=\"openAddEntryForBiz(${bizId})\">+ Entry<\u002Fbutton><\u002Fdiv>\n      <div class=\"fin-chart-wrap\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div style=\"font-size:10px;font-weight:800;color:var(--text)\">6-Month Revenue vs. Expenses<\u002Fdiv>\n          <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:${bizNet>=0?'var(--green)':'var(--red)'}\">Net ${bizNet>=0?'+':'−'}$${Math.abs(bizNet).toLocaleString()} YTD<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fin-chart-bars\">${chartBars}<\u002Fdiv>\n        <div class=\"fin-chart-legend\">\n          <div class=\"fin-chart-legend-item\"><div class=\"fin-chart-legend-dot\" style=\"background:var(--green)\"><\u002Fdiv>Revenue<\u002Fdiv>\n          <div class=\"fin-chart-legend-item\"><div class=\"fin-chart-legend-dot\" style=\"background:var(--red)\"><\u002Fdiv>Expenses<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${bizEntries.length?`<div class=\"card\" style=\"padding:0;overflow:hidden\"><div style=\"overflow-x:auto\"><table class=\"dt\"><thead><tr><th>Date<\u002Fth><th>Description<\u002Fth><th>Category<\u002Fth><th>Revenue<\u002Fth><th>Expense<\u002Fth><th>Net<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>${bizEntries.slice().reverse().map(e=>{const net=e.rev-e.exp;return`<tr><td class=\"mono\" style=\"font-size:10px\">${e.day||e.date}<\u002Ftd><td>${e.desc}<\u002Ftd><td><span class=\"badge b-muted\">${e.cat}<\u002Fspan><\u002Ftd><td class=\"mono pos\">$${e.rev.toLocaleString()}<\u002Ftd><td class=\"mono neg\">$${e.exp.toLocaleString()}<\u002Ftd><td class=\"mono ${net>=0?'pos':'neg'}\" style=\"font-weight:700\">${net>=0?'+':'−'} $${Math.abs(net).toLocaleString()}<\u002Ftd><td><button class=\"btn btn-g btn-sm\" onclick=\"deleteEntry(${e.id});renderBizProfile(${bizId})\" style=\"font-size:9px\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`;}).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>`:`<div class=\"empty-state\"><div class=\"empty-state-icon\">◇<\u002Fdiv><div class=\"empty-state-text\">No financial entries for ${biz.name} yet.<\u002Fdiv><\u002Fdiv>`}`;\n  })();\n\n  \u002F\u002F ── INTEL (business notes) ─────────────────────────────────────\n  const intelTab=`\n    <div class=\"sec-hdr mb12\">\n      <div class=\"sec-title\">Business Intel<\u002Fdiv>\n      <button class=\"btn btn-p btn-sm\" onclick=\"openAddNoteForBiz(${bizId})\">+ Add Note<\u002Fbutton>\n    <\u002Fdiv>\n    ${bizNotes.length?`<div class=\"g2\">${bizNotes.map(n=>`\n      <div class=\"note-card\" style=\"border-left:3px solid ${color}\">\n        <div class=\"fb mb8\">\n          <span style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)\">${n.date}<\u002Fspan>\n          <div style=\"display:flex;gap:5px\">\n            <button class=\"btn btn-g btn-sm\" onclick=\"openEditNote(${n.id})\" style=\"font-size:9px\">Edit<\u002Fbutton>\n            <button class=\"btn btn-g btn-sm\" onclick=\"S.notes=S.notes.filter(x=>x.id!==${n.id});save();renderBizProfile(${bizId})\" style=\"font-size:9px;color:var(--red)\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px\">${n.title}<\u002Fdiv>\n        <div class=\"note-body-text\">${n.body||''}<\u002Fdiv>\n      <\u002Fdiv>`).join('')}<\u002Fdiv>`:`\n    <div class=\"intel-empty\">\n      <div class=\"intel-empty-icon\">◈<\u002Fdiv>\n      No intel notes for ${biz.name} yet.<br>\n      Add market research, strategy notes,<br>key contacts, and insights here.\n    <\u002Fdiv>`}`;\n\n  \u002F\u002F ── SETTINGS \u002F CONTROL PANEL ──────────────────────────────────\n  const settingsTab=`\n      <div class=\"cp-section\">\n        <div class=\"cp-section-title\">Identity<\u002Fdiv>\n        <div class=\"cp-grid\">\n          <div class=\"cp-field\"><label>Business Name<\u002Flabel><input type=\"text\" id=\"cp-name\" value=\"${(biz.name||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n          <div class=\"cp-field\"><label>Tagline \u002F Slogan<\u002Flabel><input type=\"text\" id=\"cp-tagline\" placeholder=\"Short punchy tagline...\" value=\"${(biz.tagline||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n          <div class=\"cp-field\"><label>Type \u002F Industry<\u002Flabel><input type=\"text\" id=\"cp-type\" placeholder=\"e.g. E-commerce, Agency...\" value=\"${(biz.type||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n          <div class=\"cp-field\"><label>Status<\u002Flabel><select id=\"cp-status\"><option value=\"Active\" ${biz.status==='Active'?'selected':''}>Active<\u002Foption><option value=\"Building\" ${biz.status==='Building'?'selected':''}>Building<\u002Foption><option value=\"On Hold\" ${biz.status==='On Hold'?'selected':''}>On Hold<\u002Foption><option value=\"Idea Stage\" ${biz.status==='Idea Stage'?'selected':''}>Idea Stage<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div class=\"cp-field cp-field-full\"><label>Focus \u002F Description<\u002Flabel><textarea id=\"cp-focus\" placeholder=\"What does this business do? What are you building toward?\">${biz.focus||''}<\u002Ftextarea><\u002Fdiv>\n          <div class=\"cp-field cp-field-full\"><label>Business Logo<\u002Flabel><div style=\"display:flex;align-items:center;gap:12px;margin-top:2px\"><div id=\"cp-logo-preview\" style=\"width:52px;height:52px;border-radius:10px;background:var(--bg3);border:.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text3);overflow:hidden;flex-shrink:0\">${biz.logo?'<img src=\"'+biz.logo+'\" style=\"width:100%;height:100%;object-fit:cover;border-radius:10px\">':biz.name.charAt(0)}<\u002Fdiv><div><button class=\"btn btn-g btn-sm\" onclick=\"document.getElementById('cp-logo-file-${bizId}').click()\" type=\"button\">Upload Logo<\u002Fbutton><input type=\"file\" id=\"cp-logo-file-${bizId}\" accept=\"image\u002F*\" style=\"display:none\" onchange=\"previewBizLogo(this,${bizId})\"><div style=\"font-size:8px;color:var(--text3);margin-top:4px;font-family:'DM Mono',monospace\">PNG, JPG, SVG &middot; Shows in sidebar &amp; profile<\u002Fdiv>${biz.logo?'<button class=\"btn btn-g btn-sm\" onclick=\"removeBizLogo('+bizId+')\" style=\"margin-top:4px;color:var(--red)\">Remove<\u002Fbutton>':''}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cp-section\">\n        <div class=\"cp-section-title\">Market &amp; Operations<\u002Fdiv>\n        <div class=\"cp-grid\">\n          <div class=\"cp-field\"><label>Website<\u002Flabel><input type=\"text\" id=\"cp-website\" placeholder=\"https:\u002F\u002F...\" value=\"${(biz.website||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n          <div class=\"cp-field\"><label>Founded \u002F Start Date<\u002Flabel><input type=\"text\" id=\"cp-founded\" placeholder=\"e.g. Jan 2024\" value=\"${(biz.founded||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n          <div class=\"cp-field cp-field-full\"><label>Target Market<\u002Flabel><input type=\"text\" id=\"cp-targetMarket\" placeholder=\"Who are you building this for?\" value=\"${(biz.targetMarket||'').replace(\u002F\"\u002Fg,'&quot;')}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cp-section\">\n        <div class=\"cp-section-title\">Financial Target<\u002Fdiv>\n        <div class=\"cp-grid\">\n          <div class=\"cp-field\"><label>Revenue Goal ($)<\u002Flabel><input type=\"number\" id=\"cp-revenueGoal\" placeholder=\"0\" min=\"0\" value=\"${biz.revenueGoal||''}\"><\u002Fdiv>\n          <div class=\"cp-field\" style=\"justify-content:flex-end;padding-top:14px\">\n            <div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;line-height:1.8\">Sets the progress bar<br>shown on the Overview tab<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cp-save-row\">\n        <button class=\"btn btn-p\" onclick=\"saveControlPanel(${bizId})\">Save Changes<\u002Fbutton>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"deleteBusiness(${bizId})\" style=\"margin-left:auto\">Delete Business<\u002Fbutton>\n      <\u002Fdiv>`;\n\n  const tabContent={overview:overviewTab,missions:missionsTab,financials:financialsTab,intel:intelTab,settings:settingsTab};\n\n  document.getElementById('bizProfileContent').innerHTML=`\n    <div class=\"ph\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        ${biz.logo?'<div style=\"width:42px;height:42px;border-radius:8px;overflow:hidden;flex-shrink:0\"><img src=\"'+biz.logo+'\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fdiv>':'<div style=\"width:42px;height:42px;border-radius:8px;background:'+color+'22;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:'+color+'\">'+biz.name.charAt(0)+'<\u002Fdiv>'}\n        <div>\n          <div class=\"pt\">${biz.name}<\u002Fdiv>\n          <div class=\"ps\">${biz.type||'Business'} · ${biz.status}${biz.tagline?' · \"'+biz.tagline+'\"':''}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pa\">\n        <button class=\"btn btn-p btn-sm\" onclick=\"openAddTaskForBiz(${bizId})\">+ Mission<\u002Fbutton>\n        <button class=\"btn btn-g btn-sm\" onclick=\"switchBizTab(${bizId},'settings')\">⚙ Settings<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"biz-profile-card\">\n      <div class=\"biz-tabs\" title=\"Drag tabs to reorder\">\n        ${(biz.tabOrder||DEFAULT_TAB_ORDER).map(t=>`<div class=\"biz-tab${currentBizTab===t?' active':''}\" draggable=\"true\" ondragstart=\"bizTabDragStart(event,'${t}')\" ondragend=\"bizTabDragEnd(event)\" ondragover=\"bizTabDragOver(event,'${t}')\" ondrop=\"bizTabDrop(event,${bizId},'${t}')\" onclick=\"switchBizTab(${bizId},'${t}')\">${TAB_LABELS[t]||t}<\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n      <div class=\"biz-tab-content\" id=\"bizTabContent\">${tabContent[currentBizTab]||tabContent.overview}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nfunction switchBizTab(bizId, tab){currentBizTab=tab;renderBizProfile(bizId);}\n\nconst TAB_LABELS={overview:'Command Center',missions:'Missions',financials:'Financials',intel:'Intel',settings:'⚙ Settings'};\nconst DEFAULT_TAB_ORDER=['overview','missions','financials','intel','settings'];\nlet _dragBizTab=null;\nfunction bizTabDragStart(e,tab){_dragBizTab=tab;e.dataTransfer.effectAllowed='move';}\nfunction bizTabDragEnd(e){document.querySelectorAll('.biz-tab').forEach(t=>t.classList.remove('tab-drag-over'));}\nfunction bizTabDragOver(e,tab){e.preventDefault();if(_dragBizTab&&_dragBizTab!==tab){document.querySelectorAll('.biz-tab').forEach(t=>t.classList.remove('tab-drag-over'));e.currentTarget.classList.add('tab-drag-over');}}\nfunction bizTabDrop(e,bizId,targetTab){\n  e.preventDefault();\n  document.querySelectorAll('.biz-tab').forEach(t=>t.classList.remove('tab-drag-over'));\n  if(!_dragBizTab||_dragBizTab===targetTab){_dragBizTab=null;return;}\n  const biz=bizById(bizId);if(!biz){_dragBizTab=null;return;}\n  const order=[...(biz.tabOrder||DEFAULT_TAB_ORDER)];\n  const from=order.indexOf(_dragBizTab),to=order.indexOf(targetTab);\n  if(from===-1||to===-1){_dragBizTab=null;return;}\n  order.splice(from,1);order.splice(to,0,_dragBizTab);\n  biz.tabOrder=order;save();renderBizProfile(bizId);_dragBizTab=null;\n}\n\nfunction openAddTaskForBiz(bizId){\n  document.getElementById('taskTitle').value='';document.getElementById('taskNotes').value='';\n  document.getElementById('taskStatus').value='Planned';\n  refreshSelects();\n  document.getElementById('taskBiz').value=bizId;\n  openModal('taskModal');\n}\nfunction openAddEntryForBiz(bizId){\n  ['entryDate','entryDesc','entryCat','entryRev','entryExp'].forEach(id=>document.getElementById(id).value='');\n  document.getElementById('entryDate').value=new Date().toISOString().slice(0,7);\n  refreshSelects();document.getElementById('entryBiz').value=bizId;openModal('entryModal');\n}\nfunction openAddNoteForBiz(bizId){\n  document.getElementById('noteTitle').value='';\n  document.getElementById('noteBody').value='';\n  refreshSelects();\n  document.getElementById('noteBiz').value=bizId;\n  openModal('noteModal');\n}\nfunction deleteBusiness(bizId){\n  _dangerConfirm('Delete this business and ALL its data? This cannot be undone.',function(){\n    S.businesses=S.businesses.filter(b=>b.id!==bizId);\n    S.tasks=S.tasks.filter(t=>t.bizId!==bizId);\n    S.entries=S.entries.filter(e=>e.bizId!==bizId);\n    S.notes=S.notes.filter(n=>n.bizId!==bizId);\n    S.goals=S.goals.filter(g=>g.bizId!==bizId);\n    S.recent=S.recent.filter(r=>r.bizId!==bizId);\n    delete S.streams[bizId];\n    save();refreshBizNav();renderProfileBizGrid();showPage('dashboard');\n  });\n}\n\n\u002F\u002F WORK STREAMS\nlet currentStreamBizId=null;\nlet editingStreamId=null;\nfunction openAddStream(bizId){currentStreamBizId=bizId;editingStreamId=null;['streamTitle','streamBody'].forEach(id=>document.getElementById(id).value='');document.getElementById('streamStatus').value='Active';document.getElementById('streamModalTitle').textContent='New Work Stream';document.getElementById('streamSaveBtn').textContent='Add Stream';openModal('streamModal');}\nfunction openEditStream(bizId,streamId){\n  currentStreamBizId=bizId;editingStreamId=streamId;\n  if(!S.streams[bizId])return;\n  const s=S.streams[bizId].find(x=>x.id===streamId);if(!s)return;\n  document.getElementById('streamTitle').value=s.title||'';\n  document.getElementById('streamBody').value=s.body||'';\n  document.getElementById('streamType').value=s.type||'Strategy';\n  document.getElementById('streamStatus').value=s.status||'Active';\n  document.getElementById('streamModalTitle').textContent='Edit Work Stream';\n  document.getElementById('streamSaveBtn').textContent='Save Changes';\n  openModal('streamModal');\n}\nfunction saveStream(){\n  const title=document.getElementById('streamTitle').value.trim();if(!title)return;\n  const bizId=currentStreamBizId;\n  if(!S.streams[bizId])S.streams[bizId]=[];\n  if(editingStreamId!=null){\n    const idx=S.streams[bizId].findIndex(s=>s.id===editingStreamId);\n    if(idx>=0){S.streams[bizId][idx]={...S.streams[bizId][idx],title,type:document.getElementById('streamType').value,body:document.getElementById('streamBody').value.trim(),status:document.getElementById('streamStatus').value};}\n  } else {\n    S.streams[bizId].unshift({id:S.nextId++,title,type:document.getElementById('streamType').value,body:document.getElementById('streamBody').value.trim(),status:document.getElementById('streamStatus').value,date:new Date().toISOString().slice(0,10)});\n  }\n  save();closeModal('streamModal');renderBizProfile(bizId);\n}\nfunction deleteStream(bizId,streamId){\n  if(!S.streams[bizId])return;\n  S.streams[bizId]=S.streams[bizId].filter(s=>s.id!==streamId);\n  save();renderBizProfile(bizId);\n}\n\n\n\u002F\u002F ── BIZ RIGHT-CLICK CONTEXT MENU ──\nlet ctxBizId = null;\nconst bizCtxMenu = document.getElementById('bizCtxMenu');\n\nfunction showBizCtxMenu(e, bizId){\n  e.preventDefault();e.stopPropagation();\n  ctxBizId=bizId;\n  const menu=document.getElementById('bizCtxMenu');\n  \u002F\u002F Show biz name in header\n  const biz=bizById(bizId);\n  const header=document.getElementById('bizCtxMenuHeader');\n  if(header&&biz) header.textContent=biz.name;\n  \u002F\u002F Hide delete for pinned Stratus project\n  const delBtn=document.getElementById('bizCtxDeleteBtn');\n  if(delBtn) delBtn.style.display=(biz&&biz._pinned==='__stratus_project__')?'none':'';\n  \u002F\u002F Position — keep on screen\n  const menuW=190, menuH=260;\n  let left=e.clientX, top=e.clientY;\n  if(left+menuW>window.innerWidth) left=window.innerWidth-menuW-8;\n  if(top+menuH>window.innerHeight) top=window.innerHeight-menuH-8;\n  menu.style.left=left+'px';\n  menu.style.top=top+'px';\n  menu.classList.add('open');\n}\nfunction closeBizCtxMenu(){const m=document.getElementById('bizCtxMenu');if(m)m.classList.remove('open');ctxBizId=null;}\ndocument.addEventListener('click',function(e){if(!e.target.closest('#bizCtxMenu'))closeBizCtxMenu();});\ndocument.addEventListener('keydown',function(e){if(e.key==='Escape')closeBizCtxMenu();});\n\nfunction ctxOpenBiz(){\n  const id=ctxBizId;closeBizCtxMenu();\n  showPage('bizprofile',id);\n}\nfunction ctxRenameBiz(){\n  const biz=bizById(ctxBizId);if(!biz)return;\n  const name=prompt('Rename business:',biz.name);\n  if(name&&name.trim()){biz.name=name.trim();save();refreshBizNav();renderDashboard();}\n  closeBizCtxMenu();\n}\nfunction ctxEditBiz(){\n  const id=ctxBizId;closeBizCtxMenu();\n  showPage('bizprofile',id);\n}\nfunction ctxToggleStatus(){\n  const biz=bizById(ctxBizId);if(!biz)return;\n  const statuses=['Active','Building','On Hold','Idea Stage'];\n  const cur=statuses.indexOf(biz.status||'Active');\n  biz.status=statuses[(cur+1)%statuses.length];\n  save();refreshBizNav();\n  closeBizCtxMenu();\n}\nfunction ctxMoveBizUp(){\n  const idx=S.businesses.findIndex(b=>b.id===ctxBizId);\n  if(idx<=0)return;\n  [S.businesses[idx-1],S.businesses[idx]]=[S.businesses[idx],S.businesses[idx-1]];\n  save();refreshBizNav();closeBizCtxMenu();\n}\nfunction ctxMoveBizDown(){\n  const idx=S.businesses.findIndex(b=>b.id===ctxBizId);\n  if(idx<0||idx>=S.businesses.length-1)return;\n  [S.businesses[idx+1],S.businesses[idx]]=[S.businesses[idx],S.businesses[idx+1]];\n  save();refreshBizNav();closeBizCtxMenu();\n}\nfunction ctxDeleteBiz(){\n  const biz=bizById(ctxBizId);if(!biz)return;\n  if(!confirm('Delete '+biz.name+' and all its data? This cannot be undone.'))return;\n  deleteBusiness(ctxBizId);\n  closeBizCtxMenu();\n}\n\n\u002F\u002F ── CALENDAR ──\nlet calYear = new Date().getFullYear();\nlet calMonth = new Date().getMonth();\nlet selectedCalDay = null;\nlet calView = 'month';\nlet _dragCalEventId = null;\n\nconst MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst EVENT_COLORS = {strategy:'type-strategy',planning:'type-planning',revenue:'type-revenue',personal:'type-personal'};\n\nfunction shiftCal(dir){\n  if(calView==='week'){\n    \u002F\u002F shift by 7 days\n    const base=new Date(calYear,calMonth,1);\n    base.setDate(base.getDate()+dir*7);\n    calYear=base.getFullYear();calMonth=base.getMonth();\n  } else {\n    calMonth+=dir; if(calMonth>11){calMonth=0;calYear++;}else if(calMonth<0){calMonth=11;calYear--;}\n  }\n  renderCalendar();\n}\nfunction goToday(){ calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); selectedCalDay=new Date().toISOString().slice(0,10); renderCalendar(); renderDayView(selectedCalDay); }\nfunction switchCalView(v){\n  calView=v;\n  document.getElementById('calViewMonth').classList.toggle('active',v==='month');\n  document.getElementById('calViewWeek').classList.toggle('active',v==='week');\n  renderCalendar();\n}\n\nfunction bizColorForEvent(e){\n  if(e.bizId){const idx=S.businesses.findIndex(b=>b.id===e.bizId);if(idx>=0)return BIZ_COLORS[idx%BIZ_COLORS.length];}\n  const typeColors={strategy:'#1a4a8a',planning:'#7a4e00',revenue:'#256b47',personal:'#9a9a98'};\n  return typeColors[e.type]||'#9a9a98';\n}\n\nfunction _calDayDnD(dateStr){\n  return `ondragover=\"event.preventDefault();this.classList.add('drag-over')\" ondragleave=\"event.relatedTarget&&this.contains(event.relatedTarget)?null:this.classList.remove('drag-over')\" ondrop=\"dropCalEvent(event,'${dateStr}',this)\"`;\n}\n\nfunction renderCalendar(){\n  document.getElementById('calMonthTitle').textContent=`${MONTHS_LONG[calMonth]} ${calYear}`;\n  if(calView==='week'){renderWeekView();return;}\n  const wrap=document.getElementById('calGridWrap');\n  const today=new Date().toISOString().slice(0,10);\n  let html='<div class=\"cal-grid\">'+DAY_LABELS.map(d=>`<div class=\"cal-day-label\">${d}<\u002Fdiv>`).join('');\n  const first=new Date(calYear,calMonth,1).getDay();\n  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();\n  const prevDays=new Date(calYear,calMonth,0).getDate();\n  const prevYear=calMonth===0?calYear-1:calYear;\n  const prevMonth=calMonth===0?11:calMonth-1;\n  for(let i=first-1;i>=0;i--){\n    const dateStr=`${prevYear}-${pad(prevMonth+1)}-${pad(prevDays-i)}`;\n    html+=`<div class=\"cal-day other-month\" ${_calDayDnD(dateStr)} onclick=\"selectCalDay('${dateStr}')\"><div class=\"cal-day-num\">${prevDays-i}<\u002Fdiv><\u002Fdiv>`;\n  }\n  for(let d=1;d<=daysInMonth;d++){\n    const dateStr=`${calYear}-${pad(calMonth+1)}-${pad(d)}`;\n    const dayEvents=getFilteredCalEvents(S.events.filter(e=>e.date===dateStr));\n    const allDayEvents=S.events.filter(e=>e.date===dateStr);\n    const isToday=dateStr===today;\n    const isSel=dateStr===selectedCalDay;\n    let cls='cal-day'+(isToday?' today':'')+(allDayEvents.length?' has-events':'')+(isSel&&!isToday?' cal-day-selected':'');\n    const fgColor=isToday?'var(--accent-fg)':'inherit';\n    const evPips=dayEvents.slice(0,3).map(e=>{\n      const color=bizColorForEvent(e);\n      const recurIcon=e.repeat&&e.repeat!=='none'?'↻ ':'';\n      return`<div class=\"cal-event-pip\" draggable=\"true\" ondragstart=\"dragCalStart(event,${e.id})\" ondragend=\"dragCalEnd(event)\" onclick=\"event.stopPropagation();openEventPopup(${e.id})\" style=\"background:${color}18\"><div class=\"cal-event-dot\" style=\"background:${color}\"><\u002Fdiv><b style=\"color:${isToday?'var(--accent-fg)':color}\">${recurIcon}${e.title}<\u002Fb><\u002Fdiv>`;\n    }).join('');\n    const more=dayEvents.length>3?`<div class=\"cal-event-more\" style=\"color:${isToday?'var(--accent-fg)':'var(--text3)'}\">+${dayEvents.length-3} more<\u002Fdiv>`:'';\n    html+=`<div class=\"${cls}\" ${_calDayDnD(dateStr)} onclick=\"selectCalDay('${dateStr}')\" ondblclick=\"quickAddEventOnDay('${dateStr}')\" title=\"Double-click to add event\">\n      <div class=\"cal-day-num\">${d}<\u002Fdiv>\n      <button class=\"cal-day-add\" onclick=\"event.stopPropagation();openAddEventOn('${dateStr}')\" title=\"Add event\">+<\u002Fbutton>\n      ${evPips}${more}\n    <\u002Fdiv>`;\n  }\n  const total=first+daysInMonth;\n  const remaining=(7-total%7)%7;\n  const nextYear=calMonth===11?calYear+1:calYear;\n  const nextMonth=calMonth===11?0:calMonth+1;\n  for(let d=1;d<=remaining;d++){\n    const dateStr=`${nextYear}-${pad(nextMonth+1)}-${pad(d)}`;\n    html+=`<div class=\"cal-day other-month\" ${_calDayDnD(dateStr)} onclick=\"selectCalDay('${dateStr}')\"><div class=\"cal-day-num\">${d}<\u002Fdiv><\u002Fdiv>`;\n  }\n  html+='<\u002Fdiv>';\n  wrap.innerHTML=html;\n  renderCalLegend();\n}\n\nfunction renderWeekView(){\n  const wrap=document.getElementById('calGridWrap');\n  const today=new Date().toISOString().slice(0,10);\n  \u002F\u002F Find week start (Sunday) for current calYear\u002FcalMonth\u002F1\n  const anchor=new Date(calYear,calMonth,1);\n  const weekStart=new Date(anchor);\n  weekSta
