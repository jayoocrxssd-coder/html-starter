document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

idth:12px;height:12px;border-radius:50%}\n.ob-summary-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--border)}\n.ob-summary-row:last-child{border-bottom:none}\n.ob-summary-icon{width:32px;height:32px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}\n.ob-summary-label{font-size:11px;font-weight:700;color:var(--text)}\n.ob-summary-val{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px}\n\n\u002F* ══════════════════════════════\n   MOBILE RESPONSIVE LAYOUT\n   ══════════════════════════════ *\u002F\n\u002F* ══════════════════════════════════════════\n   MOBILE — ≤768px\n   ══════════════════════════════════════════ *\u002F\n@media (max-width: 768px) {\n\n  \u002F* ── Variables & base ── *\u002F\n  :root { --side: 0px; --top: 52px; }\n  html, body { font-size: 13px; }\n  .shell { height: 100svh; overflow: hidden; }\n\n  \u002F* ── Topbar ── *\u002F\n  .topbar { padding: 0 13px; gap: 7px; }\n  .logo { font-size: 10px; letter-spacing: .1em; }\n  .topbar-timer { font-size: 12px; min-width: 58px; }\n  .tsep { display: none !important; }\n  .est-display, .date-display, .sync-indicator, .invert-btn { display: none !important; }\n  #alarmChip { display: none !important; }\n  #timerChip { font-size: 8px; padding: 4px 8px; }\n  .topbar-right { gap: 6px; margin-left: auto; }\n  .appear-toggle-btn { padding: 4px 9px; gap: 5px; font-size: 9px; }\n  #cloudSignInBtn { font-size: 8px; padding: 3px 7px; }\n\n  \u002F* ── Hamburger button ── *\u002F\n  .mob-menu-btn {\n    display: flex !important; align-items: center; justify-content: center;\n    width: 34px; height: 34px; border: .5px solid var(--border2);\n    background: var(--bg2); border-radius: 9px; font-size: 14px;\n    cursor: pointer; color: var(--text2); flex-shrink: 0;\n  }\n\n  \u002F* ── Off-canvas sidebar — full height from top:0 ── *\u002F\n  .sidebar {\n    position: fixed n: fixed; inset: 0; z-index: 400; }\n  .mob-more-drawer.open { display: block; }\n  .mob-more-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.46); }\n  .mob-more-sheet {\n    position: absolute; bottom: 0; left: 0; right: 0;\n    background: var(--surface); border-radius: 20px 20px 0 0;\n    border-top: .5px solid var(--border2);\n    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 20px);\n    animation: mob-sheet-up .22s cubic-bezier(.34,1.2,.64,1);\n  }\n  @keyframes mob-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }\n  .mob-more-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--border2); margin: 12px auto 16px; }\n  .mob-more-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }\n  .mob-more-item {\n    display: flex; flex-direction: column; align-items: center; gap: 6px;\n    padding: 14px 8px; border-radius: 14px; cursor: pointer;\n    background: var(--bg2); border: .5px solid var(--border2);\n    font-size: 10px; font-weight: 700; letter-spacing: .05em;\n    text-transform: uppercase; color: var(--text2);\n    transition: background .12s; -webkit-tap-highlight-color: transparent;\n  }\n  .mob-more-item:active { background: var(--bg3); }\n  .mob-more-icon { font-size: 22px; line-height: 1; }\n  .mob-more-drive { display: flex; gap: 8px; margin-bottom: 8px; }\n  .mob-drive-btn {\n    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;\n    padding: 11px 8px; border-radius: 12px; background: var(--bg2);\n    border: .5px solid var(--border2); color: var(--text2);\n    font-family: 'Syne',sans-serif; font-size: 10px; font-weight: 700;\n    letter-spacing: .05em; text-transform: uppercase; cursor: pointer;\n    transition: background .12s; -webkit-tap-highlight-color: transparent;\n  }\n  .mob-drive-btn:active { background: var(--bg3); }\n  .mob-appear-btn { display: flex !important; }\n}\n\n\u002F* ── Extra small : 2px solid transparent; transition: all .15s; flex-shrink: 0;\n  box-shadow: 0 1px 4px rgba(0,0,0,.15);\n}\n.appear-accent-dot:hover { transform: scale(1.18); }\n.appear-accent-dot.active { border-color: var(--text); box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4px var(--text); transform: scale(1.05); }\n.appear-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding-bottom:10px; border-bottom:.5px solid var(--border2); }\n.appear-hdr-title { font-size:11px; font-weight:800; color:var(--text); letter-spacing:-.01em; line-height:1.2; }\n.appear-hdr-sub { font-size:9px; color:var(--text3); font-family:'DM Mono',monospace; margin-top:3px; letter-spacing:.03em; }\n.appear-close-x { background:none; border:.5px solid var(--border2); color:var(--text3); cursor:pointer; width:28px; height:28px; border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center; transition:all .15s; flex-shrink:0; }\n.appear-close-x:hover { background:var(--bg2); color:var(--text); border-color:var(--accent); }\n.appear-footer { margin-top: 10px; display: flex; gap: 7px; padding-top: 10px; border-top: .5px solid var(--border2); align-items:center; }\n\u002F* ── KANBAN DRAG & DROP ── *\u002F\n.k-col { transition: background .15s, border-color .15s; }\n.k-col.drag-over { background: color-mix(in srgb, var(--accent) 6%, var(--bg2)); border: 1.5px dashed var(--accent); border-radius: var(--r); }\n.task-card[draggable] { cursor: grab; }\n.task-card[draggable]:active { cursor: grabbing; }\n.task-card.dragging { opacity: .35; transform: rotate(1.5deg) scale(.97); box-shadow: 0 8px 24px rgba(0,0,0,.18); }\n.mini-task-card[draggable] { cursor: grab; }\n.mini-task-card[draggable]:active { cursor: grabbing; }\n.mini-kanban-col.drag-over { background: color-mix(in srgb, var(--accent) 8%, var(--bg3)); border: 1.5px dashed var(--accent); border-radius: var(--r); }\n\n\n\n\u002F* ══════════════════════════════\n   GOALS COMMAND CENTER\n   ══ 14px; border-radius:50%; border:.5px solid var(--border2); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:7px; transition:all .15s; }\n.goal-ms-tick.done { background:var(--green); border-color:var(--green); color:#fff; }\n.goal-ms-label { flex:1; font-size:11px; color:var(--text); }\n.goal-ms-label.done { text-decoration:line-through; color:var(--text3); }\n.goal-ms-date { font-size:8px; font-family:'DM Mono',monospace; color:var(--text3); white-space:nowrap; }\n.goal-deadline-chip { display:inline-flex; align-items:center; gap:4px; font-size:8px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:100px; }\n.goal-deadline-ok { background:var(--green-bg); color:var(--green); }\n.goal-deadline-warn { background:var(--amber-bg); color:var(--amber); }\n.goal-deadline-late { background:var(--red-bg); color:var(--red); }\n.goal-deadline-none { background:var(--bg3); color:var(--text3); }\n\n.goal-filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }\n.goal-filter-chip { display:inline-flex; align-items:center; gap:5px; border:.5px solid var(--border2); background:var(--bg2); color:var(--text3); font-size:9px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:5px 11px; border-radius:100px; cursor:pointer; transition:all .15s; }\n.goal-filter-chip:hover { background:var(--bg3); color:var(--text); }\n.goal-filter-chip.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }\n\n.goal-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }\n.goal-detail-panel { background:var(--surface); border:.5px solid var(--border2); border-radius:var(--r); overflow:hidden; }\n.goal-detail-header { padding:20px 22px 16px; border-bottom:.5px solid var(--border2); }\n.goal-log-row { display:flex; gap:10px; padding:8px 0; border-bottom:.5px solid var(--border); align-items:flex-start; }\n.goal-log-row:last-child { border-bottom:none; }\n.goal-log-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:4px; }\n\n\u002F* ── WEEKLY WINS ── *\u002F\n.win-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)}\n.win-item:last-child{border-bottom:none}\n.win-star{font-size:14px;flex-shrink:0;margin-top:1px}\n.win-text{flex:1;font-size:12px;font-weight:600;color:var(--text);line-height:1.4}\n.win-meta{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:2px}\n.win-tag{font-size:8px;font-weight:700;padding:2px 7px;border-radius:100px;background:var(--green-bg);color:var(--green);flex-shrink:0}\n\n.goal-cmd-split { display:grid; grid-template-columns:1fr 340px; gap:14px; }\n.goal-activity-feed { display:flex; flex-direction:column; gap:0; max-height:600px; overflow-y:auto; }\n\n\u002F* ── GOAL MOMENTUM CARD ── *\u002F\n.goal-momentum-card{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:center}\n.goal-level-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-fg);padding:3px 11px;border-radius:100px;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}\n.goal-xp-track{height:6px;background:var(--bg3);border-radius:100px;overflow:hidden;margin-top:6px}\n.goal-xp-fill{height:100%;border-radius:100px;background:var(--accent);transition:width .8s cubic-bezier(.34,1.2,.64,1)}\n.goal-momentum-stat{text-align:center}\n.goal-momentum-stat-val{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1}\n.goal-momentum-stat-lbl{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:3px}\n.goal-achiev-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}\n.goa -spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Patch Log<\u002Fdiv>\n              <div id=\"patchLog\" style=\"font-family:'DM Mono',monospace;font-size:10px;line-height:1.8;background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--rs);padding:10px 14px;color:var(--text2);max-height:160px;overflow-y:auto;white-space:pre-wrap\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <button class=\"btn btn-p\" id=\"runPatchBtn\" onclick=\"runSelectedPatch()\" style=\"background:var(--blue);border-color:var(--blue)\">Run Patch →<\u002Fbutton>\n              <button class=\"btn btn-g btn-sm\" onclick=\"clearPatchLog()\">Clear Log<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- RIGHT: Backup history + data summary -->\n    <div class=\"col\" style=\"flex:.7\">\n\n      <!-- Data summary -->\n      <div class=\"card\">\n        <div class=\"sec-title mb12\">Current Data Snapshot<\u002Fdiv>\n        <div id=\"dataSummaryList\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Backup history -->\n      <div class=\"card\">\n        <div class=\"sec-hdr\">\n          <div class=\"sec-title\">Backup History<\u002Fdiv>\n          <button class=\"btn btn-g btn-sm\" onclick=\"clearBackupHistory()\">Clear<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"backupHistoryList\" style=\"max-height:300px;overflow-y:auto\"><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ PROFILE & SETTINGS ══ -->\n<div class=\"page\" id=\"page-profile\">\n  <div class=\"ph\">\n    <div><div class=\"pt\">Profile &amp; Settings<\u002Fdiv><div class=\"ps\">Command central · Manage your war room<\u002Fdiv><\u002Fdiv>\n    <div class=\"pa\" style=\"display:flex;gap:8px;align-items:center\">\n      <button class=\"btn btn-p\" onclick=\"saveProfile()\">Save Changes<\u002Fbutton>\n      <button yle.color='var(--red)'\" onmouseleave=\"this.style.color='var(--text3)'\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;line-height:1.6;max-height:80px;overflow-y:auto\" id=\"aiContextSnippet\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-top:12px;border-top:.5px solid var(--border);margin-top:8px;display:flex;gap:8px\">\n            <button class=\"btn btn-p btn-sm\" onclick=\"saveAISettings()\">Save AI Settings<\u002Fbutton>\n            <button class=\"btn btn-g btn-sm\" onclick=\"resetAIChat()\">Clear Chat History<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── DATA TAB ── -->\n      <div class=\"profile-tab-panel\" id=\"ptab-data\">\n        <div class=\"card\">\n          <div class=\"sec-title mb12\">Backup &amp; Restore<\u002Fdiv>\n          <div class=\"settings-row\">\n            <div>\n              <div class=\"settings-label\">Export Full Backup<\u002Fdiv>\n              <div class=\"settings-sub\">Versioned JSON snapshot — all data preserved<\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-p btn-sm\" onclick=\"exportAllData()\">↓ Backup Now<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"settings-row\">\n            <div>\n              <div class=\"settings-label\">Google Drive Sync<\u002Fdiv>\n              <div class=\"settings-sub\" id=\"drive-sync-status\">Save or load backups from your Drive<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-shrink:0\">\n              <button class=\"btn btn-p btn-sm\" onclick=\"driveSave()\">☁ Save<\u002Fbutton>\n              <button class=\"btn btn-g btn-sm\" onclick=\"driveLoad()\">⬇ Load<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"settings-row\">\n            <div>\n              <div class=\"settings-label\">Auto-Backup History<\u002Fd :'DM Mono',monospace;margin-bottom:16px;margin-top:-10px\">Set your monthly spending limits per life category<\u002Fdiv>\n    <div id=\"budgetPlannerForm\"><\u002Fdiv>\n    <div class=\"mactions\">\n      <button class=\"btn btn-p\" onclick=\"saveBudget()\">Save Budget<\u002Fbutton>\n      <button class=\"btn btn-g\" onclick=\"closeModal('budgetModal')\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- EDIT BILL -->\n<div class=\"modal-overlay\" id=\"editBillModal\">\n  <div class=\"modal-box\" style=\"width:480px\">\n    <div class=\"modal-title\">Edit Bill<\u002Fdiv>\n    <div class=\"fg\">\n      <div class=\"frow\">\n        <div><label>Bill Name<\u002Flabel><input type=\"text\" id=\"editBillName\"><\u002Fdiv>\n        <div><label>Amount ($)<\u002Flabel><input type=\"number\" id=\"editBillAmount\" min=\"0\" step=\"0.01\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\">\n        <div><label>Business<\u002Flabel><select id=\"editBillBiz\"><option value=\"\">No Business<\u002Foption><option value=\"-1\">Stratus<\u002Foption><\u002Fselect><\u002Fdiv>\n        <div><label>Category<\u002Flabel>\n          <select id=\"editBillCat\">\n            <option value=\"Subscription\">Subscription<\u002Foption><option value=\"Rent\">Rent<\u002Foption>\n            <option value=\"Utilities\">Utilities<\u002Foption><option value=\"Insurance\">Insurance<\u002Foption>\n            <option value=\"Payroll\">Payroll<\u002Foption><option value=\"Marketing\">Marketing<\u002Foption>\n            <option value=\"Software\">Software<\u002Foption><option value=\"Services\">Services<\u002Foption>\n            <option value=\"Loan\">Loan<\u002Foption><option value=\"Tax\">Tax<\u002Foption><option value=\"Other\">Other<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\">\n        <div><label>Due Date<\u002Flabel><input type=\"date\" id=\"editBillDueDate\"><\u002Fdiv>\n        <div><label>Status<\u002Flabel>\n          <select id=\"editBillStatus\">\n            <option value=\"upcoming\">Upcoming<\u002Foption><option value=\"paid\">Paid<\u002Foption>\n            <option value=\"autopay\">Auto-pay<\u002Foption><option value=\"overdue\">Overdue<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\">\n        <div><label>Recurring<\u002Flabel>\n          <select id=\"editBillRecur\">\n            <option value=\"none\">One-time<\u002Foption><option value=\"weekly\">Weekly<\u002Foption>\n            <option value=\"biweekly\">Every 2 weeks<\u002Foption><option value=\"monthly\">Monthly<\u002Foption>\n            <option value=\"last-day\">Last day of month<\u002Foption><option value=\"quarterly\">Quarterly<\u002Foption>\n            <option value=\"yearly\">Yearly<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div><label>Auto-add to Calendar<\u002Flabel>\n          <select id=\"editBillAddCal\"><option value=\"yes\">Yes<\u002Foption><option value=\"no\">No<\u002Foption><\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><label>Notes<\u002Flabel><input type=\"text\" id=\"editBillNotes\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mactions\">\n      <button class=\"btn btn-p\" onclick=\"saveEditBill()\">Save Changes<\u002Fbutton>\n      <button class=\"btn btn-g\" onclick=\"closeModal('editBillModal')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-danger btn-sm\" onclick=\"markBillPaid(editingBillId)\" style=\"margin-left:auto\">Mark Paid<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ALARM POPUP -->\n<div class=\"alarm-popup\" id=\"alarmPopup\">\n  <div style=\"font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:5px\">⏰&nbsp; ALARM FIRING<\u002Fdiv>\n  <div style=\"font-size:15px;font-weight:700;color:var(--text)\" id=\"alarmPopupTitle\">Alarm<\u002Fdiv>\n  <div style=\"font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:2px\" id=\"alarmPopupTime\"><\u002Fdiv>\n  <button class=\"btn btn-p btn-sm\" onclick=\"dismissAlarm()\" style=\"margin-top:12px\">Dismiss<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n\u002F* ═══════════════════════════════════════\n   WAR ROOM — ENGINE v3.1\n   All data dynamic. No hardcoded content.\n═══════════════════════════════════════ *\u002F\n\n\u002F\u002F AI model — update in one place\nconst AI_MODEL = 'claude-sonnet-4-20250514';\n\n\u002F\u002F BIZ COLORS — cycling palette\nconst BIZ_COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#14b8a6','#a855f7','#0ea5e9','#22c55e','#eab308','#dc2626'];\n\n\u002F\u002F HTML escape helper — prevents XSS from user-generated content\nfunction escapeHTML(s){ return String(s).replace(\u002F&\u002Fg,'&amp;').replace(\u002F<\u002Fg,'&lt;').replace(\u002F>\u002Fg,'&gt;').replace(\u002F\"\u002Fg,'&quot;').replace(\u002F'\u002Fg,'&#39;'); }\n\nconst DEFAULT = {\n  dark: false,\n  businesses: [],\n  tasks: [],\n  entries: [],\n  notes: [],\n  goals: [],\n  goalLog: [],\n  recent: [],\n  wins: [],\n  streams: {},\n  alarms: [],\n  sessions: [],\n  events: [],\n  bills: [],\n  backups: [],\n  trackerPeriod: 'month',\n  whiteboards: {},\n  profile: {name:'',role:'',avatar:'◈',greetingName:'Sir',warRoomName:'',theme:'stratus',accent:'',radius:'10',font:'syne'},\n  onboarded: false,\n  nextId: 1,\n  monthlyBudgets: {},\n  lastBriefingTs: null,\n  xp: 0,\n  achievements: [],\n};\n\nlet S = {};\nlet timerRunning = false, timerSeconds = 0, timerInterval = null;\nlet alarmRinging = null, currentPage = 'dashboard', currentBizId = null;\nlet currentBizTab = 'overview';\n\nfunction recalculateNextId() {\n  const allIds = [];\n  ['businesses','tasks','entries','notes','goals','goalLog','recent','wins','alarms','sessions','events','bills','backups'].forEach(k => {\n    if (Array.isArray(S[k])) S[k].forEach(item => { if (item && typeof item.id === 'number') allIds.push(item.id); });\n  });\n  if (S.streams && typeof S.streams === 'object') {\n    Object.values(S.streams).forEach(arr => {\n      if (Array.isArray(arr)) arr.forEach(item => { if (item && typeof item.id === 'number') allIds.push(item.id); });\n    });\n  }\n  const maxId = allIds.length ? Math.max(...allIds) : 0;\n  S.nextId = maxId + 1;\n}\n\nfunction save() {\n  const _saveData = Object.assign({}, S, {\n    businesses: S.businesses.filter(function(b){ return !b._pinned; })\n  });\n  try { localStorage.setItem('stratusWR_v31', JSON.stringify(_saveData)); } catch(e){}\n  saveToCloud();\n}\nfunction saveImmediate() {\n  const _saveData = Object.assign({}, S, {\n    businesses: S.businesses.filter(function(b){ return !b._pinned; })\n  });\n  try { localStorage.setItem('stratusWR_v31', JSON.stringify(_saveData)); } catch(e){}\n  saveToCloud(true);\n}\nfunction load() {\n  try {\n    const d = localStorage.getItem('stratusWR_v31');\n    S = d ? JSON.parse(d) : JSON.parse(JSON.stringify(DEFAULT));\n    ['businesses','tasks','entries','notes','goals','goalLog','recent','wins','alarms','sessions','events','bills','backups'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });\n    if (!S.streams || typeof S.streams !== 'object') S.streams = {};\n    if (!S.whiteboards || typeof S.whiteboards !== 'object') S.whiteboards = {};\n    if (!S.monthlyBudgets || typeof S.monthlyBudgets !== 'object' || Array.isArray(S.monthlyBudgets)) S.monthlyBudgets = {};\n    if (typeof S.xp !== 'number' || S.xp < 0) S.xp = 0;\n    if (!Array.isArray(S.achievements)) S.achievements = [];\n    if (!Array.isArray(S.invoices)) S.invoices = [];\n    if (!S.nextId) S.nextId = 1;\n    recalculateNextId();\n    if (typeof S.trackerPeriod !== 'string') S.trackerPeriod = 'month';\n    if (S.onboarded === undefined || S.onboarded === null) S.onboarded = false;\n    if (!S.profile || typeof S.profile !== 'object' || Array.isArray(S.profile)) S.profile = {...DEFAULT.profile};\n  } catch(e) {\n    console.error('WAR ROOM: data load failed, resetting to defaults.', e);\n    S = JSON.parse(JSON.stringify(DEFAULT));\n    setTimeout(() => {\n      const t = document.createElement('div');\n      t.textContent = '⚠ Data could not be loaded — starting fresh. Check console for details.';\n      Object.assign(t.style, {position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'var(--red-bg)',color:'var(--red)',border:'.5px solid var(--red)',borderRadius:'8px',padding:'10px 18px',fontSize:'11px',zIndex:9999,fontFamily:'DM Mono,monospace',whiteSpace:'nowrap'});\n      document.body.appendChild(t);\n      setTimeout(() => t.remove(), 6000);\n    }, 800);\n  }\n}\n\n\u002F\u002F THEME\nfunction invertTheme() { S.dark = !S.dark; document.body.classList.toggle('dark', S.dark); document.getElementById('app').classList.toggle('dark', S.dark); applyTheme(); updateAppearSwatch(); const dt=document.getElementById('darkToggle');if(dt)dt.checked=S.dark; save(); }\n\n\u002F\u002F HELPERS\nfunction pad(n) { return String(n).padStart(2,'0'); }\nfunction fmtTime(s) { return `${pad(Math.floor(s\u002F3600))}:${pad(Math.floor(s%3600\u002F60))}:${pad(s%60)}`; }\nfunction bizById(id) { return S.businesses.find(b => b.id === id); }\nfunction bizColor(id) { \n  const biz=S.businesses.find(b=>b.id===id);\n  if(biz&&biz.color)return biz.color;\n  const idx=S.businesses.findIndex(b=>b.id===id);\n  return BIZ_COLORS[idx%BIZ_COLORS.length];\n}\nfunction getUniqueBizColor(){\n  const used=S.businesses.map(b=>b.color).filter(Boolean);\n  for(let c of BIZ_COLORS){if(!used.includes(c))return c;}\n  return BIZ_COLORS[Math.floor(Math.random()*BIZ_COLORS.length)];\n}\nfunction typeClass(t) { return {Strategy:'task-type-strategy',Planning:'task-type-planning',Revenue:'task-type-revenue',Operations:'task-type-ops',Creative:'task-type-strategy',Research:'task-type-planning',Admin:'task-type-ops'}[t]||'task-type-ops'; }\nfunction typeBadge(t) { const cls = typeClass(t); return `<span class=\"task-type-badge ${cls}\">${t}<\u002Fspan>`; }\n\n\u002F\u002F CLOCKS\nfunction updateClocks() {\n  const now = new Date();\n  const est = new Date(now.toLocaleString('en-US', {timeZone:'America\u002FNew_York'}));\n  const h = est.getHours(), m = est.getMinutes(), s = est.getSeconds();\n  const ampm = h >= 12 ? 'PM' : 'AM', h12 = h%12||12;\n  const estStr = `${pad(h12)}:${pad(m)} ${ampm}`;\n  document.getElementById('estDisplay').textContent = estStr;\n  const be = document.getElementById('bigEstClock'); if (be) be.textContent = estStr;\n  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});\n  const gh = now.getHours();\n  const gn=(S.profile&&S.profile.name&&S.profile.name.trim())||(S.profile&&S.profile.greetingName)||'Sir';const dg = document.getElementById('dashGreeting'); if (dg) dg.textContent = (gh<12?'Good morning':gh<17?'Good afternoon':gh<21?'Good evening':'Good night') + ', ' + gn + '.';\n  const dd = document.getElementById('dashDate'); if (dd) dd.textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});\n  checkAlarms(h, m, s);\n}\n\n\u002F\u002F TIMER\nfunction toggleTimer() {\n  if (!timerRunning) {\n    timerRunning = true;\n    timerInterval = setInterval(() => { timerSeconds++; syncTimerUI(); }, 1000);\n    setTimerState(true);\n  } else {\n    timerRunning = false; clearInterval(timerInterval); timerInterval = null;\n    const savedSeconds = timerSeconds;\n    if (savedSeconds > 0) {\n      const lbl = document.getElementById('sessionLabel')?.value || 'Untitled Session';\n      const bizSel = document.getElementById('sessionBiz');\n      const bizId = bizSel ? (parseInt(bizSel.value)||null) : null;\n      S.sessions.push({duration: savedSeconds, label: lbl, bizId, ts: new Date().toLocaleTimeString()});\n      save(); renderSessionLog();\n    }\n    setTimerState(false);\n  }\n}\nfunction resetTimer() {\n  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; }\n  timerSeconds = 0; setTimerState(false); syncTimerUI();\n}\nfunction setTimerState(r) {\n  const chip = document.getElementById('timerChip'); if (chip) chip.className = r ? 'chip on' : 'chip';\n  const ct = document.getElementById('timerChipText'); if (ct) ct.textContent = r ? 'PAUSE SESSION' : 'START SESSION';\n  const td = document.getElementById('timerDot'); if (td) td.style.opacity = r ? '1' : '.3';\n  const tt = document.getElementById('topTimer'); if (tt) tt.classList.toggle('running', r);\n  const db = document.getElementById('dashTimerBtn'); if (db) db.textContent = r ? 'Pause' : 'Start';\n  const bb = document.getElementById('bigTimerBtn'); if (bb) bb.textContent = r ? 'PAUSE SESSION' : 'START SESSION';\n  const bt = document.getElementById('bigTimer'); if (bt) bt.classList.toggle('running', r);\n  const ds = document.getElementById('dashTimerStatus'); if (ds) ds.textContent = r ? 'Session active' : 'Session paused';\n  const bs = document.getElementById('bigTimerStatus'); if (bs) bs.textContent = r ? 'Session running, Sir.' : 'Awaiting orders, Sir.';\n}\nfunction syncTimerUI() {\n  const fmt = fmtTime(timerSeconds);\n  ['topTimer','dashTimerDisplay','bigTimer'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=fmt; });\n  const si = document.getElementById('sessionInfoDisplay'); if (si) si.textContent = 'Session: ' + fmt;\n}\nfunction renderSessionLog() {\n  const log = document.getElementById('sessionLog'); if (!log) return;\n  if (!S.sessions.length) { log.innerHTML = '<div style=\"font-size:10px;color:var(--text3);font-family:\\'DM Mono\\',monospace\">No sessions yet.<\u002Fdiv>'; return; }\n  log.innerHTML = S.sessions.slice().reverse().map(s => {\n    const biz = bizById(s.bizId);\n    const color = biz ? bizColor(s.bizId) : null;\n    return `<div style=\"background:var(--bg2);border-radius:var(--rs);padding:9px 12px\">\n      <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:4px\">\n        <span style=\"font-size:11px;font-weight:600;color:var(--text)\">${s.label}<\u002Fspan>\n        ${biz?`<span class=\"session-biz-tag\" style=\"background:${color}22;color:${color}\">${biz.name}<\u002Fspan>`:''}\n      <\u002Fdiv>\n      <div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">${fmtTime(s.duration)} · ${s.ts}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n\u002F\u002F ALARMS\nfunction setAlarm() {\n  const t = document.getElementById('alarmTimeIn').value;\n  const l = document.getElementById('alarmLabelIn').value.trim() || 'Alarm';\n  if (!t) return;\n  S.alarms.push({id:S.nextId++, time:t, label:l, armed:true, fired:false});\n  save(); renderAlarms(); updateAlarmChip();\n}\nfunction checkAlarms(h, m, s) {\n  S.alarms.forEach(a => {\n    if (!a.armed || a.fired) return;\n    const [ah,am] = a.time.split(':').map(Number);\n    if (h===ah && m===am && s===0) { a.fired=true; ringAlarm(a); }\n  });\n}\nfunction ringAlarm(a) {\n  alarmRinging = a.id;\n  document.getElementById('alarmPopupTitle').textContent = a.label;\n  document.getElementById('alarmPopupTime').textContent = a.time + ' EST';\n  document.getElementById('alarmPopup').classList.add('open');\n  if (Notification?.permission==='granted') new Notification('⏰ War Room Alarm', {body:a.label});\n}\nfunction dismissAlarm() {\n  document.getElementById('alarmPopup').classList.remove('open');\n  S.alarms = S.alarms.filter(a => a.id !== alarmRinging);\n  alarmRinging = null; save(); renderAlarms(); updateAlarmChip();\n}\nfunction removeAlarm(id) { S.alarms=S.alarms.filter(a=>a.id!==id); save(); renderAlarms(); updateAlarmChip(); }\nfunction renderAlarms() {\n  const el = document.getElementById('alarmsList'); if (!el) return;\n  if (!S.alarms.length) { el.innerHTML='<div style=\"font-size:9px;color:var(--text3);font-family:\\'DM Mono\\',monospace\">No alarms set.<\u002Fdiv>'; return; }\n  el.innerHTML = S.alarms.map(a => `\n    <div style=\"display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:var(--rs);padding:9px 12px\">\n      <div><div style=\"font-size:12px;font-weight:600;color:var(--text)\">⏰ ${a.time} EST<\u002Fdiv><div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">${a.label}<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn btn-g btn-sm\" onclick=\"removeAlarm(${a.id})\">✕<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nfunction updateAlarmChip() {\n  const chip = document.getElementById('alarmChip');\n  if (!S.alarms.length) { chip.textContent='⏰  NO ALARM'; chip.className='chip'; return; }\n  chip.textContent = `⏰  ${S.alarms[0].time} EST`; chip.className = 'chip alarm-on';\n}\n\n\u002F\u002F ── AI CHAT (JARVIS \u002F custom) ──\nlet aiChatHistory = [];\n\nfunction getAIName(){ return (S.profile&&S.profile.aiName)||'JARVIS'; }\n\nfunction getAISystemPrompt(){\n  const name = getAIName();\n  const persona = (S.profile&&S.profile.aiPersona)||'jarvis';\n  const context = (S.profile&&S.profile.aiContext)||'';\n  const greetingName = (S.profile&&S.profile.greetingName)||'Sir';\n\n  const PERSONAS = {\n    jarvis: `You are ${name} — the AI command intelligence inside the operator's personal War Room, built for CRES Ventures. You operate exactly like JARVIS from Iron Man: you are calm, precise, tactically brilliant, and occasionally laced with dry wit. You never use filler words, never give corporate speak, never pad responses. Every sentence you produce should either inform a decision, flag a risk, or accelerate execution.\n\nYou have real-time access to the operator's full data: P&L across all businesses, open missions, active goals, today's schedule, bills, session hours, and intel notes. When you reference this data, be specific — cite numbers, names, and dates, not generalities.\n\nYour response style:\n- Lead with the most important thing. Always.\n- Use **bold** to highlight key terms, numbers, or action items.\n- Use line breaks generously for readability — no walls of text.\n- Be conversational but sharp. Think less \"customer service AI\" and more \"war room advisor who has seen everything.\"\n- When the operator asks for strategy, give specific steps, not theory.\n- When something in their data is a red flag, call it out immediately without sugarcoating.\n- If you spot an opportunity in their data, flag it proactively even if they didn't ask.\n\nAddress the operator as ${greetingName}. You serve one operator. You are loyal to their mission.`,\n\n    coach: `You are ${name} — a high-performance business coach embedded in the operator's War Room. You are motivational, direct, and always push for action. You ask sharp follow-up questions. You celebrate wins and don't let excuses slide. Address the operator as ${greetingName}.`,\n    analyst: `You are ${name} — a data-driven analyst embedded in the operator's War Room. You lead with numbers, patterns, and logic. You spot trends, flag risks, and recommend with precision. Keep it factual and sharp. Address the operator as ${greetingName}.`,\n    direct: `You are ${name} — the operator's no-nonsense AI assistant inside the War Room. Short answers. No fluff. Only what matters. Address the operator as ${greetingName}.`,\n    custom: `You are ${name} — the operator's AI assistant inside their War Room. ${(S.profile&&S.profile.aiCustomTone)||'Be helpful and direct.'} Address the operator as ${greetingName}.`,\n  };\n\n  let system = PERSONAS[persona] || PERSONAS.jarvis;\n  if(context) system += `\\n\\nPRIOR CONTEXT FROM OPERATOR (uploaded background data):\\n${context.slice(0,3000)}`;\n  return system;\n}\n\nfunction getWarRoomContext() {\n  const now = new Date();\n  const todayStr = now.toISOString().slice(0,10);\n  const today = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});\n\n  \u002F\u002F ── P&L ──\n  const totalRev = S.entries.reduce((a,e)=>a+(e.rev||0),0);\n  const totalExp = S.entries.reduce((a,e)=>a+(e.exp||0),0);\n  const net = totalRev - totalExp;\n  const margin = totalRev > 0 ? Math.round((net\u002FtotalRev)*100) : 0;\n\n  \u002F\u002F This week P&L\n  const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay());\n  const weekEntries = S.entries.filter(e=>{ const d=new Date(e.date+'T00:00:00'); return d>=weekStart; });\n  const weekRev = weekEntries.reduce((a,e)=>a+(e.rev||0),0);\n  const weekExp = weekEntries.reduce((a,e)=>a+(e.exp||0),0);\n\n  \u002F\u002F This month P&L\n  const monthEntries = S.entries.filter(e=>e.date&&e.date.startsWith(todayStr.slice(0,7)));\n  const monthRev = monthEntries.reduce((a,e)=>a+(e.rev||0),0);\n  const monthExp = monthEntries.reduce((a,e)=>a+(e.exp||0),0);\n\n  \u002F\u002F ── BUSINESSES ──\n  const bizSummaries = S.businesses.map(b=>{\n    const bRev = S.entries.filter(e=>e.bizId===b.id).reduce((a,e)=>a+(e.rev||0),0);\n    const bTasks = S.tasks.filter(t=>t.bizId===b.id&&t.status!=='Done').length;\n    const bGoals = S.goals.filter(g=>g.bizId===b.id&&!g.done).length;\n    return `${b.name} [${b.status}] — Rev: $${bRev.toLocaleString()}, ${bTasks} open tasks, ${bGoals} active goals${b.focus?' | Focus: '+b.focus.slice(0,60):''}`;\n  }).join('\\n') || 'No businesses added yet';\n\n  \u002F\u002F ── TASKS ──\n  const inProgressTasks = S.tasks.filter(t=>t.status==='In Progress');\n  const plannedTasks = S.tasks.filter(t=>t.status==='Planned');\n  const doneTasks = S.tasks.filter(t=>t.status==='Done');\n  const highPriTasks = S.tasks.filter(t=>t.status!=='Done'&&t.priority==='High');\n\n  \u002F\u002F ── GOALS ──\n  const activeGoals = S.goals.filter(g=>!g.done);\n  const overdueGoals = activeGoals.filter(g=>g.deadline&&new Date(g.deadline+'T00:00:00')<now);\n  const nearDeadlineGoals = activeGoals.filter(g=>{\n    if(!g.deadline)return false;\n    const diff=(new Date(g.deadline+'T00:00:00')-now)\u002F86400000;\n    return diff>=0&&diff<=7;\n  });\n\n  \u002F\u002F ── CALENDAR ──\n  const todayEvs = S.events.filter(e=>e.date===todayStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));\n  const upcomingEvs = S.events.filter(e=>e.date>todayStr&&e.date<=new Date(now.getTime()+7*86400000).toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));\n\n  \u002F\u002F ── BILLS ──\n  const overdueBills = (S.bills||[]).filter(b=>{ const d=getDueDays(b.dueDate); return d!==null&&d<0&&b.status!=='paid'; });\n  const dueSoonBills = (S.bills||[]).filter(b=>{ const d=getDueDays(b.dueDate); return d!==null&&d>=0&&d<=7&&b.status!=='paid'; });\n\n  \u002F\u002F ── SESSIONS ──\n  const totalHours = (S.sessions.reduce((a,s)=>a+(s.duration||0),0)\u002F3600).toFixed(1);\n  const recentSessions = S.sessions.slice(-3).map(s=>`${s.label} (${fmtTime(s.duration)})`).join(', ') || 'None';\n\n  \u002F\u002F ── NOTES \u002F INTEL ──\n  const recentNotes = S.notes.slice(-3).map(n=>`\"${n.title}\" — ${(bizById(n.bizId)||{name:'General'}).name}`).join('; ') || 'None';\n\n  return `╔══════════════════════════════════════╗\n     WAR ROOM INTEL SNAPSHOT — ${today}\n╚══════════════════════════════════════╝\n\n── FINANCIALS ──\nYTD: Revenue $${totalRev.toLocaleString()} | Expenses $${totalExp.toLocaleString()} | Net $${net.toLocaleString()} | Margin ${margin}%\nThis Week: Rev $${weekRev.toLocaleString()} | Exp $${weekExp.toLocaleString()} | Net $${(weekRev-weekExp).toLocaleString()}\nThis Month: Rev $${monthRev.toLocaleString()} | Exp $${monthExp.toLocaleString()} | Net $${(monthRev-monthExp).toLocaleString()}\n\n── BUSINESSES (${S.businesses.length} total) ──\n${bizSummaries}\n\n── MISSIONS ──\nIn Progress (${inProgressTasks.length}): ${inProgressTasks.map(t=>`${t.title} [${t.priority}] @ ${(bizById(t.bizId)||{name:'?'}).name}${t.notes?' | '+t.notes.slice(0,40):''}`).join(' | ') || 'None'}\nPlanned (${plannedTasks.length}): ${plannedTasks.map(t=>`${t.title} [${t.priority}] @ ${(bizById(t.bizId)||{name:'?'}).name}`).join(' | ') || 'None'}\nHigh Priority: ${highPriTasks.map(t=>t.title).join(', ') || 'None'}\nCompleted Total: ${doneTasks.length}\n\n── GOALS ──\nActive (${activeGoals.length}): ${activeGoals.map(g=>`${g.text} [${g.priority||'Med'}] @ ${(bizById(g.bizId)||{name:'General'}).name}${g.deadline?' · due '+g.deadline:''}`).join(' | ') || 'None'}\nOverdue: ${overdueGoals.map(g=>g.text).join(', ') || 'None'}\nDue This Week: ${nearDeadlineGoals.map(g=>g.text+' ('+g.deadline+')').join(', ') || 'None'}\n\n── TODAY'S SCHEDULE ──\n${todayEvs.length ? todayEvs.map(e=>`${e.time||'All day'}: ${e.title}${e.notes?' | '+e.notes.slice(0,60):''}`).join('\\n') : 'Nothing scheduled today'}\n\n── UPCOMING (next 7 days) ──\n${upcomingEvs.slice(0,5).map(e=>`${e.date}: ${e.title}`).join('\\n') || 'Nothing upcoming'}\n\n── BILLS ──\nOverdue: ${overdueBills.length ? overdueBills.map(b=>b.name+' $'+b.amount).join(', ') : 'None'}\nDue This Week: ${dueSoonBills.length ? dueSoonBills.map(b=>b.name+' $'+b.amount).join(', ') : 'None'}\n\n── SESSIONS & WORK ──\nTotal Hours Logged: ${totalHours}h\nRecent Sessions: ${recentSessions}\nRecent Intel Notes: ${recentNotes}\nRecent Work Log: ${S.recent.slice(0,5).map(r=>`${r.text} — ${(bizById(r.bizId)||{name:'General'}).name}`).join(' | ') || 'Nothing logged'}`;\n}\n\nfunction updateAINameUI(){\n  const name = getAIName();\n  const el = document.getElementById('aiPanelName'); if(el) el.textContent = name;\n  const badge = document.getElementById('aiNameBadge'); if(badge) badge.textContent = name;\n  const input = document.getElementById('aiChatInput'); if(input) input.placeholder = `Ask ${name} anything...`;\n  const emptyText = document.getElementById('aiEmptyText');\n  if(emptyText) emptyText.innerHTML = `Hit Briefing for your daily<br>priority rundown, or ask ${name}<br>anything about your war room.`;\n}\n\nfunction addChatBubble(role, html) {\n  const msgs = document.getElementById('aiChatMessages');\n  if(!msgs) return;\n  const empty = msgs.querySelector('.ai-empty');\n  if(empty) empty.remove();\n  const div = document.createElement('div');\n  div.className = `ai-chat-bubble ${role}`;\n  div.innerHTML = html;\n  msgs.appendChild(div);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nfunction addChatTyping() {\n  const msgs = document.getElementById('aiChatMessages');\n  if(!msgs) return;\n  const div = document.createElement('div');\n  div.className = 'ai-chat-bubble jarvis';\n  div.id = 'chatTyping';\n  div.innerHTML = '<div class=\"ai-dot loading\" style=\"margin:4px 0\"><\u002Fdiv>';\n  msgs.appendChild(div);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nasync function sendChat() {\n  const input = document.getElementById('aiChatInput');\n  const sendBtn = document.getElementById('aiChatSendBtn');\n  const dot = document.getElementById('aiDot');\n  const text = input?.value.trim();\n  if(!text) return;\n  input.value = '';\n  input.style.height = '';\n  sendBtn.disabled = true;\n  dot.classList.add('loading');\n  addChatBubble('user', text);\n  addChatTyping();\n  aiChatHistory.push({role:'user', content: text});\n  if(aiChatHistory.length>20)aiChatHistory.splice(0,aiChatHistory.length-20);\n\n  const contextMsg = {role:'user', content: getWarRoomContext() + '\\n\\nUse this context to answer my questions. Do not repeat this data back to me unless asked.'};\n\n  try {\n    const messages = aiChatHistory.length <= 2\n      ? [contextMsg, ...aiChatHistory]\n      : [contextMsg, ...aiChatHistory.slice(-10)];\n\n    const res = await fetch('https:\u002F\u002Fapi.anthropic.com\u002Fv1\u002Fmessages', {\n      method:'POST',\n      headers: getAIFetchHeaders(),\n      body: JSON.stringify({model:AI_MODEL, max_tokens:800, system: getAISystemPrompt(), messages})\n    });\n    const data = await res.json();\n    if(data.error){ throw new Error(data.error.message); }\n    const reply = data.content?.find(c=>c.type==='text')?.text || 'No response.';\n    aiChatHistory.push({role:'assistant', content: reply});\n    const typing = document.getElementById('chatTyping');\n    if(typing) typing.remove();\n    const formatted = reply\n      .replace(\u002F\\*\\*(.*?)\\*\\*\u002Fg,'<b>$1<\u002Fb>')\n      .replace(\u002F\\*(.*?)\\*\u002Fg,'<i>$1<\u002Fi>')\n      .replace(\u002F`(.*?)`\u002Fg,'<code style=\"background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:\\'DM Mono\\',monospace;font-size:11px\">$1<\u002Fcode>')\n      .replace(\u002F\\n\\n\u002Fg,'<br><br>')\n      .replace(\u002F\\n\u002Fg,'<br>');\n    addChatBubble('jarvis', formatted);\n  } catch(e) {\n    const typing = document.getElementById('chatTyping');\n    if(typing) typing.remove();\n    addChatBubble('jarvis', `<span style=\"color:var(--red)\">⚠ ${e.message || 'Connection issue. Check your API key in Settings.'}<\u002Fspan>`);\n  }\n  sendBtn.disabled = false;\n  dot.classList.remove('loading');\n}\n\nasync function runBriefing() {\n  const btn=document.getElementById('briefingBtn');\n  const dot=document.getElementById('aiDot');\n  const name=getAIName();\n  btn.textContent='Generating...'; btn.disabled=true; dot.classList.add('loading');\n\n  const SYSTEM = getAISystemPrompt();\n  const context = getWarRoomContext();\n  const prompt = `${context}\n\nGenerate a tactical daily briefing for the operator. Return ONLY valid JSON, no markdown, no backticks:\n{\n  \"callout\": \"2 sharp sentences that immediately orient the operator to what matters most today. Be specific to their actual data — reference real numbers, business names, or task names. No fluff.\",\n  \"priorities\": [\n    {\"title\": \"Short action-oriented task title\", \"why\": \"One precise tactical sentence explaining the impact or urgency\", \"biz\": \"Business name this applies to\"},\n    {\"title\": \"Short action-oriented task title\", \"why\": \"One precise tactical sentence explaining the impact or urgency\", \"biz\": \"Business name this applies to\"},\n    {\"title\": \"Short action-oriented task title\", \"why\": \"One precise tactical sentence explaining the impact or urgency\", \"biz\": \"Business name this applies to\"}\n  ],\n  \"insight\": \"One sharp strategic observation the operator might be missing — a pattern, risk, or opportunity visible in their data.\",\n  \"watchlist\": \"One sentence flagging any overdue items, unpaid bills, stalled goals, or blocked tasks that need immediate attention. If nothing critical, say so.\"\n}`;\n\n  try {\n    const res = await fetch('https:\u002F\u002Fapi.anthropic.com\u002Fv1\u002Fmessages', {\n      method:'POST',\n      headers: getAIFetchHeaders(),\n      body: JSON.stringify({\n        model:AI_MODEL,\n        max_tokens:1200,\n        system: SYSTEM,\n        messages:[{role:'user', content: prompt}]\n      })\n    });\n    const data = await res.json();\n    if(data.error){ throw new Error(data.error.message); }\n    const raw = data.content?.find(c=>c.type==='text')?.text||'{}';\n    let parsed;\n    try { parsed = JSON.parse(raw.replace(\u002F```json|```\u002Fg,'').trim()); }\n    catch(pe) { throw new Error('Briefing parse failed — malformed response.'); }\n\n    const msgs = document.getElementById('aiChatMessages');\n    if(msgs){ msgs.innerHTML=''; aiChatHistory=[]; }\n\n    const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});\n    const priorities = (parsed.priorities||[]).map((p,i)=>`\n      <div style=\"display:flex;gap:10px;margin-bottom:10px\">\n        <div style=\"width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px\">${i+1}<\u002Fdiv>\n        <div>\n          <div style=\"font-weight:700;font-size:12px;color:var(--text)\">${p.title||''}<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text2);margin-top:2px;line-height:1.5\">${p.why||''}<\u002Fdiv>\n          ${p.biz?`<div style=\"font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-top:3px\">${p.biz}<\u002Fdiv>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    const briefingHtml = `\n      <div style=\"font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">◈ ${name.toUpperCase()} — DAILY BRIEFING · ${now}<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--text);line-height:1.7;margin-bottom:16px;padding-bottom:14px;border-bottom:.5px solid var(--border)\">${parsed.callout||''}<\u002Fdiv>\n      <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px\">TOP PRIORITIES<\u002Fdiv>\n      ${priorities}\n      ${parsed.insight?`<div style=\"background:var(--bg2);border-radius:8px;padding:12px 14px;margin-top:10px;border-left:2px solid var(--accent)\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:5px\">STRATEGIC INSIGHT<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text2);line-height:1.6\">${parsed.insight}<\u002Fdiv>\n      <\u002Fdiv>`:''}\n      ${parsed.watchlist?`<div style=\"background:var(--amber-bg);border-radius:8px;padding:10px 14px;margin-top:8px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px\">⚠ WATCHLIST<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--text2);line-height:1.5\">${parsed.watchlist}<\u002Fdiv>\n      <\u002Fdiv>`:''}`;\n\n    addChatBubble('jarvis', briefingHtml);\n    S.lastBriefingTs=now; save();\n  } catch(e) {\n    addChatBubble('jarvis',`<span style=\"color:var(--red)\">⚠ Briefing failed: ${e.message}<\u002Fspan><br><span style=\"font-size:10px;color:var(--text3)\">Check your API key in Profile → AI Settings.<\u002Fspan>`);\n  }\n  btn.textContent='Briefing ↗'; btn.disabled=false; dot.classList.remove('loading');\n}\n\n\u002F\u002F ── API KEY MANAGEMENT ──\nfunction getApiKey(){\n  return (S.profile&&S.profile.anthropicKey)||'';\n}\n\nfunction previewApiKey(val){\n  const hint=document.getElementById('apiKeyHint');\n  const status=document.getElementById('apiKeyStatus');\n  if(val&&val.startsWith('sk-ant')){\n    if(hint)hint.style.display='';\n    if(status){status.textContent='✓ Valid format';status.style.color='var(--green)';}\n  } else if(val) {\n    if(hint)hint.style.display='none';\n    if(status){status.textContent='⚠ Check format';status.style.color='var(--amber)';}\n  } else {\n    if(hint)hint.style.display='none';\n    if(status){status.textContent='Not set';status.style.color='var(--text3)';}\n  }\n}\n\nfunction toggleApiKeyVisibility(){\n  const inp=document.getElementById('apiKeyInput');\n  if(inp)inp.type=inp.type==='password'?'text':'password';\n}\n\nfunction renderApiKeyStatus(){\n  const key=getApiKey();\n  const inp=document.getElementById('apiKeyInput');\n  const hint=document.getElementById('apiKeyHint');\n  const status=document.getElementById('apiKeyStatus');\n  if(inp)inp.value=key;\n  if(key&&key.startsWith('sk-ant')){\n    if(hint)hint.style.display='';\n    if(status){status.textContent='✓ Active';status.style.color='var(--green)';}\n  } else {\n    if(hint)hint.style.display='none';\n    if(status){status.textContent='Not set';status.style.color='var(--text3)';}\n  }\n}\n\nfunction getAIFetchHeaders(){\n  const key=getApiKey();\n  const headers={'Content-Type':'application\u002Fjson','anthropic-dangerous-direct-browser-access':'true'};\n  if(key)headers['x-api-key']=key;\n  return headers;\n}\n\nfunction saveAISettings(){\n  if(!S.profile)S.profile={};\n  const nameVal = document.getElementById('aiNameInput')?.value.trim();\n  S.profile.aiName = nameVal || 'JARVIS';\n  S.profile.aiPersona = document.getElementById('aiPersonaInput')?.value || 'jarvis';\n  S.profile.aiCustomTone = document.getElementById('aiCustomToneInput')?.value.trim() || '';\n  const keyVal = document.getElementById('apiKeyInput')?.value.trim();\n  if(keyVal) S.profile.anthropicKey = keyVal;\n  save();\n  updateAINameUI();\n  renderApiKeyStatus();\n  \u002F\u002F Flash confirm\n  const btn = document.querySelector('[onclick=\"saveAISettings()\"]');\n  if(btn){const orig=btn.textContent;btn.textContent='✓ Saved';setTimeout(()=>btn.textContent=orig,1500);}\n}\n\nfunction previewAIName(val){\n  const badge=document.getElementById('aiNameBadge');\n  if(badge) badge.textContent = val||'JARVIS';\n}\n\nfunction resetAIChat(){\n  aiChatHistory=[];\n  const msgs=document.getElementById('aiChatMessages');\n  if(msgs){msgs.innerHTML='';const name=getAIName();msgs.innerHTML=`<div class=\"ai-empty\"><div class=\"ai-empty-icon\">◈<\u002Fdiv><div class=\"ai-empty-text\" id=\"aiEmptyText\">Hit Briefing for your daily<br>priority rundown, or ask ${name}<br>anything about your war room.<\u002Fdiv><\u002Fdiv>`;}\n}\n\nfunction loadAIContext(input){\n  const file=input.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=function(ev){\n    const text=ev.target.result;\n    if(!S.profile)S.profile={};\n    S.profile.aiContext=text;\n    S.profile.aiContextFilename=file.name;\n    S.profile.aiContextSize=text.length;\n    save();\n    renderAIContextPreview();\n  };\n  reader.readAsText(file);\n  input.value='';\n}\n\nfunction clearAIContext(){\n  if(!S.profile)return;\n  delete S.profile.aiContext;\n  delete S.profile.aiContextFilename;\n  delete S.profile.aiContextSize;\n  save();\n  renderAIContextPreview();\n}\n\nfunction renderAIContextPreview(){\n  const wrap=document.getElementById('aiContextPreview');\n  const snippet=document.getElementById('aiContextSnippet');\n  if(!wrap||!snippet)return;\n  const ctx=S.profile&&S.profile.aiContext;\n  if(ctx){\n    wrap.style.display='';\n    const fname=S.profile.aiContextFilename||'context file';\n    const size=S.profile.aiContextSize||0;\n    const chars=size>1000?(Math.round(size\u002F100)\u002F10)+'k':size;\n    snippet.innerHTML=`<span style=\"color:var(--text3)\">${fname} · ${chars} chars<\u002Fspan><br><br>${ctx.slice(0,300).replace(\u002F<\u002Fg,'&lt;')}${ctx.length>300?'…':''}`;\n  } else {\n    wrap.style.display='none';\n  }\n}\n\ndocument.getElementById('aiPersonaInput')?.addEventListener('change',function(){\n  const wrap=document.getElementById('aiCustomToneWrap');\n  if(wrap) wrap.style.display=this.value==='custom'?'':'none';\n});\n\n\u002F\u002F ── JARVIS EXPAND OVERLAY ──\nfunction openJarvisOverlay(){\n  const overlay = document.getElementById('jarvisOverlay');\n  overlay.style.display = 'flex';\n  \u002F\u002F Sync name\n  const name = getAIName();\n  const nameEl = document.getElementById('aiPanelNameOverlay');\n  const emptyEl = document.getElementById('aiEmptyTextOverlay');\n  if(nameEl) nameEl.textContent = name;\n  if(emptyEl) emptyEl.innerHTML = `Hit Briefing for your daily<br>priority rundown, or ask ${name}<br>anything about your war room.`;\n  \u002F\u002F Mirror the main chat into the overlay\n  syncOverlayFromMain();\n  \u002F\u002F Focus input\n  setTimeout(()=>{ const inp=document.getElementById('aiChatInputOverlay'); if(inp) inp.focus(); }, 80);\n  document.body.style.overflow = 'hidden';\n}\n\nfunction closeJarvisOverlay(){\n  const overlay = document.getElementById('jarvisOverlay');\n  overlay.style.animation = 'none';\n  overlay.style.opacity = '0';\n  overlay.style.transition = 'opacity .2s ease';\n  setTimeout(()=>{\n    overlay.style.display = 'none';\n    overlay.style.opacity = '';\n    overlay.style.transition = '';\n    overlay.style.animation = '';\n    document.body.style.overflow = '';\n  }, 200);\n}\n\nfunction syncOverlayFromMain(){\n  \u002F\u002F Copy the main chat HTML into the overlay panel\n  const main = document.getElementById('aiChatMessages');\n  const ov = document.getElementById('aiChatMessagesOverlay');\n  if(main && ov){\n    ov.innerHTML = main.innerHTML;\n    ov.scrollTop = ov.scrollHeight;\n  }\n}\n\nfunction syncMainFromOverlay(){\n  \u002F\u002F Copy overlay chat HTML back to main panel\n  const main = document.getElementById('aiChatMessages');\n  const ov = document.getElementById('aiChatMessagesOverlay');\n  if(main && ov){\n    main.innerHTML = ov.innerHTML;\n    main.scrollTop = main.scrollHeight;\n  }\n}\n\nfunction addOverlayChatBubble(role, html){\n  const msgs = document.getElementById('aiChatMessagesOverlay');\n  if(!msgs) return;\n  const empty = msgs.querySelector('.ai-empty');\n  if(empty) empty.remove();\n  const div = document.createElement('div');\n  div.className = `ai-chat-bubble ${role}`;\n  div.innerHTML = html;\n  msgs.appendChild(div);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nfunction addOverlayChatTyping(){\n  const msgs = document.getElementById('aiChatMessagesOverlay');\n  if(!msgs) return;\n  const div = document.createElement('div');\n  div.className = 'ai-chat-bubble jarvis';\n  div.id = 'chatTypingOverlay';\n  div.innerHTML = '<div class=\"ai-dot loading\" style=\"margin:4px 0\"><\u002Fdiv>';\n  msgs.appendChild(div);\n  msgs.scrollTop = msgs.scrollHeight;\n}\n\nasync function sendChatOverlay(){\n  const input = document.getElementById('aiChatInputOverlay');\n  const sendBtn = document.getElementById('aiChatSendBtnOverlay');\n  const dotMain = document.getElementById('aiDot');\n  const dotOverlay = document.getElementById('aiDotOverlay');\n  const text = input?.value.trim();\n  if(!text) return;\n  input.value = '';\n  input.style.height = '';\n  if(sendBtn) sendBtn.disabled = true;\n  if(dotMain) dotMain.classList.add('loading');\n  if(dotOverlay) dotOverlay.classList.add('loading');\n\n  addOverlayChatBubble('user', text);\n  \u002F\u002F Also add to main panel\n  addChatBubble('user', text);\n  addOverlayChatTyping();\n  aiChatHistory.push({role:'user', content: text});\n  if(aiChatHistory.length>20)aiChatHistory.splice(0,aiChatHistory.length-20);\n\n  const contextMsg = {role:'user', content: getWarRoomContext() + '\\n\\nUse this context to answer my questions. Do not repeat this data back to me unless asked.'};\n  try {\n    const messages = aiChatHistory.length <= 2\n      ? [contextMsg, ...aiChatHistory]\n      : [contextMsg, ...aiChatHistory.slice(-10)];\n\n    const res = await fetch('https:\u002F\u002Fapi.anthropic.com\u002Fv1\u002Fmessages', {\n      method:'POST', headers: getAIFetchHeaders(),\n      body: JSON.stringify({model:AI_MODEL, max_tokens:800, system: getAISystemPrompt(), messages})\n    });\n    const data = await res.json();\n    if(data.error) throw new Error(data.error.message);\n    const reply = data.content?.find(c=>c.type==='text')?.text || 'No response.';\n    aiChatHistory.push({role:'assistant', content: reply});\n\n    const typingOv = document.getElementById('chatTypingOverlay');\n    if(typingOv) typingOv.remove();\n\n    const formatted = reply\n      .replace(\u002F\\*\\*(.*?)\\*\\*\u002Fg,'<b>$1<\u002Fb>')\n      .replace(\u002F\\*(.*?)\\*\u002Fg,'<i>$1<\u002Fi>')\n      .replace(\u002F`(.*?)`\u002Fg,'<code style=\"background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:\\'DM Mono\\',monospace;font-size:11px\">$1<\u002Fcode>')\n      .replace(\u002F\\n\\n\u002Fg,'<br><br>')\n      .replace(\u002F\\n\u002Fg,'<br>');\n\n    addOverlayChatBubble('jarvis', formatted);\n    \u002F\u002F Mirror to main\n    addChatBubble('jarvis', formatted);\n  } catch(e){\n    const typingOv = document.getElementById('chatTypingOverlay');\n    if(typingOv) typingOv.remove();\n    addOverlayChatBubble('jarvis', `<span style=\"color:var(--red)\">⚠ ${e.message||'Connection issue.'}<\u002Fspan>`);\n  }\n  if(sendBtn) sendBtn.disabled = false;\n  if(dotMain) dotMain.classList.remove('loading');\n  if(dotOverlay) dotOverlay.classList.remove('loading');\n}\n\nasync function runBriefingOverlay(){\n  const btn = document.getElementById('briefingBtnOverlay');\n  const dotMain = document.getElementById('aiDot');\n  const dotOverlay = document.getElementById('aiDotOverlay');\n  const name = getAIName();\n  if(btn){ btn.textContent='Generating...'; btn.disabled=true; }\n  if(dotMain) dotMain.classList.add('loading');\n  if(dotOverlay) dotOverlay.classList.add('loading');\n\n  \u002F\u002F Clear both panels\n  const mainMsgs = document.getElementById('aiChatMessages');\n  const ovMsgs = document.getElementById('aiChatMessagesOverlay');\n  if(mainMsgs) mainMsgs.innerHTML = '';\n  if(ovMsgs) ovMsgs.innerHTML = '';\n  aiChatHistory = [];\n\n  \u002F\u002F Reuse the same briefing logic — call runBriefing then mirror\n  const SYSTEM = getAISystemPrompt();\n  const context = getWarRoomContext();\n  const prompt = `${context}\n\nGenerate a tactical daily briefing for the operator. Return ONLY valid JSON, no markdown, no backticks:\n{\"callout\":\"2 sharp sentences that immediately orient the operator to what matters most today. Be specific to their actual data — reference real numbers, business names, or task names. No fluff.\",\"priorities\":[{\"title\":\"Short action-oriented task title\",\"why\":\"One precise tactical sentence explaining the impact or urgency\",\"biz\":\"Business name this applies to\"},{\"title\":\"Short action-oriented task title\",\"why\":\"One precise tactical sentence\",\"biz\":\"Business name\"},{\"title\":\"Short action-oriented task title\",\"why\":\"One precise tactical sentence\",\"biz\":\"Business name\"}],\"insight\":\"One sharp strategic observation the operator might be missing — a pattern, risk, or opportunity visible in their data.\",\"watchlist\":\"One sentence flagging any overdue items, unpaid bills, stalled goals, or blocked tasks. If nothing critical, say so.\"}`;\n\n  try {\n    const res = await fetch('https:\u002F\u002Fapi.anthropic.com\u002Fv1\u002Fmessages', {\n      method:'POST', headers: getAIFetchHeaders(),\n      body: JSON.stringify({model:AI_MODEL, max_tokens:1200, system: SYSTEM, messages:[{role:'user',content:prompt}]})\n    });\n    const data = await res.json();\n    if(data.error) throw new Error(data.error.message);\n    const raw = data.content?.find(c=>c.type==='text')?.text||'{}';\n    let parsed;\n    try { parsed = JSON.parse(raw.replace(\u002F```json|```\u002Fg,'').trim()); }\n    catch(pe){ throw new Error('Parse failed.'); }\n\n    const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});\n    const priorities = (parsed.priorities||[]).map((p,i)=>`\n      <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n        <div style=\"width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px\">${i+1}<\u002Fdiv>\n        <div>\n          <div style=\"font-weight:700;font-size:13px;color:var(--text)\">${p.title||''}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text2);margin-top:3px;line-height:1.6\">${p.why||''}<\u002Fdiv>\n          ${p.biz?`<div style=\"font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-top:4px\">${p.biz}<\u002Fdiv>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n\n    const briefingHtml = `\n      <div style=\"font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:12px\">◈ ${name.toUpperCase()} — DAILY BRIEFING · ${now}<\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--text);line-height:1.75;margin-bottom:18px;padding-bottom:16px;border-bottom:.5px solid var(--border)\">${parsed.callout||''}<\u002Fdiv>\n      <div style=\"font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:14px\">TOP PRIORITIES<\u002Fdiv>\n      ${priorities}\n      ${parsed.insight?`<div style=\"background:var(--bg2);border-radius:10px;padding:14px 16px;margin-top:12px;border-left:2px solid var(--accent)\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">STRATEGIC INSIGHT<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--text2);line-height:1.7\">${parsed.insight}<\u002Fdiv>\n      <\u002Fdiv>`:''}\n      ${parsed.watchlist?`<div style=\"background:var(--amber-bg);border-radius:10px;padding:12px 16px;margin-top:10px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:5px\">⚠ WATCHLIST<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text2);line-height:1.6\">${parsed.watchlist}<\u002Fdiv>\n      <\u002Fdiv>`:''}`;\n\n    addOverlayChatBubble('jarvis', briefingHtml);\n    addChatBubble('jarvis', briefingHtml);\n    S.lastBriefingTs = now; save();\n  } catch(e){\n    addOverlayChatBubble('jarvis', `<span style=\"color:var(--red)\">⚠ Briefing failed: ${e.message}<\u002Fspan>`);\n  }\n  if(btn){ btn.textContent='Briefing ↗'; btn.disabled=false; }\n  if(dotMain) dotMain.classList.remove('loading');\n  if(dotOverlay) dotOverlay.classList.remove('loading');\n}\n\n\u002F\u002F Close overlay on Escape\ndocument.addEventListener('keydown', e => {\n  if(e.key === 'Escape'){\n    const ov = document.getElementById('jarvisOverlay');\n    if(ov && ov.style.display !== 'none') closeJarvisOverlay();\n  }\n});\n\nlet qcOpen=false, qcTab='task';\nfunction toggleQC(){qcOpen=!qcOpen;const p=document.getElementById('qcPanel');if(p)p.classList.toggle('open',qcOpen);if(qcOpen)setQCTab(qcTab);}\nfunction setQCTab(tab){\n  qcTab=tab;\n  ['task','note','recent'].forEach(t=>{const el=document.getElementById('qctab-'+t);if(el)el.classList.toggle('active',t===tab);});\n  const body=document.getElementById('qcBody');\n  const actions=document.getElementById('qcActions');\n  if(!body||!actions)return;\n  refreshSelects();\n  const bizOpts='<option value=\"\">No Business<\u002Foption>'+S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  if(tab==='task'){\n    body.innerHTML=`\n      <div class=\"fg\">\n        <div><label>Mission Title<\u002Flabel><input type=\"text\" id=\"qc-task-title\" placeholder=\"What needs to get done?\" style=\"margin-top:4px\"><\u002Fdiv>\n        <div class=\"frow\" style=\"margin-top:8px\">\n          <div><label>Business<\u002Flabel><select id=\"qc-task-biz\" style=\"margin-top:4px\">${bizOpts}<\u002Fselect><\u002Fdiv>\n          <div><label>Priority<\u002Flabel><select id=\"qc-task-priority\" style=\"margin-top:4px\"><option>High<\u002Foption><option selected>Medium<\u002Foption><option>Low<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    actions.innerHTML=`<button class=\"btn btn-p btn-sm\" onclick=\"saveQCTask()\" style=\"flex:1\">+ Add Mission<\u002Fbutton><button class=\"btn btn-g btn-sm\" onclick=\"toggleQC()\">Cancel<\u002Fbutton>`;\n  } else if(tab==='note'){\n    body.innerHTML=`\n      <div class=\"fg\">\n        <div><label>Title<\u002Flabel><input type=\"text\" id=\"qc-note-title\" placeholder=\"Intel title...\" style=\"margin-top:4px\"><\u002Fdiv>\n        <div style=\"margin-top:8px\"><label>Note<\u002Flabel><textarea id=\"qc-note-body\" placeholder=\"What did you observe, learn, or think?\" style=\"margin-top:4px;min-height:60px\"><\u002Ftextarea><\u002Fdiv>\n        <div style=\"margin-top:8px\"><label>Business<\u002Flabel><select id=\"qc-note-biz\" style=\"margin-top:4px\">${bizOpts}<\u002Fselect><\u002Fdiv>\n      <\u002Fdiv>`;\n    actions.innerHTML=`<button class=\"btn btn-p btn-sm\" onclick=\"saveQCNote()\" style=\"flex:1\">+ Add Intel<\u002Fbutton><button class=\"btn btn-g btn-sm\" onclick=\"toggleQC()\">Cancel<\u002Fbutton>`;\n  } else {\n    body.innerHTML=`\n      <div class=\"fg\">\n        <div><label>What did you work on?<\u002Flabel><input type=\"text\" id=\"qc-recent-text\" placeholder=\"e.g. Wrote brand positioning doc\" style=\"margin-top:4px\"><\u002Fdiv>\n        <div class=\"frow\" style=\"margin-top:8px\">\n          <div><label>Business<\u002Flabel><select id=\"qc-recent-biz\" style=\"margin-top:4px\">${bizOpts}<\u002Fselect><\u002Fdiv>\n          <div><label>Type<\u002Flabel><select id=\"qc-recent-type\" style=\"margin-top:4px\"><option>Strategy<\u002Foption><option>Planning<\u002Foption><option>Revenue<\u002Foption><option>Operations<\u002Foption><option>Creative<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    actions.innerHTML=`<button class=\"btn btn-p btn-sm\" onclick=\"saveQCRecent()\" style=\"flex:1\">Log Work<\u002Fbutton><button class=\"btn btn-g btn-sm\" onclick=\"toggleQC()\">Cancel<\u002Fbutton>`;\n  }\n}\nfunction saveQCTask(){\n  const title=document.getElementById('qc-task-title')?.value.trim();if(!title)return;\n  S.tasks.push({id:S.nextId++,title,bizId:parseInt(document.getElementById('qc-task-biz')?.value)||null,type:'Task',priority:document.getElementById('qc-task-priority')?.value||'Medium',status:'Planned',notes:''});\n  save();renderKanban();updateBadges();renderDashboard();\n  const el=document.getElementById('qc-task-title');if(el)el.value='';\n  showQCConfirm('Mission added ✓');\n}\nfunction saveQCNote(){\n  const title=document.getElementById('qc-note-title')?.value.trim();if(!title)return;\n  S.notes.push({id:S.nextId++,title,body:document.getElementById('qc-note-body')?.value.trim()||'',bizId:parseInt(document.getElementById('qc-note-biz')?.value)||null,date:new Date().toISOString().slice(0,10)});\n  save();if(currentPage==='intel')renderNotes();updateBadges();\n  showQCConfirm('Intel captured ✓');\n}\nfunction saveQCRecent(){\n  const text=document.getElementById('qc-recent-text')?.value.trim();if(!text)return;\n  S.recent.unshift({id:S.nextId++,text,bizId:parseInt(document.getElementById('qc-recent-biz')?.value)||null,type:document.getElementById('qc-recent-type')?.value||'Work',ts:new Date().toLocaleTimeString()});\n  if(S.recent.length>30)S.recent=S.recent.slice(0,30);\n  save();renderRecent();renderDashboard();\n  showQCConfirm('Work logged ✓');\n}\nfunction showQCConfirm(msg){\n  const body=document.getElementById('qcBody');\n  if(!body)return;\n  const orig=body.innerHTML;\n  body.innerHTML=`<div style=\"text-align:center;padding:18px 0;font-size:12px;font-weight:700;color:var(--green)\">${msg}<\u002Fdiv>`;\n  setTimeout(()=>{setQCTab(qcTab);},1000);\n}\n\n\u002F\u002F ── WHITEBOARD ──\n\n\u002F\u002F ── CALENDAR FILTERS ──\nlet calFilterBiz='all', calFilterType='all', calFilterFrom='', calFilterTo='';\n\nfunction toggleCalFilter(){\n  const bar=document.getElementById('calFilterBar');\n  if(!bar)return;\n  const open=bar.style.display==='none'||bar.style.display==='';\n  bar.style.display=open?'flex':'none';\n  if(open)renderCalBizFilterChips();\n}\n\nfunction renderCalBizFilterChips(){\n  const wrap=document.getElementById('calBizFilterChips');if(!wrap)return;\n  wrap.innerHTML=S.businesses.map((b,i)=>{\n    const color=BIZ_COLORS[i%BIZ_COLORS.length];\n    return`<div class=\"cal-filter-chip ${calFilterBiz===String(b.id)?'active':''}\" id=\"calf-biz-${b.id}\" onclick=\"setCalBizFilter('${b.id}',this)\" style=\"${calFilterBiz===String(b.id)?'background:'+BIZ_COLORS[i%BIZ_COLORS.length]+';color:#fff':''}\">\n      <div class=\"cal-filter-dot\" style=\"background:${color}\"><\u002Fdiv>${b.name}\n    <\u002Fdiv>`;\n  }).join('');\n  \u002F\u002F Sync All chip state\n  const allChip=document.getElementById('calf-biz-all');\n  if(allChip)allChip.classList.toggle('active',calFilterBiz==='all');\n}\n\nfunction setCalBizFilter(val,el){\n  calFilterBiz=val;\n  \u002F\u002F Clear all biz chips\n  document.querySelectorAll('[id^=\"calf-biz-\"]').forEach(c=>c.classList.remove('active'));\n  if(el)el.classList.add('active');\n  applyCalFilters();\n}\n\nfunction setCalTypeFilter(val,el){\n  calFilterType=val;\n  document.querySelectorAll('[id^=\"calf-type-\"]').forEach(c=>c.classList.remove('active'));\n  if(el)el.classList.add('active');\n  applyCalFilters();\n}\n\nfunction applyCalFilters(){\n  calFilterFrom=document.getElementById('calFilterFrom')?.value||'';\n  calFilterTo=document.getElementById('calFilterTo')?.value||'';\n  renderCalendar();\n  renderUpcoming();\n  if(selectedCalDay)renderDayView(selectedCalDay);\n}\n\nfunction clearCalFilters(){\n  calFilterBiz='all';calFilterType='all';calFilterFrom='';calFilterTo='';\n  const ff=document.getElementById('calFilterFrom');if(ff)ff.value='';\n  const ft=document.getElementById('calFilterTo');if(ft)ft.value='';\n  document.querySelectorAll('[id^=\"calf-biz-\"]').forEach(c=>c.classList.remove('active'));\n  document.querySelectorAll('[id^=\"calf-type-\"]').forEach(c=>c.classList.remove('active'));\n  const allBiz=document.getElementById('calf-biz-all');if(allBiz)allBiz.classList.add('active');\n  const allType=document.getElementById('calf-type-all');if(allType)allType.classList.add('active');\n  renderCalendar();renderUpcoming();if(selectedCalDay)renderDayView(selectedCalDay);\n}\n\nfunction getFilteredCalEvents(eventsArr){\n  return eventsArr.filter(e=>{\n    if(calFilterBiz!=='all'&&String(e.bizId)!==String(calFilterBiz))return false;\n    if(calFilterType!=='all'&&(e.type||'personal')!==calFilterType)return false;\n    if(calFilterFrom&&e.date<calFilterFrom)return false;\n    if(calFilterTo&&e.date>calFilterTo)return false;\n    return true;\n  });\n}\n\n\u002F\u002F GOALS\nfunction renderGoals() {\n  const el=document.getElementById('goalsList'); if(!el)return;\n  if (!S.goals.length) { el.innerHTML='<div class=\"empty-state-text\" style=\"font-size:10px;color:var(--text3);padding:8px 0\">No goals set. Add your monthly targets to lock in.<\u002Fdiv>'; return; }\n  el.innerHTML=S.goals.map(g=>{\n    const biz=bizById(g.bizId);\n    return `<div class=\"goal-row\">\n      <div class=\"goal-tick ${g.done?'done':''}\" onclick=\"toggleGoal(${g.id})\">${g.done?'✓':''}<\u002Fdiv>\n      <div class=\"goal-txt ${g.done?'done':''}\">${g.text}<\u002Fdiv>\n      <div class=\"goal-biz-tag\">${biz
