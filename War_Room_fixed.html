═══════════════════════════\n\nconst OB_STEPS = 7; \u002F\u002F 0-6\nlet obStep = 0;\nlet obData = {\n  name: '', role: '', operatorType: '',\n  businesses: [], goals: [],\n  theme: 'stratus', dark: false\n};\n\nfunction redoOnboarding(){\n  if(!confirm('This will restart the onboarding wizard. Your data will NOT be deleted. Continue?')) return;\n  S.onboarded = false;\n  save();\n  initOnboarding();\n}\n\nfunction initOnboarding(){\n  obStep = 0;\n  obData = {name:'',role:'',operatorType:'',businesses:[],goals:[],theme:'stratus',dark:false};\n  \u002F\u002F Populate theme row\n  const tr = document.getElementById('obThemeRow');\n  if(tr){\n    tr.innerHTML = Object.entries(THEMES).map(([key,t])=>{\n      const col = t.preview[0];\n      return`<div class=\"ob-theme-chip ${key==='stratus'?'sel':''}\" onclick=\"obSelectTheme('${key}',this)\" data-theme=\"${key}\">\n        <div class=\"ob-swatch\" style=\"background:${col}\"><\u002Fdiv>${t.name}\n      <\u002Fdiv>`;\n    }).join('');\n  }\n  renderObProgress();\n  showObStep(0);\n  document.getElementById('obOverlay').style.display='flex';\n}\n\nfunction renderObProgress(){\n  const el=document.getElementById('obProgress');if(!el)return;\n  el.innerHTML=Array.from({length:OB_STEPS},(_,i)=>\n    `<div class=\"ob-pip ${i<=obStep?'active':''}\"><\u002Fdiv>`\n  ).join('');\n}\n\nfunction showObStep(step){\n  for(let i=0;i<OB_STEPS;i++){\n    const el=document.getElementById('obStep'+i);\n    if(el)el.style.display=i===step?'block':'none';\n  }\n  renderObProgress();\n  \u002F\u002F Step-specific setup\n  if(step===5) renderObThemePreview();\n  if(step===6) renderObSummary();\n}\n\nfunction obNext(){\n  \u002F\u002F Validate & collect current step\n  if(obStep===1){\n    const name=document.getElementById('obName').value.trim();\n    if(!name){document.getElementById('obName').focus();return;}\n    obData.name=name;\n    obData.role=document.getElementById('obRole').value.trim();\n  }\n  if(obStep<OB_STEPS-1){ obStep++; showObStep(obStep); }\n}\n\nfunction obBack(){\n  if(obStep>0){ obStep--; showObStep(obStep); }\n}\n\nfunction selectObRole(el, type){\n  document.querySelectorAll('.ob-role-card').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  obData.operatorType=type;\n}\n\nfunction obAddBiz(){\n  const inp=document.getElementById('obBizName');\n  const name=inp.value.trim(); if(!name)return;\n  const status=document.getElementById('obBizStatus').value;\n  obData.businesses.push({name,status});\n  inp.value=''; inp.focus();\n  renderObBizList();\n}\n\nfunction renderObBizList(){\n  const el=document.getElementById('obBizList');if(!el)return;\n  if(!obData.businesses.length){el.innerHTML='';return;}\n  el.innerHTML=obData.businesses.map((b,i)=>`\n    <div class=\"ob-biz-row\">\n      <div class=\"ob-biz-pip\" style=\"background:${BIZ_COLORS[i%BIZ_COLORS.length]}\"><\u002Fdiv>\n      <div class=\"ob-biz-name\">${b.name}<\u002Fdiv>\n      <div class=\"ob-biz-type\">${b.status}<\u002Fdiv>\n      <button onclick=\"obRemoveBiz(${i})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px\">✕<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\n\nfunction obRemoveBiz(i){\n  obData.businesses.splice(i,1);\n  renderObBizList();\n}\n\nfunction obAddGoal(){\n  const inp=document.getElementById('obGoalText');\n  const text=inp.value.trim(); if(!text)return;\n  const type=document.getElementById('obGoalType').value;\n  obData.goals.push({text,type});\n  inp.value=''; inp.focus();\n  renderObGoalList();\n}\n\nfunction renderObGoalList(){\n  const el=document.getElementById('obGoalList');if(!el)return;\n  if(!obData.goals.length){el.innerHTML='';return;}\n  el.innerHTML=obData.goals.map((g,i)=>`\n    <div class=\"ob-goal-item\">\n      <div class=\"ob-goal-txt\">${g.text}<\u002Fdiv>\n      <span class=\"badge b-muted\">${g.type}<\u002Fspan>\n      <button onclick=\"obRemoveGoal(${i})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;flex-shrink:0\">✕<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\n\nfunction obRemoveGoal(i){\n  obData.goals.splice(i,1);\n  renderObGoalList();\n}\n\nfunction obSelectTheme(key, el){\n  document.querySelectorAll('#obThemeRow .ob-theme-chip').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  obData.theme=key;\n  renderObThemePreview();\n}\n\nfunction obSetMode(mode){\n  obData.dark=mode==='dark';\n  document.getElementById('obLightChip').className='ob-theme-chip'+(mode==='light'?' sel':'');\n  document.getElementById('obDarkChip').className='ob-theme-chip'+(mode==='dark'?' sel':'');\n  \u002F\u002F Live preview\n  document.getElementById('app').classList.toggle('dark',obData.dark);\n  S.dark=obData.dark;\n  applyTheme();\n}\n\nfunction renderObThemePreview(){\n  \u002F\u002F Apply chosen theme live\n  if(!S.profile)S.profile={};\n  S.profile.theme=obData.theme;\n  applyTheme();\n}\n\nfunction renderObSummary(){\n  const el=document.getElementById('obSummaryList');if(!el)return;\n  const title=document.getElementById('obLaunchTitle');\n  const sub=document.getElementById('obLaunchSub');\n  const tipEl=document.getElementById('obTip');\n  const gn=obData.name||'Operator';\n  if(title)title.textContent='Welcome aboard, '+gn+'.';\n  if(sub)sub.textContent=\"Here's what War Room has configured for you.\";\n\n  const rows=[\n    {icon:'👤',label:'Identity',val:gn+(obData.role?' · '+obData.role:'')+(obData.operatorType?' · '+obData.operatorType:'')},\n    {icon:'🏢',label:'Businesses Added',val:obData.businesses.length?obData.businesses.map(b=>b.name).join(', '):'None yet — add from sidebar'},\n    {icon:'🎯',label:'Monthly Goals',val:obData.goals.length?obData.goals.length+' goal'+(obData.goals.length>1?'s':'')+' set':'None yet — add from dashboard'},\n    {icon:'🎨',label:'Theme',val:(THEMES[obData.theme]||THEMES.stratus).name+' · '+(obData.dark?'Dark':'Light')+' mode'},\n  ];\n  el.innerHTML=rows.map(r=>`\n    <div class=\"ob-summary-row\">\n      <div class=\"ob-summary-icon\">${r.icon}<\u002Fdiv>\n      <div>\n        <div class=\"ob-summary-label\">${r.label}<\u002Fdiv>\n        <div class=\"ob-summary-val\">${r.val}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  const tips={\n    entrepreneur:'Your briefing will focus on revenue targets, mission execution, and venture momentum.',\n    creative:'War Room will prioritize creative pipelines, brand strategy, and project timelines.',\n    operator:'Your War Room will emphasize execution sprints, team tasks, and operational metrics.',\n    investor:'Briefings will highlight portfolio performance, P&L snapshots, and strategic positioning.',\n    freelancer:'War Room focuses on client pipelines, project deadlines, and income tracking.',\n    executive:'Your command center surfaces high-level strategy, KPIs, and leadership priorities.',\n  };\n  if(tipEl)tipEl.innerHTML='<b>Your briefing style:<\u002Fb> '+(tips[obData.operatorType]||'War Room will adapt its briefings based on your goals and activity.');\n}\n\nfunction obFinish(){\n  \u002F\u002F Commit all onboarding data to state\n  if(!S.profile)S.profile={};\n  S.profile.name = obData.name;\n  S.profile.role = obData.role;\n  S.profile.greetingName = obData.name||'Sir';\n  S.profile.avatar = '◈';\n  S.profile.operatorType = obData.operatorType;\n  S.profile.theme = obData.theme;\n  S.profile.font = 'syne';\n  S.profile.radius = '10';\n  S.profile.accent = '';\n  S.dark = obData.dark;\n\n  \u002F\u002F Add businesses\n  obData.businesses.forEach((b,i)=>{\n    const biz={id:S.nextId++,name:b.name,type:'',focus:'',status:b.status};\n    S.businesses.push(biz);\n    if(!S.streams[biz.id])S.streams[biz.id]=[];\n  });\n\n  \u002F\u002F Add goals\n  obData.goals.forEach(g=>{\n    S.goals.push({id:S.nextId++,text:g.text,bizId:null,type:g.type,done:false});\n  });\n\n  recalculateNextId();\n  \u002F\u002F Mark onboarding complete\n  S.onboarded = true;\n\n  document.getElementById('app').classList.toggle('dark',S.dark);\n  applyTheme();\n  save();\n\n  \u002F\u002F Close overlay\n  const overlay=document.getElementById('obOverlay');\n  overlay.classList.add('fading');\n  setTimeout(()=>{\n    overlay.style.display='none';\n    overlay.classList.remove('fading');\n    refreshBizNav();\n    renderDashboard();\n    \u002F\u002F If they added businesses, show a quick debrief after a beat\n    setTimeout(()=>checkLaunchSequence(),600);\n  },400);\n}\n\nfunction openModal(id){\n  if(id!=='eventModal'&&id!=='editEventModal')refreshSelects();\n  const el=document.getElementById(id);\n  el.classList.add('open');\n  el.setAttribute('role','dialog');\n  el.setAttribute('aria-modal','true');\n  el.setAttribute('aria-hidden','false');\n  const first=el.querySelector('input,select,textarea,button');\n  if(first)setTimeout(()=>first.focus(),50);\n}\nfunction closeModal(id){\n  const el=document.getElementById(id);\n  el.classList.remove('open');\n  el.setAttribute('aria-hidden','true');\n}\ndocument.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));});\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F SUPABASE INIT & AUTH\n\u002F\u002F ══════════════════════════════════════════\n\nconst SUPABASE_URL = 'https:\u002F\u002Fkxlkjxyoenutsgjiknjc.supabase.co';\nconst SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4bGtqeHlvZW51dHNnamlrbmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NzQ1NTEsImV4cCI6MjA5MzQ1MDU1MX0.iU9ByS7mj3iUgTTeSKIke45mqVE1JzS7BKOYiilYb9k';\n\nlet _sb = null;\nlet currentUser = null;\nlet driveToken = null;\nlet syncTimeout = null;\n\nasync function initSupabase() {\n  return new Promise((resolve) => {\n    \u002F\u002F Check if already loaded\n    const sdkModule = (window.supabase && window.supabase.createClient) ? window.supabase\n                     : (window.supabaseJs && window.supabaseJs.createClient) ? window.supabaseJs\n                     : null;\n    if(sdkModule){\n      try {\n        _sb = sdkModule.createClient(SUPABASE_URL, SUPABASE_KEY);\n      } catch(e){ console.warn('Supabase init failed:', e); _sb = null; }\n      resolve(_sb); return;\n    }\n    const s = document.createElement('script');\n    s.src = 'https:\u002F\u002Fcdn.jsdelivr.net\u002Fnpm\u002F@supabase\u002Fsupabase-js@2\u002Fdist\u002Fumd\u002Fsupabase.min.js';\n    s.crossOrigin = 'anonymous';\n    s.onload = () => {\n      try {\n        \u002F\u002F supabase-js v2 UMD sets window.supabase = { createClient, ... }\n        \u002F\u002F Try all known global names\n        const sdkModule = (window.supabase && window.supabase.createClient) ? window.supabase\n                        : (window.supabaseJs && window.supabaseJs.createClient) ? window.supabaseJs\n                        : null;\n        if(sdkModule){\n          _sb = sdkModule.createClient(SUPABASE_URL, SUPABASE_KEY);\n        } else {\n          console.warn('Supabase SDK loaded but no createClient found — cloud sync disabled');\n          _sb = null;\n        }\n      } catch(e){ console.warn('Supabase createClient failed:', e); _sb = null; }\n      resolve(_sb);\n    };\n    s.onerror = () => { console.warn('Supabase SDK failed to load — offline mode'); resolve(null); };\n    document.head.appendChild(s);\n  });\n}\n\nasync function saveToCloud(immediate = false) {\n  if (!currentUser || !_sb) return;\n  const doSave = async () => {\n    try {\n      setSyncState('syncing');\n      const { error } = await _sb.from('war_room_data').upsert({\n        user_id: currentUser.id,\n        data: JSON.stringify(S),\n        updated_at: new Date().toISOString()\n      }, { onConflict: 'user_id' });\n      if(error) throw error;\n      setSyncState('synced');\n    } catch(e) { console.error('Cloud save error:', e); }\n  };\n  if(immediate){ await doSave(); }\n  else { clearTimeout(syncTimeout); syncTimeout = setTimeout(doSave, 1200); }\n}\n\nasync function loadFromCloud() {\n  if(!currentUser || !_sb) return false;\n  try {\n    const { data, error } = await _sb.from('war_room_data').select('data').eq('user_id', currentUser.id).single();\n    if(error && error.code !== 'PGRST116'){ console.error('Cloud load error:', error); return false; }\n    if(data && data.data){\n      const parsed = JSON.parse(data.data);\n      S = {...JSON.parse(JSON.stringify(DEFAULT)), ...parsed};\n      ['businesses','tasks','entries','notes','goals','goalLog','recent','wins','alarms','sessions','events','bills','backups'].forEach(k=>{ if(!Array.isArray(S[k]))S[k]=[];});\n      if(!S.streams||typeof S.streams!=='object')S.streams={};\n      if(!S.whiteboards||typeof S.whiteboards!=='object')S.whiteboards={};\n      if(!S.nextId)S.nextId=1;\n      recalculateNextId();\n      if(typeof S.trackerPeriod!=='string')S.trackerPeriod='month';\n      if(S.onboarded===undefined||S.onboarded===null)S.onboarded=false;\n      if(!S.profile||typeof S.profile!=='object'||Array.isArray(S.profile))S.profile={...DEFAULT.profile};\n      \u002F\u002F If cloud row exists but businesses is empty, recover from localStorage\n      if(!S.businesses.length){\n        try {\n          const local = localStorage.getItem('stratusWR_v31');\n          if(local){ const lp=JSON.parse(local); if(Array.isArray(lp.businesses)&&lp.businesses.length){ S.businesses=lp.businesses; S.streams=lp.streams||S.streams; console.warn('Recovered businesses from localStorage'); }}\n        } catch(e){}\n      }\n      return true;\n    }\n    return false;\n  } catch(e){ console.error('Cloud load failed:', e); return false; }\n}\n\nasync function signUp(email, password) {\n  const { data, error } = await _sb.auth.signUp({ email, password });\n  if(error) throw error; return data;\n}\n\nasync function signIn(email, password) {\n  const { data, error } = await _sb.auth.signInWithPassword({ email, password });\n  if(error) throw error; return data;\n}\n\nasync function signOut() {\n  if(_sb) await _sb.auth.signOut();\n  currentUser = null;\n  window._adminLoggedIn = false;\n  \u002F\u002F Remove toast if present\n  const toast = document.getElementById('signOutToast');\n  if(toast) toast.remove();\n  \u002F\u002F Show login screen instead of full reload\n  const ov = document.getElementById('authOverlay');\n  if(ov){ ov.style.display='flex'; ov.style.opacity='1'; }\n}\n\nfunction confirmSignOut(){\n  \u002F\u002F Remove any existing toast\n  const existing = document.getElementById('signOutToast');\n  if(existing) existing.remove();\n\n  const email = currentUser ? currentUser.email : (window._adminLoggedIn ? 'Admin (Local Mode)' : 'Unknown');\n\n  const toast = document.createElement('div');\n  toast.id = 'signOutToast';\n  toast.innerHTML = `\n    <div style=\"position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--surface);border:.5px solid var(--border2);border-radius:14px;padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px;min-width:300px;animation:toastIn .2s ease\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"width:36px;height:36px;border-radius:10px;background:rgba(var(--red-rgb,220,38,38),.1);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--red,#dc2626)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"\u002F><polyline points=\"16 17 21 12 16 7\"\u002F><line x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"\u002F><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Syne',sans-serif;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text1);text-transform:uppercase\">Sign Out?<\u002Fdiv>\n          <div style=\"font-size:10px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace\">${email}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button onclick=\"signOut()\" style=\"flex:1;background:var(--red,#dc2626);border:none;color:#fff;font-family:'Syne',sans-serif;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;border-radius:8px;cursor:pointer\">Confirm Sign Out<\u002Fbutton>\n        <button onclick=\"document.getElementById('signOutToast').remove()\" style=\"flex:1;background:var(--bg3);border:.5px solid var(--border2);color:var(--text2);font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-radius:8px;cursor:pointer\">Stay In<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  document.body.appendChild(toast);\n\n  \u002F\u002F Auto-dismiss after 6s\n  setTimeout(()=>{ const t=document.getElementById('signOutToast'); if(t) t.remove(); }, 6000);\n}\n\nfunction showUserMenu(){\n  confirmSignOut();\n}\n\nasync function forceSyncNow(){\n  setSyncState('syncing');\n  await saveToCloud(true);\n  setSyncState('synced');\n}\n\nfunction setSyncState(state){\n  const el=document.getElementById('syncIndicator'); if(!el)return;\n  el.style.display='inline-block';\n  el.className='sync-indicator '+state;\n  el.textContent=state==='syncing'?'↻ syncing':'● synced';\n}\n\nfunction updateAppName(){\n  const name=(S.profile&&S.profile.warRoomName)||'WAR ROOM';\n  const nav=document.getElementById('appNameDisplay');\n  const auth=document.getElementById('authAppNameDisplay');\n  if(nav)nav.textContent=name;\n  if(auth)auth.textContent=name;\n  document.title=name;\n}\n\nfunction bootApp() {\n  \u002F\u002F ── PHASE 1: Profile resolves first ──────────────────────────\n  if(S.dark) document.getElementById('app').classList.add('dark');\n  applyTheme();\n\n  \u002F\u002F Apply profile identity to topbar\u002Fgreeting immediately\n  const p = S.profile || {};\n  const pd = document.getElementById('profileNameDisplay');\n  if(pd) pd.textContent = p.name || 'Your Name';\n  updateAppName();\n  updateAINameUI();\n  setInterval(updateClocks, 1000); updateClocks();\n\n  \u002F\u002F ── PHASE 2: Businesses load from S (already populated) ──────\n  refreshBizNav();        \u002F\u002F sidebar biz list\n  renderProfileBizGrid(); \u002F\u002F profile page biz grid\n\n  \u002F\u002F ── PHASE 3: Everything else cascades ────────────────────────\n  \u002F\u002F Handle update merge flag — skip onboarding for users who just updated\n  if(localStorage.getItem('stratusUpdateMerge')){ S.onboarded=true; localStorage.removeItem('stratusUpdateMerge'); }\n  if(!S.onboarded){ renderDashboard(); setTimeout(()=>initOnboarding(), 500); }\n  else { renderDashboard(); }\n  renderAlarms(); updateAlarmChip(); updateLastBackupLabel();\n\n  if(Notification?.permission==='default') Notification.requestPermission();\n  \u002F\u002F Safety net: re-render bizNav after data settles (catches any timing edge cases)\n  setTimeout(()=>{ refreshBizNav(); }, 600);\n  setTimeout(()=>checkLaunchSequence(), 800);\n}\n\n\u002F\u002F Standalone business grid renderer — isolated, no side effects\nfunction renderProfileBizGrid(){\n  const bg = document.getElementById('profileBizGrid');\n  if(!bg) return;\n  const businesses = Array.isArray(S.businesses) ? S.businesses : [];\n  if(!businesses.length){\n    bg.innerHTML = '<div style=\"font-size:10px;color:var(--text3);padding:12px 0;text-align:center\">No businesses yet — add your first one above.<\u002Fdiv>';\n    return;\n  }\n  bg.innerHTML = '<div class=\"biz-grid\">' + businesses.map(function(b, i){\n    const color = BIZ_COLORS[i % BIZ_COLORS.length];\n    const rev = (S.entries||[]).filter(function(e){return e.bizId===b.id;}).reduce(function(a,e){return a+e.rev;},0);\n    const goalAmt = b.revenueGoal || 0;\n    const revPct = goalAmt > 0 ? Math.min(100, Math.round((rev\u002FgoalAmt)*100)) : 0;\n    const bizGoals = (S.goals||[]).filter(function(g){return g.bizId===b.id;});\n    const bizGoalsDone = bizGoals.filter(function(g){return g.done;}).length;\n    const bizGoalPct = bizGoals.length ? Math.round((bizGoalsDone\u002FbizGoals.length)*100) : 0;\n    const tasks = (S.tasks||[]).filter(function(t){return t.bizId===b.id && t.status!=='Done';}).length;\n    const statusColor = b.status==='Active'?'var(--green)':b.status==='Building'?'var(--amber)':b.status==='On Hold'?'var(--text3)':'var(--blue)';\n    const statusBg = b.status==='Active'?'var(--green-bg)':b.status==='Building'?'var(--amber-bg)':b.status==='On Hold'?'var(--bg3)':'var(--blue-bg)';\n\n    let progressHtml = '';\n    if(goalAmt > 0){\n      progressHtml += '<div style=\"margin-bottom:6px\">' +\n        '<div style=\"display:flex;justify-content:space-between;margin-bottom:3px\">' +\n        '<span style=\"font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)\">Revenue Goal<\u002Fspan>' +\n        '<span style=\"font-size:8px;font-family:\\'DM Mono\\',monospace;font-weight:700;color:' + (revPct>=100?'var(--green)':color) + '\">' + revPct + '% · $' + rev.toLocaleString() + ' \u002F $' + goalAmt.toLocaleString() + '<\u002Fspan>' +\n        '<\u002Fdiv>' +\n        '<div style=\"height:4px;background:var(--bg3);border-radius:100px;overflow:hidden\">' +\n        '<div style=\"height:100%;width:' + revPct + '%;background:' + (revPct>=100?'var(--green)':color) + ';border-radius:100px;transition:width .6s ease\"><\u002Fdiv>' +\n        '<\u002Fdiv><\u002Fdiv>';\n    }\n    if(bizGoals.length){\n      progressHtml += '<div>' +\n        '<div style=\"display:flex;justify-content:space-between;margin-bottom:3px\">' +\n        '<span style=\"font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)\">Goals<\u002Fspan>' +\n        '<span style=\"font-size:8px;font-family:\\'DM Mono\\',monospace;font-weight:700;color:var(--text3)\">' + bizGoalsDone + '\u002F' + bizGoals.length + ' done<\u002Fspan>' +\n        '<\u002Fdiv>' +\n        '<div style=\"height:4px;background:var(--bg3);border-radius:100px;overflow:hidden\">' +\n        '<div style=\"height:100%;width:' + bizGoalPct + '%;background:var(--accent);border-radius:100px;transition:width .6s ease\"><\u002Fdiv>' +\n        '<\u002Fdiv><\u002Fdiv>';\n    }\n\n    return '<div class=\"biz-card-full\" onclick=\"showPage(\\'bizprofile\\',' + b.id + ')\" data-bizid=\"' + b.id + '\">' +\n      '<div class=\"biz-card-accent\" style=\"background:' + color + '\"><\u002Fdiv>' +\n      '<div class=\"biz-card-body\">' +\n        '<div class=\"biz-card-name\">' + b.name + '<\u002Fdiv>' +\n        '<div class=\"biz-card-type\">' + (b.type||'Business') + '<\u002Fdiv>' +\n        '<div class=\"biz-card-focus\">' + (b.focus||'No description.') + '<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n      (progressHtml ? '<div style=\"padding:8px 16px;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:6px\">' + progressHtml + '<\u002Fdiv>' : '') +\n      '<div class=\"biz-card-footer\">' +\n        '<div style=\"display:flex;gap:8px;align-items:center\">' +\n          '<span style=\"font-size:9px;font-family:\\'DM Mono\\',monospace;color:var(--text3)\">Rev $' + rev.toLocaleString() + '<\u002Fspan>' +\n          (tasks>0 ? '<span style=\"font-size:8px;font-weight:700;padding:2px 7px;border-radius:100px;background:var(--amber-bg);color:var(--amber)\">' + tasks + ' active<\u002Fspan>' : '') +\n        '<\u002Fdiv>' +\n        '<div style=\"display:flex;gap:6px;align-items:center\">' +\n          '<span style=\"font-size:8px;font-weight:700;padding:2px 7px;border-radius:100px;background:' + statusBg + ';color:' + statusColor + '\">' + (b.status||'Active') + '<\u002Fspan>' +\n          '<button onclick=\"event.stopPropagation();openEditBiz(' + b.id + ')\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:9px;font-family:\\'Syne\\',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Edit<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n    '<\u002Fdiv>';\n  }).join('') + '<\u002Fdiv>';\n}\n\n\u002F\u002F ── AUTH UI ──\nlet authMode = 'signin';\nfunction handleGoogleSignIn() {\n  const btn = document.getElementById('googleSignInBtn');\n  if(btn){ btn.disabled = true; btn.innerHTML = '<svg width=\"18\" height=\"18\" viewBox=\"0 0 48 48\"><path fill=\"#EA4335\" d=\"M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z\"\u002F><path fill=\"#4285F4\" d=\"M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z\"\u002F><path fill=\"#FBBC05\" d=\"M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z\"\u002F><path fill=\"#34A853\" d=\"M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z\"\u002F><path fill=\"none\" d=\"M0 0h48v48H0z\"\u002F><\u002Fsvg> Connecting...'; }\n  \u002F\u002F Load GSI script on demand then prompt sign-in\n  function doGoogleAuth() {\n    google.accounts.oauth2.initTokenClient({\n      client_id: DRIVE_CLIENT_ID,\n      scope: 'https:\u002F\u002Fwww.googleapis.com\u002Fauth\u002Fdrive.file https:\u002F\u002Fwww.googleapis.com\u002Fauth\u002Fuserinfo.profile https:\u002F\u002Fwww.googleapis.com\u002Fauth\u002Fuserinfo.email',\n      callback: async (res) => {\n        if(res.error){\n          if(btn){ btn.disabled=false; btn.innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 48 48\"><path fill=\"#EA4335\" d=\"M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z\"\u002F><path fill=\"#4285F4\" d=\"M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z\"\u002F><path fill=\"#FBBC05\" d=\"M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z\"\u002F><path fill=\"#34A853\" d=\"M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z\"\u002F><path fill=\"none\" d=\"M0 0h48v48H0z\"\u002F><\u002Fsvg> Continue with Google'; }\n          return;\n        }\n        \u002F\u002F Store token for Drive sync reuse (declared at module level)\n        if(typeof driveToken !== 'undefined') driveToken = res.access_token;\n        \u002F\u002F Get user profile\n        try {\n          const profile = await fetch('https:\u002F\u002Fwww.googleapis.com\u002Foauth2\u002Fv2\u002Fuserinfo', {\n            headers: { Authorization: 'Bearer ' + res.access_token }\n          }).then(r => r.json());\n          \u002F\u002F Store Google user info in profile\n          if(!S.profile) S.profile = {};\n          if(Array.isArray(S.profile)) S.profile = {};\n          S.profile.googleName = profile.name || '';\n          S.profile.googleEmail = profile.email || '';\n          S.profile.googlePicture = profile.picture || '';\n          S.profile.googleSignedIn = true;\n          save();\n          \u002F\u002F Dismiss auth overlay\n          const ov = document.getElementById('authOverlay');\n          if(ov){ ov.classList.add('fading'); setTimeout(()=>{ ov.style.display='none'; ov.classList.remove('fading'); }, 400); }\n          \u002F\u002F Trigger onboarding if new user\n          const isNew = !S.profile.name && !S.profile.googleName;\n          if(isNew && typeof startOnboarding === 'function') startOnboarding();\n        } catch(e) {\n          if(btn){ btn.disabled=false; }\n        }\n      }\n    }).requestAccessToken();\n  }\n  \u002F\u002F Load GSI if not already loaded\n  if(typeof google !== 'undefined' && google.accounts) { doGoogleAuth(); return; }\n  const s = document.createElement('script');\n  s.src = 'https:\u002F\u002Faccounts.google.com\u002Fgsi\u002Fclient';\n  s.onload = doGoogleAuth;\n  s.onerror = () => { if(btn){ btn.disabled=false; } };\n  document.head.appendChild(s);\n}\nfunction setAuthMode(mode){\n  authMode = mode;\n  document.getElementById('authTabSignin').className='auth-tab'+(mode==='signin'?' active':'');\n  document.getElementById('authTabSignup').className='auth-tab'+(mode==='signup'?' active':'');\n  document.getElementById('authSubtitle').textContent = mode==='signin'?'Sign in to access your War Room — your data follows you everywhere.':'Create your account. Your War Room syncs across every device, instantly.';\n  document.getElementById('authBtnText').textContent = mode==='signin'?'SIGN IN':'CREATE ACCOUNT';\n  document.getElementById('authError').textContent='';\n  document.getElementById('authSuccess').textContent='';\n}\n\nfunction handleAdminLogin(){\n  \u002F\u002F Clear fields and error\n  document.getElementById('adminUser').value='';\n  document.getElementById('adminPass').value='';\n  document.getElementById('adminModalError').textContent='';\n  \u002F\u002F Show modal\n  document.getElementById('adminModalOverlay').classList.add('open');\n  setTimeout(()=>document.getElementById('adminUser').focus(), 80);\n}\nfunction closeAdminModal(){\n  document.getElementById('adminModalOverlay').classList.remove('open');\n}\nfunction submitAdminLogin(){\n  const user = document.getElementById('adminUser').value.trim();\n  const pass = document.getElementById('adminPass').value;\n  const errEl = document.getElementById('adminModalError');\n  if(!user || !pass){ errEl.textContent='Both fields are required.'; return; }\n  if(user==='admin1' && pass==='cres100'){\n    window._adminLoggedIn = true;\n    closeAdminModal();\n    const ov = document.getElementById('authOverlay');\n    ov.classList.add('fading');\n    setTimeout(()=>{ ov.style.display='none'; ov.classList.remove('fading'); }, 400);\n  } else {\n    errEl.textContent='Invalid credentials. Try again.';\n    document.getElementById('adminPass').value='';\n    document.getElementById('adminPass').focus();\n  }\n}\n\nasync function handleAuth(){\n  \u002F\u002F ADMIN BYPASS\n  const emailVal=document.getElementById(\"authEmail\").value.trim();\n  const passVal=document.getElementById(\"authPassword\").value;\n  if((emailVal===\"admin1\"||emailVal===\"admin\") && (passVal===\"cres100\"||passVal===\"admin\")){\n    window._adminLoggedIn = true;\n    document.getElementById(\"authOverlay\").style.display=\"none\";\n    return;\n  }\n  const email=document.getElementById('authEmail').value.trim();\n  const pass=document.getElementById('authPassword').value;\n  const btn=document.getElementById('authSubmitBtn');\n  const errEl=document.getElementById('authError');\n  const sucEl=document.getElementById('authSuccess');\n  errEl.textContent=''; sucEl.textContent='';\n  if(!email||!pass){errEl.textContent='Email and password required.';return;}\n  btn.disabled=true;\n  document.getElementById('authBtnText').textContent=authMode==='signin'?'SIGNING IN...':'CREATING ACCOUNT...';\n  try {\n    if(authMode==='signup'){\n      await signUp(email,pass);\n      sucEl.textContent='✓ Account created! Check your email to confirm, then sign in.';\n      setAuthMode('signin');\n    } else {\n      await signIn(email,pass);\n      \u002F\u002F Close the overlay — onAuthStateChange fires syncFromCloud in background\n      const ov = document.getElementById('authOverlay');\n      ov.classList.add('fading');\n      setTimeout(()=>{ ov.style.display='none'; ov.classList.remove('fading'); }, 400);\n    }\n  } catch(err){\n    errEl.textContent=err.message||'Authentication failed. Try again.';\n  }\n  btn.disabled=false;\n  document.getElementById('authBtnText').textContent=authMode==='signin'?'SIGN IN':'CREATE ACCOUNT';\n}\n\n\u002F\u002F ── MAIN BOOT ──\n\u002F\u002F Architecture: Boot immediately from localStorage. Supabase is background-only cloud sync.\n(async () => {\n\n  \u002F\u002F ── STEP 1: Load local data and boot the app immediately ──────\n  \u002F\u002F App works fully offline — Supabase is optional cloud sync only\n  load();\n  bootApp();\n\n  \u002F\u002F ── STEP 2: Init Supabase in background ───────────────────────\n  \u002F\u002F Non-blocking — app is already running, this just connects cloud\n  await initSupabase();\n  if(!_sb) return; \u002F\u002F no SDK, stay in local-only mode\n\n  \u002F\u002F ── STEP 3: Check for existing session (returning user) ───────\n  let _cloudSynced = false;\n\n  async function syncFromCloud(user) {\n    if(_cloudSynced) return;\n    _cloudSynced = true;\n    currentUser = user;\n\n    \u002F\u002F Show sync indicator in topbar\n    setSyncState('syncing');\n\n    \u002F\u002F Update user pill, hide cloud sign-in button\n    const pill = document.getElementById('userPill');\n    if(pill) pill.style.display = 'flex';\n    const cloudBtn = document.getElementById('cloudSignInBtn');\n    if(cloudBtn) cloudBtn.style.display = 'none';\n    const em = document.getElementById('userEmailDisplay');\n    if(em) em.textContent = user.email.split('@')[0].toUpperCase();\n\n    \u002F\u002F Pull cloud data — if it has businesses, merge into S and re-render\n    const cloudLoaded = await loadFromCloud();\n    if(cloudLoaded){\n      \u002F\u002F Cloud data loaded — re-render businesses and dashboard with latest data\n      try { localStorage.setItem('stratusWR_v31', JSON.stringify(S)); } catch(e){}\n      refreshBizNav();\n      renderProfileBizGrid();\n      renderDashboard();\n    }\n    setSyncState('synced');\n  }\n\n  \u002F\u002F Guard — supabase must be valid before using auth\n  if(!_sb || !_sb.auth){ return; }\n\n  \u002F\u002F Listen for auth changes (sign in \u002F sign out \u002F token refresh)\n  _sb.auth.onAuthStateChange(async (event, session) => {\n    if(session && session.user){\n      await syncFromCloud(session.user);\n    } else {\n      currentUser = null;\n      const pill = document.getElementById('userPill');\n      if(pill) pill.style.display = 'none';\n    }\n  });\n\n  \u002F\u002F Check for an existing session right now\n  try {\n    const { data: sessionData } = await _sb.auth.getSession();\n    if(sessionData?.session){\n      await syncFromCloud(sessionData.session.user);\n    }\n  } catch(e){ console.warn('getSession failed:', e); }\n\n})();\n<\u002Fscript>\n\n<!-- ═══ DAILY DEBRIEF OVERLAY ═══ -->\n<div class=\"launch-overlay\" id=\"debriefOverlay\" style=\"display: none;\">\n  <div class=\"launch-card\">\n    <div class=\"launch-header\">\n      <div class=\"launch-eyebrow\">Daily Debrief<\u002Fdiv>\n      <div class=\"launch-title\" id=\"debriefGreeting\">Good evening, cRes.<\u002Fdiv>\n      <div class=\"launch-sub\" id=\"debriefDate\">Wednesday, May 13, 2026<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"launch-body\">\n      <div class=\"debrief-progress\" id=\"debriefProgress\"><div class=\"dp-pip done\"><\u002Fdiv><div class=\"dp-pip \"><\u002Fdiv><div class=\"dp-pip \"><\u002Fdiv><div class=\"dp-pip \"><\u002Fdiv><div class=\"dp-pip \"><\u002Fdiv><\u002Fdiv>\n\n      <!-- Step 1: Energy check -->\n      <div class=\"debrief-step active\" id=\"dstep-0\">\n        <div class=\"debrief-q\">How are you showing up today?<\u002Fdiv>\n        <div class=\"debrief-hint\">Pick what fits — this sets the tone for your briefing.<\u002Fdiv>\n        <div class=\"debrief-tags\" id=\"energyTags\">\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">🔥 Locked in<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">⚡ High energy<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">🧠 Creative mode<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">😤 Grind mode<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">😴 Slow start<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">🎯 Focused<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"toggleTag(this,'energy')\">💭 Reflective<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Step 2: Today's intention -->\n      <div class=\"debrief-step\" id=\"dstep-1\">\n        <div class=\"debrief-q\">What's the one thing that has to happen today?<\u002Fdiv>\n        <div class=\"debrief-hint\">Your non-negotiable. The thing that makes today a win.<\u002Fdiv>\n        <textarea class=\"debrief-textarea\" id=\"d-intention\" placeholder=\"If today ends and I accomplished one thing, it's...\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <!-- Step 3: Businesses in focus -->\n      <div class=\"debrief-step\" id=\"dstep-2\">\n        <div class=\"debrief-q\">Which ventures are you focused on today?<\u002Fdiv>\n        <div class=\"debrief-hint\">Select all that apply. This informs your briefing.<\u002Fdiv>\n        <div class=\"debrief-tags\" id=\"bizFocusTags\"><button class=\"debrief-tag\" onclick=\"toggleTag(this,'bizFocus')\" data-biz=\"-1\" style=\"border-color:#3b82f640\">Stratus<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Step 4: Blockers \u002F what's in the way -->\n      <div class=\"debrief-step\" id=\"dstep-3\">\n        <div class=\"debrief-q\">Anything in your way right now?<\u002Fdiv>\n        <div class=\"debrief-hint\">Blockers, distractions, open loops — get it out.<\u002Fdiv>\n        <textarea class=\"debrief-textarea\" id=\"d-blockers\" placeholder=\"What's on your mind that might slow you down today...\"><\u002Ftextarea>\n        <div class=\"debrief-tags\" style=\"margin-top:10px\">\n          <button class=\"debrief-tag\" onclick=\"appendBlocker('Waiting on someone')\">⏳ Waiting on someone<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"appendBlocker('Decision pending')\">🤔 Decision pending<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"appendBlocker('Low energy')\">😮‍💨 Low energy<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"appendBlocker('Too many open tabs')\">🗂️ Too many open tasks<\u002Fbutton>\n          <button class=\"debrief-tag\" onclick=\"appendBlocker('Nothing blocking me')\">✅ Nothing blocking me<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Step 5: Summary -->\n      <div class=\"debrief-step\" id=\"dstep-4\">\n        <div class=\"debrief-q\">You're set up for the day.<\u002Fdiv>\n        <div class=\"debrief-hint\">Here's what you told War Room:<\u002Fdiv>\n        <div id=\"debriefSummary\" style=\"background:var(--bg2);border-radius:var(--r);padding:16px;font-size:12px;line-height:1.8;color:var(--text2)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"launch-footer\">\n      <span class=\"launch-skip\" onclick=\"closeLaunch('debriefOverlay')\">Skip for today<\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-g\" id=\"debriefBack\" onclick=\"debriefNav(-1)\" style=\"display:none\">← Back<\u002Fbutton>\n        <button class=\"btn btn-p\" id=\"debriefNext\" onclick=\"debriefNav(1)\">Next →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ END OF MONTH STATS OVERLAY ═══ -->\n<div class=\"launch-overlay\" id=\"eomOverlay\" style=\"display:none\">\n  <div class=\"launch-card\">\n    <div class=\"launch-header\">\n      <div class=\"launch-eyebrow\">End of Month Review<\u002Fdiv>\n      <div class=\"launch-title\" id=\"eomTitle\">How did the month go?<\u002Fdiv>\n      <div class=\"launch-sub\" id=\"eomSub\">Here's your full breakdown before you close out.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"launch-body\">\n      <!-- Financial summary -->\n      <div class=\"month-stat-grid\" id=\"eomStatGrid\"><\u002Fdiv>\n      <!-- Business breakdown -->\n      <div style=\"margin-bottom:14px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">Revenue by Business<\u002Fdiv>\n        <div id=\"eomBizBreakdown\"><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Goals recap -->\n      <div style=\"margin-bottom:14px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">Goals This Month<\u002Fdiv>\n        <div id=\"eomGoalsRecap\"><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Missions recap -->\n      <div>\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px\">Missions Completed<\u002Fdiv>\n        <div id=\"eomMissionsRecap\"><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Reflection -->\n      <div style=\"margin-top:16px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Month Reflection<\u002Fdiv>\n        <textarea class=\"debrief-textarea\" id=\"eomReflection\" placeholder=\"What went well? What would you do differently? Key lessons...\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"launch-footer\">\n      <span class=\"launch-skip\" onclick=\"closeLaunch('eomOverlay')\">Close<\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-g btn-sm\" onclick=\"saveEomReflection();closeLaunch('eomOverlay')\">Save Reflection &amp; Close<\u002Fbutton>\n        <button class=\"btn btn-p\" onclick=\"saveEomReflection();closeLaunch('eomOverlay')\">Done ✓<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ FIRST OF MONTH GOAL PLANNING OVERLAY ═══ -->\n<div class=\"launch-overlay\" id=\"fomOverlay\" style=\"display:none\">\n  <div class=\"launch-card\" style=\"max-width:680px;max-height:92vh;overflow-y:auto\">\n\n    <!-- ── STEP INDICATOR ── -->\n    <div style=\"display:flex;gap:5px;padding:20px 28px 0;justify-content:center\" id=\"fomStepDots\"><\u002Fdiv>\n\n    <!-- ── STEP 0: Last Month Recap ── -->\n    <div id=\"fomStep0\">\n      <div class=\"launch-header\">\n        <div class=\"launch-eyebrow\">Monthly Review · Step 1 of 4<\u002Fdiv>\n        <div class=\"launch-title\" id=\"fomTitle\">Last Month — How did it go?<\u002Fdiv>\n        <div class=\"launch-sub\" id=\"fomSub\">Your recap before you plan the next one.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"launch-body\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px\" id=\"fomRecapStats\"><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n          <div>\n            <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Goals Last Month<\u002Fdiv>\n            <div id=\"fomGoalsRecap\" style=\"max-height:160px;overflow-y:auto\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Weekly Wins Logged<\u002Fdiv>\n            <div id=\"fomWinsRecap\" style=\"max-height:160px;overflow-y:auto\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px\">\n          <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Reflection — What worked? What didn't?<\u002Fdiv>\n          <textarea class=\"debrief-textarea\" style=\"min-height:70px\" id=\"fomReflection\" placeholder=\"Be honest with yourself. What moved the needle and what was noise?\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv in-left:20%}100%{width:0;margin-left:100%}}\n<\u002Fstyle>\n\n\n<!-- BIZ CONTEXT MENU -->\n<div class=\"ctx-menu\" id=\"bizCtxMenu\">\n  <div class=\"ctx-menu-header\" id=\"bizCtxMenuHeader\" style=\"padding:8px 14px 6px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:.5px solid var(--border);margin-bottom:4px\"><\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxOpenBiz()\"><span class=\"ctx-item-icon\">→<\u002Fspan>Open<\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxRenameBiz()\"><span class=\"ctx-item-icon\">✎<\u002Fspan>Rename<\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxEditBiz()\"><span class=\"ctx-item-icon\">⚙<\u002Fspan>Edit Details<\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxToggleStatus()\"><span class=\"ctx-item-icon\">◉<\u002Fspan>Toggle Status<\u002Fdiv>\n  <div class=\"ctx-div\"><\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxMoveBizUp()\"><span class=\"ctx-item-icon\">↑<\u002Fspan>Move Up<\u002Fdiv>\n  <div class=\"ctx-item\" onclick=\"ctxMoveBizDown()\"><span class=\"ctx-item-icon\">↓<\u002Fspan>Move Down<\u002Fdiv>\n  <div class=\"ctx-div\"><\u002Fdiv>\n  <div class=\"ctx-item danger\" id=\"bizCtxDeleteBtn\" onclick=\"ctxDeleteBiz()\"><span class=\"ctx-item-icon\">✕<\u002Fspan>Delete Business<\u002Fdiv>\n<\u002Fdiv>\n\n\n<!-- ── ADMIN LOGIN MODAL ── -->\n<div class=\"admin-modal-overlay\" id=\"adminModalOverlay\">\n  <div class=\"admin-modal-card\">\n    <div class=\"admin-modal-eyebrow\">⚙ Restricted Access<\u002Fdiv>\n    <div class=\"admin-modal-title\">Admin Login<\u002Fdiv>\n    <div class=\"admin-modal-sub\">Enter your admin credentials to access the War Room directly.<\u002Fdiv>\n    <div class=\"admin-modal-field\">\n      <label>Username<\u002Flabel>\n      <input type=\"text\" id=\"adminUser\" placeholder=\"admin username\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter')document.getElementById('adminPass').focus()\">\n    <\u002Fdiv>\n    <div class= ng about your war room.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"jarvis-overlay-input\">\n      <textarea id=\"aiChatInputOverlay\" placeholder=\"Ask JARVIS anything...\" rows=\"1\" onkeydown=\"if(event.key==='Enter'&amp;&amp;!event.shiftKey){event.preventDefault();sendChatOverlay()}\" oninput=\"this.style.height='';this.style.height=Math.min(this.scrollHeight,100)+'px'\"><\u002Ftextarea>\n      <button class=\"ai-chat-send\" style=\"border-radius:10px;padding:9px 16px;font-size:12px\" onclick=\"sendChatOverlay()\" id=\"aiChatSendBtnOverlay\">↑<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── STRATUS WAR ROOM — Google Drive Sync Module ── -->\n<script>\n{\n  const SCOPE = 'https:\u002F\u002Fwww.googleapis.com\u002Fauth\u002Fdrive.file';\n  let token = null;\n  let gsiReady = false;\n  let gapiReady = false;\n\n  function setStatus(msg){\n    ['drive-sync-status','drive-sync-status-nav','drive-sync-status-qc','drive-sync-status-mob'].forEach(id => {\n      const el = document.getElementById(id);\n      if(el) el.textContent = msg;\n    });\n  }\n\n  function loadScript(src, onload){\n    if(document.querySelector('script[src=\"'+src+'\"]')){\n      onload(); return;\n    }\n    const s = document.createElement('script');\n    s.src = src;\n    s.onload = onload;\n    s.onerror = () => setStatus('❌ Failed to load Google script');\n    document.head.appendChild(s);\n  }\n\n  function ensureGSI(cb){\n    if(gsiReady) return cb();\n    loadScript('https:\u002F\u002Faccounts.google.com\u002Fgsi\u002Fclient', () => { gsiReady = true; cb(); });\n  }\n\n  function ensureGAPI(cb){\n    if(gapiReady) return cb();\n    loadScript('https:\u002F\u002Fapis.google.com\u002Fjs\u002Fapi.js', () => { gapiReady = true; cb(); });\n  }\n\n  function getToken(cb){\n    if(token) return cb(token);\n    ensureGSI(() => {\n      const client = google.accounts.oauth2.initTokenClient({\n        client_id: DRIVE_CLIENT_ID,\n        scope: SCOPE,\n        callback: (res) => {\n          if(res.error){ setStatus('Auth failed: ' + res.error); return; }\n          token = res.access_token;\n          cb(token);\n        }\n      });\n      client.requestAccessToken();\n    });\n  }\n\n  async function getOrCreateFolder(t){\n    const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application\u002Fvnd.google-apps.folder' and trashed=false`);\n    const res = await fetch(`https:\u002F\u002Fwww.googleapis.com\u002Fdrive\u002Fv3\u002Ffiles?q=${q}`,\n      { headers: { Authorization: 'Bearer ' + t } }).then(r => r.json());\n    if(res.files && res.files.length > 0) return res.files[0].id;\n    const f = await fetch('https:\u002F\u002Fwww.googleapis.com\u002Fdrive\u002Fv3\u002Ffiles', {\n      method: 'POST',\n      headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application\u002Fjson' },\n      body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application\u002Fvnd.google-apps.folder' })\n    }).then(r => r.json());\n    return f.id;\n  }\n\n  window.driveSave = function(){\n    setStatus('Loading Google...');\n    getToken(async (t) => {\n      try {\n        setStatus('Saving to Drive...');\n        const folderId = await getOrCreateFolder(t);\n        const snapshot = {\n          _warRoomVersion: WAR_ROOM_VERSION,\n          _exportDate: new Date().toISOString(),\n          _label: 'Drive backup',\n          ...DATA_KEYS.reduce((obj,k)=>{ obj[k]=S[k]; return obj; }, {})\n        };\n        const json = JSON.stringify(snapshot, null, 2);\n        const ts = new Date().toISOString().replace(\u002F[:.]\u002Fg,'-');\n        const filename = `warroom-backup-v${WAR_ROOM_VERSION}-${ts}.json`;\n        const form = new FormData();\n        form.append('metadata', new Blob(\n          [JSON.stringify({ name: filename, parents: [folderId] })],\n          { type: 'application\u002Fjson' }\n        ));\n        form.append('file', new Blob([json], { type: 'application\u002Fjson' }));\n        const result = await fetch(\n          'https:\u002F\u002Fwww.googleapis.com\u002Fupload\u002Fdrive\u002Fv3\u002Ffiles?uploadType=multipart',\n          { method: 'POST', headers: { Authorization: 'Bearer ' + t }, body: form }\n        ).then(r => r.json());\n        if(!S.backups) S.backups = [];\n        S.backups.unshift({ date: new Date().toISOString(), label: 'Drive backup', filename: result.name, counts: { businesses: S.businesses.length, tasks: S.tasks.length, entries: S.entries.length, events: S.events.length } });\n        if(S.backups.length > 20) S.backups = S.backups.slice(0,20);\n        save(); updateLastBackupLabel();\n        setStatus('✅ Saved: ' + result.name);\n      } catch(err){ setStatus('❌ ' + err.message); }\n    });\n  };\n\n  window.driveLoad = function(){\n    setStatus('Loading Google...');\n    getToken(async (t) => {\n      try {\n        ensureGAPI(async () => {\n          await new Promise(res => gapi.load('picker', res));\n          new google.picker.PickerBuilder()\n            .addView(new google.picker.DocsView().setIncludeFolders(false).setMimeTypes('application\u002Fjson'))\n            .setOAuthToken(t)\n            .setCallback(async (data) => {\n              if(data.action !== google.picker.Action.PICKED) return;\n              const file = data.docs[0];\n              setStatus('Loading ' + file.name + '...');\n              const content = await fetch(\n                `https:\u002F\u002Fwww.googleapis.com\u002Fdrive\u002Fv3\u002Ffiles\u002F${file.id}?alt=media`,\n                { headers: { Authorization: 'Bearer ' + t } }\n              ).then(r => r.text());\n              try {\n                const parsed = JSON.parse(content);\n                if(!parsed._stratusVersion && !parsed.businesses && !parsed._warRoomVersion){\n                  setStatus('❌ Invalid War Room backup file.'); return;\n                }\n                if(confirm('FULL RESTORE from Drive: This replaces all current data with the selected backup. Continue?')){\n                  const hist = S.backups || [];\n                  DATA_KEYS.forEach(k => { if(parsed[k] !== undefined) S[k] = parsed[k]; });\n                  S.backups = hist;\n                  save();\n                  setStatus('⏳ Syncing to cloud...');\n                  await saveToCloud(true);\n                  setStatus('✅ Loaded: ' + file.name);\n                  location.reload();\n                }\n              } catch(err){ setStatus('❌ Invalid file: ' + err.message); }\n            })\n            .build().setVisible(true);\n        });\n      } catch(err){ setStatus('❌ ' + err.message); }\n    });\n  };\n}\n<\u002Fscript>\n\n\n<!-- ══ VIDEO CALL OVERLAY ══ -->\n<div class=\"vcall-overlay\" id=\"vcallOverlay\">\n  <!-- Topbar -->\n  <div class=\"vcall-topbar\">\n    <div class=\"vcall-logo\">\n      <div class=\"vcall-rec\" id=\"vcallRecDot\" style=\"display:none\"><\u002Fdiv>\n      <span id=\"vcallLogoText\">WAR ROOM · MEET<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"vcall-timer-disp\" id=\"vcallTimerDisplay\">00:00<\u002Fdiv>\n    <button class=\"vcall-end-btn\" onclick=\"endVCall()\">✕ End Call<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- LOBBY (pre-join) -->\n  <div class=\"vcall-lobby\" id=\"vcallLobby\">\n    <div class=\"vcall-tab-row\">\n      <button class=\"vcall-tab\" id=\"vtab-new\" onclick=\"setVCallTab('new')\">New Meeting<\u002Fbutton>\n      <button class=\"vcall-tab active\" id=\"vtab-join\" onclick=\"setVCallTab('join')\">Join Meeting<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"vcall-lobby-cam\">\n      <div class=\"vcall-lobby-cam-av\" id=\"vcallLobbyAv\">◈<\u002Fdiv>\n      <div class=\"vcall-lobby-label\">Camera Preview (Demo)<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- New Meeting panel -->\n    <div id=\"vcallNewPanel\" style=\"display: none; flex-direction: column; align-items: center; gap: 14px;\">\n      <div class=\"vcall-title\">Start a Meeting<\u002Fdiv>\n      <div class=\"vcall-sub\">Share the room code with participants<\u002Fdiv>\n      <div class=\"vcall-room-box\">\n        <span id=\"vcallRoomCode\" style=\"letter-spacing:.18em\">ARUCRQ<\u002Fspan>\n        <button class=\"vcall-copy-btn\" onclick=\"copyRoomCode()\">Copy<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\">\n        <button class=\"vcall-btn active\" id=\"vcallLobbyMic\" onclick=\"toggleLobbyMic(this)\" title=\"Microphone (on)\">🎤<\u002Fbutton>\n        <button class=\"vcall-btn active\" id=\"vcallLobbyVid\" onclick=\"toggleLobbyVid(this)\" title=\"Camera (on)\">📷<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"vcall-start-btn\" onclick=\"joinVCall()\">Start Now →<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Join Meeting panel -->\n    <div id=\"vcallJoinPanel\" style=\"display: flex; flex-direction: column; align-items: center; gap: 14px;\">\n      <div class=\"vcall-title\">Join a Meeting<\u002Fdiv>\n      <div class=\"vcall-sub\">Enter the room code from your host<\u002Fdiv>\n      <input class=\"vcall-input\" id=\"vcallJoinInput\" placeholder=\"Enter room code...\" maxlength=\"9\">\n      <div style=\"display:flex;gap:10px;align-items:center\">\n        <button class=\"vcall-btn active\" id=\"vcallLobbyMic2\" onclick=\"toggleLobbyMic(this)\" title=\"Microphone\">🎤<\u002Fbutton>\n        <button class=\"vcall-btn active\" id=\"vcallLobbyVid2\" onclick=\"toggleLobbyVid(this)\" title=\"Camera\">📷<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"vcall-start-btn\" onclick=\"joinVCall()\">Join Now →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- IN-CALL VIEW -->\n  <div id=\"vcallInCall\" style=\"display:none;flex:1;display:none;flex-direction:column;position:relative;min-height:0\">\n    <div class=\"vcall-grid g4\" id=\"vcallParticipantGrid\"><\u002Fdiv>\n    <!-- Self PiP -->\n    <div class=\"vcall-pip\" id=\"vcallPip\">\n      <div class=\"vcall-lobby-cam-av\" id=\"vcallPipAv\" style=\"width:44px;height:44px;font-size:18px\">◈<\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Chat Panel -->\n    <div class=\"vcall-chat-panel\" id=\"vcallChatPanel\" style=\"display: none;\">\n      <div class=\"vcall-chat-hdr\">\n        <span>In-Call Chat<\u002Fspan>\n        <button onclick=\"toggleVCallChat()\" style=\"background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:14px\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"vcall-chat-msgs\" id=\"vcallChatMsgs\"><\u002Fdiv>\n      <div class=\"vcall-chat-input-row\">\n        <input class=\"vcall-chat-inp\" id=\"vcallChatInp\" placeholder=\"Message everyone...\" onkeydown=\"if(event.key==='Enter')sendVCallChat()\">\n        <button class=\"vcall-chat-send\" onclick=\"sendVCallChat()\">↑<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Controls -->\n    <div class=\"vcall-controls\">\n      <button class=\"vcall-btn active\" id=\"vcallMicBtn\" onclick=\"toggleVCallControl('mic')\" title=\"Mute\u002FUnmute\">🎤<\u002Fbutton>\n      <button class=\"vcall-btn active\" id=\"vcallVidBtn\" onclick=\"toggleVCallControl('vid')\" title=\"Video On\u002FOff\">📷<\u002Fbutton>\n      <button class=\"vcall-btn active\" id=\"vcallScreenBtn\" onclick=\"toggleVCallControl('screen')\" title=\"Share Screen\">🖥<\u002Fbutton>\n      <button class=\"vcall-btn active\" id=\"vcallChatBtn\" onclick=\"toggleVCallChat()\" title=\"Chat\">💬<\u002Fbutton>\n      <button class=\"vcall-btn active\" id=\"vcallParticipantsBtn\" onclick=\"toggleVCallParticipants()\" title=\"Participants\">👥<\u002Fbutton>\n      <button class=\"vcall-btn end\" onclick=\"endVCall()\" title=\"End Call\">📵<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ INVOICE CREATE \u002F EDIT MODAL ══ -->\n<div class=\"modal-overlay\" id=\"invModal\">\n  <div class=\"modal-box\" style=\"width:520px;max-width:96vw\">\n    <div class=\"modal-title\" id=\"invModalTitle\">New Invoice<\u002Fdiv>\n    <div class=\"fg\">\n      <div class=\"frow\">\n        <div><label>Client \u002F Company<\u002Flabel><input type=\"text\" id=\"invClient\" placeholder=\"Client name...\"><\u002Fdiv>\n        <div><label>Invoice #<\u002Flabel><input type=\"text\" id=\"invNumber\" placeholder=\"INV-001\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label>Business<\u002Flabel>\n        <select id=\"invBiz\"><option value=\"\">Personal \u002F No Business<\u002Foption><\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"frow\">\n        <div><label>Issue Date<\u002Flabel><input type=\"date\" id=\"invIssueDate\"><\u002Fdiv>\n        <div><label>Due Date<\u002Flabel><input type=\"date\" id=\"invDueDate\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label>Description \u002F Services<\u002Flabel><textarea id=\"invDesc\" placeholder=\"What are you invoicing for?\"><\u002Ftextarea><\u002Fdiv>\n      <!-- Line items -->\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n          <label style=\"margin:0\">Line Items<\u002Flabel>\n          <button class=\"btn btn-g btn-sm\" onclick=\"addInvLine()\" type=\"button\">+ Add Line<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"invLinesContainer\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\">\n        <div><label>Tax Rate (%)<\u002Flabel><input type=\"number\" id=\"invTaxRate\" placeholder=\"0\" min=\"0\" max=\"100\" value=\"0\"><\u002Fdiv>\n        <div><label>Discount ($)<\u002Flabel><input type=\"number\" id=\"invDiscount\" placeholder=\"0\" min=\"0\" value=\"0\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end;gap:10px;padding:10px 0;border-top:.5px solid var(--border2);margin-top:4px\">\n        <div style=\"font-size:11px;color:var(--text3);font-family:'DM Mono',monospace\">Total: <strong id=\"invTotalPreview\" style=\"color:var(--text);font-size:14px\">$0.00<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div><label>Status<\u002Flabel>\n        <select id=\"invStatus\">\n          <option value=\"draft\">Draft<\u002Foption>\n          <option value=\"sent\">Sent<\u002Foption>\n          <option value=\"paid\">Paid<\u002Foption>\n          <option value=\"partial\">Partial Payment<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div><label>Notes \u002F Payment Terms<\u002Flabel><input type=\"text\" id=\"invNotes\" placeholder=\"e.g. Net 30, Wire transfer, Thank you for your business...\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mactions\">\n      <button class=\"btn btn-p\" onclick=\"saveInvoice()\" id=\"invSaveBtn\">Create Invoice<\u002Fbutton>\n      <button class=\"btn btn-g\" onclick=\"closeModal('invModal')\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ INVOICE DETAIL OVERLAY ══ -->\n<div class=\"inv-detail-overlay\" id=\"invDetailOverlay\">\n  <div class=\"inv-detail-card\">\n    <div class=\"inv-detail-header\">\n      <div>\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:5px\" id=\"invDetailNum\">INV-001<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em\" id=\"invDetailClient\">Client Name<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--text2);margin-top:3px\" id=\"invDetailDesc\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;flex-shrink:0\">\n        <div style=\"font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1\" id=\"invDetailAmount\">$0<\u002Fdiv>\n        <div id=\"invDetailStatusBadge\" style=\"margin-top:8px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:18px 28px\">\n      <div class=\"g2 mb12\" id=\"invDetailMeta\"><\u002Fdiv>\n      <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Line Items<\u002Fdiv>\n      <table class=\"inv-line-table\" id=\"invDetailLines\"><\u002Ftable>\n      <div class=\"inv-total-row\" id=\"invDetailTotals\"><\u002Fdiv>\n      <div id=\"invDetailNotes\" style=\"margin-top:14px;padding:10px 14px;background:var(--bg2);border-radius:var(--rs);font-size:11px;color:var(--text2);display:none\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 28px 22px;border-top:.5px solid var(--border2);display:flex;gap:8px;justify-content:space-between;align-items:center\">\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-p btn-sm\" id=\"invMarkPaidBtn\" onclick=\"markInvoicePaidFromDetail()\" style=\"background:var(--green);border-color:var(--green)\">✓ Mark Paid<\u002Fbutton>\n        <button class=\"btn btn-g btn-sm\" id=\"invEditBtn\" onclick=\"editInvoiceFromDetail()\">Edit<\u002Fbutton>\n        <button class=\"btn btn-danger btn-sm\" id=\"invDeleteBtn\" onclick=\"deleteInvoiceFromDetail()\">Delete<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"btn btn-g btn-sm\" onclick=\"closeInvDetail()\">Close<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script>\n\u002F\u002F ═══════════════════════════════════════════════════════════\n\u002F\u002F  WARROOM ADDITIONS — Video Call · Invoices · Tax Tracker\n\u002F\u002F ═══════════════════════════════════════════════════════════\n\nfunction fmtMoney(n){\n  return '$' + (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\n}\n\n\u002F\u002F ─── VIDEO CALL ───────────────────────────────────────────\nvar _vcState = {muted:false,vidOff:false,chatOpen:false,inCall:false,participants:[],chatMsgs:[],roomCode:'',_speakTimer:null};\n\nfunction openVCallLobby(){\n  _vcState.roomCode = Math.random().toString(36).slice(2,8).toUpperCase();\n  var rc = document.getElementById('vcallRoomCode');\n  if(rc) rc.textContent = _vcState.roomCode;\n  var overlay = document.getElementById('vcallOverlay');\n  if(overlay) overlay.classList.add('open');\n  \u002F\u002F Show lobby, hide in-call\n  var lobby = document.getElementById('vcallLobby');\n  var inCall = document.getElementById('vcallInCall');\n  if(lobby) lobby.style.display = '';\n  if(inCall) inCall.style.display = 'none';\n  \u002F\u002F Default to new-meeting sub-panel\n  _vcShowLobbyPanel('new');\n  \u002F\u002F Reset controls\n  _vcState.muted = false; _vcState.vidOff = false;\n  var mic = document.getElementById('vcallLobbyMic');\n  var vid = document.getElementById('vcallLobbyVid');\n  if(mic){mic.classList.add('active');mic.title='Microphone (on)';}\n  if(vid){vid.classList.add('active');vid.title='Camera (on)';}\n}\n\nfunction _vcShowLobbyPanel(panel){\n  var np = document.getElementById('vcallNewPanel');\n  var jp = document.getElementById('vcallJoinPanel');\n  var t1 = document.getElementById('vtab-new');\n  var t2 = document.getElementById('vtab-join');\n  if(np) np.style.display = panel==='new' ? 'flex' : 'none';\n  if(jp) jp.style.display = panel==='join' ? 'flex' : 'none';\n  if(t1) t1.classList.toggle('active', panel==='new');\n  if(t2) t2.classList.toggle('active', panel==='join');\n}\n\nfunction setVCallTab(tab){\n  if(tab==='new'||tab==='join'){\n    _vcShowLobbyPanel(tab);\n  } else if(tab==='call'){\n    var lobby = document.getElementById('vcallLobby');\n    var inCall = document.getElementById('vcallInCall');\n    if(lobby) lobby.style.display = 'none';\n    if(inCall){ inCall.style.display = 'flex'; inCall.style.flexDirection = 'column'; }\n  }\n}\n\nfunction copyRoomCode(){\n  var rc = document.getElementById('vcallRoomCode');\n  if(!rc) return;\n  var code = rc.textContent;\n  var btn = rc.parentElement && rc.parentElement.querySelector('button');\n  function flashBtn(){ if(btn){ var orig=btn.textContent; btn.textContent='Copied!'; setTimeout(function(){btn.textContent=orig;},1400); } }\n  if(navigator.clipboard && window.isSecureContext){\n    navigator.clipboard.writeText(code).then(flashBtn).catch(function(){\n      \u002F\u002F fallback for restricted contexts\n      var ta=document.createElement('textarea'); ta.value=code;\n      ta.style.cssText='position:fixed;opacity:0;top:0;left:0';\n      document.body.appendChild(ta); ta.select(); document.execCommand('copy');\n      document.body.removeChild(ta); flashBtn();\n    });\n  } else {\n    var ta=document.createElement('textarea'); ta.value=code;\n    ta.style.cssText='position:fixed;opacity:0;top:0;left:0';\n    document.body.appendChild(ta); ta.select(); document.execCommand('copy');\n    document.body.removeChild(ta); flashBtn();\n  }\n}\n\nfunction toggleLobbyMic(el){\n  _vcState.muted = !_vcState.muted;\n  if(el){ el.classList.toggle('active', !_vcState.muted); el.title = _vcState.muted ? 'Microphone (muted)' : 'Microphone (on)'; }\n}\n\nfunction toggleLobbyVid(el){\n  _vcState.vidOff = !_vcState.vidOff;\n  if(el){ el.classList.toggle('active', !_vcState.vidOff); el.title = _vcState.vidOff ? 'Camera (off)' : 'Camera (on)'; }\n}\n\nfunction joinVCall(){\n  _vcState.inCall = true;\n  var myName = (S.profile&&S.profile.name)||'You';\n  \u002F\u002F Check if joining with a code\n  var joinInp = document.getElementById('vcallJoinInput');\n  if(joinInp&&joinInp.value.trim()) _vcState.roomCode = joinInp.value.trim().toUpperCase();\n  _vcState.participants = [\n    {id:1,name:myName,muted:_vcState.muted,vidOff:_vcState.vidOff,speaking:false,isMe:true},\n    {id:2,name:'Alex Rivera',muted:false,vidOff:false,speaking:true},\n    {id:3,name:'Sam Chen',muted:true,vidOff:false,speaking:false},\n    {id:4,name:'Jordan Lee',muted:false,vidOff:true,speaking:false}\n  ];\n  \u002F\u002F Show rec dot\n  var rec = document.getElementById('vcallRecDot');\n  if(rec) rec.style.display = '';\n  setVCallTab('call');\n  renderVCallParticipants();\n  updateVCallControls();\n  _vcState.chatMsgs = [{from:'System',text:'Meeting started — Room: '+_vcState.roomCode,ts:_vcNow()}];\n  _vcRenderChat();\n  \u002F\u002F Animate speaking indicator\n  var spkIdx = 1;\n  _vcState._speakTimer = setInterval(function(){\n    _vcState.participants.forEach(function(p){p.speaking=false;});\n    _vcState.participants[spkIdx % _vcState.participants.length].speaking = true;\n    spkIdx++;\n    renderVCallParticipants();\n  },3200);\n}\n\nfunction _vcNow(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }\n\nfunction renderVCallParticipants(){\n  var grid = document.getElementById('vcallParticipantGrid');\n  if(!grid) return;\n  grid.innerHTML = _vcState.participants.map(function(p){\n    return '<div class=\"vcall-tile'+(p.speaking?' speaking':'')+(p.vidOff?' vcall-tile-novid':'')+'\">'\n      +'<div class=\"vcall-tile-avatar\">'+p.name.charAt(0).toUpperCase()+'<\u002Fdiv>'\n      +'<div class=\"vcall-tile-name\">'+p.name+(p.isMe?' (You)':'')+(p.muted?' · muted':'')+'<\u002Fdiv>'\n      +(p.vidOff?'<div style=\"position:absolute;top:8px;right:10px;font-size:10px;opacity:.5;color:var(--text3);letter-spacing:.05em\">CAM OFF<\u002Fdiv>':'')\n      +'<\u002Fdiv>';\n  }).join('');\n}\n\nfunction _vcRenderChat(){\n  var el = document.getElementById('vcallChatMsgs');\n  if(!el) return;\n  el.innerHTML = _vcState.chatMsgs.map(function(m){\n    return '<div style=\"margin-bottom:8px\">'\n      +'<span style=\"font-weight:700;color:var(--accent);font-size:10px\">'+m.from+'<\u002Fspan>'\n      +'<span style=\"color:rgba(255,255,255,.3);font-size:9px;margin-left:6px\">'+m.ts+'<\u002Fspan>'\n      +'<div style=\"color:rgba(255,255,255,.85);font-size:11px;margin-top:2px\">'+m.text+'<\u002Fdiv>'\n      +'<\u002Fdiv>';\n  }).join('');\n  el.scrollTop = el.scrollHeight;\n}\n\nfunction updateVCallControls(){\n  var micBtn = document.getElementById('vcallMicBtn');\n  var vidBtn = document.getElementById('vcallVidBtn');\n  if(micBtn){ micBtn.classList.toggle('active',!_vcState.muted); micBtn.title=_vcState.muted?'Unmute':'Mute'; }\n  if(vidBtn){ vidBtn.classList.toggle('active',!_vcState.vidOff); vidBtn.title=_vcState.vidOff?'Start Camera':'Stop Camera'; }\n}\n\nfunction toggleVCallControl(type){\n  if(type==='mic'){ _vcState.muted=!_vcState.muted; }\n  else if(type==='vid'){ _vcState.vidOff=!_vcState.vidOff; }\n  else if(type==='screen'){\n    var b = document.getElementById('vcallScreenBtn');\n    if(b){\n      var on = b.getAttribute('data-on')==='1';\n      b.setAttribute('data-on',on?'0':'1');\n      b.classList.toggle('active',!on);\n    }\n  }\n  updateVCallControls();\n  var me = _vcState.participants.find(function(p){return p.isMe;});\n  if(me){me.muted=_vcState.muted;me.vidOff=_vcState.vidOff;}\n  renderVCallParticipants();\n}\n\nfunction toggleVCallChat(){\n  _vcState.chatOpen = !_vcState.chatOpen;\n  var panel = document.getElementById('vcallChatPanel');\n  if(panel) panel.style.display = _vcState.chatOpen ? 'flex' : 'none';\n}\n\nfunction toggleVCallParticipants(){\n  \u002F\u002F placeholder — grid already visible\n}\n\nfunction sendVCallChat(){\n  var inp = document.getElementById('vcallChatInp');\n  if(!inp) return;\n  var text = inp.value.trim();\n  if(!text) return;\n  var name = (S.profile&&S.profile.name)||'You';\n  _vcState.chatMsgs.push({from:name,text:text,ts:_vcNow()});\n  _vcRenderChat();\n  inp.value = '';\n  var replies = ['Got it!','Sounds good.','Can you share your screen?','One sec...','Agreed!','On it.'];\n  var names = ['Alex Rivera','Sam Chen','Jordan Lee'];\n  setTimeout(function(){\n    _vcState.chatMsgs.push({\n      from:names[Math.floor(Math.random()*names.length)],\n      text:replies[Math.floor(Math.random()*replies.length)],\n      ts:_vcNow()\n    });\n    _vcRenderChat();\n  },1800);\n}\n\nfunction endVCall(){\n  if(_vcState._speakTimer) clearInterval(_vcState._speakTimer);\n  _vcState.inCall=false; _vcState.participants=[]; _vcState.chatMsgs=[];\n  _vcState.chatOpen=false; _vcState.muted=false; _vcState.vidOff=false;\n  var overlay = document.getElementById('vcallOverlay');\n  if(overlay) overlay.classList.remove('open');\n  var rec = document.getElementById('vcallRecDot');\n  if(rec) rec.style.display = 'none';\n  var panel = document.getElementById('vcallChatPanel');\n  if(panel) panel.style.display = 'none';\n}\n\n\u002F\u002F ─── INVOICES ─────────────────────────────────────────────\nvar _invEditId = null;\nvar _invTab = 'all';\nvar _invDetailId = null;\nvar _invLines = [];\n\nfunction setInvTab(tab){\n  _invTab = tab;\n  \u002F\u002F Match by element ID pattern itab-xxx\n  document.querySelectorAll('.inv-tab').forEach(function(el){\n    var elTab = (el.id||'').replace('itab-','') || (el.dataset&&el.dataset.tab) || '';\n    el.classList.toggle('active', elTab===tab);\n  });\n  renderInvList();\n}\n\nfunction openInvModal(id){\n  _invEditId = id||null;\n  _invLines = [];\n  _refreshBizSelect();\n  var modal = document.getElementById('invModal');\n  if(!modal) return;\n  var today = new Date().toISOString().slice(0,10);\n  var due30 = new Date(Date.now()+30*86400000).toISOString().slice(0,10);\n  if(id){\n    var inv = (S.invoices||[]).find(function(i){return i.id===id;});\n    if(!inv) return;\n    var titleEl = document.getElementById('invModalTitle'); if(titleEl) titleEl.textContent='Edit Invoice';\n    document.getElementById('invClient').value = inv.client||'';\n    document.getElementById('invIssueDate').value = inv.issueDate||today;\n    document.getElementById('invDueDate').value = inv.dueDate||due30;\n    document.getElementById('invNotes').value = inv.notes||'';\n    document.getElementById('invStatus').value = inv.status||'draft';\n    var bs = document.getElementById('invBiz'); if(bs) bs.value = inv.bizId||'';\n    var nr = document.getElementById('invNumber'); if(nr) nr.value = inv.num||'';\n    var ds = document.getElementById('invDesc'); if(ds) ds.value = inv.desc||'';\n    _invLines = (inv.lines||[]).map(function(l){return {desc:l.desc,qty:l.qty,rate:l.rate};});\n  } else {\n    var titleEl2 = document.getElementById('invModalTitle'); if(titleEl2) titleEl2.textContent='New Invoice';\n    document.getElementById('invClient').value = '';\n    document.getElementById('invIssueDate').value = today;\n    document.getElementById('invDueDate').value = due30;\n    document.getElementById('invNotes').value = '';\n    document.getElementById('invStatus').value = 'draft';\n    var ds2 = document.getElementById('invDesc'); if(ds2) ds2.value = '';\n    var bs2 = document.getElementById('invBiz');\n    if(bs2&&S.businesses.length) bs2.value = S.businesses[0].id;\n    var newNum = 'INV-'+String((S.invoices||[]).length+1).padStart(3,'0');\n    var nr2 = document.getElementById('invNumber'); if(nr2) nr2.value = newNum;\n    _invLines = [{desc:'',qty:1,rate:0}];\n  }\n  _renderInvLines();\n  _updateInvTotal();\n  var saveBtn = document.getElementById('invSaveBtn');\n  if(saveBtn) saveBtn.textContent = id ? 'Save Changes' : 'Create Invoice';\n  modal.classList.add('open');\n}\n\nfunction _refreshBizSelect(){\n  var sel = document.getElementById('invBiz');\n  if(!sel) return;\n  sel.innerHTML = '<option value=\"\">Personal \u002F No Business<\u002Foption>'\n    +(S.businesses||[]).map(function(b){return '<option value=\"'+b.id+'\">'+b.name+'<\u002Foption>';}).join('');\n}\n\nfunction addInvLine(){\n  _invLines.push({desc:'',qty:1,rate:0});\n  _renderInvLines();\n  _updateInvTotal();\n}\n\nfunction removeInvLine(i){\n  _invLines.splice(i,1);\n  _renderInvLines();\n  _updateInvTotal();\n}\n\nfunction _renderInvLines(){\n  var container = document.getElementById('invLinesContainer');\n  if(!container) return;\n  container.innerHTML = _invLines.map(function(l,i){\n    var lineTotal = (l.qty||1)*(l.rate||0);\n    return '<div style=\"display:grid;grid-template-columns:1fr 70px 100px 80px 30px;gap:6px;align-items:center;margin-bottom:6px\">'\n      +'<input class=\"inp\" value=\"'+(l.desc||'')+'\" oninput=\"_invLines['+i+'].desc=this.value\" placeholder=\"Description\">'\n      +'<input class=\"inp\" type=\"number\" value=\"'+(l.qty||1)+'\" min=\"1\" oninput=\"_invLines['+i+'].qty=+this.value;_updateInvTotal()\" style=\"text-align:center\">'\n      +'<input class=\"inp\" type=\"number\" value=\"'+(l.rate||0)+'\" min=\"0\" step=\"0.01\" oninput=\"_invLines['+i+'].rate=+this.value;_updateInvTotal()\" style=\"text-align:right\" placeholder=\"Rate\">'\n      +'<div style=\"font-size:11px;font-weight:700;color:var(--text);text-align:right;font-family:\\'DM Mono\\',monospace\">'+fmtMoney(lineTotal)+'<\u002Fdiv>'\n      +'<button class=\"btn btn-danger btn-sm\" onclick=\"removeInvLine('+i+')\" style=\"padding:3px 6px;font-size:10px;line-height:1\">x<\u002Fbutton>'\n      +'<\u002Fdiv>';\n  }).join('');\n}\n\nfunction _calcInvTotal(){\n  var taxRate = parseFloat((document.getElementById('invTaxRate')||{}).value)||0;\n  var discount = parseFloat((document.getElementById('invDiscount')||{}).value)||0;\n  var subtotal = _invLines.reduce(function(s,l){return s+(l.qty||1)*(l.rate||0);},0);\n  return Math.max(0, subtotal * (1+taxRate\u002F100) - discount);\n}\n\nfunction _updateInvTotal(){\n  var el = document.getElementById('invTotalPreview');\n  if(el) el.textContent = fmtMoney(_calcInvTotal());\n}\n\nfunction saveInvoice(){\n  var clientEl = document.getElementById('invClient');\n  var client = clientEl ? clientEl.value.trim() : '';\n  if(!client){ alert('Client name is required.'); return; }\n  recalculateNextId();\n  var existing = _invEditId ? (S.invoices||[]).find(function(i){return i.id===_invEditId;}) : null;\n  var numEl = document.getElementById('invNumber');\n  var descEl = document.getElementById('invDesc');\n  var inv = {\n    id: _invEditId || S.nextId++,\n    num: numEl&&numEl.value.trim() ? numEl.value.trim() : (existing?existing.num:'INV-'+String((S.invoices||[]).length+1).padStart(3,'0')),\n    client: client,\n    desc: descEl ? descEl.value.trim() : '',\n    bizId: parseInt((document.getElementById('invBiz')||{}).value)||null,\n    issueDate: (document.getElementById('invIssueDate')||{}).value||'',\n    dueDate: (document.getElementById('invDueDate')||{}).value||'',\n    status: (document.getElementById('invStatus')||{}).value||'draft',\n    notes: (document.getElementById('invNotes')||{}).value.trim()||'',\n    lines: _invLines.map(function(l){return {desc:l.desc,qty:+l.qty,rate:+l.rate};}),\n    total: _calcInvTotal()\n  };\n  if(!S.invoices) S.invoices = [];\n  if(_invEditId){\n    var idx = S.invoices.findIndex(function(i){return i.id===_invEditId;});\n    if(idx>-1) S.invoices[idx]=inv; else S.invoices.push(inv);\n  } else {\n    S.invoices.push(inv);\n  }\n  save();\n  closeModal('invModal');\n  renderInvoices();\n  updateBadges();\n}\n\nfunction invIsOverdue(inv){\n  if(inv.status==='paid') return false;\n  if(!inv.dueDate) return false;\n  return inv.dueDate < new Date().toISOString().slice(0,10);\n}\n\nfunction renderInvoices(){\n  renderInvKpis();\n  _renderInvTabCounts();\n  renderInvList();\n}\n\nfunction _renderInvTabCounts(){\n  var tabs = ['all','draft','sent','paid','overdue'];\n  tabs.forEach(function(t){\n    var btn = document.getElementById('itab-'+t);\n    if(!btn) return;\n    var cnt = t==='all' ? (S.invoices||[]).length\n      : t==='overdue' ? (S.invoices||[]).filter(invIsOverdue).length\n      : (S.invoices||[]).filter(function(i){return i.status===t;}).length;\n    \u002F\u002F Update button text to include count\n    var base = t.charAt(0).toUpperCase()+t.slice(1);\n    btn.textContent = cnt ? base+' ('+cnt+')' : base;\n  });\n}\n\nfunction renderInvKpis(){\n  var el = document.getElementById('invKpiStrip');\n  if(!el) return;\n  var invs = S.invoices||[];\n  var total = invs.reduce(function(s,i){return s+i.total;},0);\n  var paid = invs.filter(function(i){return i.status==='paid';}).reduce(function(s,i){return s+i.total;},0);\n  var outstanding = invs.filter(function(i){return i.status!=='paid';}).reduce(function(s,i){return s+i.total;},0);\n  var oc = invs.filter(invIsOverdue).length;\n  el.innerHTML =\n    '<div class=\"kpi-card\"><div class=\"kpi-label\">Total Invoiced<\u002Fdiv><di
