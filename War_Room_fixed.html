0;\n    const circum=2*Math.PI*R;\n    cats.forEach(([cat,val],i)=>{\n      const frac=total?val\u002Ftotal:0;\n      const dash=frac*circum;\n      const gap=circum-dash;\n      const color=CAT_COLORS[i%CAT_COLORS.length];\n      const rot=-90+(offset*360);\n      html+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"18\"\n        stroke-dasharray=\"${dash.toFixed(2)} ${gap.toFixed(2)}\"\n        transform=\"rotate(${rot.toFixed(2)} ${cx} ${cy})\"\n        style=\"transition:stroke-dasharray .6s cubic-bezier(.34,1.2,.64,1)\"\u002F>`;\n      legendHtml+=`<div style=\"display:flex;align-items:center;gap:7px;padding:4px 0\">\n        <div class=\"chart-legend-dot\" style=\"background:${color}\"><\u002Fdiv>\n        <div style=\"flex:1;font-size:11px;font-weight:600;color:var(--text)\">${cat}<\u002Fdiv>\n        <div style=\"font-size:10px;font-family:'DM Mono',monospace;color:var(--text2)\">$${val.toLocaleString()}<\u002Fdiv>\n      <\u002Fdiv>`;\n      offset+=frac;\n    });\n    \u002F\u002F center hole\n    html+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"var(--surface)\"\u002F>`;\n    svg.innerHTML=html;\n    if(legend)legend.innerHTML=legendHtml;\n  } else if(svg){\n    svg.innerHTML=`<circle cx=\"70\" cy=\"70\" r=\"60\" fill=\"none\" stroke=\"var(--bg3)\" stroke-width=\"18\"\u002F>\n      <circle cx=\"70\" cy=\"70\" r=\"40\" fill=\"var(--surface)\"\u002F>`;\n    if(legend)legend.innerHTML='<div style=\"font-size:10px;color:var(--text3)\">No bills yet.<\u002Fdiv>';\n  }\n\n  \u002F\u002F ── HORIZONTAL BARS by business ──\n  const el=document.getElementById('billBizBarsChart');\n  if(!el)return;\n  const byB={};\n  unpaid.forEach(b=>{const k=b.bizId||'personal';if(!byB[k])byB[k]=0;byB[k]+=parseFloat(b.amount)||0;});\n  const bizArr=Object.entries(byB).sort((a,b)=>b[1]-a[1]);\n  const maxB=Math.max(...bizArr.map(x=>x[1]),1);\n  if(!bizArr.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3)\">No bill data.<\u002Fdiv>';return;}\n  el.innerHTML=bizArr.map(([id,val],i)=>{\n    const biz=id==='personal'?null:bizById(parseInt(id));\n    const color=biz?bizColor(parseInt(id)):CAT_COLORS[i%CAT_COLORS.length];\n    const pct=Math.round((val\u002FmaxB)*100);\n    return`<div class=\"bar-h-row\">\n      <div class=\"bar-h-label\">${biz?biz.name:'Personal'}<\u002Fdiv>\n      <div class=\"bar-h-track\"><div class=\"bar-h-fill\" style=\"width:${pct}%;background:${color}\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"bar-h-val\">$${val.toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction getFilteredBills(){\n  const bizF=document.getElementById('billsBizFilter')?.value||'all';\n  let bills=S.bills||[];\n  if(bizF!=='all')bills=bills.filter(b=>String(b.bizId)===bizF);\n  return bills;\n}\n\nfunction renderBillSummary(){\n  const bills=S.bills||[];\n  const now=new Date();\n  const ym=now.toISOString().slice(0,7);\n  const totalDue=bills.filter(b=>b.status!=='paid').reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  const totalPaid=bills.filter(b=>b.status==='paid').reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  const overdue=bills.filter(b=>billStatusLabel(b)==='overdue').length;\n  const thisMonth=bills.filter(b=>b.dueDate&&b.dueDate.startsWith(ym)&&b.status!=='paid').reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  const el=document.getElementById('billSummaryStrip');\n  if(!el)return;\n  el.innerHTML=[\n    {lbl:'Due This Month',val:'$'+thisMonth.toLocaleString(),cls:'neg'},\n    {lbl:'Total Outstanding',val:'$'+totalDue.toLocaleString(),sub:'Unpaid'},\n    {lbl:'Paid Bills',val:'$'+totalPaid.toLocaleString(),cls:'pos'},\n    {lbl:'Overdue',val:overdue,cls:overdue?'neg':'',sub:overdue?'Needs attention':'All clear'},\n  ].map(k=>`<div class=\"card card-sm\"><div class=\"cl\">${k.lbl}<\u002Fdiv><div class=\"cv ${k.cls||''}\">${k.val}<\u002Fdiv><div class=\"cs\">${k.sub||''}<\u002Fdiv><\u002Fdiv>`).join('');\n}\n\nfunction renderBillAlerts(){\n  const el=document.getElementById('billAlertStrip');if(!el)return;\n  const soon=(S.bills||[]).filter(b=>{const d=getDueDays(b.dueDate);return d!==null&&d>=0&&d<=7&&b.status!=='paid'&&b.status!=='autopay';});\n  const overdue=(S.bills||[]).filter(b=>billStatusLabel(b)==='overdue');\n  let html='';\n  if(overdue.length)html+=`<div style=\"background:var(--red-bg);border:.5px solid var(--red);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px\"><div style=\"font-size:12px;font-weight:700;color:var(--red)\">⚠ ${overdue.length} bill${overdue.length>1?'s':''} overdue<\u002Fdiv><div style=\"font-size:11px;color:var(--red);opacity:.8\">${overdue.map(b=>b.name).join(', ')}<\u002Fdiv><\u002Fdiv>`;\n  if(soon.length)html+=`<div style=\"background:var(--amber-bg);border:.5px solid var(--amber);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px\"><div style=\"font-size:12px;font-weight:700;color:var(--amber)\">⏰ ${soon.length} bill${soon.length>1?'s':''} due within 7 days<\u002Fdiv><div style=\"font-size:11px;color:var(--amber);opacity:.8\">${soon.map(b=>b.name+' ($'+b.amount+')').join(', ')}<\u002Fdiv><\u002Fdiv>`;\n  el.innerHTML=html;\n}\n\nfunction renderBillsMainList(){\n  const el=document.getElementById('billsMainList');if(!el)return;\n  let bills=getFilteredBills();\n  const tab=currentBillTab;\n  if(tab==='upcoming')bills=bills.filter(b=>{const d=getDueDays(b.dueDate);return d!==null&&d>=0&&b.status!=='paid';});\n  else if(tab==='overdue')bills=bills.filter(b=>billStatusLabel(b)==='overdue');\n  else if(tab==='paid')bills=bills.filter(b=>b.status==='paid');\n  else if(tab==='recurring')bills=bills.filter(b=>b.recur&&b.recur!=='none');\n  bills=bills.slice().sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));\n  const cnt=document.getElementById('billTabCount');\n  if(cnt)cnt.textContent=bills.length+' bill'+(bills.length!==1?'s':'');\n  if(!bills.length){el.innerHTML='<div class=\"empty-state\"><div class=\"empty-state-icon\">◫<\u002Fdiv><div class=\"empty-state-text\">No bills here.<br>Add your first bill above.<\u002Fdiv><\u002Fdiv>';return;}\n  const CAT_ICONS={Subscription:'📱',Rent:'🏢',Utilities:'⚡',Insurance:'🛡️',Payroll:'👥',Marketing:'📣',Software:'💻',Services:'🤝',Loan:'🏦',Tax:'📋',Other:'💰'};\n  el.innerHTML='<div class=\"bill-card-grid\">'+bills.map(b=>{\n    const biz=bizById(b.bizId);const days=getDueDays(b.dueDate);\n    const sl=billStatusLabel(b);\n    const daysStr=days===null?'':days<0?Math.abs(days)+'d overdue':days===0?'Due today':days===1?'Due tomorrow':'In '+days+'d';\n    const statusCls={paid:'bill-status-paid',upcoming:'bill-status-upcoming',overdue:'bill-status-overdue',autopay:'bill-status-autopay','due-soon':'bill-status-overdue'}[sl]||'bill-status-upcoming';\n    const color=biz?bizColor(b.bizId):(sl==='overdue'?'var(--red)':sl==='due-soon'?'var(--amber)':'var(--text3)');\n    const urgentBg=sl==='overdue'?'background:var(--red-bg)':sl==='due-soon'?'background:var(--amber-bg)':'';\n    return`<div class=\"bill-mini-card\" style=\"${urgentBg}\" onclick=\"openBillDetail(${b.id})\">\n      <div class=\"bill-mini-card-accent\" style=\"background:${color}\"><\u002Fdiv>\n      <div class=\"bill-mini-status\"><span class=\"badge ${statusCls}\">${sl==='due-soon'?'soon':sl}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:22px;margin-bottom:6px;margin-top:4px\">${CAT_ICONS[b.cat||'Other']||'💰'}<\u002Fdiv>\n      <div class=\"bill-mini-name\">${b.name}<\u002Fdiv>\n      <div class=\"bill-mini-amount\">$${parseFloat(b.amount||0).toLocaleString()}<\u002Fdiv>\n      <div class=\"bill-mini-meta\">${b.dueDate||'No date'}${daysStr?' · '+daysStr:''}${b.recur&&b.recur!=='none'?' · ↻ '+repeatLabel(b.recur):''}${biz?' · '+biz.name:''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')+'<\u002Fdiv>';\n}\n\nfunction openBillDetail(id){\n  const b=(S.bills||[]).find(x=>x.id===id);if(!b)return;\n  const biz=bizById(b.bizId);const days=getDueDays(b.dueDate);\n  const sl=billStatusLabel(b);\n  const color=biz?bizColor(b.bizId):'var(--red)';\n  const daysStr=days===null?'':days<0?Math.abs(days)+'d overdue':days===0?'Due today':days===1?'Due tomorrow':'In '+days+'d';\n  const overlay=document.getElementById('eventDetailOverlay');\n  overlay.querySelector('.event-popup-card').style.setProperty('--ep-color',color);\n  document.getElementById('eventPopupAccent').style.background=color;\n  document.getElementById('eventPopupHeroBg').style.background=color;\n  document.getElementById('eventPopupEyebrowDot').style.background=color;\n  document.getElementById('eventPopupType').style.color=color;\n  document.getElementById('eventPopupType').textContent=(b.cat||'Bill')+' · '+(b.recur&&b.recur!=='none'?repeatLabel(b.recur)+' recurring':'One-time');\n  document.getElementById('eventPopupTitle').textContent=b.name;\n  const metaItems=[];\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">💰<\u002Fdiv><div><div class=\"event-popup-meta-label\">Amount<\u002Fdiv><div class=\"event-popup-meta-value\" style=\"color:var(--red)\">$${parseFloat(b.amount||0).toLocaleString()}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">📅<\u002Fdiv><div><div class=\"event-popup-meta-label\">Due Date<\u002Fdiv><div class=\"event-popup-meta-value\">${b.dueDate||'No date'}<\u002Fdiv>${daysStr?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">${daysStr}<\u002Fdiv>`:''}<\u002Fdiv><\u002Fdiv>`);\n  if(biz) metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\" style=\"background:${color}22\">◉<\u002Fdiv><div><div class=\"event-popup-meta-label\">Business<\u002Fdiv><div class=\"event-popup-meta-value\" style=\"color:${color}\">${biz.name}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">◈<\u002Fdiv><div><div class=\"event-popup-meta-label\">Status<\u002Fdiv><div class=\"event-popup-meta-value\">${sl.toUpperCase()}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  document.getElementById('eventPopupMetaGrid').innerHTML=metaItems.join('');\n  const nb=document.getElementById('eventPopupNotesBlock');\n  const nt=document.getElementById('eventPopupNotesText');\n  if(b.notes&&nb&&nt){nb.style.display='';nt.textContent=b.notes;}else if(nb){nb.style.display='none';}\n  document.getElementById('eventPopupEditBtn').onclick=()=>{closeEventPopup();openEditBillModal(id);};\n  document.getElementById('eventPopupDeleteBtn').onclick=()=>{if(confirm('Delete this bill?')){deleteBill(id);closeEventPopup();}};\n  const footer=document.querySelector('#eventDetailOverlay .event-popup-footer');\n  const existPaid=document.getElementById('billDetailPaidBtn');if(existPaid)existPaid.remove();\n  if(b.status!=='paid'){\n    const paidBtn=document.createElement('button');\n    paidBtn.id='billDetailPaidBtn';paidBtn.className='btn btn-p btn-sm';\n    paidBtn.textContent='✓ Mark Paid';paidBtn.style.background='var(--green)';paidBtn.style.borderColor='var(--green)';\n    paidBtn.onclick=()=>{markBillPaid(id);closeEventPopup();};\n    footer.insertBefore(paidBtn,footer.firstChild);\n  }\n  overlay.style.display='flex';\n}\n\nfunction renderBillMonthView(){\n  const el=document.getElementById('billMonthView');if(!el)return;\n  const now=new Date();\n  const ym=now.toISOString().slice(0,7);\n  const monthBills=(S.bills||[]).filter(b=>b.dueDate&&b.dueDate.startsWith(ym)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));\n  const total=monthBills.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  const totalEl=document.getElementById('billMonthTotal');if(totalEl)totalEl.textContent='$'+total.toLocaleString();\n  if(!monthBills.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3);font-family:DM Mono,monospace\">No bills due this month.<\u002Fdiv>';return;}\n  el.innerHTML=monthBills.map(b=>{\n    const sl=billStatusLabel(b);const days=getDueDays(b.dueDate);\n    const statusCls={paid:'b-green',upcoming:'b-amber',overdue:'b-red',autopay:'b-blue','due-soon':'b-red'}[sl]||'b-amber';\n    const biz=bizById(b.bizId);\n    return`<div class=\"bill-row\">\n      <div class=\"bill-icon\" style=\"background:${biz?bizColor(b.bizId)+'22':'var(--bg2)'}\">\n        ${b.cat==='Subscription'?'📱':b.cat==='Rent'?'🏢':b.cat==='Utilities'?'⚡':b.cat==='Insurance'?'🛡️':b.cat==='Software'?'💻':'💰'}\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--text)\">${b.name}<\u002Fdiv>\n        <div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace\">${b.dueDate}${biz?' · '+biz.name:''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;flex-shrink:0\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--red)\">$${parseFloat(b.amount||0).toLocaleString()}<\u002Fdiv>\n        <span class=\"badge ${statusCls}\" style=\"font-size:8px\">${sl}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n\u002F\u002F renderBillBizBreakdown merged into renderBillCharts\n\nfunction saveBill(){\n  const name=document.getElementById('billName').value.trim();if(!name)return;\n  const amount=parseFloat(document.getElementById('billAmount').value)||0;\n  const bizId=parseInt(document.getElementById('billBiz').value)||null;\n  const dueDate=document.getElementById('billDueDate').value||'';\n  const recur=document.getElementById('billRecur').value||'none';\n  const addCal=document.getElementById('billAddCal').value==='yes';\n  const bill={\n    id:S.nextId++,name,amount,bizId,\n    cat:document.getElementById('billCat').value,\n    lifeCat:document.getElementById('billLifeCat')?.value||'',\n    dueDate,status:document.getElementById('billStatus').value,\n    recur,notes:document.getElementById('billNotes').value.trim(),\n    addCal\n  };\n  if(!S.bills)S.bills=[];\n  S.bills.push(bill);\n  \u002F\u002F auto-generate recurring bill dates as calendar events\n  if(addCal&&dueDate){\n    addBillToCalendar(bill);\n  }\n  \u002F\u002F auto-log as P&L expense entry (opt-in via billAutoLog)\n  const autoLog=document.getElementById('billAutoLog');\n  if(autoLog&&autoLog.value==='yes'&&amount>0&&dueDate){\n    const ym=dueDate.slice(0,7);\n    S.entries.push({id:S.nextId++,bizId,date:ym,day:dueDate,desc:name+' (Bill)',cat:bill.cat,rev:0,exp:amount});\n  }\n  save();closeModal('billModal');renderBills();renderDashboard();\n  ['billName','billAmount','billDueDate','billNotes'].forEach(id=>document.getElementById(id).value='');\n}\n\nfunction addBillToCalendar(bill){\n  const baseDate=bill.dueDate;\n  const bv=bill.bizId;\n  const ev={id:S.nextId++,title:'💰 '+bill.name+' ($'+bill.amount+')',date:baseDate,time:'',type:'revenue',bizId:bv,notes:'Bill payment: '+bill.name,repeat:bill.recur==='none'?'none':bill.recur,repeatEnd:'',billId:bill.id};\n  S.events.push(ev);\n  if(bill.recur!=='none') generateRepeatEvents(ev);\n}\n\nfunction markBillPaid(id){\n  const b=(S.bills||[]).find(x=>x.id===id);if(!b)return;\n  b.status='paid';\n  save();closeModal('editBillModal');renderBills();updateBadges();\n}\n\nfunction deleteBill(id){\n  S.bills=(S.bills||[]).filter(b=>b.id!==id);\n  \u002F\u002F remove linked calendar events\n  S.events=S.events.filter(e=>e.billId!==id);\n  save();renderBills();updateBadges();\n}\n\nfunction openEditBillModal(id){\n  editingBillId=id;\n  const b=(S.bills||[]).find(x=>x.id===id);if(!b)return;\n  refreshSelects();\n  document.getElementById('editBillName').value=b.name;\n  document.getElementById('editBillAmount').value=b.amount;\n  document.getElementById('editBillBiz').value=b.bizId||'';\n  document.getElementById('editBillCat').value=b.cat||'Other';\n  document.getElementById('editBillDueDate').value=b.dueDate||'';\n  document.getElementById('editBillStatus').value=b.status||'upcoming';\n  document.getElementById('editBillRecur').value=b.recur||'none';\n  document.getElementById('editBillAddCal').value=b.addCal?'yes':'no';\n  document.getElementById('editBillNotes').value=b.notes||'';\n  openModal('editBillModal');\n}\n\nfunction saveEditBill(){\n  const b=(S.bills||[]).find(x=>x.id===editingBillId);if(!b)return;\n  b.name=document.getElementById('editBillName').value.trim()||b.name;\n  b.amount=parseFloat(document.getElementById('editBillAmount').value)||b.amount;\n  b.bizId=parseInt(document.getElementById('editBillBiz').value)||null;\n  b.cat=document.getElementById('editBillCat').value;\n  b.dueDate=document.getElementById('editBillDueDate').value||b.dueDate;\n  b.status=document.getElementById('editBillStatus').value;\n  b.recur=document.getElementById('editBillRecur').value;\n  b.addCal=document.getElementById('editBillAddCal').value==='yes';\n  b.notes=document.getElementById('editBillNotes').value.trim();\n  save();closeModal('editBillModal');renderBills();renderDashboard();\n}\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F THEME SYSTEM\n\u002F\u002F ══════════════════════════════════════════\n\nconst THEMES = {\n  stratus: {\n    name:'Stratus',\n    light:{bg:'#f4f4f2',bg2:'#ececea',bg3:'#e2e2e0',surface:'#ffffff',border:'rgba(0,0,0,.07)',border2:'rgba(0,0,0,.13)',text:'#0e0e0d',text2:'#525250',text3:'#9a9a98',accent:'#0e0e0d','accent-fg':'#f4f4f2'},\n    dark:{bg:'#0f0f0e',bg2:'#181817',bg3:'#202020',surface:'#1c1c1b',border:'rgba(255,255,255,.06)',border2:'rgba(255,255,255,.12)',text:'#f0f0ee',text2:'#9a9a98',text3:'#525250',accent:'#f0f0ee','accent-fg':'#0f0f0e'},\n    preview:['#0e0e0d','#f4f4f2','#ececea','#9a9a98']\n  },\n  midnight: {\n    name:'Midnight',\n    light:{bg:'#f0f2f8',bg2:'#e4e8f4',bg3:'#d6dcee',surface:'#ffffff',border:'rgba(30,50,120,.08)',border2:'rgba(30,50,120,.15)',text:'#0d1b4b',text2:'#3a4d80',text3:'#8896c0',accent:'#1e3a8a','accent-fg':'#ffffff'},\n    dark:{bg:'#08091a',bg2:'#0d1029',bg3:'#131630',surface:'#111230',border:'rgba(100,130,255,.08)',border2:'rgba(100,130,255,.16)',text:'#e8ecff',text2:'#8896c0',text3:'#3a4d80',accent:'#4a6cf7','accent-fg':'#ffffff'},\n    preview:['#1e3a8a','#0d1b4b','#f0f2f8','#8896c0']\n  },\n  forest: {\n    name:'Forest',\n    light:{bg:'#f2f6f0',bg2:'#e6ede3',bg3:'#d8e5d3',surface:'#ffffff',border:'rgba(30,80,40,.07)',border2:'rgba(30,80,40,.13)',text:'#0d2b12',text2:'#2d5a35',text3:'#7aad82',accent:'#1a5c28','accent-fg':'#ffffff'},\n    dark:{bg:'#080f09',bg2:'#0e180f',bg3:'#142016',surface:'#101a11',border:'rgba(80,180,80,.06)',border2:'rgba(80,180,80,.13)',text:'#e0f0e2',text2:'#7aad82',text3:'#2d5a35',accent:'#4caf60','accent-fg':'#080f09'},\n    preview:['#1a5c28','#0d2b12','#f2f6f0','#7aad82']\n  },\n  ember: {\n    name:'Ember',\n    light:{bg:'#faf5f0',bg2:'#f2e8dc',bg3:'#e8d8c5',surface:'#ffffff',border:'rgba(120,60,0,.07)',border2:'rgba(120,60,0,.13)',text:'#2d1500',text2:'#7a4010',text3:'#c08050',accent:'#c04a00','accent-fg':'#ffffff'},\n    dark:{bg:'#110800',bg2:'#1e0f00',bg3:'#2a1600',surface:'#1a0d00',border:'rgba(255,140,60,.07)',border2:'rgba(255,140,60,.14)',text:'#ffe8d0',text2:'#c08050',text3:'#7a4010',accent:'#f07030','accent-fg':'#110800'},\n    preview:['#c04a00','#2d1500','#faf5f0','#c08050']\n  },\n  obsidian: {\n    name:'Obsidian',\n    light:{bg:'#f5f5f5',bg2:'#ebebeb',bg3:'#e0e0e0',surface:'#ffffff',border:'rgba(0,0,0,.07)',border2:'rgba(0,0,0,.12)',text:'#1a1a1a',text2:'#4a4a4a',text3:'#909090',accent:'#2a2a2a','accent-fg':'#ffffff'},\n    dark:{bg:'#000000',bg2:'#0d0d0d',bg3:'#1a1a1a',surface:'#111111',border:'rgba(255,255,255,.05)',border2:'rgba(255,255,255,.10)',text:'#f5f5f5',text2:'#909090',text3:'#4a4a4a',accent:'#ffffff','accent-fg':'#000000'},\n    preview:['#1a1a1a','#000000','#f5f5f5','#909090']\n  },\n  aurora: {\n    name:'Aurora',\n    light:{bg:'#f4f0fa',bg2:'#ebe4f5',bg3:'#ddd5ee',surface:'#ffffff',border:'rgba(80,20,120,.07)',border2:'rgba(80,20,120,.13)',text:'#1a0a30',text2:'#5a3a80',text3:'#9a80c0',accent:'#6020b0','accent-fg':'#ffffff'},\n    dark:{bg:'#0a0514',bg2:'#120a1e',bg3:'#1a1030',surface:'#110820',border:'rgba(160,100,255,.07)',border2:'rgba(160,100,255,.14)',text:'#ece0ff',text2:'#9a80c0',text3:'#5a3a80',accent:'#9060e0','accent-fg':'#0a0514'},\n    preview:['#6020b0','#1a0a30','#f4f0fa','#9a80c0']\n  },\n  slate: {\n    name:'Slate',\n    light:{bg:'#f0f4f8',bg2:'#e2eaf2',bg3:'#d2dce8',surface:'#ffffff',border:'rgba(40,70,100,.07)',border2:'rgba(40,70,100,.13)',text:'#0f2030',text2:'#3a5570',text3:'#7a9ab0',accent:'#1e4060','accent-fg':'#ffffff'},\n    dark:{bg:'#090e14',bg2:'#101820',bg3:'#182230',surface:'#111c28',border:'rgba(100,160,220,.06)',border2:'rgba(100,160,220,.13)',text:'#ddeeff',text2:'#7a9ab0',text3:'#3a5570',accent:'#4a90c0','accent-fg':'#090e14'},\n    preview:['#1e4060','#0f2030','#f0f4f8','#7a9ab0']\n  },\n  rose: {\n    name:'Rose',\n    light:{bg:'#fdf2f4',bg2:'#fae5ea',bg3:'#f5d4db',surface:'#ffffff',border:'rgba(140,30,60,.07)',border2:'rgba(140,30,60,.13)',text:'#2d0a12',text2:'#8a3050',text3:'#c07090',accent:'#b02040','accent-fg':'#ffffff'},\n    dark:{bg:'#120508',bg2:'#1e0910',bg3:'#2a1018',surface:'#1a0810',border:'rgba(255,100,140,.07)',border2:'rgba(255,100,140,.14)',text:'#ffe0e8',text2:'#c07090',text3:'#8a3050',accent:'#e0507a','accent-fg':'#120508'},\n    preview:['#b02040','#2d0a12','#fdf2f4','#c07090']\n  },\n};\n\nconst ACCENT_PRESETS = [\n  {color:'#0e0e0d',label:'Ink'},\n  {color:'#1e3a8a',label:'Navy'},\n  {color:'#1a5c28',label:'Forest'},\n  {color:'#c04a00',label:'Ember'},\n  {color:'#6020b0',label:'Violet'},\n  {color:'#b02040',label:'Rose'},\n  {color:'#0e7490',label:'Teal'},\n  {color:'#92400e',label:'Amber'},\n  {color:'#1e4060',label:'Slate'},\n  {color:'#4a1d96',label:'Indigo'},\n  {color:'#065f46',label:'Emerald'},\n  {color:'#831843',label:'Pink'},\n];\n\nconst RADIUS_OPTS = [\n  {val:'0',label:'Sharp'},\n  {val:'6',label:'Soft'},\n  {val:'10',label:'Round'},\n  {val:'16',label:'Pill'},\n];\n\nconst FONT_OPTS = [\n  {val:'syne',label:'Syne',style:\"font-family:'Syne',sans-serif\"},\n  {val:'mono',label:'Mono',style:\"font-family:'DM Mono',monospace\"},\n  {val:'system',label:'System',style:\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif\"},\n  {val:'serif',label:'Serif',style:\"font-family:'Georgia',serif\"},\n];\n\nfunction renderThemePanel(){\n  const p = S.profile||{};\n  const activeTheme = p.theme||'stratus';\n  const activeAccent = p.accent||'';\n  const activeRadius = p.radius||'10';\n  const activeFont = p.font||'syne';\n\n  \u002F\u002F Swatches\n  const sg = document.getElementById('themeSwatchGrid');\n  if(sg) sg.innerHTML = Object.entries(THEMES).map(([key,t])=>{\n    const isDark = S.dark;\n    const colors = isDark ? t.dark : t.light;\n    return`<div class=\"theme-swatch ${activeTheme===key?'active':''}\" onclick=\"selectTheme('${key}')\" title=\"${t.name}\">\n      <div class=\"swatch-preview\" style=\"background:${colors.bg}\">\n        ${t.preview.map(col=>`<div class=\"swatch-bar\" style=\"background:${col};opacity:.85\"><\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n      <div class=\"swatch-name\">${t.name}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  \u002F\u002F Accent dots\n  const ag = document.getElementById('accentDotGrid');\n  if(ag) ag.innerHTML = ACCENT_PRESETS.map(a=>\n    `<div class=\"accent-dot ${activeAccent===a.color?'active':''}\" style=\"background:${a.color}\" onclick=\"selectAccent('${a.color}')\" title=\"${a.label}\"><\u002Fdiv>`\n  ).join('');\n\n  \u002F\u002F Radius\n  const rg = document.getElementById('radiusGrid');\n  if(rg) rg.innerHTML = RADIUS_OPTS.map(r=>\n    `<div class=\"radius-opt ${activeRadius===r.val?'active':''}\" onclick=\"selectRadius('${r.val}')\" style=\"border-radius:${r.val}px\">${r.label}<\u002Fdiv>`\n  ).join('');\n\n  \u002F\u002F Font\n  const fg = document.getElementById('fontGrid');\n  if(fg) fg.innerHTML = FONT_OPTS.map(f=>\n    `<div class=\"font-opt ${activeFont===f.val?'active':''}\" onclick=\"selectFont('${f.val}')\" style=\"${f.style}\">${f.label}<\u002Fdiv>`\n  ).join('');\n\n  \u002F\u002F Custom accent input\n  const cai = document.getElementById('customAccentInput');\n  if(cai && activeAccent) cai.value = activeAccent;\n}\n\nfunction selectTheme(key){\n  if(!S.profile) S.profile={};\n  S.profile.theme = key;\n  applyTheme();\n  renderThemePanel();\n}\n\nfunction selectAccent(color){\n  if(!S.profile) S.profile={};\n  S.profile.accent = color;\n  applyTheme();\n  renderThemePanel();\n}\n\nfunction applyCustomAccent(color){\n  if(!S.profile) S.profile={};\n  S.profile.accent = color;\n  applyTheme();\n  renderThemePanel();\n}\n\nfunction selectRadius(val){\n  if(!S.profile) S.profile={};\n  S.profile.radius = val;\n  applyTheme();\n  renderThemePanel();\n}\n\nfunction selectFont(val){\n  if(!S.profile) S.profile={};\n  S.profile.font = val;\n  applyTheme();\n  renderThemePanel();\n}\n\nfunction applyTheme(){\n  const p = S.profile||{};\n  const key = p.theme||'stratus';\n  const t = THEMES[key]||THEMES.stratus;\n  const isDark = S.dark;\n  const colors = isDark ? t.dark : t.light;\n  const root = document.documentElement;\n\n  \u002F\u002F Apply color scheme\n  Object.entries(colors).forEach(([k,v])=>root.style.setProperty('--'+k, v));\n\n  \u002F\u002F Override accent if custom\n  if(p.accent){\n    let accentColor = p.accent;\n    \u002F\u002F In dark mode, ensure accent colors are bright enough to be visible\n    if(isDark){\n      const hex = p.accent.replace('#','');\n      const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);\n      const lum = (0.299*r + 0.587*g + 0.114*b)\u002F255;\n      if(lum < 0.25){\n        \u002F\u002F Brighten dark accents for dark mode - boost each channel\n        const boost = Math.min(255, Math.round(r*1.8)), bg = Math.min(255, Math.round(g*1.8)), bb = Math.min(255, Math.round(b*1.8));\n        accentColor = '#'+boost.toString(16).padStart(2,'0')+bg.toString(16).padStart(2,'0')+bb.toString(16).padStart(2,'0');\n      }\n    }\n    root.style.setProperty('--accent', accentColor);\n    \u002F\u002F Determine accent-fg based on luminance\n    const hex2 = accentColor.replace('#','');\n    const r2=parseInt(hex2.substr(0,2),16),g2=parseInt(hex2.substr(2,2),16),b2=parseInt(hex2.substr(4,2),16);\n    const lum2 = (0.299*r2 + 0.587*g2 + 0.114*b2)\u002F255;\n    root.style.setProperty('--accent-fg', lum2>0.5?'#0e0e0d':'#ffffff');\n  }\n\n  \u002F\u002F Border radius\n  const radius = p.radius||'10';\n  root.style.setProperty('--r', radius+'px');\n  root.style.setProperty('--rs', Math.max(2,parseInt(radius)-4)+'px');\n\n  \u002F\u002F Font\n  const font = p.font||'syne';\n  const fontMap = {\n    syne:\"'Syne', sans-serif\",\n    mono:\"'DM Mono', monospace\",\n    system:\"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\",\n    serif:\"'Georgia', serif\",\n  };\n  document.body.style.fontFamily = fontMap[font]||fontMap.syne;\n}\n\nfunction saveTheme(btn){\n  save();\n  applyTheme();\n  \u002F\u002F Show confirmation\n  if(!btn) btn = event && event.target;\n  const orig = btn.textContent;\n  btn.textContent = '✓ Applied';\n  btn.style.background = 'var(--green)';\n  setTimeout(()=>{ btn.textContent=orig; btn.style.background=''; },1800);\n}\n\n\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F GOALS COMMAND CENTER — FULL SYSTEM\n\u002F\u002F ══════════════════════════════════════════\n\nlet goalFilter = 'all';\nlet editingGoalFullId = null;\n\n\u002F\u002F ── XP & LEVEL SYSTEM ──\nconst XP_LEVELS = [\n  {name:'Recruit',   min:0,    icon:'◌'},\n  {name:'Operative', min:200,  icon:'◎'},\n  {name:'Strategist',min:500,  icon:'◈'},\n  {name:'Commander', min:1000, icon:'⬡'},\n  {name:'War Room',  min:2000, icon:'⬟'},\n  {name:'Legend',    min:4000, icon:'★'},\n];\nconst ACHIEVEMENTS = [\n  {id:'first_goal',    icon:'🏁', label:'First Strike',      desc:'Complete your first goal'},\n  {id:'five_goals',    icon:'🔥', label:'On Fire',           desc:'Complete 5 goals'},\n  {id:'ten_goals',     icon:'⚡', label:'Momentum',          desc:'Complete 10 goals'},\n  {id:'twenty_five',   icon:'🏆', label:'War Room Elite',    desc:'Complete 25 goals'},\n  {id:'on_time',       icon:'⏱', label:'On Time',           desc:'Complete a goal before its deadline'},\n  {id:'high_priority', icon:'💎', label:'High Value',        desc:'Complete a High priority goal'},\n  {id:'milestone_5',   icon:'🎯', label:'Milestone Master',  desc:'Complete 5 milestones across any goals'},\n  {id:'speed_run',     icon:'🚀', label:'Speed Run',         desc:'Complete a goal within 7 days of creating it'},\n];\nconst XP_PER_GOAL = {High:150, Medium:100, Low:75};\nconst XP_PER_MILESTONE = 25;\nconst XP_EARLY_BONUS = 50;\n\nfunction getWarRoomLevel(xp){\n  let idx=0;\n  for(let i=0;i<XP_LEVELS.length;i++){if(xp>=XP_LEVELS[i].min)idx=i;}\n  const cur=XP_LEVELS[idx];\n  const next=XP_LEVELS[idx+1];\n  const pct=next?Math.min(100,Math.round(((xp-cur.min)\u002F(next.min-cur.min))*100)):100;\n  return{level:idx+1,name:cur.name,icon:cur.icon,pct,nextXp:next?next.min:null,xp};\n}\n\nfunction awardXP(amount){\n  if(typeof S.xp!=='number')S.xp=0;\n  const before=getWarRoomLevel(S.xp);\n  S.xp+=amount;\n  const after=getWarRoomLevel(S.xp);\n  if(after.level>before.level) setTimeout(()=>showLevelUpToast(after),1200);\n}\n\nfunction showLevelUpToast(lvl){\n  const t=document.createElement('div');\n  t.innerHTML=`${lvl.icon} Level Up! You are now a <strong>${lvl.name}<\u002Fstrong>`;\n  Object.assign(t.style,{position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'var(--accent)',color:'var(--accent-fg)',border:'none',borderRadius:'100px',padding:'10px 22px',fontSize:'11px',fontWeight:'800',zIndex:10001,fontFamily:'\\'Syne\\',sans-serif',letterSpacing:'.06em',whiteSpace:'nowrap',boxShadow:'0 4px 24px rgba(0,0,0,.2)',opacity:'0',transition:'opacity .3s'});\n  document.body.appendChild(t);\n  setTimeout(()=>t.style.opacity='1',20);\n  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},3500);\n}\n\nfunction checkAchievements(goal){\n  if(!Array.isArray(S.achievements))S.achievements=[];\n  const has=id=>S.achievements.includes(id);\n  const done=S.goals.filter(g=>g.done);\n  const newOnes=[];\n  const earn=id=>{if(!has(id)){S.achievements.push(id);newOnes.push(id);}};\n  if(done.length>=1)earn('first_goal');\n  if(done.length>=5)earn('five_goals');\n  if(done.length>=10)earn('ten_goals');\n  if(done.length>=25)earn('twenty_five');\n  if(goal.priority==='High')earn('high_priority');\n  if(goal.deadline&&new Date(goal.deadline+'T23:59:59')>=new Date())earn('on_time');\n  if(goal.createdAt){const age=(Date.now()-new Date(goal.createdAt).getTime())\u002F(1000*60*60*24);if(age<=7)earn('speed_run');}\n  const totalMs=(S.goals||[]).reduce((a,g)=>a+(g.milestones?g.milestones.filter(m=>m.done).length:0),0);\n  if(totalMs>=5)earn('milestone_5');\n  return newOnes;\n}\n\nfunction showGoalCelebration(goalText, xpEarned, newAchievements){\n  const el=document.getElementById('goalCelebration'); if(!el)return;\n  const lvl=getWarRoomLevel(S.xp);\n  \u002F\u002F Trophy varies by priority\u002Fxp\n  const trophy=xpEarned>=150?'🏆':xpEarned>=100?'🥇':'🎯';\n  const trophyEl=document.getElementById('celebTrophy'); if(trophyEl)trophyEl.textContent=trophy;\n  const textEl=document.getElementById('celebGoalText'); if(textEl)textEl.textContent=goalText;\n  const xpEl=document.getElementById('celebXpBadge'); if(xpEl)xpEl.textContent='+'+xpEarned+' XP';\n  const lvlEl=document.getElementById('celebLevelLine'); if(lvlEl)lvlEl.textContent=lvl.icon+' '+lvl.name+' · '+S.xp+' XP total'+(lvl.nextXp?' · '+(lvl.nextXp-S.xp)+' to next rank':'');\n  const achEl=document.getElementById('celebAchievements');\n  if(achEl){\n    achEl.innerHTML=newAchievements.map(id=>{\n      const a=ACHIEVEMENTS.find(x=>x.id===id);\n      return a?`<div class=\"goal-celeb-badge\">${a.icon} ${a.label}<\u002Fdiv>`:'';\n    }).join('');\n  }\n  \u002F\u002F Generate confetti\n  const confetti=document.getElementById('celebConfetti');\n  if(confetti){\n    const colors=['var(--accent)','var(--green)','var(--amber)','var(--blue)','#f0c040','#e07040'];\n    confetti.innerHTML=Array.from({length:30},(_,i)=>{\n      const color=colors[i%colors.length];\n      const tx=(Math.random()-0.5)*300;\n      const tx2=(Math.random()-0.5)*100;\n      const spin=Math.round(Math.random()*720-360);\n      const delay=(Math.random()*0.6).toFixed(2);\n      const dur=(1.8+Math.random()*1.2).toFixed(1);\n      const left=Math.round(Math.random()*100);\n      return`<div class=\"celeb-piece\" style=\"left:${left}%;background:${color};border-radius:${Math.random()>.5?'50%':'2px'};--tx:${tx.toFixed(0)}px;--tx2:${tx2.toFixed(0)}px;--spin:${spin};--delay:${delay}s;--dur:${dur}s;animation-delay:${delay}s\"><\u002Fdiv>`;\n    }).join('');\n  }\n  el.style.display='flex';\n  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.opacity='1';}));\n  if(el._autoClose)clearTimeout(el._autoClose);\n  el._autoClose=setTimeout(closeGoalCelebration,5000);\n}\n\nfunction closeGoalCelebration(){\n  const el=document.getElementById('goalCelebration'); if(!el)return;\n  el.style.opacity='0';\n  setTimeout(()=>{el.style.display='none';},400);\n}\n\nfunction renderGoalMomentum(){\n  const el=document.getElementById('goalMomentumCard'); if(!el)return;\n  const lvl=getWarRoomLevel(S.xp||0);\n  const done=S.goals.filter(g=>g.done);\n  const active=S.goals.filter(g=>!g.done);\n  \u002F\u002F Goals done this month\n  const now=new Date(); const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');\n  const thisMonth=(S.goalLog||[]).filter(l=>l.ts&&l.ts.includes&&l.msg&&l.msg.includes('complete')&&l.ts.slice&&l.ts.slice(0,7)===ym).length;\n  const rate=S.goals.length?Math.round((done.length\u002FS.goals.length)*100):0;\n  const achUnlocked=ACHIEVEMENTS.filter(a=>(S.achievements||[]).includes(a.id));\n  const nextXpNeeded=lvl.nextXp?lvl.nextXp-S.xp:0;\n\n  el.innerHTML=`<div class=\"goal-momentum-card\">\n    <div>\n      <div class=\"goal-level-badge\">${lvl.icon} ${lvl.name} &nbsp;·&nbsp; Lv ${lvl.level}<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:800;color:var(--text);letter-spacing:-.01em\">${(S.xp||0).toLocaleString()} XP<\u002Fdiv>\n      <div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">${lvl.nextXp?nextXpNeeded+' XP to '+XP_LEVELS[lvl.level]?.name:'Max rank reached'}<\u002Fdiv>\n      <div class=\"goal-xp-track\"><div class=\"goal-xp-fill\" style=\"width:${lvl.pct}%\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;justify-content:center\">\n      <div class=\"goal-momentum-stat\">\n        <div class=\"goal-momentum-stat-val\">${done.length}<\u002Fdiv>\n        <div class=\"goal-momentum-stat-lbl\">Completed<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"goal-momentum-stat\">\n        <div class=\"goal-momentum-stat-val\">${active.length}<\u002Fdiv>\n        <div class=\"goal-momentum-stat-lbl\">Active<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"goal-momentum-stat\">\n        <div class=\"goal-momentum-stat-val\">${rate}%<\u002Fdiv>\n        <div class=\"goal-momentum-stat-lbl\">Win Rate<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Achievements ${achUnlocked.length}\u002F${ACHIEVEMENTS.length}<\u002Fdiv>\n      <div class=\"goal-achiev-grid\">\n        ${ACHIEVEMENTS.map(a=>{\n          const earned=(S.achievements||[]).includes(a.id);\n          return`<div class=\"goal-achiev-pip ${earned?'unlocked':'locked'}\" title=\"${a.label}: ${a.desc}\">${a.icon}<\u002Fdiv>`;\n        }).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nconst GOAL_TYPE_COLORS = {\n  Revenue: '#256b47', Strategy: '#1a4a8a', Growth: '#6020b0',\n  Planning: '#7a4e00', Operations: '#525250', Default: '#525250'\n};\n\nfunction goalTypeColor(type) {\n  return GOAL_TYPE_COLORS[type] || GOAL_TYPE_COLORS.Default;\n}\n\nfunction goalDeadlineStatus(deadline) {\n  if (!deadline) return { cls: 'goal-deadline-none', label: 'No deadline' };\n  const d = new Date(deadline + 'T00:00:00');\n  const now = new Date(); now.setHours(0,0,0,0);\n  const days = Math.round((d - now) \u002F 86400000);\n  if (days < 0) return { cls: 'goal-deadline-late', label: 'Overdue ' + Math.abs(days) + 'd' };\n  if (days === 0) return { cls: 'goal-deadline-warn', label: 'Due Today' };\n  if (days <= 7) return { cls: 'goal-deadline-warn', label: days + 'd left' };\n  if (days <= 30) return { cls: 'goal-deadline-ok', label: days + 'd left' };\n  return { cls: 'goal-deadline-ok', label: Math.ceil(days\u002F7) + 'w left' };\n}\n\nfunction goalPct(g) {\n  if (g.done) return 100;\n  if (g.target && g.target > 0) {\n    return Math.min(100, Math.round(((g.progress || 0) \u002F g.target) * 100));\n  }\n  \u002F\u002F milestone-based\n  if (g.milestones && g.milestones.length) {\n    const done = g.milestones.filter(m => m.done).length;\n    return Math.round((done \u002F g.milestones.length) * 100);\n  }\n  return g.done ? 100 : 0;\n}\n\nfunction setGoalFilter(f, el) {\n  goalFilter = f;\n  document.querySelectorAll('#goalFilterBar .goal-filter-chip').forEach(c => c.classList.remove('active'));\n  if (el) el.classList.add('active');\n  renderGoalsPage();\n}\n\nfunction openGoalModal() {\n  refreshSelects();\n  ['goalText','goalDesc','goalUnit','goalMilestones'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });\n  ['goalTarget'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });\n  const sd=document.getElementById('goalStartDate'); if(sd) sd.value=new Date().toISOString().slice(0,10);\n  const dd=document.getElementById('goalDeadline'); if(dd) dd.value='';\n  const gt=document.getElementById('goalType'); if(gt) gt.value='Strategy';\n  const gp=document.getElementById('goalPriority'); if(gp) gp.value='Medium';\n  openModal('goalModal');\n}\n\nfunction saveGoal() {\n  const text = document.getElementById('goalText').value.trim();\n  if (!text) return;\n  const milestonesRaw = document.getElementById('goalMilestones')?.value || '';\n  const milestones = milestonesRaw.split('\\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>({id:i+1,text:s,done:false}));\n  \n  const goal = {\n    id: S.nextId++,\n    text,\n    desc: document.getElementById('goalDesc')?.value.trim() || '',\n    bizId: parseInt(document.getElementById('goalBiz').value) || null,\n    type: document.getElementById('goalType').value,\n    priority: document.getElementById('goalPriority')?.value || 'Medium',\n    target: parseFloat(document.getElementById('goalTarget')?.value) || 0,\n    unit: document.getElementById('goalUnit')?.value.trim() || '',\n    progress: 0,\n    startDate: document.getElementById('goalStartDate')?.value || '',\n    deadline: document.getElementById('goalDeadline')?.value || '',\n    milestones,\n    log: [],\n    done: false,\n    createdAt: new Date().toISOString()\n  };\n  \n  S.goals.push(goal);\n  logGoalActivity(goal.id, '🎯 Goal created: ' + text);\n  save();\n  closeModal('goalModal');\n  renderGoals();\n  renderGoalsPage();\n  updateBadges();\n}\n\n\u002F\u002F Override old saveGoal to new one already done above\n\nfunction updateEditGoalPreview() {\n  const prog = parseFloat(document.getElementById('editGoalProgress').value) || 0;\n  const target = parseFloat(document.getElementById('editGoalTarget').value) || 0;\n  const unit = document.getElementById('editGoalUnit').value.trim();\n  const pct = target > 0 ? Math.min(100, Math.round((prog \u002F target) * 100)) : (prog > 0 ? 100 : 0);\n  const bar = document.getElementById('editGoalPctBar');\n  const label = document.getElementById('editGoalPctLabel');\n  const sub = document.getElementById('editGoalPctSub');\n  if(bar) bar.style.width = pct + '%';\n  if(label) { label.textContent = pct + '%'; label.style.color = pct >= 100 ? 'var(--green)' : 'var(--text)'; }\n  if(sub && target > 0) sub.textContent = prog.toLocaleString() + ' \u002F ' + target.toLocaleString() + (unit ? ' ' + unit : '');\n  else if(sub) sub.textContent = target > 0 ? '' : 'Set a target value to track completion';\n}\n\nfunction updateLogProgressPreview() {\n  const id = parseInt(document.getElementById('logGoalId').value);\n  const g = S.goals.find(x => x.id === id);\n  if (!g) return;\n  const newVal = parseFloat(document.getElementById('logProgressVal').value) || 0;\n  const target = g.target || 0;\n  const unit = g.unit || '';\n  const pct = target > 0 ? Math.min(100, Math.round((newVal \u002F target) * 100)) : (newVal > 0 ? 100 : 0);\n  const bar = document.getElementById('logProgressBar');\n  const pctEl = document.getElementById('logProgressPct');\n  const valsEl = document.getElementById('logProgressVals');\n  if(bar){ bar.style.width = pct + '%'; bar.style.background = pct >= 100 ? 'var(--green)' : 'var(--accent)'; }\n  if(pctEl){ pctEl.textContent = pct + '%'; pctEl.style.color = pct >= 100 ? 'var(--green)' : 'var(--accent)'; }\n  if(valsEl && target > 0) valsEl.textContent = newVal.toLocaleString() + ' \u002F ' + target.toLocaleString() + (unit ? ' ' + unit : '');\n}\n\nfunction openEditGoalFull(id) {\n  id = parseInt(id);\n  editingGoalFullId = id;\n  const g = S.goals.find(x => x.id === id);\n  if (!g) return;\n  \u002F\u002F Populate biz dropdown first\n  const eb = document.getElementById('editGoalBiz');\n  if(eb) {\n    eb.innerHTML = '<option value=\"\">None \u002F Personal<\u002Foption>' +\n      (S.businesses||[]).map(b => '<option value=\"'+b.id+'\">' + b.name + '<\u002Foption>').join('');\n    eb.value = g.bizId || '';\n  }\n  document.getElementById('editGoalText').value = g.text || '';\n  document.getElementById('editGoalDesc').value = g.desc || '';\n  document.getElementById('editGoalTarget').value = g.target || '';\n  document.getElementById('editGoalProgress').value = g.progress || 0;\n  document.getElementById('editGoalUnit').value = g.unit || '';\n  document.getElementById('editGoalStartDate').value = g.startDate || '';\n  document.getElementById('editGoalDeadline').value = g.deadline || '';\n  document.getElementById('editGoalPriority').value = g.priority || 'Medium';\n  document.getElementById('editGoalType').value = g.type || 'Strategy';\n  openModal('goalEditModal');\n  setTimeout(updateEditGoalPreview, 50);\n}\n\nfunction saveEditGoalFull() {\n  const g = S.goals.find(x => x.id === parseInt(editingGoalFullId));\n  if (!g) return;\n  const oldProg = g.progress || 0;\n  g.text = document.getElementById('editGoalText').value.trim() || g.text;\n  g.desc = document.getElementById('editGoalDesc')?.value.trim() || '';\n  g.bizId = parseInt(document.getElementById('editGoalBiz').value) || null;\n  g.type = document.getElementById('editGoalType').value;\n  g.priority = document.getElementById('editGoalPriority').value;\n  g.target = parseFloat(document.getElementById('editGoalTarget').value) || 0;\n  g.progress = parseFloat(document.getElementById('editGoalProgress').value) || 0;\n  g.unit = document.getElementById('editGoalUnit').value.trim();\n  g.startDate = document.getElementById('editGoalStartDate').value;\n  g.deadline = document.getElementById('editGoalDeadline').value;\n  if (g.progress !== oldProg) {\n    logGoalActivity(g.id, '📈 Progress updated: ' + oldProg + ' → ' + g.progress + (g.unit?' '+g.unit:''));\n  }\n  if (g.target > 0 && g.progress >= g.target && !g.done) {\n    g.done = true;\n    logGoalActivity(g.id, '✅ Goal completed!');\n  }\n  save();\n  closeModal('goalEditModal');\n  renderGoals();\n  renderGoalsPage();\n  updateBadges();\n}\n\nfunction deleteGoalFromEdit() {\n  _dangerConfirm('Delete this goal? This cannot be undone.', function(){\n    S.goals = S.goals.filter(g => g.id !== editingGoalFullId);\n    save(); closeModal('goalEditModal'); renderGoals(); renderGoalsPage(); updateBadges();\n  });\n}\n\nfunction openLogProgress(id) {\n  id = parseInt(id);\n  document.getElementById('logGoalId').value = id;\n  const g = S.goals.find(x => x.id === id);\n  if(!g) return;\n  \u002F\u002F Populate context header\n  const nameEl = document.getElementById('logGoalName');\n  if(nameEl) nameEl.textContent = g.text;\n  document.getElementById('logProgressVal').value = g.progress || 0;\n  document.getElementById('logProgressNote').value = '';\n  closeModal('goalDetailModal');\n  openModal('goalLogModal');\n  setTimeout(updateLogProgressPreview, 50);\n}\n\nfunction saveProgressLog() {\n  const id = parseInt(document.getElementById('logGoalId').value);\n  const g = S.goals.find(x => x.id === id);\n  if (!g) return;\n  const newVal = parseFloat(document.getElementById('logProgressVal').value) || 0;\n  const note = document.getElementById('logProgressNote').value.trim();\n  const oldProg = g.progress || 0;\n  g.progress = newVal;\n  const msg = '📈 ' + oldProg + ' → ' + newVal + (g.unit ? ' ' + g.unit : '') + (note ? ' — ' + note : '');\n  logGoalActivity(id, msg);\n  if (g.target > 0 && g.progress >= g.target && !g.done) {\n    g.done = true; logGoalActivity(id, '✅ Target reached! Goal marked complete.');\n  }\n  save(); closeModal('goalLogModal'); renderGoals(); renderGoalsPage();\n}\n\nfunction logGoalActivity(goalId, msg) {\n  if (!S.goalLog) S.goalLog = [];\n  S.goalLog.unshift({ goalId, msg, ts: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) });\n  if (S.goalLog.length > 80) S.goalLog = S.goalLog.slice(0,80);\n}\n\nfunction clearGoalLog() {\n  _dangerConfirm('Clear activity log?', function(){\n    S.goalLog = []; save(); renderGoalsPage();\n  });\n}\n\nfunction toggleMilestone(goalId, msId) {\n  goalId = parseInt(goalId); msId = parseInt(msId);\n  const g = S.goals.find(x => x.id === goalId);\n  if (!g || !g.milestones) return;\n  const ms = g.milestones.find(m => m.id === msId);\n  if (!ms) return;\n  const wasMs = ms.done;\n  ms.done = !ms.done;\n  logGoalActivity(goalId, (ms.done ? '✓ ' : '↩ ') + ms.text);\n  if (ms.done && !wasMs) { awardXP(XP_PER_MILESTONE); checkAchievements(g); }\n  const allDone = g.milestones.every(m => m.done);\n  if (allDone && !g.done) {\n    g.done = true;\n    logGoalActivity(goalId, '✅ All milestones complete — goal done!');\n    const xp = XP_PER_GOAL[g.priority] || XP_PER_GOAL.Medium;\n    awardXP(xp);\n    const newA = checkAchievements(g);\n    save();\n    showGoalCelebration(g.text, xp, newA);\n  } else {\n    save();\n  }\n  openGoalDetail(goalId);\n  renderGoalsPage();\n}\n\nfunction openGoalDetail(id) {\n  id = parseInt(id);\n  const g = S.goals.find(x => x.id === id);\n  if (!g) return;\n  const biz = bizById(g.bizId);\n  const pct = goalPct(g);\n  const ds = goalDeadlineStatus(g.deadline);\n  const color = goalTypeColor(g.type);\n  const log = (S.goalLog || []).filter(l => l.goalId === id);\n\n  const milestonesHtml = g.milestones && g.milestones.length ? '<div style=\"margin-top:14px\"><div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Milestones<\u002Fdiv>' +\n    g.milestones.map(ms => '<div class=\"goal-milestone-row\"><div class=\"goal-ms-tick ' + (ms.done?'done':'') + '\" onclick=\"toggleMilestone(' + id + ',' + ms.id + ')\">' + (ms.done?'✓':'') + '<\u002Fdiv><div class=\"goal-ms-label ' + (ms.done?'done':'') + '\">' + ms.text + '<\u002Fdiv><\u002Fdiv>').join('') + '<\u002Fdiv>' : '';\n\n  const logHtml = log.length ? log.map(l =>\n    '<div class=\"goal-log-row\"><div class=\"goal-log-dot\" style=\"background:' + color + '\"><\u002Fdiv><div style=\"flex:1\"><div style=\"font-size:11px;color:var(--text);line-height:1.4\">' + l.msg + '<\u002Fdiv><div style=\"font-size:8px;font-family:DM Mono,monospace;color:var(--text3);margin-top:2px\">' + l.ts + '<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n  ).join('') : '<div style=\"font-size:10px;color:var(--text3);font-family:DM Mono,monospace\">No activity yet.<\u002Fdiv>';\n\n  const detailEl = document.getElementById('goalDetailContent');\n  detailEl.innerHTML = '<div style=\"height:4px;background:' + color + ';margin:-24px -24px 18px;border-radius:4px 4px 0 0\"><\u002Fdiv>'\n    + '<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px\">'\n    + '<div><div style=\"font-size:17px;font-weight:800;color:var(--text);line-height:1.3\">' + g.text + '<\u002Fdiv>'\n    + (g.desc ? '<div style=\"font-size:11px;color:var(--text2);margin-top:4px;line-height:1.6\">' + g.desc + '<\u002Fdiv>' : '') + '<\u002Fdiv>'\n    + '<span class=\"badge ' + (g.done?'b-green':'b-muted') + '\" style=\"flex-shrink:0\">' + (g.done?'Done':'Active') + '<\u002Fspan><\u002Fdiv>'\n    + '<div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px\">'\n    + '<span class=\"badge b-muted\">' + g.type + '<\u002Fspan>'\n    + (biz ? '<span class=\"badge\" style=\"background:' + color + '22;color:' + color + '\">' + biz.name + '<\u002Fspan>' : '')\n    + '<span class=\"badge ' + (g.priority==='High'?'b-red':g.priority==='Low'?'b-green':'b-amber') + '\">' + (g.priority||'Medium') + '<\u002Fspan>'\n    + '<span class=\"goal-deadline-chip ' + ds.cls + '\">' + ds.label + '<\u002Fspan><\u002Fdiv>'\n    + '<div style=\"background:var(--bg2);border-radius:var(--rs);padding:14px;margin-bottom:12px\">'\n    + '<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">'\n    + '<div style=\"font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.02em\">' + pct + '%<\u002Fdiv>'\n    + (g.target > 0 ? '<div style=\"font-size:11px;font-family:DM Mono,monospace;color:var(--text3)\">' + (g.progress||0).toLocaleString() + ' \u002F ' + g.target.toLocaleString() + ' ' + (g.unit||'') + '<\u002Fdiv>' : '') + '<\u002Fdiv>'\n    + '<div class=\"goal-prog-track\"><div class=\"goal-prog-fill\" style=\"width:' + pct + '%;background:' + color + '\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    + (g.startDate || g.deadline ? '<div style=\"display:flex;gap:14px;margin-bottom:12px\">'\n      + (g.startDate ? '<div><div style=\"font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Start<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:var(--text);margin-top:2px\">' + g.startDate + '<\u002Fdiv><\u002Fdiv>' : '')\n      + (g.deadline ? '<div><div style=\"font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Deadline<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:var(--text);margin-top:2px\">' + g.deadline + '<\u002Fdiv><\u002Fdiv>' : '')\n      + '<\u002Fdiv>' : '')\n    + milestonesHtml\n    + '<div style=\"margin-top:14px\"><div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">Activity Log<\u002Fdiv>'\n    + '<div style=\"max-height:160px;overflow-y:auto\">' + logHtml + '<\u002Fdiv><\u002Fdiv>';\n\n  const actionsEl = document.getElementById('goalDetailActions');\n  actionsEl.innerHTML = '';\n\n  const makeBtn = (label, cls, fn) => {\n    const b = document.createElement('button');\n    b.className = 'btn ' + cls;\n    b.textContent = label;\n    b.onclick = fn;\n    return b;\n  };\n  actionsEl.appendChild(makeBtn('+ Log Progress', 'btn-p', () => openLogProgress(id)));\n  actionsEl.appendChild(makeBtn('Edit Goal', 'btn-g', () => { closeModal('goalDetailModal'); openEditGoalFull(id); }));\n  actionsEl.appendChild(makeBtn(g.done ? '↩ Reopen' : '✓ Complete', 'btn-g', () => { toggleGoal(id); closeModal('goalDetailModal'); }));\n  actionsEl.appendChild(makeBtn('Close', 'btn-g', () => closeModal('goalDetailModal')));\n\n  openModal('goalDetailModal');\n}\n\nfunction renderGoalsPage() {\n  if (currentPage !== 'goals') return;\n  refreshGoalSelects();\n  renderGoalMomentum();\n  renderGoalKpis();\n  renderGoalGrid();\n  renderGoalRing();\n  renderGoalDeadlines();\n  renderGoalActivityFeed();\n  updateBadges();\n}\n\nfunction refreshGoalSelects() {\n  const sel = document.getElementById('goalBizFilter');\n  if (!sel) return;\n  const cur = sel.value;\n  sel.innerHTML = '<option value=\"all\">All Businesses<\u002Foption>' +\n    S.businesses.map(b => `<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  sel.value = cur;\n  \u002F\u002F Also refresh edit goal biz\n  const eb = document.getElementById('editGoalBiz');\n  if(eb) eb.innerHTML = '<option value=\"\">None \u002F Personal<\u002Foption>' + S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n}\n\nfunction getFilteredGoals() {\n  const bizF = document.getElementById('goalBizFilter')?.value || 'all';\n  let goals = S.goals;\n  if (bizF !== 'all') goals = goals.filter(g => String(g.bizId) === bizF);\n  if (goalFilter === 'active') goals = goals.filter(g => !g.done);\n  else if (goalFilter === 'done') goals = goals.filter(g => g.done);\n  else if (['Revenue','Strategy','Growth','Planning','Operations'].includes(goalFilter))\n    goals = goals.filter(g => g.type === goalFilter);\n  return goals;\n}\n\nfunction renderGoalKpis() {\n  const el = document.getElementById('goalCmdKpis'); if (!el) return;\n  const all = S.goals;\n  const active = all.filter(g => !g.done);\n  const done = all.filter(g => g.done);\n  const overdue = active.filter(g => g.deadline && new Date(g.deadline+'T00:00:00') < new Date());\n  const avgPct = all.length ? Math.round(all.reduce((a,g) => a + goalPct(g), 0) \u002F all.length) : 0;\n  const highPri = active.filter(g => g.priority === 'High');\n\n  el.innerHTML = [\n    {lbl:'Total Goals', val:all.length, sub:'All time', icon:'◈'},\n    {lbl:'Active', val:active.length, sub:'In progress', icon:'◎', cls:''},\n    {lbl:'Completed', val:done.length, sub:all.length ? Math.round((done.length\u002Fall.length)*100)+'% rate' : '0%', icon:'✓', cls:'pos'},\n    {lbl:'Overdue', val:overdue.length, sub:'Past deadline', icon:'⚠', cls:overdue.length?'neg':''},\n    {lbl:'Avg Progress', val:avgPct+'%', sub:'Across all goals', icon:'◷'},\n  ].map(k => `<div class=\"card card-sm\">\n    <div class=\"cl\">${k.icon}&nbsp; ${k.lbl}<\u002Fdiv>\n    <div class=\"cv ${k.cls||''}\">${k.val}<\u002Fdiv>\n    <div class=\"cs\">${k.sub}<\u002Fdiv>\n  <\u002Fdiv>`).join('');\n}\n\nfunction renderGoalGrid() {\n  const el = document.getElementById('goalCmdGrid'); if (!el) return;\n  const allFiltered = getFilteredGoals();\n  const activeGoals = allFiltered.filter(g => !g.done);\n  const doneGoals = allFiltered.filter(g => g.done);\n  const showOnlyDone = goalFilter === 'done';\n\n  \u002F\u002F ── Active goals grid ──\n  let activeHtml = '';\n  if (!showOnlyDone) {\n    if (!activeGoals.length && !doneGoals.length) {\n      activeHtml = `<div class=\"card\" style=\"grid-column:span 2;padding:48px;text-align:center\">\n        <div style=\"font-size:36px;opacity:.08;margin-bottom:14px\">◉<\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:800;color:var(--text);margin-bottom:6px\">No goals yet<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:18px\">Set your first objective and start earning XP.<\u002Fdiv>\n        <button class=\"btn btn-p\" onclick=\"openGoalModal()\">+ Create First Goal<\u002Fbutton>\n      <\u002Fdiv>`;\n    } else if (!activeGoals.length) {\n      activeHtml = `<div class=\"card\" style=\"grid-column:span 2;padding:32px;text-align:center;border-color:var(--green)\">\n        <div style=\"font-size:28px;margin-bottom:8px\">🏆<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:800;color:var(--green);margin-bottom:4px\">All goals complete!<\u002Fdiv>\n        <div style=\"font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:14px\">Set new targets to keep the momentum going.<\u002Fdiv>\n        <button class=\"btn btn-p\" onclick=\"openGoalModal()\">+ New Goal<\u002Fbutton>\n      <\u002Fdiv>`;\n    } else {\n      activeHtml = activeGoals.map(g => goalCardHtml(g)).join('');\n    }\n  }\n\n  \u002F\u002F ── Hall of Fame ──\n  let hofHtml = '';\n  if (doneGoals.length) {\n    const trophies = ['🏆','🥇','🎯','⭐','💎','🔥','⚡','🌟'];\n    hofHtml = `<div class=\"goal-hof-section\" style=\"${showOnlyDone?'margin-top:0;padding-top:0;border-top:none':''}\">\n      <div class=\"goal-hof-header\">\n        <div class=\"goal-hof-title\">Hall of Fame<\u002Fdiv>\n        <div class=\"goal-hof-count\">${doneGoals.length} completed<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"goal-hof-grid\">\n        ${doneGoals.map((g,i) => {\n          const color = goalTypeColor(g.type);\n          const biz = bizById(g.bizId);\n          const xpVal = XP_PER_GOAL[g.priority] || XP_PER_GOAL.Medium;\n          const icon = trophies[i % trophies.length];\n          return `<div class=\"goal-hof-card\" onclick=\"openGoalDetail(${g.id})\">\n            <div class=\"goal-hof-card-top\">\n              <div class=\"goal-hof-icon\">${icon}<\u002Fdiv>\n              <div>\n                <div class=\"goal-hof-card-title\">${g.text}<\u002Fdiv>\n                <div class=\"goal-hof-card-meta\">\n                  <span style=\"background:${color}20;color:${color};padding:1px 6px;border-radius:100px\">${g.type}<\u002Fspan>\n                  ${biz?`<span>${biz.name}<\u002Fspan>`:''}\n                  <span class=\"goal-hof-xp\">+${xpVal} XP<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:3px;background:var(--green);border-radius:100px;opacity:.5\"><\u002Fdiv>\n            <div style=\"margin-top:8px;display:flex;justify-content:space-between;align-items:center\">\n              <button onclick=\"event.stopPropagation();toggleGoal(${g.id})\" style=\"background:none;border:.5px solid var(--border2);color:var(--text3);font-family:'Syne',sans-serif;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:100px;cursor:pointer\" onmouseenter=\"this.style.borderColor='var(--accent)';this.style.color='var(--accent)'\" onmouseleave=\"this.style.borderColor='var(--border2)';this.style.color='var(--text3)'\">↩ Reopen<\u002Fbutton>\n              <span style=\"font-size:8px;font-family:'DM Mono',monospace;color:var(--text3)\">${g.priority||'Medium'} priority<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  } else if (showOnlyDone) {\n    hofHtml = `<div class=\"card\" style=\"grid-column:span 2;padding:40px;text-align:center\">\n      <div style=\"font-size:32px;opacity:.12;margin-bottom:12px\">🏆<\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px\">Hall of Fame is empty<\u002Fdiv>\n      <div style=\"font-size:10px;color:var(--text3);font-family:'DM Mono',monospace\">Complete goals to see them enshrined here.<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  el.innerHTML = (showOnlyDone ? '' : activeHtml) + hofHtml;\n}\n\nfunction goalCardHtml(g) {\n  const pct = goalPct(g);\n  const color = goalTypeColor(g.type);\n  const biz = bizById(g.bizId);\n  const ds = goalDeadlineStatus(g.deadline);\n  const msDone = g.milestones ? g.milestones.filter(m=>m.done).length : 0;\n  const msTotal = g.milestones ? g.milestones.length : 0;\n  const isOverdue = g.deadline && !g.done && new Date(g.deadline+'T00:00:00') < new Date();\n  const priorityIcon = g.priority==='High' ? '🔥' : g.priority==='Low' ? '◌' : '◎';\n\n  return `<div class=\"goal-card\" onclick=\"openGoalDetail(${g.id})\" style=\"${isOverdue?'border-color:var(--red)':''}\">\n    <div class=\"goal-card-accent\" style=\"background:${color}\"><\u002Fdiv>\n    <div class=\"goal-card-body\">\n      <div class=\"goal-card-top\">\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:${color};margin-bottom:4px\">${priorityIcon} ${g.type} · ${g.priority||'Medium'}<\u002Fdiv>\n          <div class=\"goal-card-title\">${g.text}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0\">\n          ${biz ? `<span class=\"badge\" style=\"background:${color}18;color:${color};font-size:7px\">${biz.name}<\u002Fspan>` : ''}\n          <span class=\"goal-deadline-chip ${ds.cls}\" style=\"font-size:7px\">${ds.label}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"goal-progress-wrap\">\n        <div class=\"goal-progress-top\">\n          <span class=\"goal-progress-pct\" style=\"color:${color}\">${pct}%<\u002Fspan>\n          ${g.target > 0\n            ? `<span class=\"goal-progress-vals\">${(g.progress||0).toLocaleString()} \u002F ${g.target.toLocaleString()} ${g.unit||''}<\u002Fspan>`\n            : msTotal ? `<span class=\"goal-progress-vals\">${msDone}\u002F${msTotal} milestones<\u002Fspan>` : ''}\n        <\u002Fdiv>\n        <div class=\"goal-prog-track\">\n          <div class=\"goal-prog-fill\" style=\"width:${pct}%;background:${color};transition:width .8s cubic-bezier(.34,1.2,.64,1)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${msTotal ? `<div style=\"margin-top:8px\">${g.milestones.slice(0,3).map(ms=>`\n        <div style=\"display:flex;align-items:center;gap:6px;padding:3px 0\">\n          <div style=\"width:10px;height:10px;border-radius:50%;${ms.done?'background:'+color:'border:.5px solid var(--border2)'};flex-shrink:0;display:flex;align-items:center;justify-content:center\">\n            ${ms.done?'<span style=\"font-size:6px;color:#fff;font-weight:800\">✓<\u002Fspan>':''}\n          <\u002Fdiv>\n          <span style=\"font-size:10px;color:${ms.done?'var(--text3)':'var(--text2)'};${ms.done?'text-decoration:line-through':''};line-height:1.3\">${ms.text}<\u002Fspan>\n        <\u002Fdiv>`).join('')}\n        ${g.milestones.length > 3 ? `<div style=\"font-size:9px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace\">+${g.milestones.length-3} more<\u002Fdiv>` : ''}\n      <\u002Fdiv>` : ''}\n      <div style=\"margin-top:10px;padding-top:8px;border-top:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between\">\n        <div style=\"display:flex;align-items:center;gap:6px\">\n          <button onclick=\"event.stopPropagation();toggleGoal(${g.id})\" class=\"btn btn-g btn-sm\" style=\"padding:3px 8px;font-size:7px;background:var(--green-bg);border-color:var(--green);color:var(--green)\">✓ Done<\u002Fbutton>\n          <button onclick=\"event.stopPropagation();openLogProgress(${g.id})\" class=\"btn btn-g btn-sm\" style=\"padding:3px 7px;font-size:7px\">+ Log<\u002Fbutton>\n          <button onclick=\"event.stopPropagation();openEditGoalFull(${g.id})\" class=\"btn btn-g btn-sm\" style=\"padding:3px 7px;font-size:7px\">Edit<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:8px;font-family:'DM Mono',monospace;color:var(--text3)\">${XP_PER_GOAL[g.priority]||100} XP<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderGoalRing() {\n  const svg = document.getElementById('goalRingSvg');\n  const val = document.getElementById('goalRingVal');\n  const breakdown = document.getElementById('goalRingBreakdown');\n  if (!svg || !val) return;\n\n  const all = S.goals;\n  const done = all.filter(g => g.done).length;\n  const total = all.length;\n  const pct = total ? Math.round((done\u002Ftotal)*100) : 0;\n  val.textContent = pct + '%';\n\n  const R = 35, cx = 45, cy = 45;\n  const circum = 2 * Math.PI * R;\n  const dash = (pct\u002F100) * circum;\n  svg.innerHTML = `\n    <circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"var(--bg3)\" stroke-width=\"9\"\u002F>\n    <circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"9\"\n      stroke-dasharray=\"${dash.toFixed(1)} ${circum.toFixed(1)}\"\n      transform=\"rotate(-90 ${cx} ${cy})\"\n      style=\"transition:stroke-dasharray .6s cubic-bezier(.34,1.2,.64,1)\"\u002F>\n  `;\n\n  \u002F\u002F Type breakdown\n  const byType = {};\n  all.forEach(g => { byType[g.type] = (byType[g.type]||0) + 1; });\n  breakdown.innerHTML = Object.entries(byType).map(([type,count]) => {\n    const tdone = all.filter(g=>g.type===type && g.done).length;\n    const color = goalTypeColor(type);\n    return `<div style=\"display:flex;align-items:center;gap:7px;padding:3px 0\">\n      <div style=\"width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0\"><\u002Fdiv>\n      <div style=\"flex:1;font-size:10px;font-weight:600;color:var(--text)\">${type}<\u002Fdiv>\n      <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)\">${tdone}\u002F${count}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('') || '<div style=\"font-size:10px;color:var(--text3)\">No goals yet.<\u002Fdiv>';\n}\n\nfunction renderGoalDeadlines() {\n  const el = document.getElementById('goalDeadlineList'); if(!el) return;\n  const upcoming = S.goals.filter(g => g.deadline && !g.done)\n    .sort((a,b) => a.deadline.localeCompare(b.deadline)).slice(0, 8);\n  if (!upcoming.length) {\n    el.innerHTML = '<div style=\"font-size:10px;color:var(--text3);font-family:\\'DM Mono\\',monospace;padding:6px 0\">No upcoming deadlines.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML = upcoming.map(g => {\n    const ds = goalDeadlineStatus(g.deadline);\n    const color = goalTypeColor(g.type);\n    const pct = goalPct(g);\n    return `<div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border);cursor:pointer\" onclick=\"openGoalDetail(${g.id})\">\n      <div style=\"width:3px;height:32px;background:${color};border-radius:2px;flex-shrink:0\"><\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${g.text}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px;margin-top:3px\">\n          <div style=\"flex:1;height:3px;background:var(--bg3);border-radius:2px\"><div style=\"height:3px;width:${pct}%;background:${color};border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-size:8px;font-family:'DM Mono',monospace;color:var(--text3)\">${pct}%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"goal-deadline-chip ${ds.cls}\" style=\"font-size:7px;flex-shrink:0\">${ds.label}<\u002Fspan>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderGoalActivityFeed() {\n  const el = document.getElementById('goalActivityFeed'); if(!el) return;\n  const log = S.goalLog || [];\n  if (!log.length) {\n    el.innerHTML = '<div style=\"font-size:10px;color:var(--text3);font-family:\\'DM Mono\\',monospace\">No activity yet.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML = log.slice(0,20).map(l => {\n    const g = S.goals.find(x => x.id === l.goalId);\n    return `<div class=\"goal-log-row\">\n      <div class=\"goal-log-dot\"><\u002Fdiv>\n      <div style=\"flex:1\">\n        <div style=\"font-size:10px;color:var(--text);line-height:1.4\">${l.msg}<\u002Fdiv>\n        ${g ? `<div style=\"font-size:8px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:1px\">${g.text.slice(0,32)}${g.text.length>32?'…':''}<\u002Fdiv>` : ''}\n        <div style=\"font-size:8px;font-family:'DM Mono',monospace;color:var(--text3)\">${l.ts}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n\u002F\u002F Hook goals page into showPage\nconst _origShowPageGoals = showPage;\n\u002F\u002F Already patched — just ensure renderGoalsPage is called\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F APPEARANCE DROPDOWN (Topbar Quick Access)\n\u002F\u002F ══════════════════════════════════════════\n\nfunction _appearSaveAndFlash(){\n  save();\n  const fb = document.getElementById('appearSavedFeedback');\n  if(fb){ fb.style.display='flex'; clearTimeout(fb._t); fb._t=setTimeout(()=>fb.style.display='none',1400); }\n}\n\nfunction renderAppearDropdown(){\n  const p = S.profile||{};\n  const activeTheme = p.theme||'stratus';\n  const activeAccent = p.accent||'';\n  const isDark = S.dark;\n  const themeMeta = THEMES[activeTheme]||THEMES.stratus;\n\n  \u002F\u002F Header: theme name + mode\n  const ht = document.getElementById('appearHdrTitle');\n  const hs = document.getElementById('appearHdrSub');\n  if(ht) ht.textContent = themeMeta.name;\n  if(hs) hs.textContent = (isDark?'Dark':'Light') + ' · Saves automatically';\n\n  \u002F\u002F Theme grid — mode-aware background + bars from theme palette\n  const tg = document.getElementById('appearThemeGrid');\n  if(tg) tg.innerHTML = Object.entries(THEMES).map(([key,t])=>{\n    const colors = isDark ? t.dark : t.light;\n    const bars = [colors.text, colors.accent, colors.bg2, colors.text3];\n    return`<div class=\"appear-swatch ${activeTheme===key?'active':''}\" onclick=\"appearSetTheme('${key}')\" title=\"${t.name}\">\n      <div class=\"appear-swatch-preview\" style=\"background:${colors.bg}\">\n        ${bars.map(col=>`<div class=\"appear-swatch-bar\" style=\"background:${col}\"><\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n      <div class=\"appear-swatch-name\">${t.name}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  \u002F\u002F Mode chips\n  const ml = document.getElementById('modeLight');\n  const md = document.getElementById('modeDark');\n  if(ml) ml.className = 'appear-mode-chip' + (!isDark?' active':'');\n  if(md) md.className = 'appear-mode-chip' + (isDark?' active':'');\n\n  \u002F\u002F Accent dots\n  const ad = document.getElementById('appearAccentDots');\n  if(ad) ad.innerHTML = ACCENT_PRESETS.map(a=>\n    `<div class=\"appear-accent-dot ${activeAccent===a.color?'active':''}\" style=\"background:${a.color}\" onclick=\"appearSetAccent('${a.color}')\" title=\"${a.label}\"><\u002Fdiv>`\n  ).join('');\n\n  \u002F\u002F Accent label\n  const al = document.getElementById('appearAccentLabel');\n  if(al){\n    const preset = ACCENT_PRESETS.find(a=>a.color===activeAccent);\n    al.textContent = preset ? preset.label : (activeAccent?activeAccent:'');\n  }\n\n  \u002F\u002F Custom accent input\n  const cai = document.getElementById('appearCustomAccent');\n  if(cai && activeAccent) cai.value = activeAccent;\n\n  \u002F\u002F Button swatch\n  updateAppearSwatch();\n}\n\nfunction updateAppearSwatch(){\n  const dot = document.getElementById('appearDotSwatch');\n  if(!dot) return;\n  const p = S.profile||{};\n  const key = p.theme||'stratus';\n  const t = THEMES[key]||THEMES.stratus;\n  const previewColor = p.accent || (S.dark ? t.dark.accent : t.light.accent);\n  dot.style.background = previewColor;\n}\n\nfunction appearSetTheme(key){\n  if(!S.profile) S.profile={};\n  S.profile.theme = key;\n  applyTheme();\n  _appearSaveAndFlash();\n  renderAppearDropdown();\n  renderThemePanel();\n}\n\nfunction appearSetMode(mode){\n  S.dark = (mode==='dark');\n  document.body.classList.toggle('dark', S.dark);\n  const app = document.getElementById('app');\n  if(app) app.classList.toggle('dark', S.dark);\n  applyTheme();\n  _appearSaveAndFlash();\n  renderAppearDropdown();\n  renderThemePanel();\n  const dt = document.getElementById('darkToggle');\n  if(dt) dt.checked = S.dark;\n}\n\nfunction appearSetAccent(color){\n  if(!S.profile) S.profile={};\n  S.profile.accent = color;\n  applyTheme();\n  _appearSaveAndFlash();\n  renderAppearDropdown();\n  renderThemePanel();\n}\n\nfunction appearSave(){\n  save();\n  applyTheme();\n  closeAppearDropdown();\n}\n\nfunction toggleAppearDropdown(e){\n  e.stopPropagation();\n  const dd = document.getElementById('appearDropdown');\n  const wrap = document.getElementById('appearBtnWrap');\n  const isOpen = dd.classList.contains('open');\n  if(!isOpen){\n    \u002F\u002F Calculate position relative to viewport so fixed positioning\n    \u002F\u002F escapes overflow:hidden on .shell\u002F.body-wrap and stacking context\n    \u002F\u002F issues from the aurora CSS layer (which resets topbar z-index to 1)\n    if(wrap){\n      const r = wrap.getBoundingClientRect();\n      dd.style.top = (r.bottom + 8) + 'px';\n      const rightOffset = window.innerWidth - r.right;\n      dd.style.right = Math.max(8, rightOffset) + 'px';\n      dd.style.left = '';\n    }\n    renderAppearDropdown();\n    dd.classList.add('open');\n    document.getElementById('appearChevron').textContent='▴';\n  } else {\n    closeAppearDropdown();\n  }\n}\n\nfunction closeAppearDropdown(){\n  const dd = document.getElementById('appearDropdown');\n  if(dd) dd.classList.remove('open');\n  const ch = document.getElementById('appearChevron');\n  if(ch) ch.textContent='▾';\n}\n\n\u002F\u002F Close on Escape key\ndocument.addEventListener('keydown', function(e){\n  if(e.key==='Escape'){\n    const dd = document.getElementById('appearDropdown');\n    if(dd && dd.classList.contains('open')) closeAppearDropdown();\n  }\n});\n\n\u002F\u002F Close dropdown on outside click\ndocument.addEventListener('click', function(e){\n  const wrap = document.getElementById('appearBtnWrap');\n  if(wrap && !wrap.contains(e.target)){\n    closeAppearDropdown();\n  }\n});\n\n\u002F\u002F Reposition dropdown on resize (fixed positioning uses viewport coords)\nwindow.addEventListener('resize', function(){\n  const dd = document.getElementById('appearDropdown');\n  if(!dd || !dd.classList.contains('open')) return;\n  const wrap = document.getElementById('appearBtnWrap');\n  if(wrap){\n    const r = wrap.getBoundingClientRect();\n    dd.style.top = (r.bottom + 8) + 'px';\n    dd.style.right = Math.max(8, window.innerWidth - r.right) + 'px';\n  }\n});\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F MOBILE SIDEBAR\n\u002F\u002F ══════════════════════════════════════════\n\nfunction toggleMobileSidebar(){\n  const sb = document.querySelector('.sidebar');\n  const bd = document.getElementById('mobSidebarBackdrop');\n  if(!sb || !bd) return;\n  const isOpen = sb.classList.contains('mob-open');\n  if(isOpen){\n    closeMobileSidebar();\n  } else {\n    sb.classList.add('mob-open');\n    bd.classList.add('active');\n  }\n}\n\nfunction closeMobileSidebar(){\n  const sb = document.querySelector('.sidebar');\n  const bd = document.getElementById('mobSidebarBackdrop');\n  if(sb) sb.classList.remove('mob-open');\n  if(bd) bd.classList.remove('active');\n}\n\nfunction toggleMobMore(){\n  const drawer = document.getElementById('mobMoreDrawer');\n  if(!drawer) return;\n  drawer.classList.toggle('open');\n  \u002F\u002F Mark More tab active when drawer is open\n  const moreTab = document.getElementById('mobnav-more');\n  if(moreTab) moreTab.classList.toggle('active', drawer.classList.contains('open'));\n}\n\nfunction closeMobMore(){\n  const drawer = document.getElementById('mobMoreDrawer');\n  if(drawer) drawer.classList.remove('open');\n  const moreTab = document.getElementById('mobnav-more');\n  if(moreTab) moreTab.classList.remove('active');\n}\n\n\u002F\u002F Mobile bottom nav updated inside showPage()\n\n\n\n\u002F\u002F ── EVENT DETAIL POPUP ──\nfunction openEventPopup(id){\n  const e=S.events.find(x=>x.id===id);if(!e)return;\n  const biz=bizById(e.bizId);\n  const color=bizColorForEvent(e);\n  const overlay=document.getElementById('eventDetailOverlay');\n  \u002F\u002F Set CSS var for hero bg color\n  overlay.querySelector('.event-popup-card').style.setProperty('--ep-color',color);\n  document.getElementById('eventPopupAccent').style.background=color;\n  document.getElementById('eventPopupHeroBg').style.background=color;\n  document.getElementById('eventPopupEyebrowDot').style.background=color;\n  document.getElementById('eventPopupType').style.color=color;\n  document.getElementById('eventPopupType').textContent=(e.type||'Event').toUpperCase()+(e.repeat&&e.repeat!=='none'?' · ↻ '+repeatLabel(e.repeat):'')+(biz?' · '+biz.name:'');\n  document.getElementById('eventPopupTitle').textContent=e.title;\n\n  \u002F\u002F Build meta grid\n  const metaItems=[];\n  \u002F\u002F Date\n  const dayLbl=getDayLabel(e.date);\n  const dObj=new Date(e.date+'T00:00:00');\n  const dateFormatted=dObj.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">📅<\u002Fdiv><div><div class=\"event-popup-meta-label\">Date<\u002Fdiv><div class=\"event-popup-meta-value\">${dateFormatted}<\u002Fdiv><div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">${dayLbl}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  \u002F\u002F Time\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">🕐<\u002Fdiv><div><div class=\"event-popup-meta-label\">Time<\u002Fdiv><div class=\"event-popup-meta-value\">${e.time||'All day'}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  \u002F\u002F Business\n  if(biz) metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\" style=\"background:${color}22;font-size:12px\">◉<\u002Fdiv><div><div class=\"event-popup-meta-label\">Business<\u002Fdiv><div class=\"event-popup-meta-value\" style=\"color:${color}\">${biz.name}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n  \u002F\u002F Repeat\n  if(e.repeat&&e.repeat!=='none') metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">↻<\u002Fdiv><div><div class=\"event-popup-meta-label\">Repeats<\u002Fdiv><div class=\"event-popup-meta-value\">${repeatLabel(e.repeat)}<\u002Fdiv>${e.repeatEnd?`<div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px\">Until ${e.repeatEnd}<\u002Fdiv>`:''}<\u002Fdiv><\u002Fdiv>`);\n  \u002F\u002F Type badge\n  metaItems.push(`<div class=\"event-popup-meta-item\"><div class=\"event-popup-meta-icon\">◈<\u002Fdiv><div><div class=\"event-popup-meta-label\">Type<\u002Fdiv><div class=\"event-popup-meta-value\">${(e.type||'Event').charAt(0).toUpperCase()+(e.type||'event').slice(1)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`);\n\n  document.getElementById('eventPopupMetaGrid').innerHTML=metaItems.join('');\n\n  \u002F\u002F Notes\n  const nb=document.getElementById('eventPopupNotesBlock');\n  const nt=document.getElementById('eventPopupNotesText');\n  if(e.notes&&nb&&nt){nb.style.display='';nt.textContent=e.notes;}\n  else if(nb){nb.style.display='none';}\n\n  document.getElementById('eventPopupEditBtn').onclick=()=>{closeEventPopup();openEditEvent(id);};\n  document.getElementById('eventPopupDeleteBtn').onclick=()=>{if(confirm('Delete this event?')){deleteEvent(id);closeEventPopup();}};\n  \u002F\u002F Remove leftover bill paid btn\n  const ep=document.getElementById('billDetailPaidBtn');if(ep)ep.remove();\n  overlay.style.display='flex';\n}\n\nfunction closeEventPopup(){\n  const el=document.getElementById('eventDetailOverlay');\n  if(el){el.style.opacity='0';el.style.transition='opacity .18s';setTimeout(()=>{el.style.display='none';el.style.opacity='';el.style.transition='';},180);}\n}\n\nfunction getDayLabel(dateStr){\n  if(!dateStr)return'';\n  const d=new Date(dateStr+'T00:00:00');\n  const today=new Date();today.setHours(0,0,0,0);\n  const diff=Math.round((d-today)\u002F86400000);\n  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';\n  if(diff>0)return'In '+diff+' days';\n  return Math.abs(diff)+' days ago';\n}\n\ndocument.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeEventPopup();closeTaskDetail();}});\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F ONBOARDING SYSTEM\n\u002F\u002F ═══════════════
