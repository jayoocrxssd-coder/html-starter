rt.setDate(anchor.getDate()-anchor.getDay());\n  let html='<div class=\"cal-week-grid\">';\n  for(let i=0;i<7;i++){\n    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);\n    const dateStr=d.toISOString().slice(0,10);\n    const isToday=dateStr===today;\n    const isSel=dateStr===selectedCalDay;\n    const dayEvs=getFilteredCalEvents(S.events.filter(e=>e.date===dateStr)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));\n    const colCls='cal-week-col'+(isToday?' today':'')+(isSel?' cal-day-selected':'');\n    const hdrCls='cal-week-col-hdr'+(isToday?' today':'');\n    const evHtml=dayEvs.map(e=>{\n      const color=bizColorForEvent(e);\n      return`<div class=\"cal-event-pip\" draggable=\"true\" ondragstart=\"dragCalStart(event,${e.id})\" ondragend=\"dragCalEnd(event)\" onclick=\"event.stopPropagation();openEventPopup(${e.id})\" style=\"background:${color}18\"><div class=\"cal-event-dot\" style=\"background:${color}\"><\u002Fdiv><b style=\"color:${color}\">${e.title}<\u002Fb><\u002Fdiv>`;\n    }).join('');\n    html+=`<div class=\"${colCls}\" ${_calDayDnD(dateStr)} onclick=\"selectCalDay('${dateStr}')\" ondblclick=\"quickAddEventOnDay('${dateStr}')\">\n      <div class=\"${hdrCls}\">\n        <div class=\"cal-week-day-name\">${DAY_LABELS[d.getDay()]}<\u002Fdiv>\n        <div class=\"cal-week-day-num\">${d.getDate()}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cal-week-col-body\">${evHtml||''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n  html+='<\u002Fdiv>';\n  wrap.innerHTML=html;\n  renderCalLegend();\n}\n\nfunction dragCalStart(e,id){\n  _dragCalEventId=id;\n  setTimeout(()=>{e.target.classList.add('dragging');},0);\n  e.dataTransfer.effectAllowed='move';\n}\nfunction dragCalEnd(e){\n  e.target.classList.remove('dragging');\n  document.querySelectorAll('.cal-day,.cal-week-col').forEach(c=>c.classList.remove('drag-over'));\n}\nfunction dropCalEvent(e,dateStr,el){\n  e.preventDefault();el.classList.remove('drag-over');\n  if(!_dragCalEventId)return;\n  const ev=S.events.find(x=>x.id===_dragCalEventId);\n  if(ev&&ev.date!==dateStr){ev.date=dateStr;save();renderCalendar();renderUpcoming();if(selectedCalDay)renderDayView(selectedCalDay);}\n  _dragCalEventId=null;\n}\n\nfunction renderCalLegend(){\n  const legend=document.getElementById('calLegend');if(!legend)return;\n  if(!S.businesses.length){legend.innerHTML='';return;}\n  legend.innerHTML=S.businesses.map((b,i)=>`\n    <div class=\"cal-legend-item\">\n      <div class=\"cal-legend-dot\" style=\"background:${BIZ_COLORS[i%BIZ_COLORS.length]}\"><\u002Fdiv>${b.name}\n    <\u002Fdiv>`).join('')+'<div class=\"cal-legend-item\"><div class=\"cal-legend-dot\" style=\"background:#9a9a98\"><\u002Fdiv>Personal<\u002Fdiv>';\n}\n\nfunction selectCalDay(dateStr){\n  selectedCalDay=dateStr;\n  renderCalendar();\n  renderDayView(dateStr);\n  const btn=document.getElementById('dayAddBtn');if(btn)btn.style.display='flex';\n}\n\nfunction renderDayView(dateStr){\n  const title=document.getElementById('dayViewTitle');\n  const list=document.getElementById('dayEventList');\n  if(!dateStr){return;}\n  const d=new Date(dateStr+'T00:00:00');\n  title.textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});\n  const evs=getFilteredCalEvents(S.events.filter(e=>e.date===dateStr)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));\n  if(!evs.length){\n    list.innerHTML=`<div style=\"font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;padding:4px 0\">Nothing scheduled. <span style=\"cursor:pointer;text-decoration:underline;color:var(--accent)\" onclick=\"openAddEventOn('${dateStr}')\">Add event →<\u002Fspan><\u002Fdiv>`;\n    return;\n  }\n  list.innerHTML=evs.map(e=>{\n    const biz=bizById(e.bizId);\n    const color=bizColorForEvent(e);\n    return`<div class=\"day-event-card\" onclick=\"openEventPopup(${e.id})\" style=\"border-left:3px solid ${color}\">\n      <div class=\"day-event-time\">${e.time||'All day'}<\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--text)\">${e.title}<\u002Fdiv>\n        <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);margin-top:2px\">${biz?biz.name:e.type}${e.notes?' · '+e.notes.slice(0,40):''}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"event.stopPropagation();openEditEvent(${e.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:9px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;padding:0\">Edit<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderUpcoming(){\n  const el=document.getElementById('upcomingEvents');\n  const countEl=document.getElementById('upcomingCount');\n  const today=new Date().toISOString().slice(0,10);\n  const upcoming=getFilteredCalEvents(S.events.filter(e=>e.date>=today)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')).slice(0,10);\n  if(countEl)countEl.textContent=upcoming.length?`${upcoming.length} events`:'';\n  if(!upcoming.length){el.innerHTML='<div style=\"font-size:10px;color:var(--text3);font-family:\\'DM Mono\\',monospace;padding:8px 0\">No upcoming events.<\u002Fdiv>';return;}\n  el.innerHTML=upcoming.map(e=>{\n    const biz=bizById(e.bizId);\n    const d=new Date(e.date+'T00:00:00');\n    const color=bizColorForEvent(e);\n    const mon=d.toLocaleDateString('en-US',{month:'short'});\n    const day=d.getDate();\n    const isToday=e.date===today;\n    return`<div class=\"upcoming-item\" onclick=\"selectCalDay('${e.date}')\" style=\"cursor:pointer\">\n      <div class=\"upcoming-date-badge\" style=\"border-color:${color}40\">\n        <div class=\"upcoming-date-month\">${isToday?'TODAY':mon}<\u002Fdiv>\n        <div class=\"upcoming-date-num\" style=\"color:${isToday?'var(--accent)':'var(--text)'}\">${day}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${e.title}<\u002Fdiv>\n        <div style=\"font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:1px\">${e.time||'All day'}${biz?' · '+biz.name:''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${color};margin-top:5px\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction openAddEvent(){\n  document.getElementById('eventDate').value=selectedCalDay||new Date().toISOString().slice(0,10);\n  document.getElementById('eventTitle').value='';\n  document.getElementById('eventTime').value='';\n  document.getElementById('eventNotes').value='';\n  const er=document.getElementById('eventRepeat');if(er)er.value='none';\n  const ere=document.getElementById('eventRepeatEnd');if(ere)ere.value='';\n  const evBiz=document.getElementById('eventBiz');\n  evBiz.innerHTML='<option value=\"\">None<\u002Foption>'+S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  openModal('eventModal');\n}\nfunction openAddEventOn(dateStr){\n  selectedCalDay=dateStr;\n  openAddEvent();\n}\nfunction quickAddEventOnDay(dateStr){openAddEventOn(dateStr);}\nfunction saveEvent(){\n  const title=document.getElementById('eventTitle').value.trim(); if(!title)return;\n  const bizVal=document.getElementById('eventBiz').value;\n  const repeat=document.getElementById('eventRepeat')?.value||'none';\n  const repeatEnd=document.getElementById('eventRepeatEnd')?.value||'';\n  const baseDate=document.getElementById('eventDate').value||new Date().toISOString().slice(0,10);\n  const ev={id:S.nextId++,title,date:baseDate,time:document.getElementById('eventTime').value||'',type:document.getElementById('eventType').value,bizId:bizVal?parseInt(bizVal):null,notes:document.getElementById('eventNotes').value.trim(),repeat,repeatEnd};\n  S.events.push(ev);\n  \u002F\u002F generate repeat instances\n  if(repeat!=='none') generateRepeatEvents(ev);\n  save(); closeModal('eventModal');\n  if(currentPage==='calendar'){renderCalendar();renderUpcoming();if(selectedCalDay)renderDayView(selectedCalDay);}\n}\nfunction deleteEvent(id){\n  S.events=S.events.filter(e=>e.id!==id);\n  save();\n  if(currentPage==='calendar'){renderCalendar();renderUpcoming();if(selectedCalDay)renderDayView(selectedCalDay);}\n}\n\n\n\u002F\u002F ── PROFILE PAGE ──\nlet editingBizId=null, editingNoteId=null, editingGoalId=null, editingTaskId=null, editingEventId=null, editingEntryId=null;\n\nfunction renderProfilePage(){\n  const p=S.profile||{};\n  \u002F\u002F fill inputs\n  const av=document.getElementById('profileAvatar');\n  const emojiSpan=document.getElementById('profileAvatarEmoji');\n  if(av&&emojiSpan){\n    \u002F\u002F Remove any existing img\n    const oldImg=av.querySelector('img');if(oldImg)oldImg.remove();\n    if(p.avatarImg){\n      const img=document.createElement('img');img.src=p.avatarImg;av.insertBefore(img,emojiSpan);\n      emojiSpan.style.display='none';\n    } else {\n      emojiSpan.style.display='';\n      emojiSpan.textContent=p.avatar||'◈';\n    }\n  }\n  const ni=document.getElementById('profileNameInput');if(ni)ni.value=p.name||'';\n  const ri=document.getElementById('profileRoleInput');if(ri)ri.value=p.role||'';\n  const ai=document.getElementById('avatarEmojiInput');if(ai)ai.value=p.avatar||'';\n  const gni=document.getElementById('greetingNameInput');if(gni)gni.value=p.greetingName||'Sir';\n  const wrni=document.getElementById('warRoomNameInput');if(wrni)wrni.value=p.warRoomName||'';\n  \u002F\u002F AI settings\n  const aiNameIn=document.getElementById('aiNameInput');if(aiNameIn)aiNameIn.value=p.aiName||'';\n  const aiPersonaIn=document.getElementById('aiPersonaInput');if(aiPersonaIn)aiPersonaIn.value=p.aiPersona||'jarvis';\n  const aiCustomIn=document.getElementById('aiCustomToneInput');if(aiCustomIn)aiCustomIn.value=p.aiCustomTone||'';\n  const aiCustomWrap=document.getElementById('aiCustomToneWrap');if(aiCustomWrap)aiCustomWrap.style.display=(p.aiPersona==='custom')?'':'none';\n  const aiBadge=document.getElementById('aiNameBadge');if(aiBadge)aiBadge.textContent=p.aiName||'JARVIS';\n  renderAIContextPreview();\n  renderThemePanel();\n  renderApiKeyStatus();\n  const dt=document.getElementById('darkToggle');if(dt)dt.checked=S.dark||false;\n  const nd=document.getElementById('profileNameDisplay');if(nd)nd.textContent=p.name||'Your Name';\n  const rd=document.getElementById('profileRoleDisplay');if(rd)rd.textContent=p.role||'Operator · War Room';\n  \u002F\u002F stats\n  const totalRev=S.entries.reduce((a,e)=>a+e.rev,0);\n  const totalSecs=S.sessions.reduce((a,s)=>a+s.duration,0);\n  const statData=[\n    {val:S.businesses.length,lbl:'Businesses'},\n    {val:S.tasks.filter(t=>t.status!=='Done').length,lbl:'Active Missions'},\n    {val:(totalSecs\u002F3600).toFixed(1)+'h',lbl:'Hours Logged'},\n    {val:'$'+totalRev.toLocaleString(),lbl:'Revenue YTD'},\n  ];\n  statData.forEach((s,i)=>{const el=document.getElementById(['statBiz','statMissions','statHours','statRevenue'][i]);if(el)el.innerHTML=`<div class=\"profile-stat-val\">${s.val}<\u002Fdiv><div class=\"profile-stat-lbl\">${s.lbl}<\u002Fdiv>`;});\n  \u002F\u002F war room name in hero\n  const wrnd=document.getElementById('profileWarRoomNameDisplay');\n  if(wrnd)wrnd.textContent=(p.warRoomName||'WAR ROOM').toUpperCase();\n  \u002F\u002F goals in profile\n  const pgl=document.getElementById('profileGoalsList');\n  if(pgl){\n    if(!S.goals.length){pgl.innerHTML='<div style=\"font-size:10px;color:var(--text3);padding:8px 0\">No goals set. Add your monthly targets above.<\u002Fdiv>';}\n    else{pgl.innerHTML=S.goals.map(g=>{const biz=bizById(g.bizId);return`<div class=\"goal-row\"><div class=\"goal-tick${g.done?' done':''}\" onclick=\"toggleGoal(${g.id})\">${g.done?'✓':''}<\u002Fdiv><div class=\"goal-txt${g.done?' done':''}\">${g.text}<\u002Fdiv><div class=\"goal-biz-tag\">${biz?biz.name:''}<\u002Fdiv><button onclick=\"deleteGoal(${g.id})\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0\">✕<\u002Fbutton><\u002Fdiv>`;}).join('');}\n  }\n  \u002F\u002F detailed stats card\n  const psl=document.getElementById('profileStatsList');\n  if(psl){\n    const doneTasks=S.tasks.filter(t=>t.status==='Done').length;\n    const totalBills=(S.bills||[]).length;\n    const totalNotes=(S.notes||[]).length;\n    const totalEntries=(S.entries||[]).length;\n    const totalExp=S.entries.reduce((a,e)=>a+e.exp,0);\n    psl.innerHTML=[\n      {lbl:'Total Missions',val:S.tasks.length},\n      {lbl:'Missions Complete',val:doneTasks},\n      {lbl:'Intel Notes',val:totalNotes},\n      {lbl:'P&L Entries',val:totalEntries},\n      {lbl:'Total Revenue',val:'$'+totalRev.toLocaleString()},\n      {lbl:'Total Expenses',val:'$'+totalExp.toLocaleString()},\n      {lbl:'Bills Tracked',val:totalBills},\n      {lbl:'Focus Hours',val:(totalSecs\u002F3600).toFixed(1)+'h'},\n    ].map(s=>`<div class=\"profile-stat-detail\"><div class=\"settings-label\">${s.lbl}<\u002Fdiv><div style=\"font-size:13px;font-weight:800;color:var(--text);font-family:'DM Mono',monospace\">${s.val}<\u002Fdiv><\u002Fdiv>`).join('');\n  }\n  \u002F\u002F biz grid — rendered by isolated renderProfileBizGrid()\n  renderProfileBizGrid();\n}\n\nfunction switchProfileTab(tab,btn){\n  document.querySelectorAll('.profile-tab').forEach(t=>t.classList.remove('active'));\n  document.querySelectorAll('.profile-tab-panel').forEach(p=>p.classList.remove('active'));\n  if(btn)btn.classList.add('active');\n  const panel=document.getElementById('ptab-'+tab);\n  if(panel)panel.classList.add('active');\n}\n\nfunction saveProfile(){\n  if(!S.profile)S.profile={};\n  const av=document.getElementById('avatarEmojiInput').value.trim();\n  S.profile.avatar=av||'◈';\n  S.profile.name=document.getElementById('profileNameInput').value.trim();\n  S.profile.role=document.getElementById('profileRoleInput').value.trim();\n  S.profile.greetingName=document.getElementById('greetingNameInput').value.trim()||'Sir';\n  S.profile.warRoomName=document.getElementById('warRoomNameInput')?.value.trim()||'';\n  updateAppName();\n  \u002F\u002F Update avatar display\n  const emojiSpan=document.getElementById('profileAvatarEmoji');\n  if(emojiSpan&&!S.profile.avatarImg){emojiSpan.textContent=S.profile.avatar;}\n  document.getElementById('profileNameDisplay').textContent=S.profile.name||'Your Name';\n  document.getElementById('profileRoleDisplay').textContent=S.profile.role||'Operator · War Room';\n  \u002F\u002F update topbar profile chip if exists\n  save();\n  renderProfilePage();\n}\n\nfunction handleAvatarUpload(input){\n  const file=input.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=function(ev){\n    if(!S.profile)S.profile={};\n    S.profile.avatarImg=ev.target.result;\n    save();\n    \u002F\u002F Update display immediately\n    const av=document.getElementById('profileAvatar');\n    const emojiSpan=document.getElementById('profileAvatarEmoji');\n    if(av&&emojiSpan){\n      const oldImg=av.querySelector('img');if(oldImg)oldImg.remove();\n      const img=document.createElement('img');img.src=ev.target.result;\n      av.insertBefore(img,emojiSpan);\n      emojiSpan.style.display='none';\n    }\n  };\n  reader.readAsDataURL(file);\n  input.value=''; \u002F\u002F reset so same file can be re-uploaded\n}\n\nfunction clearAvatarImage(){\n  if(!S.profile)return;\n  delete S.profile.avatarImg;\n  save();renderProfilePage();\n}\n\nfunction toggleDarkFromProfile(el){\n  S.dark=el.checked;\n  document.getElementById('app').classList.toggle('dark',S.dark);\n  document.body.classList.toggle('dark',S.dark);\n  applyTheme();\n  renderThemePanel();\n  updateAppearSwatch();\n  save();\n}\n\nfunction _closeDangerModal(){\n  const m=document.getElementById('_dangerModal');\n  if(m) m.style.display='none';\n}\n\nfunction _dangerConfirm(msg, onConfirm){\n  let modal = document.getElementById('_dangerModal');\n  if(!modal){\n    modal = document.createElement('div');\n    modal.id = '_dangerModal';\n    modal.setAttribute('role','dialog');\n    modal.setAttribute('aria-modal','true');\n    modal.setAttribute('aria-label','Confirm action');\n    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px';\n\n    const card = document.createElement('div');\n    card.style.cssText = 'background:var(--surface);border:.5px solid var(--red);border-radius:var(--r);padding:24px;max-width:360px;width:100%';\n\n    const title = document.createElement('div');\n    title.style.cssText = 'font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:10px';\n    title.textContent = 'Danger Zone';\n\n    const msgEl = document.createElement('div');\n    msgEl.id = '_dangerModalMsg';\n    msgEl.style.cssText = 'font-size:13px;color:var(--text);margin-bottom:20px;line-height:1.5';\n\n    const btnRow = document.createElement('div');\n    btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';\n\n    const cancelBtn = document.createElement('button');\n    cancelBtn.textContent = 'Cancel';\n    cancelBtn.style.cssText = 'background:none;border:.5px solid var(--border2);color:var(--text3);font-family:Syne,sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border-radius:100px;cursor:pointer';\n    cancelBtn.onclick = _closeDangerModal;\n\n    const confirmBtn = document.createElement('button');\n    confirmBtn.id = '_dangerModalConfirm';\n    confirmBtn.textContent = 'Confirm';\n    confirmBtn.style.cssText = 'background:var(--red);border:.5px solid var(--red);color:#fff;font-family:Syne,sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border-radius:100px;cursor:pointer';\n\n    btnRow.appendChild(cancelBtn);\n    btnRow.appendChild(confirmBtn);\n    card.appendChild(title);\n    card.appendChild(msgEl);\n    card.appendChild(btnRow);\n    modal.appendChild(card);\n    document.body.appendChild(modal);\n  }\n\n  document.getElementById('_dangerModalMsg').textContent = msg;\n  modal.style.display = 'flex';\n  document.getElementById('_dangerModalConfirm').onclick = function(){\n    _closeDangerModal();\n    onConfirm();\n  };\n}\n\nfunction clearSessions(){\n  _dangerConfirm('Clear all focus session history? This cannot be undone.', function(){\n    S.sessions=[];save();renderProfilePage();\n  });\n}\n\nfunction resetWarRoom(){\n  _dangerConfirm('Delete ALL War Room data and start fresh? This cannot be undone.', function(){\n    localStorage.removeItem('stratusWR_v31');\n    if(currentUser&&_sb){_sb.from('war_room_data').delete().eq('user_id',currentUser.id).then(()=>location.reload());}else{location.reload();}\n  });\n}\n\u002F* showUserMenu \u002F forceSyncNow \u002F setSyncState — defined below *\u002F\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F BACKUP & UPDATE SYSTEM\n\u002F\u002F ══════════════════════════════════════════\n\nconst WAR_ROOM_VERSION = '6.0';\nconst DATA_KEYS = ['businesses','tasks','entries','notes','goals','goalLog','recent','wins','alarms','sessions','events','bills','invoices','profile','trackerPeriod','whiteboards','backups'];\nlet pendingUpdateHTML = null;\nlet step1Done = false;\n\nfunction exportAllData(label){\n  const snapshot = {\n    _warRoomVersion: WAR_ROOM_VERSION,\n    _exportDate: new Date().toISOString(),\n    _label: label||'Manual backup',\n    ...DATA_KEYS.reduce((obj,k)=>{obj[k]=S[k];return obj;},{})\n  };\n  const json = JSON.stringify(snapshot, null, 2);\n  const filename = 'warroom-backup-v'+WAR_ROOM_VERSION+'-'+new Date().toISOString().slice(0,10)+'.json';\n  const a = document.createElement('a');\n  a.href = 'data:application\u002Fjson;charset=utf-8,'+encodeURIComponent(json);\n  a.download = filename; a.click();\n\n  \u002F\u002F Record in backup history\n  if(!S.backups) S.backups=[];\n  S.backups.unshift({\n    date: new Date().toISOString(),\n    label: label||'Manual backup',\n    filename,\n    counts: {\n      businesses: S.businesses.length,\n      tasks: S.tasks.length,\n      entries: S.entries.length,\n      events: S.events.length,\n      bills: (S.bills||[]).length,\n      notes: S.notes.length,\n    }\n  });\n  if(S.backups.length > 20) S.backups = S.backups.slice(0,20);\n  save();\n  updateLastBackupLabel();\n  return filename;\n}\n\nfunction exportAndMarkStep1(){\n  exportAllData('Pre-update backup');\n  step1Done = true;\n  document.getElementById('step1Status').innerHTML = '<div class=\"update-dot green\"><\u002Fdiv>Backed up ✓';\n  const conf = document.getElementById('step1Confirm'); if(conf) conf.style.display='block';\n  \u002F\u002F Unlock step 2\n  const s2 = document.getElementById('step2Card');\n  if(s2){ s2.style.opacity='1'; s2.style.pointerEvents='auto'; }\n  document.getElementById('step2Status').innerHTML = '<div class=\"update-dot green\"><\u002Fdiv>Ready — load update file';\n}\n\nfunction updateLastBackupLabel(){\n  const el = document.getElementById('lastBackupLabel'); if(!el)return;\n  if(!S.backups||!S.backups.length){ el.textContent='No backup recorded yet'; return; }\n  const last = S.backups[0];\n  const d = new Date(last.date);\n  el.textContent = 'Last: '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});\n}\n\nfunction importData(input){\n  const file=input.files[0]; if(!file)return;\n  const reader=new FileReader();\n  reader.onload=async e=>{\n    try{\n      const data=JSON.parse(e.target.result);\n      if(!data._warRoomVersion && !data._stratusVersion && !data.businesses){\n        alert('Invalid backup file. Must be a War Room backup JSON.');\n        input.value=''; return;\n      }\n      if(confirm('FULL RESTORE: This replaces all current data with the backup. Continue?\\n\\nTip: Use Update Manager for a safe data-preserving merge instead.')){\n        \u002F\u002F Preserve backup history\n        const hist = S.backups||[];\n        DATA_KEYS.forEach(k=>{ if(data[k]!==undefined) S[k]=data[k]; });\n        S.backups = hist;\n        recalculateNextId();\n        save();\n        await saveToCloud(true);\n        location.reload();\n      }\n    }catch(err){ alert('Invalid file: '+err.message); }\n    input.value='';\n  };\n  reader.readAsText(file);\n}\n\n\u002F\u002F ── UPDATE MANAGER ──\nfunction loadUpdateFile(input){\n  const file=input.files[0]; if(!file)return;\n  if(!file.name.endsWith('.html')){\n    alert('Please select a War Room .html update file.'); input.value=''; return;\n  }\n  const reader=new FileReader();\n  reader.onload=e=>{\n    pendingUpdateHTML = e.target.result;\n    \u002F\u002F Navigate to update page and show preview\n    showPage('update');\n    setTimeout(()=>showUpdatePreview(), 200);\n  };\n  reader.readAsText(file);\n  input.value='';\n}\n\nfunction showUpdatePreview(){\n  if(!pendingUpdateHTML){ return; }\n  \u002F\u002F Extract version from update file\n  const verMatch = pendingUpdateHTML.match(\u002FWAR_ROOM_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]\u002F);\n  const newVer = verMatch ? verMatch[1] : 'Unknown';\n\n  \u002F\u002F Show step 3\n  const s3 = document.getElementById('step3Card');\n  if(s3) s3.style.display='block';\n  document.getElementById('step2Status').innerHTML = '<div class=\"update-dot green\"><\u002Fdiv>File loaded ✓';\n\n  \u002F\u002F Build preview list\n  const counts = {\n    'Businesses': S.businesses.length,\n    'Tasks & Missions': S.tasks.length,\n    'P&L Entries': S.entries.length,\n    'Calendar Events': S.events.length,\n    'Bills': (S.bills||[]).length,\n    'Intel Notes': S.notes.length,\n    'Goals': S.goals.length,\n    'Focus Sessions': S.sessions.length,\n    'Backup History': (S.backups||[]).length,\n  };\n  const el = document.getElementById('updatePreviewList');\n  if(el){\n    el.innerHTML = '<div style=\"font-size:11px;color:var(--text2);margin-bottom:10px\">Updating from <b>v'+WAR_ROOM_VERSION+'<\u002Fb> → <b>v'+newVer+'<\u002Fb><\u002Fdiv>'\n      + Object.entries(counts).map(([label,count])=>`\n        <div class=\"update-preview-row\">\n          <div class=\"update-preview-icon mod\">→<\u002Fdiv>\n          <div style=\"flex:1;font-size:12px;color:var(--text)\">${label}<\u002Fdiv>\n          <div style=\"font-size:11px;font-family:'DM Mono',monospace;color:var(--green);font-weight:700\">${count} records preserved<\u002Fdiv>\n        <\u002Fdiv>`).join('');\n  }\n\n  \u002F\u002F Unlock step 1 if not already done\n  if(!step1Done){\n    document.getElementById('step1Status').innerHTML='<div class=\"update-dot red\"><\u002Fdiv>Backup first!';\n  }\n}\n\nfunction applyUpdate(){\n  if(!pendingUpdateHTML){ alert('No update file loaded.'); return; }\n  if(!step1Done){\n    if(!confirm('You have not exported a backup yet. Proceed anyway? (Your data will still be merged but there is no fallback.)')){return;}\n  }\n\n  \u002F\u002F Extract the data injection point from the update HTML\n  \u002F\u002F We inject current S data into the new HTML's localStorage key before launch\n  try{\n    \u002F\u002F Create a data payload with version stamp\n    const mergePayload = {\n      _warRoomVersion: WAR_ROOM_VERSION,\n      _mergeDate: new Date().toISOString(),\n    };\n    DATA_KEYS.forEach(k=>{ if(S[k]!==undefined) mergePayload[k]=S[k]; });\n\n    \u002F\u002F Write current data to localStorage under the same key so new page picks it up\n    localStorage.setItem('stratusWR_v31', JSON.stringify(mergePayload));\n\n    \u002F\u002F Also write a merge-ready flag so new version knows to skip onboarding\n    localStorage.setItem('stratusUpdateMerge', '1');\n\n    \u002F\u002F Launch the new HTML in the current window\n    const blob = new Blob([pendingUpdateHTML], {type:'text\u002Fhtml'});\n    const url = URL.createObjectURL(blob);\n    window.location.href = url;\n  } catch(err){\n    alert('Update failed: '+err.message+'\\n\\nYour data has not been changed.');\n  }\n}\n\nfunction cancelUpdate(){\n  pendingUpdateHTML=null;\n  const s3=document.getElementById('step3Card'); if(s3) s3.style.display='none';\n  document.getElementById('step2Status').innerHTML='<div class=\"update-dot amber\"><\u002Fdiv>Ready — load update file';\n}\n\n\n\u002F\u002F ══ DATA PATCHER ══════════════════════════════════════════════════════════════\n\nconst PATCHES = [\n  { id:'fix-duplicate-ids',  name:'Fix Duplicate Business IDs',    desc:'Scans all data arrays, finds ID collisions, reassigns unique IDs and updates all bizId cross-references.', run:patchFixDuplicateIds },\n  { id:'fix-orphaned-tasks', name:'Remove Orphaned Tasks',         desc:'Deletes missions linked to business IDs that no longer exist.', run:patchOrphanedTasks },\n  { id:'fix-orphaned-events',name:'Remove Orphaned Events',        desc:'Cleans calendar events referencing deleted businesses.', run:patchOrphanedEvents },\n  { id:'fix-orphaned-entries',name:'Remove Orphaned P&L Entries',  desc:'Removes P&L entries tied to businesses that no longer exist.', run:patchOrphanedEntries },\n  { id:'fix-streams',        name:'Clean Orphaned Intel Streams',  desc:'Removes intel stream entries for deleted businesses and purges empty stream keys.', run:patchOrphanedStreams },\n  { id:'fix-nextid',         name:'Recalibrate ID Counter',        desc:'Forces nextId to max existing ID + 1, preventing all future ID collisions.', run:patchRecalibrateNextId },\n  { id:'fix-all',            name:'⚡ Run All Patches',            desc:'Runs every patch above in sequence. Recommended after any import or restore.', run:patchRunAll }\n];\n\nlet selectedPatchId = null;\n\nfunction renderPatchList() {\n  const el = document.getElementById('patchList'); if(!el) return;\n  el.innerHTML = PATCHES.map(p => `\n    <div onclick=\"selectPatch('${p.id}')\" style=\"display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:.5px solid ${selectedPatchId===p.id?'var(--blue)':'var(--border2)'};border-radius:var(--rs);cursor:pointer;background:${selectedPatchId===p.id?'var(--blue-bg)':'var(--bg2)'};transition:all .15s\">\n      <div style=\"width:14px;height:14px;border-radius:50%;border:1.5px solid ${selectedPatchId===p.id?'var(--blue)':'var(--border2)'};display:flex;align-items:center;justify-content:center;margin-top:1px;flex-shrink:0\">\n        ${selectedPatchId===p.id?'<div style=\"width:7px;height:7px;border-radius:50%;background:var(--blue)\"><\u002Fdiv>':''}\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px\">${p.name}<\u002Fdiv>\n        <div style=\"font-size:10px;color:var(--text3);line-height:1.5\">${p.desc}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\nfunction togglePatcher(){\n  const body=document.getElementById('patcherBody');\n  const chevron=document.getElementById('patcherChevron');\n  if(!body)return;\n  const open = body.style.display!=='block';\n  body.style.display = open ? 'block' : 'none';\n  if(chevron) chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';\n  if(open) renderPatchList();\n}\n\nfunction selectPatch(id){ selectedPatchId=id; renderPatchList(); }\n\nfunction patchLog(msg){\n  const el=document.getElementById('patchLog'), wrap=document.getElementById('patchLogWrap'); if(!el||!wrap)return;\n  wrap.style.display='block'; el.textContent+=msg+'\\n'; el.scrollTop=el.scrollHeight;\n}\n\nfunction clearPatchLog(){\n  const el=document.getElementById('patchLog'),wrap=document.getElementById('patchLogWrap');\n  if(el)el.textContent=''; if(wrap)wrap.style.display='none';\n  const st=document.getElementById('patcherStatus'); if(st)st.innerHTML='<div class=\"update-dot amber\"><\u002Fdiv>Ready';\n}\n\nfunction setPatcherStatus(label,color){\n  const st=document.getElementById('patcherStatus'); if(st)st.innerHTML=`<div class=\"update-dot ${color}\"><\u002Fdiv>${label}`;\n}\n\nfunction runSelectedPatch(){\n  if(!selectedPatchId){ patchLog('⚠ No patch selected. Pick one above.'); return; }\n  const patch=PATCHES.find(p=>p.id===selectedPatchId); if(!patch)return;\n  const btn=document.getElementById('runPatchBtn');\n  if(btn){btn.disabled=true;btn.textContent='Running…';}\n  patchLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');\n  patchLog('▶ '+patch.name);\n  patchLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');\n  try{\n    patch.run();\n    save();\n    setPatcherStatus('Patch applied ✓','green');\n    patchLog('✅ Saved.');\n  } catch(err){\n    patchLog('❌ Error: '+err.message);\n    setPatcherStatus('Error — check log','red');\n  }\n  if(btn){btn.disabled=false;btn.textContent='Run Patch →';}\n}\n\nfunction patchFixDuplicateIds(){\n  const allArrays=['businesses','tasks','entries','notes','goals','goalLog','recent','wins','alarms','sessions','events','bills'];\n  const seen=new Set(); const idMap={}; let totalFixed=0;\n  let maxId=0;\n  allArrays.forEach(k=>{if(Array.isArray(S[k]))S[k].forEach(item=>{if(item&&item.id>maxId)maxId=item.id;});});\n  if(S.streams)Object.values(S.streams).forEach(arr=>{if(Array.isArray(arr))arr.forEach(item=>{if(item&&item.id>maxId)maxId=item.id;});});\n  let nextFree=maxId+1;\n\n  allArrays.forEach(k=>{\n    if(!Array.isArray(S[k]))return;\n    S[k].forEach(item=>{\n      if(!item||typeof item.id!=='number')return;\n      if(seen.has(item.id)){\n        const newId=nextFree++;\n        patchLog(`  [${k}] Duplicate ID ${item.id} → ${newId} (\"${item.name||item.title||item.text||'?'}\")`);\n        idMap[item.id]=newId; item.id=newId; totalFixed++;\n      } else { seen.add(item.id); }\n    });\n  });\n\n  if(Object.keys(idMap).length>0){\n    ['tasks','entries','notes','goals','recent','events','bills'].forEach(k=>{\n      if(!Array.isArray(S[k]))return;\n      S[k].forEach(item=>{ if(item&&item.bizId&&idMap[item.bizId]!==undefined){ patchLog(`  [${k}] Updated bizId ref ${item.bizId} → ${idMap[item.bizId]}`); item.bizId=idMap[item.bizId]; }});\n    });\n    if(S.streams){\n      Object.keys(idMap).forEach(oldId=>{\n        const newId=idMap[oldId];\n        if(S.streams[oldId]){S.streams[newId]=S.streams[oldId];delete S.streams[oldId];patchLog(`  [streams] Remapped key ${oldId} → ${newId}`);}\n      });\n    }\n  }\n  patchLog(totalFixed===0?'✓ No duplicate IDs found. Data is clean.':`✓ Fixed ${totalFixed} duplicate ID(s).`);\n}\n\nfunction patchOrphanedTasks(){\n  const valid=new Set(S.businesses.map(b=>b.id));\n  const before=S.tasks.length; S.tasks=S.tasks.filter(t=>!t.bizId||valid.has(t.bizId));\n  patchLog(before-S.tasks.length>0?`✓ Removed ${before-S.tasks.length} orphaned task(s).`:'✓ No orphaned tasks.');\n}\n\nfunction patchOrphanedEvents(){\n  const valid=new Set(S.businesses.map(b=>b.id));\n  const before=S.events.length; S.events=S.events.filter(e=>!e.bizId||valid.has(e.bizId));\n  patchLog(before-S.events.length>0?`✓ Removed ${before-S.events.length} orphaned event(s).`:'✓ No orphaned events.');\n}\n\nfunction patchOrphanedEntries(){\n  const valid=new Set(S.businesses.map(b=>b.id));\n  const before=S.entries.length; S.entries=S.entries.filter(e=>!e.bizId||valid.has(e.bizId));\n  patchLog(before-S.entries.length>0?`✓ Removed ${before-S.entries.length} orphaned P&L entry(s).`:'✓ No orphaned P&L entries.');\n}\n\nfunction patchOrphanedStreams(){\n  if(!S.streams||typeof S.streams!=='object'){patchLog('✓ No streams data.'); return;}\n  const valid=new Set(S.businesses.map(b=>String(b.id)));\n  let removedKeys=0,removedItems=0;\n  Object.keys(S.streams).forEach(key=>{\n    if(!valid.has(key)){removedItems+=(S.streams[key]||[]).length;delete S.streams[key];removedKeys++;patchLog(`  Removed stream for deleted biz ID ${key}`);}\n  });\n  patchLog(removedKeys>0?`✓ Removed ${removedKeys} orphaned stream(s) (${removedItems} entries).`:'✓ No orphaned streams.');\n}\n\nfunction patchRecalibrateNextId(){\n  const before=S.nextId; recalculateNextId();\n  patchLog(`✓ nextId: ${before} → ${S.nextId}`);\n}\n\nfunction patchRunAll(){\n  patchLog('Running all patches in sequence…\\n');\n  patchFixDuplicateIds(); patchLog('');\n  patchOrphanedTasks(); patchOrphanedEvents(); patchOrphanedEntries(); patchOrphanedStreams(); patchLog('');\n  patchRecalibrateNextId();\n  patchLog('\\n✅ All patches complete.');\n}\n\n\u002F\u002F ── UPDATE PAGE RENDERS ──\nfunction renderUpdatePage(){\n  renderUpdateStatusStrip();\n  renderDataSummary();\n  renderBackupHistory();\n  updateLastBackupLabel();\n  renderPatchList();\n}\n\nfunction renderUpdateStatusStrip(){\n  const el=document.getElementById('updateStatusStrip'); if(!el)return;\n  const lastBackup=S.backups&&S.backups.length?new Date(S.backups[0].date):null;\n  const daysSince=lastBackup?Math.round((Date.now()-lastBackup)\u002F86400000):null;\n  const backupStatus=daysSince===null?'No backup yet':daysSince===0?'Backed up today':daysSince===1?'Yesterday':daysSince+' days ago';\n  const backupCls=daysSince===null?'neg':daysSince>7?'neg':daysSince>3?'':'pos';\n  el.innerHTML=[\n    {lbl:'Current Version',val:'v'+WAR_ROOM_VERSION,sub:'War Room'},\n    {lbl:'Last Backup',val:backupStatus,sub:lastBackup?lastBackup.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Never',cls:backupCls},\n    {lbl:'Total Data Records',val:S.businesses.length+S.tasks.length+S.entries.length+S.events.length+(S.bills||[]).length,sub:'Across all modules'},\n  ].map(k=>`<div class=\"card card-sm\"><div class=\"cl\">${k.lbl}<\u002Fdiv><div class=\"cv ${k.cls||''}\">${k.val}<\u002Fdiv><div class=\"cs\">${k.sub}<\u002Fdiv><\u002Fdiv>`).join('');\n}\n\nfunction renderDataSummary(){\n  const el=document.getElementById('dataSummaryList'); if(!el)return;\n  const rows=[\n    {icon:'◈',label:'Businesses',val:S.businesses.length},\n    {icon:'◎',label:'Missions',val:S.tasks.length},\n    {icon:'◇',label:'P&L Entries',val:S.entries.length},\n    {icon:'▦',label:'Events',val:S.events.length},\n    {icon:'◫',label:'Bills',val:(S.bills||[]).length},\n    {icon:'◉',label:'Intel Notes',val:S.notes.length},\n    {icon:'◈',label:'Goals',val:S.goals.length},\n    {icon:'◷',label:'Sessions',val:S.sessions.length},\n  ];\n  el.innerHTML=rows.map(r=>`\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"font-size:10px;color:var(--text3)\">${r.icon}<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:600;color:var(--text)\">${r.label}<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;font-family:'DM Mono',monospace;font-weight:700;color:var(--text)\">${r.val}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n}\n\nfunction renderBackupHistory(){\n  const el=document.getElementById('backupHistoryList'); if(!el)return;\n  if(!S.backups||!S.backups.length){\n    el.innerHTML='<div style=\"font-size:10px;color:var(--text3);padding:8px 0;font-family:DM Mono,monospace\">No backups yet. Export a backup to start your history.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML=S.backups.map((b,i)=>{\n    const d=new Date(b.date);\n    const age=Math.round((Date.now()-d)\u002F86400000);\n    const ageStr=age===0?'Today':age===1?'Yesterday':age+'d ago';\n    return`<div class=\"backup-history-row\">\n      <div class=\"backup-icon\" style=\"${i===0?'background:var(--green-bg)':'background:var(--bg2);'}\">\n        <span style=\"font-size:13px\">${i===0?'✓':'📁'}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--text)\">${b.label||'Backup'}<\u002Fdiv>\n        <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)\">${d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} · ${ageStr}<\u002Fdiv>\n        <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)\">${Object.entries(b.counts||{}).map(([k,v])=>v+' '+k).join(' · ')}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction clearBackupHistory(){\n  _dangerConfirm('Clear backup history records? (This does not delete your exported files.)', function(){\n    S.backups=[];save();renderBackupHistory();\n  });\n}\n\n\u002F\u002F ── EDIT FUNCTIONS ──\n\n\u002F\u002F BIZ\nfunction openEditBiz(id){\n  editingBizId=id;\n  const b=bizById(id);if(!b)return;\n  document.getElementById('editBizName').value=b.name;\n  document.getElementById('editBizType').value=b.type||'';\n  document.getElementById('editBizFocus').value=b.focus||'';\n  document.getElementById('editBizStatus').value=b.status||'Active';\n  openModal('editBizModal');\n}\nfunction saveEditBiz(){\n  const b=bizById(editingBizId);if(!b)return;\n  b.name=document.getElementById('editBizName').value.trim()||b.name;\n  b.type=document.getElementById('editBizType').value.trim();\n  b.focus=document.getElementById('editBizFocus').value.trim();\n  b.status=document.getElementById('editBizStatus').value;\n  save();closeModal('editBizModal');refreshBizNav();renderProfileBizGrid();\n  if(currentPage==='profile')renderProfilePage();\n  if(currentPage==='bizprofile')renderBizProfile(editingBizId);\n}\n\nfunction previewBizLogo(input,bizId){\n  if(!input.files||!input.files[0])return;\n  const reader=new FileReader();\n  reader.onload=function(e){\n    if(!window._pendingBizLogo)window._pendingBizLogo={};\n    window._pendingBizLogo[bizId]=e.target.result;\n    const preview=document.getElementById('cp-logo-preview');\n    if(preview)preview.innerHTML='<img src=\"'+e.target.result+'\" style=\"width:100%;height:100%;object-fit:cover;border-radius:10px\">';\n  };\n  reader.readAsDataURL(input.files[0]);\n}\nfunction removeBizLogo(bizId){\n  const b=bizById(bizId);if(!b)return;\n  b.logo=null;\n  if(window._pendingBizLogo)delete window._pendingBizLogo[bizId];\n  save();renderBizProfile(bizId);\n}\nfunction saveControlPanel(bizId){\n  const b=bizById(bizId);if(!b)return;\n  b.name=document.getElementById('cp-name').value.trim()||b.name;\n  b.tagline=document.getElementById('cp-tagline').value.trim();\n  b.type=document.getElementById('cp-type').value.trim();\n  b.status=document.getElementById('cp-status').value;\n  b.focus=document.getElementById('cp-focus').value.trim();\n  b.website=document.getElementById('cp-website').value.trim();\n  b.targetMarket=document.getElementById('cp-targetMarket').value.trim();\n  b.founded=document.getElementById('cp-founded').value.trim();\n  b.revenueGoal=parseFloat(document.getElementById('cp-revenueGoal').value)||0;\n  if(window._pendingBizLogo&&window._pendingBizLogo[bizId]){b.logo=window._pendingBizLogo[bizId];delete window._pendingBizLogo[bizId];}\n  save();refreshBizNav();renderProfileBizGrid();renderBizProfile(bizId);\n}\n\n\u002F\u002F NOTE\nfunction openEditNote(id){\n  editingNoteId=id;\n  const n=S.notes.find(x=>x.id===id);if(!n)return;\n  refreshSelects();\n  document.getElementById('editNoteBiz').value=n.bizId||'';\n  document.getElementById('editNoteTitle').value=n.title;\n  document.getElementById('editNoteBody').value=n.body;\n  openModal('editNoteModal');\n}\nfunction saveEditNote(){\n  const n=S.notes.find(x=>x.id===editingNoteId);if(!n)return;\n  n.bizId=parseInt(document.getElementById('editNoteBiz').value)||null;\n  n.title=document.getElementById('editNoteTitle').value.trim()||n.title;\n  n.body=document.getElementById('editNoteBody').value.trim();\n  save();closeModal('editNoteModal');renderNotes();if(currentPage==='bizprofile'&&currentBizId)renderBizProfile(currentBizId);\n}\n\n\u002F\u002F GOAL\nfunction openEditGoal(id){\n  editingGoalId=id;\n  const g=S.goals.find(x=>x.id===id);if(!g)return;\n  refreshSelects();\n  document.getElementById('lgcEditGoalText').value=g.text||'';\n  document.getElementById('lgcEditGoalType').value=g.type||'Strategy';\n  const eb=document.getElementById('lgcEditGoalBiz');if(eb)eb.value=g.bizId||'';\n  const ep=document.getElementById('lgcEditGoalPriority');if(ep)ep.value=g.priority||'Medium';\n  const ed=document.getElementById('lgcEditGoalDeadline');if(ed)ed.value=g.deadline||'';\n  openModal('editGoalModal');\n}\nfunction saveEditGoal(){\n  const g=S.goals.find(x=>x.id===editingGoalId);if(!g)return;\n  g.bizId=parseInt(document.getElementById('lgcEditGoalBiz').value)||null;\n  g.text=document.getElementById('lgcEditGoalText').value.trim()||g.text;\n  g.type=document.getElementById('lgcEditGoalType').value;\n  g.priority=document.getElementById('lgcEditGoalPriority')?.value||g.priority||'Medium';\n  g.deadline=document.getElementById('lgcEditGoalDeadline')?.value||g.deadline||'';\n  save();closeModal('editGoalModal');renderGoals();renderGoalsPage();\n  if(currentPage==='profile')renderProfilePage();\n}\n\n\u002F\u002F TASK\nfunction openEditTask(id){\n  editingTaskId=id;\n  const t=S.tasks.find(x=>x.id===id);if(!t)return;\n  refreshSelects();\n  document.getElementById('editTaskBiz').value=t.bizId||'';\n  document.getElementById('editTaskTitle').value=t.title;\n  document.getElementById('editTaskType').value=t.type||'Strategy';\n  document.getElementById('editTaskPriority').value=t.priority||'High';\n  document.getElementById('editTaskStatus').value=t.status||'Planned';\n  document.getElementById('editTaskNotes').value=t.notes||'';\n  openModal('editTaskModal');\n}\nfunction saveEditTask(){\n  const t=S.tasks.find(x=>x.id===editingTaskId);if(!t)return;\n  t.bizId=parseInt(document.getElementById('editTaskBiz').value)||null;\n  t.title=document.getElementById('editTaskTitle').value.trim()||t.title;\n  t.type=document.getElementById('editTaskType').value;\n  t.priority=document.getElementById('editTaskPriority').value;\n  t.status=document.getElementById('editTaskStatus').value;\n  t.notes=document.getElementById('editTaskNotes').value.trim();\n  save();closeModal('editTaskModal');renderKanban();updateBadges();renderDashboard();\n}\n\n\u002F\u002F EVENT\nfunction openEditEvent(id){\n  editingEventId=id;\n  const e=S.events.find(x=>x.id===id);if(!e)return;\n  const evBiz=document.getElementById('editEventBiz');\n  evBiz.innerHTML='<option value=\"\">None \u002F Personal<\u002Foption>'+S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n  document.getElementById('editEventTitle').value=e.title;\n  document.getElementById('editEventDate').value=e.date;\n  document.getElementById('editEventTime').value=e.time||'';\n  document.getElementById('editEventType').value=e.type||'strategy';\n  evBiz.value=e.bizId||'';\n  document.getElementById('editEventNotes').value=e.notes||'';\n  const er=document.getElementById('editEventRepeat');if(er)er.value=e.repeat||'none';\n  const ere=document.getElementById('editEventRepeatEnd');if(ere)ere.value=e.repeatEnd||'';\n  openModal('editEventModal');\n}\nfunction saveEditEvent(){\n  const e=S.events.find(x=>x.id===editingEventId);if(!e)return;\n  e.title=document.getElementById('editEventTitle').value.trim()||e.title;\n  e.date=document.getElementById('editEventDate').value||e.date;\n  e.time=document.getElementById('editEventTime').value||'';\n  e.type=document.getElementById('editEventType').value;\n  const bv=document.getElementById('editEventBiz').value;\n  e.bizId=bv?parseInt(bv):null;\n  e.notes=document.getElementById('editEventNotes').value.trim();\n  e.repeat=document.getElementById('editEventRepeat')?.value||'none';\n  e.repeatEnd=document.getElementById('editEventRepeatEnd')?.value||'';\n  save();closeModal('editEventModal');\n  if(currentPage==='calendar'){renderCalendar();renderUpcoming();if(selectedCalDay)renderDayView(selectedCalDay);}\n  renderDashboard();\n}\n\n\u002F\u002F ENTRY\nfunction openEditEntry(id){\n  editingEntryId=id;\n  const e=S.entries.find(x=>x.id===id);if(!e)return;\n  refreshSelects();\n  document.getElementById('editEntryBiz').value=e.bizId||'';\n  document.getElementById('editEntryDate').value=e.date;\n  document.getElementById('editEntryDay').value=e.day||'';\n  document.getElementById('editEntryDesc').value=e.desc;\n  document.getElementById('editEntryCat').value=e.cat||'';\n  document.getElementById('editEntryRev').value=e.rev;\n  document.getElementById('editEntryExp').value=e.exp;\n  openModal('editEntryModal');\n}\nfunction saveEditEntry(){\n  const e=S.entries.find(x=>x.id===editingEntryId);if(!e)return;\n  e.bizId=parseInt(document.getElementById('editEntryBiz').value)||null;\n  e.date=document.getElementById('editEntryDate').value||e.date;\n  e.day=document.getElementById('editEntryDay').value||'';\n  e.desc=document.getElementById('editEntryDesc').value.trim()||e.desc;\n  e.cat=document.getElementById('editEntryCat').value.trim()||e.cat;\n  e.rev=parseFloat(document.getElementById('editEntryRev').value)||0;\n  e.exp=parseFloat(document.getElementById('editEntryExp').value)||0;\n  save();closeModal('editEntryModal');renderTracker();renderDashboard();\n}\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F LAUNCH SYSTEM — Debrief \u002F EOM \u002F FOM\n\u002F\u002F ══════════════════════════════════════════\n\nlet debriefStep = 0;\nconst DEBRIEF_STEPS = 5;\nlet debriefData = {energy:'', intention:'', bizFocus:[], blockers:''};\nlet fomNewGoals = [];\n\nfunction closeLaunch(id){\n  const el = document.getElementById(id);\n  el.classList.add('fading');\n  setTimeout(() => { el.style.display='none'; el.classList.remove('fading'); }, 400);\n  \u002F\u002F mark today as launched so it doesn't repeat this session\n  if(id==='debriefOverlay') sessionStorage.setItem('stratusDebriefDone', '1');\n  if(id==='eomOverlay') sessionStorage.setItem('stratusEomDone', '1');\n  if(id==='fomOverlay') sessionStorage.setItem('stratusFomDone', '1');\n}\n\nfunction showLaunch(id){\n  const el = document.getElementById(id);\n  el.style.display='flex';\n}\n\n\u002F\u002F ── DAILY DEBRIEF ──\nfunction initDebrief(){\n  const now = new Date();\n  const gh = now.getHours();\n  const gn = (S.profile&&S.profile.name&&S.profile.name.trim())||(S.profile&&S.profile.greetingName)||'Sir';\n  const realGreet = gh<12?'Good morning':gh<17?'Good afternoon':gh<21?'Good evening':'Good night';\n  document.getElementById('debriefGreeting').textContent = realGreet + ', ' + gn + '.';\n  document.getElementById('debriefDate').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});\n\n  \u002F\u002F populate biz tags\n  const btWrap = document.getElementById('bizFocusTags');\n  if(btWrap) btWrap.innerHTML = S.businesses.map((b,i)=>\n    `<button class=\"debrief-tag\" onclick=\"toggleTag(this,'bizFocus')\" data-biz=\"${b.id}\" style=\"border-color:${BIZ_COLORS[i%BIZ_COLORS.length]}40\">${b.name}<\u002Fbutton>`\n  ).join('');\n\n  debriefStep = 0;\n  debriefData = {energy:'', intention:'', bizFocus:[], blockers:''};\n  renderDebriefProgress();\n  showDebriefStep(0);\n  showLaunch('debriefOverlay');\n}\n\nfunction renderDebriefProgress(){\n  const prog = document.getElementById('debriefProgress');\n  if(!prog) return;\n  prog.innerHTML = Array.from({length:DEBRIEF_STEPS},(_,i)=>\n    `<div class=\"dp-pip ${i<=debriefStep?'done':''}\"><\u002Fdiv>`\n  ).join('');\n}\n\nfunction showDebriefStep(step){\n  document.querySelectorAll('.debrief-step').forEach(el=>el.classList.remove('active'));\n  const el = document.getElementById('dstep-'+step);\n  if(el) el.classList.add('active');\n  document.getElementById('debriefBack').style.display = step>0?'':'none';\n  const nextBtn = document.getElementById('debriefNext');\n  if(step===DEBRIEF_STEPS-1){ nextBtn.textContent='Launch Day →'; }\n  else { nextBtn.textContent='Next →'; }\n  renderDebriefProgress();\n\n  \u002F\u002F Build summary on last step\n  if(step===4){\n    const energy = document.querySelectorAll('#dstep-0 .debrief-tag.sel');\n    const energyText = [...energy].map(t=>t.textContent).join(', ') || 'Not specified';\n    const intention = document.getElementById('d-intention')?.value||'—';\n    const bizSel = document.querySelectorAll('#dstep-2 .debrief-tag.sel');\n    const bizText = [...bizSel].map(t=>t.textContent).join(', ') || 'All ventures';\n    const blockers = document.getElementById('d-blockers')?.value||'Nothing noted';\n    document.getElementById('debriefSummary').innerHTML = `\n      <div style=\"margin-bottom:8px\"><span style=\"font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Energy Today<\u002Fspan><br>${energyText}<\u002Fdiv>\n      <div style=\"margin-bottom:8px\"><span style=\"font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Non-Negotiable Win<\u002Fspan><br>${intention}<\u002Fdiv>\n      <div style=\"margin-bottom:8px\"><span style=\"font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Focus Ventures<\u002Fspan><br>${bizText}<\u002Fdiv>\n      <div><span style=\"font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)\">Blockers<\u002Fspan><br>${blockers||'Nothing blocking me'}<\u002Fdiv>\n    `;\n    \u002F\u002F Log intention as recent work item\n    const intentVal = document.getElementById('d-intention')?.value?.trim();\n    if(intentVal){\n      const now=new Date();\n      S.recent.unshift({id:S.nextId++,text:'Intention: '+intentVal,bizId:null,type:'Planning',ts:'Today, '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});\n      if(S.recent.length>10)S.recent=S.recent.slice(0,10);\n      save();\n    }\n  }\n}\n\nfunction debriefNav(dir){\n  if(dir===1 && debriefStep===DEBRIEF_STEPS-1){ closeLaunch('debriefOverlay'); renderDashboard(); return; }\n  debriefStep = Math.max(0, Math.min(DEBRIEF_STEPS-1, debriefStep+dir));\n  showDebriefStep(debriefStep);\n}\n\nfunction toggleTag(el, group){\n  if(group==='energy'){\n    document.querySelectorAll('#dstep-0 .debrief-tag').forEach(t=>t.classList.remove('sel'));\n    el.classList.toggle('sel');\n  } else {\n    el.classList.toggle('sel');\n  }\n}\n\nfunction appendBlocker(text){\n  const ta=document.getElementById('d-blockers');\n  if(!ta)return;\n  ta.value=(ta.value?ta.value+', ':'')+text;\n}\n\n\u002F\u002F ── END OF MONTH ──\nfunction initEom(){\n  const now=new Date();\n  const prevMonth=new Date(now.getFullYear(), now.getMonth()-1, 1);\n  const monthName=prevMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});\n  const ym=prevMonth.toISOString().slice(0,7);\n\n  document.getElementById('eomTitle').textContent=monthName+' — How did it go?';\n  document.getElementById('eomSub').textContent='Your full month breakdown before you close out '+monthName+'.';\n\n  \u002F\u002F financials\n  const monthEnts=S.entries.filter(e=>e.date===ym);\n  const rev=monthEnts.reduce((a,e)=>a+e.rev,0);\n  const exp=monthEnts.reduce((a,e)=>a+e.exp,0);\n  const net=rev-exp;\n  const mg=rev?Math.round((net\u002Frev)*100):0;\n  const doneTasks=S.tasks.filter(t=>t.status==='Done').length;\n  const hoursTotal=(S.sessions.reduce((a,s)=>a+s.duration,0)\u002F3600).toFixed(1);\n\n  document.getElementById('eomStatGrid').innerHTML=[\n    {val:'$'+rev.toLocaleString(),lbl:'Revenue'},\n    {val:'$'+exp.toLocaleString(),lbl:'Expenses'},\n    {val:(net>=0?'+':'-')+' $'+Math.abs(net).toLocaleString(),lbl:'Net Profit',cls:net>=0?'pos':'neg'},\n    {val:mg+'%',lbl:'Margin',cls:mg>=0?'pos':'neg'},\n  ].map(s=>`<div class=\"month-stat-card\"><div class=\"month-stat-val ${s.cls||''}\">${s.val}<\u002Fdiv><div class=\"month-stat-lbl\">${s.lbl}<\u002Fdiv><\u002Fdiv>`).join('');\n\n  \u002F\u002F biz breakdown\n  const byB={};\n  monthEnts.forEach(e=>{if(!byB[e.bizId])byB[e.bizId]={rev:0,exp:0};byB[e.bizId].rev+=e.rev;byB[e.bizId].exp+=e.exp;});\n  const maxRev=Math.max(...Object.values(byB).map(v=>v.rev),1);\n  const bizHtml=Object.entries(byB).map(([id,v])=>{\n    const biz=bizById(parseInt(id));const net=v.rev-v.exp;const pct=Math.round((v.rev\u002FmaxRev)*100);\n    const color=biz?bizColor(parseInt(id)):'var(--text3)';\n    return`<div class=\"month-biz-row\"><div style=\"font-size:12px;font-weight:700;color:var(--text);min-width:110px\">${biz?biz.name:'Unknown'}<\u002Fdiv><div class=\"month-biz-bar-wrap\"><div class=\"month-biz-bar\" style=\"width:${pct}%;background:${color}\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);min-width:80px;text-align:right\">$${v.rev.toLocaleString()}<\u002Fdiv><div style=\"font-size:11px;font-family:'DM Mono',monospace;min-width:70px;text-align:right\" class=\"${net>=0?'pos':'neg'}\">${net>=0?'+':'-'}$${Math.abs(net).toLocaleString()}<\u002Fdiv><\u002Fdiv>`;\n  }).join('')||'<div style=\"font-size:10px;color:var(--text3)\">No financial entries for this month.<\u002Fdiv>';\n  document.getElementById('eomBizBreakdown').innerHTML=bizHtml;\n\n  \u002F\u002F goals recap\n  const goalsHtml=S.goals.length?S.goals.map(g=>{\n    const biz=bizById(g.bizId);\n    return`<div style=\"display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--border)\">\n      <div style=\"width:16px;height:16px;border-radius:50%;${g.done?'background:var(--accent);border:.5px solid var(--accent)':'border:.5px solid var(--border2)'};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--accent-fg)\">${g.done?'✓':''}<\u002Fdiv>\n      <div style=\"flex:1;font-size:12px;color:var(--text);${g.done?'text-decoration:line-through;opacity:.5':''}\">${g.text}<\u002Fdiv>\n      <div style=\"font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)\">${biz?biz.name:''}<\u002Fdiv>\n      <span class=\"badge ${g.done?'b-green':'b-muted'}\">${g.done?'Done':'Open'}<\u002Fspan>\n    <\u002Fdiv>`;\n  }).join(''):'<div style=\"font-size:10px;color:var(--text3)\">No goals were set this month.<\u002Fdiv>';\n  document.getElementById('eomGoalsRecap').innerHTML=goalsHtml;\n\n  \u002F\u002F missions\n  const doneTasksAll=S.tasks.filter(t=>t.status==='Done').slice(0,5);\n  document.getElementById('eomMissionsRecap').innerHTML=doneTasksAll.length?doneTasksAll.map(t=>{\n    const biz=bizById(t.bizId);\n    return`<div style=\"display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)\"><div style=\"width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0\"><\u002Fdiv><div style=\"flex:1;font-size:11px;color:var(--text)\">${t.title}<\u002Fdiv>${biz?`<span class=\"badge b-muted\">${biz.name}<\u002Fspan>`:''}<\u002Fdiv>`;\n  }).join(''):'<div style=\"font-size:10px;color:var(--text3)\">No missions marked done yet.<\u002Fdiv>';\n\n  showLaunch('eomOverlay');\n}\n\nfunction saveEomReflection(){\n  const ref=document.getElementById('eomReflection')?.value?.trim();\n  if(ref){\n    if(!S.notes)S.notes=[];\n    const now=new Date();\n    const prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1);\n    S.notes.push({id:S.nextId++,bizId:null,title:'Month Reflection — '+prevMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'}),body:ref,date:now.toISOString().slice(0,10)});\n    save();\n    if(typeof renderNotes==='function')renderNotes();\n  }\n}\n\n\u002F\u002F ── FIRST OF MONTH \u002F MONTHLY ONBOARDING ──\nlet fomCurrentStep = 0;\nconst FOM_STEPS = 4;\n\nfunction fomNav(dir){\n  if(dir===1 && fomCurrentStep===FOM_STEPS-1){ saveFomGoals(); return; }\n  fomCurrentStep = Math.max(0, Math.min(FOM_STEPS-1, fomCurrentStep+dir));\n  showFomStep(fomCurrentStep);\n}\n\nfunction showFomStep(step){\n  for(let i=0;i<FOM_STEPS;i++){\n    const el=document.getElementById('fomStep'+i);\n    if(el) el.style.display = i===step?'':'none';\n  }\n  const dots=document.getElementById('fomStepDots');\n  if(dots) dots.innerHTML=Array.from({length:FOM_STEPS},(_,i)=>\n    `<div style=\"height:3px;width:${i===step?28:16}px;border-radius:2px;background:${i<=step?'var(--accent)':'var(--bg3)'};transition:all .25s ease\"><\u002Fdiv>`\n  ).join('');\n  if(step===3) fomBuildSummary();\n}\n\nfunction initFom(){\n  const now=new Date();\n  const thisMonthName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});\n  const prevMonth=new Date(now.getFullYear(), now.getMonth()-1, 1);\n  const prevMonthName=prevMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});\n  const prevYM=prevMonth.toISOString().slice(0,7);\n\n  \u002F\u002F Step 0: last month data\n  document.getElementById('fomTitle').textContent=prevMonthName+' — How did it go?';\n  document.getElementById('fomSub').textContent='Review your numbers before planning '+thisMonthName+'.';\n  document.getElementById('fomThisMonthLabel').textContent=\"It's the 1st. Let's build \"+thisMonthName+'.';\n\n  const prevEnts=S.entries.filter(e=>e.date&&e.date.startsWith(prevYM));\n  const pRev=prevEnts.reduce((a,e)=>a+(e.rev||0),0);\n  const pExp=prevEnts.reduce((a,e)=>a+(e.exp||0),0);\n  const pNet=pRev-pExp;\n  const prevWins=(S.wins||[]).filter(w=>w.date&&w.date.startsWith(prevYM));\n\n  const recapEl=document.getElementById('fomRecapStats');\n  if(recapEl) recapEl.innerHTML=[\n    {val:'$'+pRev.toLocaleString(),lbl:'Revenue',cls:'pos'},\n    {val:'$'+pExp.toLocaleString(),lbl:'Expenses',cls:'neg'},\n    {val:(pNet>=0?'+':'-')+'$'+Math.abs(pNet).toLocaleString(),lbl:'Net',cls:pNet>=0?'pos':'neg'},\n    {val:prevWins.length+'★',lbl:'Wins Logged',cls:''},\n  ].map(s=>`<div class=\"month-stat-card\"><div class=\"month-stat-val ${s.cls}\">${s.val}<\u002Fdiv><div class=\"month-stat-lbl\">${s.lbl}<\u002Fdiv><\u002Fdiv>`).join('');\n\n  const goalsEl=document.getElementById('fomGoalsRecap');\n  if(goalsEl) goalsEl.innerHTML=S.goals.length?S.goals.map(g=>`\n    <div style=\"display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)\">\n      <div style=\"width:14px;height:14px;border-radius:50%;${g.done?'background:var(--accent)':'border:.5px solid var(--border2)'};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--accent-fg)\">${g.done?'✓':''}<\u002Fdiv>\n      <div style=\"flex:1;font-size:11px;color:var(--text);${g.done?'opacity:.5;text-decoration:line-through':''}\">${g.text}<\u002Fdiv>\n      <span class=\"badge ${g.done?'b-green':'b-muted'}\" style=\"font-size:7px\">${g.done?'Done':'Open'}<\u002Fspan>\n    <\u002Fdiv>`).join(''):'<div style=\"font-size:10px;color:var(--text3)\">No goals tracked.<\u002Fdiv>';\n\n  const winsEl=document.getElementById('fomWinsRecap');\n  if(winsEl) winsEl.innerHTML=prevWins.length?prevWins.slice(0,8).map(w=>`\n    <div style=\"display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:.5px solid var(--border)\">\n      <span style=\"font-size:12px\">${WIN_ICONS[w.category]||'⭐'}<\u002Fspan>\n      <div style=\"flex:1;font-size:11px;color:var(--text);line-height:1.3\">${w.text}<\u002Fdiv>\n    <\u002Fdiv>`).join(''):'<div style=\"font-size:10px;color:var(--text3);font-family:\\'DM Mono\\',monospace\">No wins logged last month.<\u002Fdiv>';\n\n  \u002F\u002F Step 1: goal setup\n  const fbSel=document.getElementById('fomGoalBiz');\n  if(fbSel) fbSel.innerHTML='<option value=\"\">No business<\u002Foption>'+S.businesses.map(b=>`<option value=\"${b.id}\">${b.name}<\u002Foption>`).join('');\n\n  const openGoals=S.goals.filter(g=>!g.done);\n  const cWrap=document.getElementById('fomCarryoverWrap');\n  const cList=document.getElementById('fomCarryoverList');\n  if(openGoals.length&&cWrap&&cList){\n    cWrap.style.display='block';\n    cList.innerHTML=openGoals.map(g=>{\n      const biz=bizById(g.bizId);\n      return`<div style=\"display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg2);border-radius:var(--rs);margin-bottom:6px\">\n        <div style=\"flex:1;font-size:11px;color:var(--text)\">${g.text}<\u002Fdiv>\n        ${biz?`<span class=\"badge b-muted\">${biz.name}<\u002Fspan>`:''}\n        <button onclick=\"carryGoal(${g.id},this)\" class=\"btn btn-g btn-sm\" style=\"font-size:8px\">Carry →<\u002Fbutton>\n      <\u002Fdiv>`;\n    }).join('');\n  } else if(cWrap){ cWrap.style.display='none'; }\n\n  \u002F\u002F Step 2: biz focus tags\n  const fbt=document.getElementById('fomBizTags');\n  if(fbt) fbt.innerHTML=S.businesses.map((b,i)=>\n    `<button class=\"debrief-tag\" onclick=\"this.classList.toggle('sel')\" style=\"border-color:${BIZ_COLORS[i%BIZ_COLORS.length]}40\">${b.name}<\u002Fbutton>`\n  ).join('');\n\n  fomNewGoals=[];\n  renderFomGoals();\n  const reflEl=document.getElementById('fomReflection');if(reflEl)reflEl.value='';\n  const intEl=document.getElementById('fomIntention');if(intEl)intEl.value='';\n\n  fomCurrentStep=0;\n  showFomStep(0);\n  showLaunch('fomOverlay');\n}\n\nfunction fomBuildSummary(){\n  const now=new Date();\n  const monthName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});\n  const intention=document.getElementById('fomIntention')?.value||'—';\n  const bizSel=[...document.querySelectorAll('#fomBizTags .debrief-tag.sel')].map(t=>t.textContent).join(', ')||'All ventures';\n  const el=document.getElementById('fomSummaryContent');\n  if(!el) return;\n  el.innerHTML=`\n    <div style=\"background:var(--bg2);border-radius:var(--r);padding:14px 16px\">\n      <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:4px\">LAUNCHING<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:800;color:var(--text)\">${monthName}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--bg2);border-radius:var(--r);padding:14px 16px\">\n      <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px\">GOALS SET (${fomNewGoals.length})<\u002Fdiv>\n      ${fomNewGoals.length?fomNewGoals.map(g=>{const biz=bizById(g.bizId);return`<div style=\"display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--border)\"><div style=\"width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0\"><\u002Fdiv><div style=\"flex:1;font-size:12px;color:var(--text)\">${g.text}<\u002Fdiv>${biz?`<span class=\"badge b-muted\">${biz.name}<\u002Fspan>`:''}<span class=\"badge b-blue\">${g.type}<\u002Fspan><\u002Fdiv>`;}).join(''):'<div style=\"font-size:10px;color:var(--text3)\">No goals set — you can add them after launch.<\u002Fdiv>'}\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <div style=\"background:var(--bg2);border-radius:var(--r);padding:14px 16px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">FOCUS VENTURES<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:var(--text)\">${bizSel}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg2);border-radius:var(--r);padding:14px 16px\">\n        <div style=\"font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">INTENTION<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text2);line-height:1.5;font-style:italic\">${intention!=='—'?'\"'+intention+'\"':'Not set.'}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nfunction addFomGoal(){\n  const inp=document.getElementById('fomGoalInput');\n  const text=inp?.value?.trim(); if(!text)return;\n  const bizId=parseInt(document.getElementById('fomGoalBiz').value)||null;\n  const type=document.getElementById('fomGoalType').value||'Revenue';\n  fomNewGoals.push({text,bizId,type});\n  inp.value='';\n  renderFomGoals();\n}\n\nfunction renderFomGoals(){\n  const list=document.getElementById('fomNewGoalsList');\n  if(!list)return;\n  if(!fomNewGoals.length){list.innerHTML='<div style=\"font-size:10px;color:var(--text3);padding:6px 0\">No goals added yet.<\u002Fdiv>';return;}\n  list.innerHTML=fomNewGoals.map((g,i)=>{\n    const biz=bizById(g.bizId);\n    return`<div class=\"goal-plan-item\">\n      <div class=\"goal-plan-text\">${g.text}<\u002Fdiv>\n      ${biz?`<span class=\"badge b-muted\" style=\"flex-shrink:0\">${biz.name}<\u002Fspan>`:''}\n      <span class=\"badge b-blue\" style=\"flex-shrink:0\">${g.type}<\u002Fspan>\n      <button onclick=\"fomNewGoals.splice(${i},1);renderFomGoals()\" style=\"background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;flex-shrink:0\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction carryGoal(id, btn){\n  const g=S.goals.find(x=>x.id===id);if(!g)return;\n  fomNewGoals.push({text:g.text,bizId:g.bizId,type:g.type||'Revenue'});\n  btn.textContent='Added ✓'; btn.disabled=true;\n  renderFomGoals();\n}\n\nfunction saveFomGoals(){\n  \u002F\u002F clear old incomplete goals\n  S.goals=S.goals.filter(g=>g.done);\n  \u002F\u002F add new goals\n  fomNewGoals.forEach(g=>{\n    S.goals.push({id:S.nextId++,text:g.text,bizId:g.bizId,type:g.type,done:false});\n  });\n  \u002F\u002F save reflection as note\n  const refl=document.getElementById('fomReflection')?.value?.trim();\n  if(refl){\n    const now=new Date();\n    const prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1);\n    S.notes.push({id:S.nextId++,bizId:null,title:'Month Reflection — '+prevMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'}),body:refl,date:now.toISOString().slice(0,10)});\n  }\n  \u002F\u002F save month intention as note\n  const intent=document.getElementById('fomIntention')?.value?.trim();\n  if(intent){\n    const now=new Date();\n    S.notes.push({id:S.nextId++,bizId:null,title:'Month Intention — '+now.toLocaleDateString('en-US',{month:'long',year:'numeric'}),body:intent,date:now.toISOString().slice(0,10)});\n  }\n  save();\n  closeLaunch('fomOverlay');\n  renderDashboard();\n  if(typeof renderGoals==='function')renderGoals();\n  if(typeof renderGoalsPage==='function')renderGoalsPage();\n}\n\n\u002F\u002F ── LAUNCH TRIGGER LOGIC ──\nfunction checkLaunchSequence(){\n  const now=new Date();\n  const day=now.getDate();\n  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();\n  const todayKey=now.toISOString().slice(0,10);\n\n  \u002F\u002F Only trigger if user has businesses set up\n  if(!S.businesses.length) return;\n\n  \u002F\u002F Priority order: EOM > FOM > Daily Debrief\n  \u002F\u002F End of month — last day, show once per day\n  if(day===lastDay && !sessionStorage.getItem('stratusEomDone')){\n    setTimeout(()=>initEom(), 800);\n    return;\n  }\n  \u002F\u002F First of month — 1st day, show once per day\n  if(day===1 && !sessionStorage.getItem('stratusFomDone')){\n    setTimeout(()=>initFom(), 800);\n    return;\n  }\n  \u002F\u002F Daily debrief — every day, once per session\n  if(!sessionStorage.getItem('stratusDebriefDone')){\n    setTimeout(()=>initDebrief(), 600);\n  }\n}\n\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F REPEAT EVENT GENERATION\n\u002F\u002F ══════════════════════════════════════════\nfunction generateRepeatEvents(baseEv){\n  const start=new Date(baseEv.date+'T00:00:00');\n  const endDate=baseEv.repeatEnd?new Date(baseEv.repeatEnd+'T00:00:00'):new Date(start.getFullYear()+2,start.getMonth(),start.getDate());\n  const instances=[];\n  let cur=new Date(start);\n  \u002F\u002F advance past base date for first repeat\n  cur=nextRepeatDate(cur, baseEv.repeat);\n  let safety=0;\n  while(cur<=endDate && safety<500){\n    safety++;\n    instances.push({\n      id:S.nextId++,title:baseEv.title,date:cur.toISOString().slice(0,10),\n      time:baseEv.time,type:baseEv.type,bizId:baseEv.bizId,notes:baseEv.notes,\n      repeat:baseEv.repeat,repeatEnd:baseEv.repeatEnd,parentId:baseEv.id\n    });\n    cur=nextRepeatDate(new Date(cur), baseEv.repeat);\n  }\n  S.events.push(...instances);\n}\n\nfunction nextRepeatDate(date, repeat){\n  const d=new Date(date);\n  switch(repeat){\n    case 'daily':    d.setDate(d.getDate()+1); break;\n    case 'weekly':   d.setDate(d.getDate()+7); break;\n    case 'biweekly': d.setDate(d.getDate()+14); break;\n    case 'monthly':  d.setMonth(d.getMonth()+1); break;\n    case 'last-day':\n      d.setMonth(d.getMonth()+1);\n      d.setDate(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());\n      break;\n    case 'first-day':\n      d.setMonth(d.getMonth()+1);\n      d.setDate(1);\n      break;\n    case 'quarterly':d.setMonth(d.getMonth()+3); break;\n    case 'yearly':   d.setFullYear(d.getFullYear()+1); break;\n  }\n  return d;\n}\n\nfunction repeatLabel(r){\n  return{none:'',daily:'Daily',weekly:'Weekly',biweekly:'Every 2 wks',monthly:'Monthly','last-day':'Last of month','first-day':'1st of month',quarterly:'Quarterly',yearly:'Yearly'}[r]||'';\n}\n\n\u002F\u002F show\u002Fhide repeat end date field\ndocument.addEventListener('change', e=>{\n  if(e.target.id==='eventRepeat'){\n    const wrap=document.getElementById('eventRepeatEndWrap');\n    if(wrap) wrap.style.display=e.target.value!=='none'?'block':'none';\n  }\n});\n\n\u002F\u002F ══════════════════════════════════════════\n\u002F\u002F BILLS SYSTEM\n\u002F\u002F ══════════════════════════════════════════\nlet currentBillTab='all';\nlet editingBillId=null;\nlet billsCardView=false;\n\nfunction setBillTab(tab){\n  currentBillTab=tab;\n  ['all','upcoming','overdue','paid','recurring'].forEach(t=>{\n    const el=document.getElementById('btab-'+t);\n    if(el)el.className='tracker-tab'+(t===tab?' active':'');\n  });\n  renderBillsMainList();\n}\n\nfunction toggleBillsView(){\n  billsCardView=!billsCardView;\n  const btn=document.getElementById('billsViewToggle');\n  if(btn)btn.textContent=billsCardView?'Table View':'List View';\n  renderBillsMainList();\n}\n\nfunction getDueDays(dateStr){\n  if(!dateStr)return null;\n  const due=new Date(dateStr+'T00:00:00');\n  const now=new Date(); now.setHours(0,0,0,0);\n  return Math.round((due-now)\u002F(1000*60*60*24));\n}\n\nfunction billStatusLabel(b){\n  if(b.status==='paid')return 'paid';\n  if(b.status==='autopay')return 'autopay';\n  const days=getDueDays(b.dueDate);\n  if(days===null)return b.status||'upcoming';\n  if(days<0)return 'overdue';\n  if(days<=3)return 'due-soon';\n  return b.status||'upcoming';\n}\n\nfunction renderBills(){\n  refreshSelects();\n  renderBillSummary();\n  renderBillAlerts();\n  renderBillCharts();\n  renderBillsMainList();\n  renderBillMonthView();\n  renderBudgetOverview();\n  renderMonthlyTrend();\n  updateBadges();\n  const lbl=document.getElementById('billMonthLabel');\n  if(lbl)lbl.textContent=new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'});\n}\n\n\u002F\u002F ── PERSONAL LIFE CATEGORIES ──\nconst PERSONAL_CATS=[\n  {key:'housing',icon:'🏠',label:'Housing \u002F Rent'},\n  {key:'food',icon:'🍔',label:'Food & Dining'},\n  {key:'transport',icon:'🚗',label:'Transport'},\n  {key:'health',icon:'💊',label:'Health & Medical'},\n  {key:'entertainment',icon:'🎬',label:'Entertainment'},\n  {key:'shopping',icon:'🛍️',label:'Shopping'},\n  {key:'utilities',icon:'⚡',label:'Utilities'},\n  {key:'subscriptions',icon:'📱',label:'Subscriptions'},\n  {key:'savings',icon:'💰',label:'Savings'},\n  {key:'other',icon:'◉',label:'Other'},\n];\nconst BILL_TO_LIFE={Rent:'housing',Utilities:'utilities',Insurance:'health',Subscription:'subscriptions',Software:'subscriptions',Marketing:'other',Services:'other',Loan:'other',Tax:'other',Payroll:'other',Other:'other'};\n\nlet _trendMode='biz';\nfunction setTrendMode(mode){\n  _trendMode=mode;\n  document.getElementById('trendToggleBiz')?.classList.toggle('active',mode==='biz');\n  document.getElementById('trendToggleLife')?.classList.toggle('active',mode==='life');\n  renderMonthlyTrend();\n}\n\nfunction renderBudgetOverview(){\n  const el=document.getElementById('budgetOverviewSection');if(!el)return;\n  const budgets=S.monthlyBudgets||{};\n  const now=new Date();const ym=now.toISOString().slice(0,7);\n  const monthBills=(S.bills||[]).filter(b=>b.dueDate&&b.dueDate.startsWith(ym));\n  const spent={};\n  monthBills.forEach(b=>{\n    const cat=b.lifeCat||BILL_TO_LIFE[b.cat]||'other';\n    spent[cat]=(spent[cat]||0)+(parseFloat(b.amount)||0);\n  });\n  const totalBudget=Object.values(budgets).reduce((a,v)=>a+(parseFloat(v)||0),0);\n  const totalSpent=Object.values(spent).reduce((a,v)=>a+v,0);\n  const remaining=totalBudget-totalSpent;\n  const hasBudget=Object.keys(budgets).length>0;\n  const rows=PERSONAL_CATS.map(c=>{\n    const budget=parseFloat(budgets[c.key])||0;\n    const s=spent[c.key]||0;\n    if(!budget&&!s)return'';\n    const pct=budget>0?Math.min(100,Math.round((s\u002Fbudget)*100)):100;\n    const over=budget>0&&s>budget;\n    const barColor=over?'var(--red)':pct>80?'var(--amber)':'var(--green)';\n    return`<div class=\"budget-cat-row\">\n      <div class=\"budget-cat-icon\">${c.icon}<\u002Fdiv>\n      <div class=\"budget-cat-name\">${c.label}<\u002Fdiv>\n      <div class=\"budget-track\"><div class=\"budget-fill\" style=\"width:${pct}%;background:${barColor}\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"budget-amounts\">${over?'<span style=\"color:var(--red);font-weight:700\">over <\u002Fspan>':''} $${s.toLocaleString()}${budget?' \u002F $'+budget.toLocaleString():''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n  el.innerHTML=`<div class=\"budget-section\">\n    <div class=\"sec-hdr\" style=\"margin-bottom:${hasBudget?'14px':'6px'}\">\n      <div class=\"sec-title\">Life Budget — ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}<\u002Fdiv>\n      <button class=\"btn btn-g btn-sm\" onclick=\"openBudgetModal()\">⚙ Set Budget<\u002Fbutton>\n    <\u002Fdiv>\n    ${hasBudget?`<div class=\"budget-kpi-row\">\n      <div class=\"budget-kpi\"><div class=\"budget-kpi-lbl\">Budget<\u002Fdiv><div class=\"budget-kpi-val\">$${totalBudget.toLocaleString()}<\u002Fdiv><\u002Fdiv>\n      <div class=\"budget-kpi\"><div class=\"budget-kpi-lbl\">Spent<\u002Fdiv><div class=\"budget-kpi-val\" style=\"color:var(--red)\">$${totalSpent.toLocaleString()}<\u002Fdiv><\u002Fdiv>\n      <div class=\"budget-kpi\"><div class=\"budget-kpi-lbl\">${remaining>=0?'Remaining':'Over Budget'}<\u002Fdiv><div class=\"budget-kpi-val\" style=\"color:${remaining>=0?'var(--green)':'var(--red)'}\">$${Math.abs(remaining).toLocaleString()}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>${rows}`:'<div class=\"empty-state\" style=\"padding:16px 0;min-height:auto\"><div class=\"empty-state-icon\" style=\"font-size:18px\">◎<\u002Fdiv><div class=\"empty-state-text\">No monthly budget set yet.<br>Click ⚙ Set Budget to get started.<\u002Fdiv><\u002Fdiv>'}\n  <\u002Fdiv>`;\n}\n\nfunction renderMonthlyTrend(){\n  const el=document.getElementById('billTrendChart');if(!el)return;\n  const bills=S.bills||[];\n  const now=new Date();\n  const months=[];\n  for(let i=5;i>=0;i--){\n    const d=new Date(now.getFullYear(),now.getMonth()-i,1);\n    const ym=d.toISOString().slice(0,7);\n    const label=d.toLocaleDateString('en-US',{month:'short'});\n    let total;\n    if(_trendMode==='life'){\n      total=bills.filter(b=>!b.bizId&&b.dueDate&&b.dueDate.startsWith(ym)).reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n    }else{\n      total=bills.filter(b=>b.bizId&&b.dueDate&&b.dueDate.startsWith(ym)).reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n    }\n    months.push({label,total});\n  }\n  const max=Math.max(...months.map(m=>m.total),1);\n  el.innerHTML=months.map(m=>{\n    const h=Math.max(2,Math.round((m.total\u002Fmax)*72));\n    const amt=m.total>0?'$'+(m.total>=1000?Math.round(m.total\u002F1000)+'k':m.total.toLocaleString()):'';\n    return`<div class=\"trend-bar-col\">\n      <div class=\"trend-bar-amt\">${amt}<\u002Fdiv>\n      <div class=\"trend-bar-fill\" style=\"height:${h}px\"><\u002Fdiv>\n      <div class=\"trend-bar-lbl\">${m.label}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction openBudgetModal(){\n  const budgets=S.monthlyBudgets||{};\n  const form=document.getElementById('budgetPlannerForm');if(!form)return;\n  form.innerHTML=PERSONAL_CATS.map(c=>`\n    <div style=\"display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:.5px solid var(--border)\">\n      <div style=\"font-size:16px;width:24px;text-align:center\">${c.icon}<\u002Fdiv>\n      <div style=\"flex:1;font-size:12px;font-weight:600;color:var(--text)\">${c.label}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:5px\">\n        <span style=\"font-size:12px;color:var(--text3);font-family:'DM Mono',monospace\">$<\u002Fspan>\n        <input type=\"number\" id=\"budget_${c.key}\" value=\"${budgets[c.key]||''}\" placeholder=\"0\" min=\"0\" style=\"width:100px;text-align:right\">\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  openModal('budgetModal');\n}\n\nfunction saveBudget(){\n  const budgets={};\n  PERSONAL_CATS.forEach(c=>{\n    const v=parseFloat(document.getElementById('budget_'+c.key)?.value)||0;\n    if(v>0)budgets[c.key]=v;\n  });\n  S.monthlyBudgets=budgets;\n  save();closeModal('budgetModal');renderBills();\n}\n\nfunction renderBillCharts(){\n  const bills=S.bills||[];\n  const unpaid=bills.filter(b=>b.status!=='paid');\n  const total=unpaid.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);\n  const dv=document.getElementById('billDonutVal');\n  if(dv)dv.textContent='$'+total.toLocaleString();\n\n  \u002F\u002F ── DONUT by category ──\n  const CAT_COLORS=['#e05a3a','#4a6cf7','#2d9e6b','#f0a030','#9060e0','#e04080','#0e9090','#c04060'];\n  const byCat={};\n  unpaid.forEach(b=>{const k=b.cat||'Other';if(!byCat[k])byCat[k]=0;byCat[k]+=parseFloat(b.amount)||0;});\n  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);\n  const svg=document.getElementById('billDonutSvg');\n  const legend=document.getElementById('billCatLegend');\n  if(svg&&cats.length){\n    const R=60,r=40,cx=70,cy=70;\n    let html='';let legendHtml='';let offset=
