v class=\"kpi-value\">'+fmtMoney(total)+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"kpi-card\"><div class=\"kpi-label\">Collected<\u002Fdiv><div class=\"kpi-value\" style=\"color:var(--green)\">'+fmtMoney(paid)+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"kpi-card\"><div class=\"kpi-label\">Outstanding<\u002Fdiv><div class=\"kpi-value\" style=\"color:var(--accent)\">'+fmtMoney(outstanding)+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"kpi-card\"><div class=\"kpi-label\">Overdue<\u002Fdiv><div class=\"kpi-value\" style=\"color:'+(oc?'var(--red)':'var(--text2)')+'\">'+oc+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"kpi-card\"><div class=\"kpi-label\">Count<\u002Fdiv><div class=\"kpi-value\">'+invs.length+'<\u002Fdiv><\u002Fdiv>';\n}\n\nfunction renderInvList(){\n  var el = document.getElementById('invList');\n  if(!el) return;\n  var invs = (S.invoices||[]).slice().reverse();\n  if(_invTab!=='all'){\n    if(_invTab==='overdue') invs = invs.filter(invIsOverdue);\n    else invs = invs.filter(function(i){return i.status===_invTab;});\n  }\n  if(!invs.length){\n    el.innerHTML = '<div style=\"text-align:center;padding:48px 0;color:var(--text3)\">No invoices'\n      +(_invTab!=='all'?' in this filter':'')\n      +'.<br><button class=\"btn btn-p btn-sm\" onclick=\"openInvModal()\" style=\"margin-top:12px\">+ New Invoice<\u002Fbutton><\u002Fdiv>';\n    return;\n  }\n  var sColors = {draft:'var(--text3)',sent:'var(--accent)',paid:'var(--green)',overdue:'var(--red)'};\n  el.innerHTML = invs.map(function(inv){\n    var biz = (S.businesses||[]).find(function(b){return b.id===inv.bizId;});\n    var isOD = invIsOverdue(inv);\n    var sLabel = (isOD&&inv.status!=='paid')?'overdue':inv.status;\n    var color = sColors[sLabel]||'var(--text3)';\n    return '<div class=\"inv-card\" onclick=\"openInvDetail('+inv.id+')\" style=\"margin-bottom:8px\">'\n      +'<div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--border2)\">'\n        +'<div style=\"display:flex;align-items:center;gap:12px\">'\n          +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text3);font-family:\\'DM Mono\\',monospace\">'+(inv.num||'INV')+'<\u002Fdiv>'\n          +'<div>'\n            +'<div style=\"font-weight:700;color:var(--text);font-size:13px\">'+inv.client+'<\u002Fdiv>'\n            +'<div style=\"font-size:10px;color:var(--text3);margin-top:2px\">'+(biz?biz.name:inv.desc||'')+'<\u002Fdiv>'\n          +'<\u002Fdiv>'\n        +'<\u002Fdiv>'\n        +'<div style=\"text-align:right\">'\n          +'<div style=\"font-weight:800;font-size:16px;color:var(--text)\">'+fmtMoney(inv.total)+'<\u002Fdiv>'\n          +'<div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+color+';margin-top:3px\">'+sLabel+'<\u002Fdiv>'\n        +'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<div style=\"padding:8px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between\">'\n        +'<div style=\"font-size:10px;color:var(--text3)\">Issued: '+(inv.issueDate||'—')+'&nbsp;·&nbsp;Due: '+(inv.dueDate||'—')+'<\u002Fdiv>'\n        +'<div style=\"display:flex;gap:6px\" onclick=\"event.stopPropagation()\">'\n          +'<button class=\"btn btn-g btn-sm\" onclick=\"openInvModal('+inv.id+')\" style=\"font-size:10px;padding:3px 10px\">Edit<\u002Fbutton>'\n          +(inv.status!=='paid'?'<button class=\"btn btn-sm\" onclick=\"_markInvPaid('+inv.id+')\" style=\"font-size:10px;padding:3px 10px;background:var(--green);border-color:var(--green);color:#fff\">Mark Paid<\u002Fbutton>':'')\n        +'<\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<\u002Fdiv>';\n  }).join('');\n}\n\nfunction _markInvPaid(id){\n  var inv = (S.invoices||[]).find(function(i){return i.id===id;});\n  if(inv){inv.status='paid';save();renderInvoices();updateBadges();}\n}\n\nfunction openInvDetail(id){\n  _invDetailId = id;\n  var inv = (S.invoices||[]).find(function(i){return i.id===id;});\n  if(!inv) return;\n  var isOD = invIsOverdue(inv);\n  var sLabel = (isOD&&inv.status!=='paid')?'overdue':inv.status;\n  var sColors = {draft:'var(--text3)',sent:'var(--accent)',paid:'var(--green)',overdue:'var(--red)'};\n  var color = sColors[sLabel]||'var(--text3)';\n  var biz = (S.businesses||[]).find(function(b){return b.id===inv.bizId;});\n  var set = function(id,val){var e=document.getElementById(id);if(e)e.textContent=val;};\n  set('invDetailNum', inv.num||'INV');\n  set('invDetailClient', inv.client);\n  set('invDetailDesc', biz?biz.name:(inv.desc||''));\n  set('invDetailAmount', fmtMoney(inv.total));\n  var badge = document.getElementById('invDetailStatusBadge');\n  if(badge) badge.innerHTML='<span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;background:'+color+'22;color:'+color+'\">'+sLabel+'<\u002Fspan>';\n  var meta = document.getElementById('invDetailMeta');\n  if(meta) meta.innerHTML =\n    '<div style=\"font-size:11px;color:var(--text2)\"><span style=\"color:var(--text3)\">Issued<\u002Fspan><br>'+(inv.issueDate||'—')+'<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:var(--text2)\"><span style=\"color:var(--text3)\">Due<\u002Fspan><br>'+(inv.dueDate||'—')+'<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:var(--text2)\"><span style=\"color:var(--text3)\">Business<\u002Fspan><br>'+(biz?biz.name:'—')+'<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:var(--text2)\"><span style=\"color:var(--text3)\">Status<\u002Fspan><br>'+sLabel+'<\u002Fdiv>';\n  var linesEl = document.getElementById('invDetailLines');\n  if(linesEl) linesEl.innerHTML = (inv.lines||[]).map(function(l){\n    return '<tr style=\"border-bottom:.5px solid var(--border2)\">'\n      +'<td style=\"padding:8px 0;color:var(--text);font-size:12px\">'+(l.desc||'—')+'<\u002Ftd>'\n      +'<td style=\"padding:8px 12px;color:var(--text2);font-size:12px;text-align:center\">'+l.qty+'<\u002Ftd>'\n      +'<td style=\"padding:8px 12px;color:var(--text2);font-size:12px;text-align:right\">'+fmtMoney(l.rate)+'<\u002Ftd>'\n      +'<td style=\"padding:8px 0;font-weight:700;color:var(--text);font-size:12px;text-align:right\">'+fmtMoney(l.qty*l.rate)+'<\u002Ftd>'\n      +'<\u002Ftr>';\n  }).join('');\n  var totEl = document.getElementById('invDetailTotals');\n  if(totEl) totEl.innerHTML='<span>Total<\u002Fspan><span>'+fmtMoney(inv.total)+'<\u002Fspan>';\n  var notesEl = document.getElementById('invDetailNotes');\n  if(notesEl){if(inv.notes){notesEl.textContent=inv.notes;notesEl.style.display='block';}else{notesEl.style.display='none';}}\n  var mpBtn = document.getElementById('invMarkPaidBtn');\n  if(mpBtn) mpBtn.style.display = inv.status==='paid'?'none':'';\n  var overlay = document.getElementById('invDetailOverlay');\n  if(overlay) overlay.classList.add('open');\n}\n\nfunction closeInvDetail(){\n  var overlay = document.getElementById('invDetailOverlay');\n  if(overlay) overlay.classList.remove('open');\n  _invDetailId = null;\n}\n\nfunction markInvoicePaidFromDetail(){\n  if(!_invDetailId) return;\n  _markInvPaid(_invDetailId);\n  closeInvDetail();\n}\n\nfunction editInvoiceFromDetail(){\n  var id = _invDetailId;\n  closeInvDetail();\n  openInvModal(id);\n}\n\nfunction deleteInvoiceFromDetail(){\n  if(!_invDetailId) return;\n  if(!confirm('Delete this invoice? This cannot be undone.')) return;\n  S.invoices = (S.invoices||[]).filter(function(i){return i.id!==_invDetailId;});\n  save();\n  closeInvDetail();\n  renderInvoices();\n  updateBadges();\n}\n\n\u002F\u002F ─── TAX TRACKER ──────────────────────────────────────────\nvar _taxMode = 'biz';\n\nfunction setBillsMainTab(tab){\n  document.querySelectorAll('.bills-main-tab').forEach(function(el){\n    el.classList.toggle('active', el.id==='bmtab-'+tab);\n  });\n  var billsSec = document.getElementById('billsSection');\n  var taxSec = document.getElementById('taxSection');\n  if(billsSec) billsSec.style.display = tab==='bills' ? '' : 'none';\n  if(taxSec) taxSec.style.display = tab==='tax' ? '' : 'none';\n  if(tab==='tax') renderTaxTracker();\n}\n\nfunction setTaxMode(mode){\n  _taxMode = mode;\n  var bizBtn = document.getElementById('taxToggleBiz');\n  var lifeBtn = document.getElementById('taxToggleLife');\n  if(bizBtn) bizBtn.classList.toggle('active', mode==='biz');\n  if(lifeBtn) lifeBtn.classList.toggle('active', mode==='personal');\n  renderTaxTracker();\n}\n\nfunction renderTaxTracker(){\n  var yr = new Date().getFullYear();\n  var isBiz = _taxMode==='biz';\n  var entries = S.entries||[];\n  var paidBills = (S.bills||[]).filter(function(b){return b.status==='paid';});\n  var totalRev = entries.reduce(function(s,e){return s+e.rev;},0);\n  var entryExp = entries.reduce(function(s,e){return s+e.exp;},0);\n  var billExp = paidBills.reduce(function(s,b){return s+b.amount;},0);\n  var totalExp = entryExp + billExp;\n  var taxableIncome = isBiz ? Math.max(0,totalRev-totalExp) : totalRev;\n  var estRate = isBiz ? 0.25 : 0.22;\n  var estTax = taxableIncome * estRate;\n  var effRate = totalRev>0 ? (estTax\u002FtotalRev*100).toFixed(1) : '0.0';\n\n  \u002F\u002F KPI strip\n  var kpiEl = document.getElementById('taxKpiStrip');\n  if(kpiEl){\n    kpiEl.innerHTML =\n      '<div class=\"tax-q-card\"><div style=\"font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">'+(isBiz?'Gross Revenue':'Gross Income')+'<\u002Fdiv><div style=\"font-size:22px;font-weight:800;color:var(--text)\">'+fmtMoney(totalRev)+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"tax-q-card\"><div style=\"font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">'+(isBiz?'Deductions':'Std. Deduction')+'<\u002Fdiv><div style=\"font-size:22px;font-weight:800;color:var(--green)\">'+fmtMoney(isBiz?totalExp:14600)+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"tax-q-card\"><div style=\"font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Est. Tax Owed<\u002Fdiv><div style=\"font-size:22px;font-weight:800;color:var(--red)\">'+fmtMoney(estTax)+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"tax-q-card\"><div style=\"font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">Effective Rate<\u002Fdiv><div style=\"font-size:22px;font-weight:800;color:var(--accent)\">'+effRate+'%<\u002Fdiv><\u002Fdiv>';\n  }\n\n  \u002F\u002F Quarterly estimates\n  var qEl = document.getElementById('taxQStrip');\n  if(qEl){\n    var qData = [\n      {q:'Q1',range:'Jan — Mar',due:'Apr 15, '+yr},\n      {q:'Q2',range:'Apr — May',due:'Jun 16, '+yr},\n      {q:'Q3',range:'Jun — Aug',due:'Sep 15, '+yr},\n      {q:'Q4',range:'Sep — Dec',due:'Jan 15, '+(yr+1)}\n    ];\n    var qAmt = estTax * 0.25;\n    var now = new Date();\n    qEl.innerHTML = qData.map(function(q){\n      var dueDate = new Date(q.due);\n      var isPast = dueDate < now;\n      return '<div class=\"tax-q-card\">'\n        +'<div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px\">'\n          +'<div><div style=\"font-size:11px;font-weight:800;color:var(--text)\">'+q.q+' '+yr+' — '+q.range+'<\u002Fdiv>'\n          +'<div style=\"font-size:10px;color:var(--text3);margin-top:2px\">Due '+q.due+'<\u002Fdiv><\u002Fdiv>'\n          +'<span style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:10px;'\n          +(isPast?'background:rgba(82,196,151,.15);color:var(--green)':'background:var(--bg2);color:var(--text3)')+'\">'+( isPast?'Past':'Upcoming')+'<\u002Fspan>'\n        +'<\u002Fdiv>'\n        +'<div style=\"font-size:20px;font-weight:800;color:var(--text)\">'+fmtMoney(qAmt)+'<\u002Fdiv>'\n        +'<\u002Fdiv>';\n    }).join('');\n  }\n\n  \u002F\u002F Deductible categories\n  var dcEl = document.getElementById('taxCatList');\n  if(dcEl){\n    var cats = isBiz ? [\n      {name:'Office & Supplies',icon:'📦',est:'100% deductible'},\n      {name:'Software & Tools',icon:'💻',est:'100% deductible'},\n      {name:'Marketing & Ads',icon:'📣',est:'100% deductible'},\n      {name:'Travel & Transport',icon:'✈️',est:'50–100% deductible'},\n      {name:'Meals & Entertainment',icon:'🍽',est:'50% deductible'},\n      {name:'Home Office',icon:'🏠',est:'Prorated deductible'},\n      {name:'Professional Services',icon:'⚖️',est:'100% deductible'},\n      {name:'Health Insurance (SE)',icon:'🏥',est:'100% deductible'}\n    ] : [\n      {name:'Mortgage \u002F Rent Interest',icon:'🏠',est:'Itemized deduction'},\n      {name:'Charitable Donations',icon:'🎁',est:'Up to 60% of AGI'},\n      {name:'Medical Expenses',icon:'🏥',est:'>7.5% AGI threshold'},\n      {name:'Student Loan Interest',icon:'🎓',est:'Up to $2,500\u002Fyr'},\n      {name:'State & Local Taxes',icon:'🏛',est:'Up to $10,000 cap'},\n      {name:'Child Tax Credit',icon:'👶',est:'Up to $2,000\u002Fchild'},\n      {name:'IRA Contributions',icon:'💰',est:'Up to $7,000\u002Fyr'},\n      {name:'HSA Contributions',icon:'💊',est:'Up to $4,150 (single)'}\n    ];\n    dcEl.innerHTML = cats.map(function(c){\n      return '<div class=\"tax-q-card\" style=\"display:flex;align-items:center;gap:10px\">'\n        +'<div style=\"font-size:20px;width:32px;text-align:center;flex-shrink:0\">'+c.icon+'<\u002Fdiv>'\n        +'<div><div style=\"font-size:12px;font-weight:700;color:var(--text)\">'+c.name+'<\u002Fdiv>'\n        +'<div style=\"font-size:10px;color:var(--text3);margin-top:2px\">'+c.est+'<\u002Fdiv><\u002Fdiv>'\n        +'<\u002Fdiv>';\n    }).join('');\n  }\n\n  \u002F\u002F YOY mini chart\n  var yoyEl = document.getElementById('taxYoyChart');\n  if(yoyEl){\n    var years = [yr-2,yr-1,yr];\n    var revs = {[yr-2]:0,[yr-1]:0,[yr]:totalRev};\n    var taxes = {[yr-2]:0,[yr-1]:0,[yr]:estTax};\n    var maxV = Math.max(totalRev,1);\n    yoyEl.innerHTML = '<div style=\"display:flex;align-items:flex-end;gap:20px;height:90px;padding-bottom:4px\">'\n      +years.map(function(y){\n        var rh = Math.round((revs[y]\u002FmaxV)*72);\n        var th = Math.round((taxes[y]\u002FmaxV)*72);\n        return '<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\">'\n          +'<div style=\"display:flex;gap:4px;align-items:flex-end;height:74px\">'\n          +'<div title=\"'+fmtMoney(revs[y])+'\" style=\"width:18px;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;height:'+rh+'px;min-height:2px\"><\u002Fdiv>'\n          +'<div title=\"'+fmtMoney(taxes[y])+'\" style=\"width:18px;background:var(--red);opacity:.75;border-radius:3px 3px 0 0;height:'+th+'px;min-height:2px\"><\u002Fdiv>'\n          +'<\u002Fdiv>'\n          +'<div style=\"font-size:9px;color:var(--text3);font-weight:700\">'+y+'<\u002Fdiv>'\n          +'<\u002Fdiv>';\n      }).join('')\n      +'<\u002Fdiv>'\n      +'<div style=\"display:flex;gap:14px;margin-top:8px\">'\n      +'<div style=\"display:flex;align-items:center;gap:4px\"><div style=\"width:10px;height:10px;background:var(--accent);opacity:.75;border-radius:2px\"><\u002Fdiv><span style=\"font-size:10px;color:var(--text3)\">Revenue<\u002Fspan><\u002Fdiv>'\n      +'<div style=\"display:flex;align-items:center;gap:4px\"><div style=\"width:10px;height:10px;background:var(--red);opacity:.75;border-radius:2px\"><\u002Fdiv><span style=\"font-size:10px;color:var(--text3)\">Est. Tax<\u002Fspan><\u002Fdiv>'\n      +'<\u002Fdiv>';\n  }\n\n  \u002F\u002F Filing checklist\n  var clEl = document.getElementById('taxChecklist');\n  if(clEl){\n    var items = isBiz ? [\n      'Track all business income sources',\n      'Keep business & personal accounts separate',\n      'Save all receipts — digital and physical',\n      'Log mileage — IRS rate: 67¢\u002Fmile (2024)',\n      'File quarterly estimated tax payments',\n      'Prepare Schedule C (sole prop) or K-1 (partnership)',\n      'Review payroll taxes if you have employees',\n      'Consult a CPA before final filing'\n    ] : [\n      'Gather W-2s from all employers',\n      'Collect 1099s for freelance, interest, and dividends',\n      'Document charitable donations with receipts',\n      'Compile medical expense records',\n      'Review IRA and HSA contribution limits',\n      'Check eligibility for credits (child, EV, education)',\n      'File or request an extension by Apr 15',\n      'Consider tax software or a professional preparer'\n    ];\n    clEl.innerHTML = items.map(function(item){\n      return '<label style=\"display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:12px;color:var(--text);padding:6px 0;border-bottom:.5px solid var(--border2)\">'\n        +'<input type=\"checkbox\" style=\"margin-top:2px;accent-color:var(--accent)\">'\n        +'<span>'+item+'<\u002Fspan>'\n        +'<\u002Flabel>';\n    }).join('');\n  }\n\n  \u002F\u002F Populate year selector\n  var yrSel = document.getElementById('taxYearSel');\n  if(yrSel&&!yrSel.options.length){\n    for(var y=yr-3;y<=yr+1;y++){\n      var opt=document.createElement('option'); opt.value=y; opt.textContent=y;\n      if(y===yr) opt.selected=true;\n      yrSel.appendChild(opt);\n    }\n  }\n}\n\n<\u002Fscript>\n\n\n\n\n\n\n\n\n\n\n\n<!-- ════════════════════════════════════════════════════════════════\n     WAR ROOM — UX UPGRADE LAYER (additive, non-breaking)\n     • Aurora ambient background     • Command Palette (⌘K)\n     • Card lift + sheen on hover    • Button ripple\n     • Animated count-up KPIs        • Sliding sidebar pill\n     • Confetti on task\u002Fgoal done    • Toast utility\n     • Page transition polish        • FUN MODE toggle\n     ════════════════════════════════════════════════════════════════ -->\n<style id=\"wr-upgrade-style\">\n\u002F* ── Aurora background ─────────────────────────────────────── *\u002F\n.wr-aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.55;transition:opacity .6s ease}\n.wr-aurora .blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.42;mix-blend-mode:multiply;will-change:transform;animation:wr-drift 28s ease-in-out infinite alternate}\n.wr-aurora .b1{background:radial-gradient(circle at center, oklch(78% 0.13 250), transparent 65%);top:-180px;left:-120px;animation-duration:32s}\n.wr-aurora .b2{background:radial-gradient(circle at center, oklch(82% 0.12 35), transparent 65%);bottom:-200px;right:-140px;animation-duration:38s;animation-delay:-8s}\n.wr-aurora .b3{background:radial-gradient(circle at center, oklch(82% 0.12 145), transparent 65%);top:35%;left:50%;animation-duration:44s;animation-delay:-14s}\n.dark .wr-aurora{opacity:.32}\n.dark .wr-aurora .blob{mix-blend-mode:screen;opacity:.34}\n@keyframes wr-drift{\n  0%{transform:translate(0,0) scale(1)}\n  50%{transform:translate(80px,-60px) scale(1.12)}\n  100%{transform:translate(-60px,80px) scale(.94)}\n}\n.shell,.topbar,.sidebar,.content,.modal-overlay,.task-popup-overlay,.jarvis-overlay{position:relative;z-index:1}\n.content{background:transparent!important}\nbody{background:var(--bg)}\n.wr-fun-off .wr-aurora{display:none}\n@media (prefers-reduced-motion:reduce){.wr-aurora .blob{animation:none!important}}\n\n\u002F* ── Card \u002F surface micro-interactions ─────────────────────── *\u002F\n.card,.bp,.ai-panel,.cal-wrap,.biz-profile-card,.note-card{\n  transition:transform .25s cubic-bezier(.34,1.3,.64,1),box-shadow .25s ease,border-color .2s ease;\n}\n.card:hover,.bp:hover,.ai-panel:hover,.biz-profile-card:hover,.note-card:hover{\n  transform:translateY(-1.5px);\n  box-shadow:0 6px 22px rgba(0,0,0,.06),0 1px 0 rgba(255,255,255,.4) inset;\n}\n.dark .card:hover,.dark .bp:hover,.dark .ai-panel:hover,.dark .biz-profile-card:hover,.dark .note-card:hover{\n  box-shadow:0 6px 28px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.04) inset;\n}\n.card.card-sm{position:relative;overflow:hidden}\n.card.card-sm::after{content:\"\";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);transition:transform .9s ease;pointer-events:none}\n.card.card-sm:hover::after{transform:translateX(120%)}\n.dark .card.card-sm::after{background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%)}\n\n\u002F* ── KPI value pop on update ───────────────────────────────── *\u002F\n.cv{transition:transform .25s cubic-bezier(.34,1.6,.64,1),color .25s ease}\n.cv.wr-pop{transform:scale(1.08);color:var(--accent)}\n\n\u002F* ── Buttons: ripple + magnetism + press feel ──────────────── *\u002F\n.btn{position:relative;overflow:hidden;will-change:transform}\n.btn:active{transform:scale(.96)}\n.btn-p{transition:transform .15s cubic-bezier(.34,1.6,.64,1),box-shadow .2s,opacity .2s}\n.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.18)}\n.wr-ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);pointer-events:none;animation:wr-ripple .55s ease-out forwards}\n.dark .wr-ripple{background:rgba(255,255,255,.22)}\n.btn-g .wr-ripple,.chip .wr-ripple{background:rgba(0,0,0,.12)}\n.dark .btn-g .wr-ripple,.dark .chip .wr-ripple{background:rgba(255,255,255,.14)}\n@keyframes wr-ripple{to{transform:scale(2.6);opacity:0}}\n\n\u002F* ── Sidebar active pill (sliding) ─────────────────────────── *\u002F\n.sidebar{position:relative}\n.wr-side-pill{position:absolute;left:0;width:2px;background:var(--accent);border-radius:0 3px 3px 0;transition:transform .35s cubic-bezier(.5,1.5,.5,1),height .25s ease,opacity .2s;pointer-events:none;opacity:0;z-index:3;box-shadow:0 0 12px var(--accent)}\n.nav-item.active{border-left-color:transparent!important}\n\n\u002F* ── Progress shimmer ──────────────────────────────────────── *\u002F\n.prog-fill,.rev-goal-bar-fill{position:relative;overflow:hidden}\n.prog-fill::after,.rev-goal-bar-fill::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:wr-shimmer 2.4s ease-in-out infinite}\n.dark .prog-fill::after,.dark .rev-goal-bar-fill::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}\n@keyframes wr-shimmer{0%{transform:translateX(-100%)}60%{transform:translateX(220%)}100%{transform:translateX(220%)}}\n\n\u002F* ── Page enter polish ─────────────────────────────────────── *\u002F\n.page.active{animation:wr-page-in .35s cubic-bezier(.2,.8,.2,1)}\n@keyframes wr-page-in{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}\n\n\u002F* ── Nav items: hover slide & icon kick ────────────────────── *\u002F\n.nav-item,.biz-item{transition:color .15s,background .15s,padding-left .2s cubic-bezier(.34,1.6,.64,1)}\n.nav-item:hover{padding-left:20px}\n.nav-icon{transition:transform .25s cubic-bezier(.34,1.6,.64,1),color .15s;display:inline-block}\n.nav-item:hover .nav-icon{transform:rotate(-12deg) scale(1.15);color:var(--accent)}\n.nav-item.active .nav-icon{color:var(--accent)}\n\n\u002F* ── Topbar chips bounce ───────────────────────────────────── *\u002F\n.chip{transition:transform .2s cubic-bezier(.34,1.6,.64,1),background .15s,color .15s,border-color .15s}\n.chip:hover{transform:translateY(-1px)}\n.chip:active{transform:scale(.93)}\n\n\u002F* ── Kanban card hover lift ───────────────────────────────── *\u002F\n.task-card{transition:transform .22s cubic-bezier(.34,1.4,.64,1),box-shadow .25s,border-color .15s}\n.task-card:hover{transform:translateY(-2px) rotate(-.3deg);box-shadow:0 8px 22px rgba(0,0,0,.1)}\n.dark .task-card:hover{box-shadow:0 8px 30px rgba(0,0,0,.45)}\n.k-col.drag-over{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--bg2))!important;border-radius:var(--r)}\n\n\u002F* ── Goal tick celebration ─────────────────────────────────── *\u002F\n.goal-tick.done{animation:wr-pop .45s cubic-bezier(.34,1.8,.64,1)}\n@keyframes wr-pop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}\n\n\u002F* ── Logo wordmark glow on hover ───────────────────────────── *\u002F\n.logo{cursor:pointer;transition:letter-spacing .25s ease}\n.logo:hover{letter-spacing:.22em}\n.logo:hover #appNameDisplay{text-shadow:0 0 12px var(--accent)80}\n\n\u002F* ── Confetti canvas ───────────────────────────────────────── *\u002F\n#wr-confetti{position:fixed;inset:0;z-index:999;pointer-events:none;display:none}\n\n\u002F* ── Toast ─────────────────────────────────────────────────── *\u002F\n#wr-toast-host{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n.wr-toast{background:var(--surface);border:.5px solid var(--border2);color:var(--text);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;padding:10px 18px;border-radius:100px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;animation:wr-toast-in .35s cubic-bezier(.34,1.6,.64,1);min-width:180px;justify-content:center;backdrop-filter:blur(8px);background:color-mix(in srgb,var(--surface) 88%,transparent)}\n.wr-toast .wr-toast-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}\n.wr-toast.out{animation:wr-toast-out .25s ease forwards}\n@keyframes wr-toast-in{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}\n@keyframes wr-toast-out{to{opacity:0;transform:translateY(8px) scale(.96)}}\n\n\u002F* ── Command palette ───────────────────────────────────────── *\u002F\n#wr-cmdk{position:fixed;inset:0;z-index:8000;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);animation:wr-cmdk-fade .18s ease}\n#wr-cmdk.open{display:flex}\n@keyframes wr-cmdk-fade{from{opacity:0}to{opacity:1}}\n.wr-cmdk-card{background:var(--surface);border:.5px solid var(--border2);border-radius:18px;width:min(560px,92vw);max-height:64vh;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:wr-cmdk-in .25s cubic-bezier(.34,1.4,.64,1)}\n@keyframes wr-cmdk-in{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}\n.wr-cmdk-search{padding:14px 18px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:10px}\n.wr-cmdk-search .wr-cmdk-kbd{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);border:.5px solid var(--border2);background:var(--bg2);padding:2px 7px;border-radius:5px;letter-spacing:.06em}\n.wr-cmdk-search input{flex:1;border:none;background:transparent;color:var(--text);font-family:'Syne',sans-serif;font-size:15px;outline:none;padding:0}\n.wr-cmdk-list{overflow-y:auto;padding:6px;flex:1}\n.wr-cmdk-section{font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);padding:10px 14px 5px}\n.wr-cmdk-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;transition:background .12s,color .12s}\n.wr-cmdk-item .wr-cmdk-ic{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--text2);flex-shrink:0}\n.wr-cmdk-item .wr-cmdk-hint{margin-left:auto;font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.06em}\n.wr-cmdk-item.sel,.wr-cmdk-item:hover{background:var(--bg2);color:var(--text)}\n.wr-cmdk-item.sel .wr-cmdk-ic,.wr-cmdk-item:hover .wr-cmdk-ic{background:var(--accent);color:var(--accent-fg)}\n.wr-cmdk-foot{padding:8px 16px;border-top:.5px solid var(--border);font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);display:flex;gap:14px;justify-content:flex-end;letter-spacing:.04em;flex-shrink:0}\n.wr-cmdk-foot span b{font-weight:500;color:var(--text2);padding:1px 5px;border-radius:4px;background:var(--bg2);border:.5px solid var(--border2)}\n\n\u002F* ── FUN MODE chip in topbar ───────────────────────────────── *\u002F\n.wr-fun-chip{margin-left:6px;position:relative}\n.wr-fun-chip.on{background:linear-gradient(120deg, oklch(82% 0.13 35), oklch(85% 0.12 140))!important;color:#1a1a1a!important;border-color:transparent!important}\n.wr-fun-chip.on::before{content:\"\";position:absolute;inset:-2px;border-radius:100px;background:linear-gradient(120deg, oklch(82% 0.13 35), oklch(85% 0.12 140));filter:blur(8px);opacity:.5;z-index:-1}\n\n\u002F* ── Sparkle on logo bullet ─────────────────────────────────── *\u002F\n.wr-spark{position:absolute;pointer-events:none;font-size:9px;opacity:0;animation:wr-spark .9s ease-out forwards;color:var(--accent)}\n@keyframes wr-spark{0%{opacity:0;transform:scale(.4) rotate(0deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.4) translateY(-22px) rotate(140deg)}}\n\n\u002F* ── Scrollbar polish ──────────────────────────────────────── *\u002F\n.content::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.bpb::-webkit-scrollbar,.wr-cmdk-list::-webkit-scrollbar{width:8px;height:8px}\n.content::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.bpb::-webkit-scrollbar-thumb,.wr-cmdk-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:100px}\n.content::-webkit-scrollbar-thumb:hover{background:var(--text3)}\n.content::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}\n\n\u002F* ── Subtle gradient borders on focused inputs ─────────────── *\u002F\ninput:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}\n\n\u002F* ── Reduce motion ─────────────────────────────────────────── *\u002F\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n<\u002Fstyle>\n\n<!-- Aurora background canvas -->\n<div class=\"wr-aurora\" aria-hidden=\"true\">\n  <div class=\"blob b1\"><\u002Fdiv>\n  <div class=\"blob b2\"><\u002Fdiv>\n  <div class=\"blob b3\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Confetti canvas -->\n<canvas id=\"wr-confetti\"><\u002Fcanvas>\n\n<!-- Toast host -->\n<div id=\"wr-toast-host\"><\u002Fdiv>\n\n<!-- Command palette -->\n<div id=\"wr-cmdk\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Command palette\">\n  <div class=\"wr-cmdk-card\">\n    <div class=\"wr-cmdk-search\">\n      <span style=\"font-size:14px;color:var(--text3)\">⌕<\u002Fspan>\n      <input id=\"wr-cmdk-input\" type=\"text\" placeholder=\"Jump to a page or run a command…\" autocomplete=\"off\" spellcheck=\"false\">\n      <span class=\"wr-cmdk-kbd\">ESC<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"wr-cmdk-list\" id=\"wr-cmdk-list\"><\u002Fdiv>\n    <div class=\"wr-cmdk-foot\">\n      <span><b>↑↓<\u002Fb> Navigate<\u002Fspan>\n      <span><b>↵<\u002Fb> Select<\u002Fspan>\n      <span><b>⌘K<\u002Fb> Toggle<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  \u002F\u002F ───────────────────────────────────────────────────────────────\n  \u002F\u002F Run after engine boots\n  \u002F\u002F ───────────────────────────────────────────────────────────────\n  const ready = (fn) => (document.readyState !== 'loading') ? setTimeout(fn,0) : document.addEventListener('DOMContentLoaded', fn);\n\n  ready(() => {\n\n  \u002F\u002F ── 1. SIDEBAR SLIDING PILL ──────────────────────────────────\n  const sidebar = document.querySelector('.sidebar');\n  if(sidebar){\n    const pill = document.createElement('div');\n    pill.className = 'wr-side-pill';\n    sidebar.appendChild(pill);\n    const positionPill = () => {\n      const active = sidebar.querySelector('.nav-item.active');\n      if(!active){ pill.style.opacity='0'; return; }\n      const sRect = sidebar.getBoundingClientRect();\n      const aRect = active.getBoundingClientRect();\n      pill.style.height = (aRect.height - 10) + 'px';\n      pill.style.transform = `translateY(${aRect.top - sRect.top + 5 + sidebar.scrollTop}px)`;\n      pill.style.opacity = '1';\n    };\n    \u002F\u002F Watch class changes on nav-items\n    const navObs = new MutationObserver(()=>requestAnimationFrame(positionPill));\n    sidebar.querySelectorAll('.nav-item').forEach(n => navObs.observe(n,{attributes:true,attributeFilter:['class']}));\n    sidebar.addEventListener('scroll', positionPill);\n    window.addEventListener('resize', positionPill);\n    setTimeout(positionPill, 100);\n    setTimeout(positionPill, 600);\n  }\n\n  \u002F\u002F ── 2. BUTTON RIPPLE ─────────────────────────────────────────\n  document.addEventListener('click', (e) => {\n    const btn = e.target.closest('.btn, .chip, .cal-nav-btn, .cal-today-btn');\n    if(!btn || btn.disabled) return;\n    const rect = btn.getBoundingClientRect();\n    const size = Math.max(rect.width, rect.height);\n    const ripple = document.createElement('span');\n    ripple.className = 'wr-ripple';\n    ripple.style.width = ripple.style.height = size + 'px';\n    ripple.style.left = (e.clientX - rect.left - size\u002F2) + 'px';\n    ripple.style.top  = (e.clientY - rect.top  - size\u002F2) + 'px';\n    btn.appendChild(ripple);\n    setTimeout(()=>ripple.remove(), 600);\n  }, true);\n\n  \u002F\u002F ── 3. KPI COUNT-UP ──────────────────────────────────────────\n  \u002F\u002F Animate .cv numeric values when they appear or change\n  const parseValue = (txt) => {\n    const m = (txt||'').replace(\u002F[,\\s]\u002Fg,'').match(\u002F(-?)\\$?(\\d+(?:\\.\\d+)?)([kKmMhH%]?)\u002F);\n    if(!m) return null;\n    let v = parseFloat(m[2]);\n    if(m[3].toLowerCase() === 'k') v *= 1000;\n    if(m[3].toLowerCase() === 'm') v *= 1000000;\n    return { sign:m[1]==='-'?-1:1, val:v, raw:m[0], hasDollar:txt.includes('$'), suffix:m[3], orig:txt };\n  };\n  const fmtBack = (n, info) => {\n    const useK = info.suffix.toLowerCase()==='k';\n    const useM = info.suffix.toLowerCase()==='m';\n    let display = n;\n    if(useM) display = (n\u002F1e6);\n    else if(useK) display = (n\u002F1e3);\n    let str;\n    if(info.suffix === '%') str = Math.round(display) + '%';\n    else if(info.suffix.toLowerCase() === 'h') str = display.toFixed(1) + 'h';\n    else if(useK || useM) str = display.toFixed(1).replace(\u002F\\.0$\u002F,'') + info.suffix;\n    else str = Math.round(display).toLocaleString();\n    return (info.sign<0?'-':'') + (info.hasDollar?'$':'') + str;\n  };\n  const animateCv = (el, target) => {\n    if(el.dataset.wrAnimating === '1') return;\n    const info = parseValue(target); if(!info) return;\n    const fromInfo = parseValue(el.dataset.wrLast || '0') || {sign:1,val:0,hasDollar:info.hasDollar,suffix:info.suffix};\n    const start = fromInfo.sign * fromInfo.val;\n    const end   = info.sign * info.val;\n    if(Math.abs(end - start) < 0.5){ el.dataset.wrLast = target; return; }\n    el.dataset.wrAnimating = '1';\n    const dur = 700; const t0 = performance.now();\n    const step = (now) => {\n      const p = Math.min(1, (now - t0)\u002Fdur);\n      const eased = 1 - Math.pow(1-p, 3);\n      const cur = start + (end - start) * eased;\n      el.textContent = fmtBack(Math.abs(cur), {...info, sign: cur<0?-1:1});\n      if(p < 1) requestAnimationFrame(step);\n      else { el.dataset.wrAnimating='0'; el.dataset.wrLast=target; el.classList.add('wr-pop'); setTimeout(()=>el.classList.remove('wr-pop'),250); }\n    };\n    requestAnimationFrame(step);\n  };\n  const scanCvs = () => {\n    document.querySelectorAll('.cv').forEach(el => {\n      const txt = el.textContent.trim();\n      if(el.dataset.wrLast === txt) return;\n      animateCv(el, txt);\n    });\n  };\n  const cvObs = new MutationObserver(scanCvs);\n  cvObs.observe(document.body, {childList:true, subtree:true, characterData:true});\n  setTimeout(scanCvs, 200);\n  setTimeout(scanCvs, 1500);\n\n  \u002F\u002F ── 4. CONFETTI ──────────────────────────────────────────────\n  const cvs = document.getElementById('wr-confetti');\n  const cctx = cvs.getContext('2d');\n  let pieces = []; let cAF = 0;\n  const resizeCanvas = () => { cvs.width = innerWidth; cvs.height = innerHeight; };\n  resizeCanvas(); addEventListener('resize', resizeCanvas);\n  const colors = ['#7cc4a0','#e8a063','#6c8fff','#e8806a','#c89df0','#f5d36b'];\n  const burstConfetti = (x, y, count=70) => {\n    cvs.style.display = 'block';\n    for(let i=0;i<count;i++){\n      const ang = Math.random() * Math.PI * 2;\n      const sp  = 4 + Math.random() * 7;\n      pieces.push({\n        x, y,\n        vx: Math.cos(ang) * sp,\n        vy: Math.sin(ang) * sp - 4,\n        g: 0.18 + Math.random()*0.08,\n        size: 5 + Math.random()*5,\n        rot: Math.random()*Math.PI*2,\n        vr: (Math.random()-.5) * .3,\n        color: colors[(Math.random()*colors.length)|0],\n        life: 0, max: 120 + Math.random()*40,\n        shape: Math.random() < .5 ? 'rect' : 'circle'\n      });\n    }\n    if(!cAF) tickConfetti();\n  };\n  const tickConfetti = () => {\n    cctx.clearRect(0,0,cvs.width,cvs.height);\n    pieces = pieces.filter(p => p.life < p.max);\n    pieces.forEach(p => {\n      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;\n      const a = 1 - (p.life \u002F p.max);\n      cctx.save();\n      cctx.translate(p.x, p.y); cctx.rotate(p.rot);\n      cctx.globalAlpha = a;\n      cctx.fillStyle = p.color;\n      if(p.shape === 'rect') cctx.fillRect(-p.size\u002F2, -p.size\u002F2, p.size, p.size*.6);\n      else { cctx.beginPath(); cctx.arc(0,0,p.size\u002F2,0,Math.PI*2); cctx.fill(); }\n      cctx.restore();\n    });\n    if(pieces.length){ cAF = requestAnimationFrame(tickConfetti); }\n    else { cAF = 0; cvs.style.display = 'none'; }\n  };\n  window.wrCelebrate = (x, y, n) => burstConfetti(x ?? innerWidth\u002F2, y ?? innerHeight\u002F2, n);\n\n  \u002F\u002F Hook: confetti when a goal tick goes to done\n  document.addEventListener('click', (e) => {\n    const tick = e.target.closest('.goal-tick');\n    if(!tick) return;\n    setTimeout(() => {\n      if(tick.classList.contains('done')){\n        const r = tick.getBoundingClientRect();\n        burstConfetti(r.left + r.width\u002F2, r.top + r.height\u002F2, 55);\n        toast('Goal locked in ✓');\n      }\n    }, 60);\n  }, true);\n  \u002F\u002F Hook: confetti when a task done-flash class is added\n  const doneObs = new MutationObserver((muts) => {\n    muts.forEach(m => {\n      if(m.type === 'attributes' && m.target.classList.contains('done-flash')){\n        const r = m.target.getBoundingClientRect();\n        burstConfetti(r.left + r.width\u002F2, r.top + r.height\u002F2, 80);\n        toast('Mission complete ✓');\n      }\n    });\n  });\n  const watchTasks = () => {\n    document.querySelectorAll('.task-card').forEach(c => {\n      if(c.dataset.wrWatched) return;\n      c.dataset.wrWatched='1';\n      doneObs.observe(c, {attributes:true, attributeFilter:['class']});\n    });\n  };\n  new MutationObserver(watchTasks).observe(document.body, {childList:true, subtree:true});\n  watchTasks();\n\n  \u002F\u002F ── 5. TOAST ─────────────────────────────────────────────────\n  const toastHost = document.getElementById('wr-toast-host');\n  const toast = (msg, kind='ok') => {\n    const t = document.createElement('div');\n    t.className = 'wr-toast';\n    t.innerHTML = `<span class=\"wr-toast-dot\"><\u002Fspan><span>${msg}<\u002Fspan>`;\n    toastHost.appendChild(t);\n    setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(), 260); }, 2200);\n  };\n  window.wrToast = toast;\n\n  \u002F\u002F ── 6. COMMAND PALETTE ───────────────────────────────────────\n  const cmdk = document.getElementById('wr-cmdk');\n  const cmdkInput = document.getElementById('wr-cmdk-input');\n  const cmdkList = document.getElementById('wr-cmdk-list');\n  const commands = [\n    {sec:'Navigate', ic:'◈', label:'Dashboard',     run:()=>window.showPage&&showPage('dashboard')},\n    {sec:'Navigate', ic:'◎', label:'Mission Board', run:()=>window.showPage&&showPage('strategy')},\n    {sec:'Navigate', ic:'◉', label:'Goals',         run:()=>window.showPage&&showPage('goals')},\n    {sec:'Navigate', ic:'◇', label:'P&L Tracker',   run:()=>window.showPage&&showPage('tracker')},\n    {sec:'Navigate', ic:'◷', label:'Focus Timer',   run:()=>window.showPage&&showPage('timer')},\n    {sec:'Navigate', ic:'◉', label:'Intel Notes',   run:()=>window.showPage&&showPage('intel')},\n    {sec:'Navigate', ic:'▦', label:'Calendar',      run:()=>window.showPage&&showPage('calendar')},\n    {sec:'Navigate', ic:'◫', label:'Bills & Expenses', run:()=>window.showPage&&showPage('bills')},\n    {sec:'Navigate', ic:'△', label:'Invoices',      run:()=>window.showPage&&showPage('invoices')},\n    {sec:'Navigate', ic:'⟳', label:'Update Manager',run:()=>window.showPage&&showPage('update')},\n    {sec:'Navigate', ic:'◐', label:'Profile & Settings', run:()=>window.showPage&&showPage('profile')},\n    {sec:'Action',   ic:'▶', label:'Start \u002F Pause Timer',    run:()=>window.toggleTimer&&toggleTimer()},\n    {sec:'Action',   ic:'↺', label:'Reset Timer',            run:()=>window.resetTimer&&resetTimer()},\n    {sec:'Action',   ic:'+', label:'New Mission',            run:()=>{window.showPage&&showPage('strategy'); setTimeout(()=>window.openAddTask&&openAddTask(),200);}},\n    {sec:'Action',   ic:'+', label:'New Goal',               run:()=>window.openModal&&openModal('goalModal')},\n    {sec:'Action',   ic:'+', label:'Log Weekly Win',         run:()=>window.openWinModal&&openWinModal()},\n    {sec:'Action',   ic:'+', label:'New P&L Entry',          run:()=>window.openAddEntry&&openAddEntry()},\n    {sec:'Action',   ic:'✦', label:'Run AI Briefing',        run:()=>{window.showPage&&showPage('dashboard'); setTimeout(()=>{const b=document.getElementById('briefingBtn'); b&&b.click();},200);}},\n    {sec:'Action',   ic:'⤢', label:'Expand JARVIS',          run:()=>window.openJarvisOverlay&&openJarvisOverlay()},\n    {sec:'Action',   ic:'☁', label:'Save to Google Drive',   run:()=>window.driveSave&&driveSave()},\n    {sec:'Action',   ic:'⬇', label:'Load from Google Drive', run:()=>window.driveLoad&&driveLoad()},\n    {sec:'Action',   ic:'◐', label:'Toggle Dark Mode',       run:()=>document.documentElement.classList.toggle('dark')},\n    {sec:'Action',   ic:'✨', label:'Toggle Fun Mode',        run:()=>toggleFun()},\n  ];\n  let cmdkSel = 0; let cmdkFiltered = commands;\n  const renderCmdk = () => {\n    const q = cmdkInput.value.trim().toLowerCase();\n    cmdkFiltered = !q ? commands : commands.filter(c => c.label.toLowerCase().includes(q) || c.sec.toLowerCase().includes(q));\n    cmdkSel = 0;\n    let html=''; let lastSec='';\n    cmdkFiltered.forEach((c,i) => {\n      if(c.sec !== lastSec){ html += `<div class=\"wr-cmdk-section\">${c.sec}<\u002Fdiv>`; lastSec = c.sec; }\n      html += `<div class=\"wr-cmdk-item${i===0?' sel':''}\" data-i=\"${i}\"><span class=\"wr-cmdk-ic\">${c.ic}<\u002Fspan><span>${c.label}<\u002Fspan><span class=\"wr-cmdk-hint\">↵<\u002Fspan><\u002Fdiv>`;\n    });\n    if(!cmdkFiltered.length) html = `<div class=\"wr-cmdk-section\" style=\"text-align:center;padding:30px 0\">No matches<\u002Fdiv>`;\n    cmdkList.innerHTML = html;\n  };\n  const openCmdk = () => { cmdkInput.value=''; renderCmdk(); cmdk.classList.add('open'); setTimeout(()=>cmdkInput.focus(),20); };\n  const closeCmdk = () => { cmdk.classList.remove('open'); };\n  const runCmd = (i) => { const c = cmdkFiltered[i]; if(!c) return; closeCmdk(); try{ c.run(); toast(c.label); }catch(e){ console.warn(e); } };\n  cmdkInput.addEventListener('input', renderCmdk);\n  cmdkInput.addEventListener('keydown', (e) => {\n    if(e.key === 'ArrowDown'){ e.preventDefault(); cmdkSel = Math.min(cmdkFiltered.length-1, cmdkSel+1); updateCmdkSel(); }\n    else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdkSel = Math.max(0, cmdkSel-1); updateCmdkSel(); }\n    else if(e.key === 'Enter'){ e.preventDefault(); runCmd(cmdkSel); }\n    else if(e.key === 'Escape'){ closeCmdk(); }\n  });\n  const updateCmdkSel = () => {\n    cmdkList.querySelectorAll('.wr-cmdk-item').forEach((el,i)=>{ el.classList.toggle('sel', i===cmdkSel); if(i===cmdkSel) el.scrollIntoView({block:'nearest'}); });\n  };\n  cmdkList.addEventListener('click', (e) => { const it = e.target.closest('.wr-cmdk-item'); if(it) runCmd(parseInt(it.dataset.i,10)); });\n  cmdk.addEventListener('click', (e) => { if(e.target === cmdk) closeCmdk(); });\n  document.addEventListener('keydown', (e) => {\n    const isMod = e.metaKey || e.ctrlKey;\n    if(isMod && (e.key === 'k' || e.key === 'K')){\n      e.preventDefault();\n      cmdk.classList.contains('open') ? closeCmdk() : openCmdk();\n    }\n  });\n\n  \u002F\u002F ── 7. FUN MODE TOGGLE in topbar ─────────────────────────────\n  const topRight = document.querySelector('.topbar-right');\n  if(topRight){\n    const funBtn = document.createElement('button');\n    funBtn.className = 'chip wr-fun-chip on';\n    funBtn.id = 'wrFunChip';\n    funBtn.title = 'Toggle ambient effects';\n    funBtn.innerHTML = '<span class=\"chip-dot\" style=\"background:currentColor\"><\u002Fspan><span>FUN<\u002Fspan>';\n    \u002F\u002F Insert before MEET chip if present\n    const meet = document.getElementById('meetChip');\n    if(meet) topRight.insertBefore(funBtn, meet);\n    else topRight.appendChild(funBtn);\n    let funOn = localStorage.getItem('wrFun') !== '0';\n    const applyFun = () => {\n      document.body.classList.toggle('wr-fun-off', !funOn);\n      funBtn.classList.toggle('on', funOn);\n    };\n    applyFun();\n    funBtn.addEventListener('click', () => { funOn = !funOn; localStorage.setItem('wrFun', funOn?'1':'0'); applyFun(); toast(funOn?'Fun mode on ✨':'Fun mode off'); });\n    window.toggleFun = () => funBtn.click();\n  }\n\n  \u002F\u002F ── 8. CMD-K HINT in topbar timer area (subtle) ──────────────\n  const timerEl = document.getElementById('topTimer');\n  if(timerEl && !document.getElementById('wrCmdkHint')){\n    const hint = document.createElement('button');\n    hint.id = 'wrCmdkHint';\n    hint.className = 'chip';\n    hint.title = 'Open command palette';\n    hint.style.cssText = 'background:transparent;border-style:dashed;color:var(--text3)';\n    hint.innerHTML = '<span style=\"font-family:DM Mono,monospace;font-size:9px;letter-spacing:.06em\">⌘K<\u002Fspan>';\n    hint.addEventListener('click', openCmdk);\n    timerEl.parentNode.insertBefore(hint, timerEl.nextSibling.nextSibling.nextSibling || timerEl.nextSibling);\n  }\n\n  \u002F\u002F ── 9. LOGO SPARKLE on click ─────────────────────────────────\n  const logo = document.querySelector('.logo');\n  if(logo){\n    logo.addEventListener('click', (e) => {\n      const r = logo.getBoundingClientRect();\n      for(let i=0;i<6;i++){\n        const s = document.createElement('span');\n        s.className = 'wr-spark';\n        s.textContent = '✦';\n        s.style.left = (e.clientX - r.left + (Math.random()-.5)*40) + 'px';\n        s.style.top  = (e.clientY - r.top  + (Math.random()-.5)*16) + 'px';\n        s.style.animationDelay = (i*60) + 'ms';\n        s.style.position = 'absolute';\n        logo.style.position = 'relative';\n        logo.appendChild(s);\n        setTimeout(()=>s.remove(), 1100);\n      }\n    });\n  }\n\n  \u002F\u002F ── 10. ANNOUNCE ─────────────────────────────────────────────\n  setTimeout(() => toast('UX layer loaded — press ⌘K'), 600);\n\n  });\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
  </script>
