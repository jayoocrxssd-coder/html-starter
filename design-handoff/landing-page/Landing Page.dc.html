<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 4px rgba(0,0,0,0.12); }
      50% { text-shadow: 0 0 8px rgba(0,0,0,0.25); }
    }
    html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  </style>
</helmet>

<x-import component-from-global-scope="image-slot" from="./image-slot.js" hint-size="0,0"></x-import>

<div style="position:fixed;inset:0;background:#fff;overflow:hidden;">

  <!-- Starfield canvas -->
  <canvas id="starfield" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>

  <!-- Subtle shooting star line -->

  <!-- Main centered content -->
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;">

    <!-- Laptop image + timestamp -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;animation:float 4s ease-in-out infinite;margin-bottom:32px;">
      <image-slot id="laptop-hero" style="width:160px;height:120px;" shape="rect" fit="contain" placeholder="Drop laptop image"></image-slot>
      <span id="live-clock" style="font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(0,0,0,0.45);letter-spacing:0.08em;"></span>
    </div>

    <!-- Nav links -->
    <nav style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:48px;">
      <a href="#" style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:#000;text-decoration:none;border:1px solid rgba(0,0,0,0.55);padding:4px 20px 2px;min-width:110px;text-align:center;animation:glowPulse 3s ease-in-out infinite;cursor:pointer;" style-hover="border-color:#000;background:rgba(0,0,0,0.06);">SHOP</a>
      <a href="#" style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:#000;text-decoration:none;border:1px solid rgba(0,0,0,0.55);padding:4px 20px 2px;min-width:110px;text-align:center;animation:glowPulse 3s ease-in-out infinite 0.3s;cursor:pointer;" style-hover="border-color:#000;background:rgba(0,0,0,0.06);">CONTACT</a>
      <a href="#" style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:#000;text-decoration:none;border:1px solid rgba(0,0,0,0.55);padding:4px 20px 2px;min-width:110px;text-align:center;animation:glowPulse 3s ease-in-out infinite 0.6s;cursor:pointer;" style-hover="border-color:#000;background:rgba(0,0,0,0.06);">RETURN POLICY</a>
      <!-- Coming Soon (locked) -->
      <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:rgba(0,0,0,0.3);text-decoration:none;border:1px solid rgba(0,0,0,0.2);padding:4px 20px 2px;min-width:110px;text-align:center;cursor:default;display:flex;align-items:center;justify-content:center;gap:6px;">
        <svg width="9" height="11" viewBox="0 0 9 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4.5" width="7" height="6" rx="1"></rect>
          <path d="M2.5 4.5V3a2 2 0 0 1 4 0v1.5"></path>
        </svg>
        COMING SOON
      </div>
    </nav>

    <!-- Social icons -->
    <div style="display:flex;flex-direction:row;align-items:center;gap:14px;">
      <!-- Instagram -->
      <a href="#" style="color:rgba(0,0,0,0.5);display:flex;" style-hover="color:#000;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>
      <!-- YouTube -->
      <a href="#" style="color:rgba(0,0,0,0.5);display:flex;" style-hover="color:#000;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.5 6.2s-.3-1.9-1.1-2.7c-1.1-1.1-2.3-1.1-2.8-1.2C16.8 2 12 2 12 2s-4.8 0-7.6.3c-.6.1-1.8.1-2.8 1.2C.8 4.3.5 6.2.5 6.2S.2 8.4.2 10.6v2.1c0 2.2.3 4.4.3 4.4s.3 1.9 1.1 2.7c1.1 1.1 2.5 1.1 3.1 1.2C6.7 21.1 12 21.1 12 21.1s4.8 0 7.6-.3c.6-.1 1.8-.1 2.8-1.2.8-.8 1.1-2.7 1.1-2.7s.3-2.2.3-4.4v-2.1c0-2.2-.3-4.4-.3-4.4zM9.7 15.5V8.4l7.6 3.6-7.6 3.5z"></path>
        </svg>
      </a>

    </div>
  </div>



</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.initStarfield();
    this.initClock();
    window.addEventListener('resize', () => this.initStarfield());
  }

  initClock() {
    const tick = () => {
      const el = document.getElementById('live-clock');
      if (!el) return;
      const now = new Date();
      const est = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      const mm = String(est.getMonth() + 1).padStart(2, '0');
      const dd = String(est.getDate()).padStart(2, '0');
      const yyyy = est.getFullYear();
      let h = est.getHours();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      const min = String(est.getMinutes()).padStart(2, '0');
      const sec = String(est.getSeconds()).padStart(2, '0');
      el.textContent = `${mm}/${dd}/${yyyy} ${h}:${min}:${sec} ${ampm} EST`;
    };
    tick();
    this._clockInterval = setInterval(tick, 1000);
  }

  initStarfield() {
    const canvas = document.getElementById('starfield');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;

    const stars = Array.from({ length: 320 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      baseR: Math.random() * 1.4 + 0.3,
      baseAlpha: Math.random() * 0.55 + 0.1,
      // twinkle
      twinkleSpeed: Math.random() * 1.8 + 0.6,
      twinklePhase: Math.random() * Math.PI * 2,
      // drift
      driftX: (Math.random() - 0.5) * 0.18,
      driftY: (Math.random() - 0.5) * 0.12,
      // size pulse (independent freq)
      pulseSpeed: Math.random() * 1.2 + 0.4,
      pulsePhase: Math.random() * Math.PI * 2,
      // occasional burst
      burstTimer: Math.random() * 8,
      burstDuration: 0,
      colored: Math.random() > 0.96,
    }));

    const animate = () => {
      ctx.clearRect(0, 0, W, H);
      const t = Date.now() / 1000;
      stars.forEach(s => {
        // drift
        s.x += s.driftX * 0.016;
        s.y += s.driftY * 0.016;
        if (s.x < -2) s.x = W + 2;
        if (s.x > W + 2) s.x = -2;
        if (s.y < -2) s.y = H + 2;
        if (s.y > H + 2) s.y = -2;

        // twinkle alpha
        const twinkle = 0.45 + 0.55 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
        // size pulse
        const pulse = 0.8 + 0.2 * Math.sin(t * s.pulseSpeed + s.pulsePhase);
        // burst flash every ~10s
        s.burstTimer -= 0.016;
        let burst = 0;
        if (s.burstTimer <= 0) {
          s.burstDuration = 0.35;
          s.burstTimer = 7 + Math.random() * 10;
        }
        if (s.burstDuration > 0) {
          burst = s.burstDuration / 0.35;
          s.burstDuration -= 0.016;
        }

        const a = Math.min(1, s.baseAlpha * twinkle + burst * 0.6);
        const r = s.baseR * pulse * (1 + burst * 1.2);

        ctx.beginPath();
        ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ctx.fillStyle = s.colored
          ? `rgba(80,100,180,${a})`
          : `rgba(0,0,0,${a})`;
        ctx.fill();

        // draw a tiny cross on burst
        if (burst > 0.5) {
          ctx.strokeStyle = `rgba(0,0,0,${burst * 0.25})`;
          ctx.lineWidth = 0.5;
          const len = r * 3;
          ctx.beginPath();
          ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
          ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
          ctx.stroke();
        }
      });
      this._animFrame = requestAnimationFrame(animate);
    };
    if (this._animFrame) cancelAnimationFrame(this._animFrame);
    animate();
  }

  componentWillUnmount() {
    if (this._animFrame) cancelAnimationFrame(this._animFrame);
    if (this._clockInterval) clearInterval(this._clockInterval);
    window.removeEventListener('resize', () => this.initStarfield());
  }

  renderVals() { return {}; }
}
</script>
</body>
</html>
