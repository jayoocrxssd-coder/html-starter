<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 4px rgba(0,0,0,0.12); }
      50% { text-shadow: 0 0 8px rgba(0,0,0,0.25); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
    input:-webkit-autofill, textarea:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 100px #fff inset;
      -webkit-text-fill-color: #000;
    }
  </style>
</helmet>

<div style="position:fixed;inset:0;background:#fff;overflow:hidden;">

  <!-- Starfield canvas -->
  <canvas id="starfield" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>

  <!-- Back link -->
  <a href="#" style="position:absolute;top:24px;left:24px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:0.18em;color:rgba(0,0,0,0.45);text-decoration:none;z-index:10;" style-hover="color:#000;">← BACK</a>

  <!-- Main centered content -->
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeUp 0.6s ease both;">

    <!-- Heading -->
    <div style="margin-bottom:28px;text-align:center;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.22em;color:#000;animation:glowPulse 3s ease-in-out infinite;">CONTACT</div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.12em;color:rgba(0,0,0,0.35);margin-top:4px;">GET IN TOUCH</div>
    </div>

    <!-- Form -->
    <form id="contact-form" style="display:flex;flex-direction:column;gap:10px;width:220px;" onSubmit="{{ handleSubmit }}">

      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.14em;color:rgba(0,0,0,0.4);">NAME</label>
        <input type="text" placeholder="Your name" style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.08em;color:#000;background:transparent;border:none;border-bottom:1px solid rgba(0,0,0,0.35);padding:5px 0 4px;outline:none;width:100%;" style-focus="border-bottom-color:#000;" />
      </div>

      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.14em;color:rgba(0,0,0,0.4);">EMAIL</label>
        <input type="email" placeholder="your@email.com" style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.08em;color:#000;background:transparent;border:none;border-bottom:1px solid rgba(0,0,0,0.35);padding:5px 0 4px;outline:none;width:100%;" style-focus="border-bottom-color:#000;" />
      </div>

      <div style="display:flex;flex-direction:column;gap:3px;margin-top:2px;">
        <label style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.14em;color:rgba(0,0,0,0.4);">MESSAGE</label>
        <textarea placeholder="Write your message..." rows="4" style="font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.08em;color:#000;background:transparent;border:1px solid rgba(0,0,0,0.35);padding:7px 8px;outline:none;resize:none;width:100%;box-sizing:border-box;line-height:1.6;" style-focus="border-color:#000;"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:#000;background:transparent;border:1px solid rgba(0,0,0,0.55);padding:5px 20px 3px;cursor:pointer;margin-top:6px;animation:glowPulse 3s ease-in-out infinite 0.5s;" style-hover="background:rgba(0,0,0,0.06);border-color:#000;">SEND MESSAGE</button>

      <!-- Status -->
      <div id="form-status" style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:0.12em;color:rgba(0,0,0,0.45);text-align:center;min-height:12px;"></div>
    </form>

    <!-- Social icons -->
    <div style="display:flex;flex-direction:row;align-items:center;gap:14px;margin-top:28px;">
      <a href="#" style="color:rgba(0,0,0,0.5);display:flex;" style-hover="color:#000;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>
      <a href="#" style="color:rgba(0,0,0,0.5);display:flex;" style-hover="color:#000;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.5 6.2s-.3-1.9-1.1-2.7c-1.1-1.1-2.3-1.1-2.8-1.2C16.8 2 12 2 12 2s-4.8 0-7.6.3c-.6.1-1.8.1-2.8 1.2C.8 4.3.5 6.2.5 6.2S.2 8.4.2 10.6v2.1c0 2.2.3 4.4.3 4.4s.3 1.9 1.1 2.7c1.1 1.1 2.5 1.1 3.1 1.2C6.7 21.1 12 21.1 12 21.1s4.8 0 7.6-.3c.6-.1 1.8-.1 2.8-1.2.8-.8 1.1-2.7 1.1-2.7s.3-2.2.3-4.4v-2.1c0-2.2-.3-4.4-.3-4.4zM9.7 15.5V8.4l7.6 3.6-7.6 3.5z"></path>
        </svg>
      </a>
    </div>

  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.initStarfield();
    window.addEventListener('resize', () => this.initStarfield());
  }

  initStarfield() {
    const canvas = document.getElementById('starfield');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;

    const stars = Array.from({ length: 320 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      baseR: Math.random() * 1.4 + 0.3,
      baseAlpha: Math.random() * 0.55 + 0.1,
      twinkleSpeed: Math.random() * 1.8 + 0.6,
      twinklePhase: Math.random() * Math.PI * 2,
      driftX: (Math.random() - 0.5) * 0.18,
      driftY: (Math.random() - 0.5) * 0.12,
      pulseSpeed: Math.random() * 1.2 + 0.4,
      pulsePhase: Math.random() * Math.PI * 2,
      burstTimer: Math.random() * 8,
      burstDuration: 0,
      colored: Math.random() > 0.96,
    }));

    const animate = () => {
      ctx.clearRect(0, 0, W, H);
      const t = Date.now() / 1000;
      stars.forEach(s => {
        s.x += s.driftX * 0.016;
        s.y += s.driftY * 0.016;
        if (s.x < -2) s.x = W + 2;
        if (s.x > W + 2) s.x = -2;
        if (s.y < -2) s.y = H + 2;
        if (s.y > H + 2) s.y = -2;

        const twinkle = 0.45 + 0.55 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
        const pulse = 0.8 + 0.2 * Math.sin(t * s.pulseSpeed + s.pulsePhase);
        s.burstTimer -= 0.016;
        let burst = 0;
        if (s.burstTimer <= 0) {
          s.burstDuration = 0.35;
          s.burstTimer = 7 + Math.random() * 10;
        }
        if (s.burstDuration > 0) {
          burst = s.burstDuration / 0.35;
          s.burstDuration -= 0.016;
        }

        const a = Math.min(1, s.baseAlpha * twinkle + burst * 0.6);
        const r = s.baseR * pulse * (1 + burst * 1.2);

        ctx.beginPath();
        ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ctx.fillStyle = s.colored ? `rgba(80,100,180,${a})` : `rgba(0,0,0,${a})`;
        ctx.fill();

        if (burst > 0.5) {
          ctx.strokeStyle = `rgba(0,0,0,${burst * 0.25})`;
          ctx.lineWidth = 0.5;
          const len = r * 3;
          ctx.beginPath();
          ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
          ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
          ctx.stroke();
        }
      });
      this._animFrame = requestAnimationFrame(animate);
    };
    if (this._animFrame) cancelAnimationFrame(this._animFrame);
    animate();
  }

  handleSubmit(e) {
    e.preventDefault();
    const status = document.getElementById('form-status');
    if (status) {
      status.textContent = 'MESSAGE SENT — THANK YOU.';
      setTimeout(() => { if (status) status.textContent = ''; }, 4000);
    }
    e.target.reset();
  }

  componentWillUnmount() {
    if (this._animFrame) cancelAnimationFrame(this._animFrame);
    window.removeEventListener('resize', () => this.initStarfield());
  }

  renderVals() {
    return { handleSubmit: (e) => this.handleSubmit(e) };
  }
}

</script>
</body>
</html>
